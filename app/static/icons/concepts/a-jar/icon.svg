<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Concept A "the island jar": the 貯金箱 full of Bells, sprout on the lid, sweatband on, on a tiny island. -->
  <defs>
    <path id="jar" d="M340 400 Q238 450 238 572 V716 Q238 796 318 796 H706 Q786 796 786 716 V572 Q786 450 684 400 Z"/>
    <clipPath id="glass"><use href="#jar"/></clipPath>
    <g id="bell">
      <circle r="62" fill="#F7C548" stroke="#C98A22" stroke-width="12"/>
      <path d="M-22 -26 Q0 -40 22 -26 L26 18 H-26 Z" fill="#E0A93A"/>
      <circle cy="28" r="9" fill="#E0A93A"/>
    </g>
  </defs>
  <rect width="1024" height="1024" fill="#8FD6F6"/>
  <!-- sea + island -->
  <ellipse cx="512" cy="826" rx="404" ry="138" fill="#3D8FE2" stroke="#4A3A2C" stroke-width="16"/>
  <ellipse cx="512" cy="812" rx="338" ry="98" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-dasharray="70 46" stroke-linecap="round"/>
  <ellipse cx="512" cy="800" rx="320" ry="88" fill="#F4D184" stroke="#4A3A2C" stroke-width="16"/>
  <!-- jar glass -->
  <use href="#jar" fill="#DDF2FB"/>
  <g clip-path="url(#glass)">
    <rect x="230" y="600" width="570" height="170" fill="#F7C548"/>
    <use href="#bell" x="292" y="770"/><use href="#bell" x="430" y="772"/><use href="#bell" x="568" y="770"/><use href="#bell" x="720" y="772"/>
    <use href="#bell" x="350" y="670"/><use href="#bell" x="500" y="650"/><use href="#bell" x="650" y="666"/><use href="#bell" x="270" y="620"/><use href="#bell" x="420" y="600"/><use href="#bell" x="580" y="602"/><use href="#bell" x="740" y="620"/>
    <path d="M220 486 Q512 530 804 486 V580 Q512 624 220 580 Z" fill="#FF8F7A" stroke="#4A3A2C" stroke-width="16" stroke-linejoin="round"/>
    <path d="M220 533 Q512 577 804 533" fill="none" stroke="#FFFCF2" stroke-width="18"/>
  </g>
  <use href="#jar" fill="none" stroke="#4A3A2C" stroke-width="22" stroke-linejoin="round"/>
  <!-- sweatband (with the knot tails flying right) -->
  <path d="M770 520 Q850 500 880 540 Q840 560 790 556 Z" fill="#FF8F7A" stroke="#4A3A2C" stroke-width="14" stroke-linejoin="round"/>
  <path d="M772 560 Q840 590 856 630 Q808 630 774 596 Z" fill="#FF8F7A" stroke="#4A3A2C" stroke-width="14" stroke-linejoin="round"/>
  <!-- glass shine -->
  <path d="M276 640 V720" stroke="#fff" stroke-width="22" stroke-linecap="round" opacity=".85"/>
  <path d="M276 470 Q280 446 300 430" stroke="#fff" stroke-width="20" stroke-linecap="round" fill="none"/>
  <!-- lid -->
  <rect x="296" y="322" width="432" height="96" rx="36" fill="#FFD84D" stroke="#4A3A2C" stroke-width="20"/>
  <path d="M340 356 H500" stroke="#FFFCF2" stroke-width="18" stroke-linecap="round"/>
  <!-- sprout -->
  <path d="M512 324 V246" stroke="#4A3A2C" stroke-width="22" stroke-linecap="round"/>
  <path d="M512 258 Q522 156 654 152 Q644 266 512 258 Z" fill="#6ED07A" stroke="#4A3A2C" stroke-width="18" stroke-linejoin="round"/>
  <path d="M512 278 Q500 200 386 204 Q402 288 512 278 Z" fill="#6ED07A" stroke="#4A3A2C" stroke-width="18" stroke-linejoin="round"/>
  <!-- sparkle -->
  <path d="M236 250 Q244 290 276 298 Q244 306 236 346 Q228 306 196 298 Q228 290 236 250 Z" fill="#FFFCF2"/>
</svg>
