      - { en: rice, ja: ご飯, kana: ごはん, pic: 🍚, ex: "Can I get some more rice?", exJa: "ご飯のおかわりをもらえますか？", how: "舌先はどこにも触れず、少し奥へ引く。唇を軽く丸めて「ゥライス」" }
