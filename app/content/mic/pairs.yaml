# はつおん ききわけ (docs/kikimimi-mic.md §2.4): production minimal pairs, the contrasts Japanese speakers merge.
# One card a pair: two pictures with their labels, both words heard first (a US voice), then one to say; the villager
# shows what they heard. Checked by src/lib/kikimimi/games/pair/pairs.ts (npm run kikimimi:levels; content.test).
#
# Each pair: `id` (pr-…, never renamed: clips `<id>-1`, `<id>-2`), `sound` (the contrast), `who` (a US villager: the
# voice of both words and the one who listens), `ctx` (before: one line ≤ 30 字), `why` (after: ≤ 90 字), and two
# `words`: `en` (what's said, alone), `ja` (the picture's label, kanji Japanese), `kana` (the villager's spaced-kana
# reading, for 「え、 ○○？！」), `pic` (an emoji, or the figures of a number), `ex` / `exJa` (the word in a short line
# of everyday American English), `how` (the mouth: 舌・唇・息, ≤ 60 字).
schema: 1
unit: mic-pairs
status: voiced
pairs:
