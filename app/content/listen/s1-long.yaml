  - kind: long
    id: lg-kawa-neighbor-parcel
    name: お隣さんと 荷物
    source: tts
    ctx: "マンションの 廊下。隣の 人が 声を かける"
    note: "I wouldn't say no は「ほしい」の やわらかい 言い方"
    tags: { seed: 37, register: neighbour, pragmatic: indirect, features: [linking, numbers, flap] }
    lines:
      - { who: tex, at: 0, en: "Oh, hi! You're in 302, right? I've got something for you.", tts: "Oh, hi! You're in three-oh-two, right? I've got something for you.", ja: "あ、こんばんは！三〇二号室の方ですよね？お渡しするものがあって。" }
      - { who: pekoe, at: 0.4, en: "Hi! Yes, that's my place. Is that for me?", ja: "こんばんは！はい、うちです。私宛てですか？" }
      - { who: tex, at: 0.4, en: "A delivery driver came by this afternoon, and nobody was home at your place.", ja: "今日の午後に配達の人が来たんですが、お宅は留守だったので。" }
      - { who: tex, at: 0.3, en: "So he asked me to hold this box for you. I hope that's okay.", ja: "それで、この箱を預かってほしいと頼まれたんです。よかったですか？" }
      - { who: pekoe, at: 0.4, en: "Of course! Thank you so much. I was at work all day, and I just got home.", ja: "もちろんです！本当にありがとうございます。一日中仕事で、今帰ってきたところなんです。" }
      - { who: tex, at: 0.4, en: "No problem. It's pretty heavy, though. Do you want me to carry it up?", ja: "いえいえ。でもけっこう重いですよ。上まで運びましょうか？" }
      - { who: pekoe, at: 0.4, en: "That's kind of you, but I can manage. It's only one floor.", ja: "ご親切に。でも大丈夫です。一階上がるだけなので。" }
      - { who: tex, at: 0.4, en: "Okay. Oh, and he left a slip on your door, too. It's a yellow one.", ja: "わかりました。あ、それとお宅のドアに不在票も入れていきましたよ。黄色いのです。" }
      - { who: pekoe, at: 0.4, en: "A slip? But you have the box.", ja: "不在票？でも箱はここにありますよね。" }
      - { who: tex, at: 0.4, en: "I think there was a second one. He said it needs to be kept cold.", ja: "もう一つあったみたいです。冷やしておかないといけないそうで。" }
      - { who: pekoe, at: -0.3, en: "Oh! That must be the fish from my parents in Hokkaido.", ja: "あ！北海道の両親から送ってくれた魚だ。" }
      - { who: tex, at: 0.3, en: "Fish? Then you don't want to leave that sitting around.", ja: "魚？じゃあ置きっぱなしにはできませんね。" }
      - { who: pekoe, at: 0.4, en: "No, definitely not. Let me look at the slip.", ja: "はい、絶対にだめです。不在票を見てみます。" }
      - { who: pekoe, at: 0.6, en: "Okay, it says they can bring it again tonight or tomorrow.", ja: "えっと、今夜か明日にもう一度届けてくれるって書いてあります。" }
      - { who: tex, at: 0.4, en: "You can just scan the code on the slip and pick a time.", ja: "不在票のコードを読み取って、時間を選ぶだけでいいですよ。" }
      - { who: pekoe, at: 0.4, en: "Oh, that's easy. Let's see, the latest time today is seven to nine.", ja: "あ、簡単ですね。えっと、今日いちばん遅いのは七時から九時です。" }
      - { who: tex, at: 0.4, en: "That works, if you're home by then.", ja: "それなら大丈夫ですね、それまでに家にいれば。" }
      - { who: pekoe, at: 0.4, en: "I'm home now, so seven to nine is perfect.", ja: "もう家にいるので、七時から九時でちょうどいいです。" }
      - { who: tex, at: 0.4, en: "They usually call you about ten minutes before they come.", ja: "たいてい来る十分くらい前に電話をくれますよ。" }
      - { who: pekoe, at: 0.4, en: "Good. Then I can take a quick shower first.", ja: "よかった。じゃあ先にさっとシャワーを浴びられますね。" }
      - { who: tex, at: 0.4, en: "Great. Then you'll have fresh fish for the weekend.", ja: "よかった。じゃあ週末は新鮮な魚ですね。" }
      - { who: pekoe, at: 0.4, en: "If there's a lot, I'll bring some over for you.", ja: "たくさんあったら、少しお持ちしますね。" }
      - { who: tex, at: 0.4, en: "You don't have to, but I wouldn't say no.", ja: "気をつかわなくていいですけど、いただけるならうれしいです。" }
      - { who: pekoe, at: 0.4, en: "It's the least I can do. You took care of my box.", ja: "それくらいはさせてください。荷物を預かってもらったので。" }
      - { who: tex, at: 0.4, en: "Anytime. I work from home most days, so I'm happy to help.", ja: "いつでもどうぞ。たいてい家で仕事をしているので、喜んで。" }
      - { who: pekoe, at: 0.4, en: "Thanks. I'll book the delivery right now, before I forget.", ja: "ありがとうございます。忘れないうちに、今すぐ配達を頼みます。" }
      - { who: tex, at: 0.4, en: "Good idea. Have a good night, and enjoy the fish.", ja: "それがいいですね。おやすみなさい。魚、楽しんでください。" }
    questions:
      - { type: gist, ask: "どんな 話？", line: 3, choices: ["A neighbor kept her box, and she books one more delivery.", "A neighbor asks her to hold his box while he's out at work.", "A driver brings her fish, and the neighbor signs for it."], answer: 0, cja: ["隣の人が箱を預かっていて、彼女はもう一度配達を頼む", "隣の人が仕事で出ている間、自分の箱を預かってと頼む", "配達の人が魚を届け、隣の人が受け取る"], why: "留守の間に隣の人が箱を預かってくれた。もう一つの冷たい荷物は不在票で、届け直しを頼む。仕事に出ていたのは彼女の方。" }
      - { type: mean, ask: "二つ目の 荷物に ついて わかる ことは？", line: 9, choices: ["It's at the neighbor's place too, with the first box.", "It must stay cold, so it wasn't left.", "It's very heavy, so it needs two people to carry."], answer: 1, cja: ["それも一つ目の箱と一緒に隣の人の部屋にある", "冷やす必要があるので、置いていかれなかった", "とても重いので、運ぶのに二人必要"], why: "needs to be kept cold＝冷やす必要がある。だから預けずに不在票だけ。重いのは隣の人が持っている箱。" }
      - { type: mean, ask: "I wouldn't say no の 意味は？", line: 22, choices: ["He doesn't want any fish at all.", "He'd be happy to get some fish.", "He isn't sure he'll be at home."], answer: 1, cja: ["魚はまったくいらない", "魚をもらえたらうれしい", "家にいるかわからない"], why: "You don't have to のあとの I wouldn't say no＝断らない、つまり「もらえたらうれしい」。遠慮しつつ喜んでいる。" }
      - { type: next, ask: "女性は このあと 何を する？", line: 25, choices: ["She waits for the driver to come back tomorrow.", "She carries the box up, then calls her parents.", "She scans the code and books seven to nine tonight."], answer: 2, cja: ["明日の朝、配達の人がまた来るのを待つ", "箱を上に運んでから両親に電話する", "コードを読み取り、今夜の七時から九時を頼む"], why: "I'll book the delivery right now＝今すぐ配達を頼む。今日いちばん遅い七時から九時。コードを読み取るだけ。" }
    dict:
      - { line: 5, words: "carry it up", feature: linking }
      - { line: 11, words: "leave that sitting around", feature: flap }
      - { line: 25, words: "I'll book the delivery", feature: contraction }
