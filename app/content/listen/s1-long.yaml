# まるごと 聞く S1 かわ: two-minute talks among friends and neighbors heard whole: a dinner moved, a housewarming
# invitation, lunch with a friend on a diet, a parcel a neighbor kept. Two speakers at a natural pace, one mild overlap,
# common phrasal verbs (drop off, head over, run out of), one because / if / when clause a sentence, and a plain
# indirect reply ("I'll try to make it", "I'm not a great cook", "I wouldn't say no"); the questions ask the point,
# the reply's real meaning, a detail, a feeling and the next step.
schema: 1
unit: s1-long
game: long
stage: 2
track: people
seeds: [49, 48, 18, 37]
features: { primary: linking, review: contraction }
cando: "友だちや 近所の 人との 予定の 話を 通しで 聞いて、決まった ことと 本当の 気持ちが わかる"
status: draft
items:
  - kind: long
    id: lg-kawa-replan-dinner
    name: 金曜の 予定を 変える
    source: tts
    ctx: "電話で。友だちが 金曜の 夕食を 断る"
    note: "I'll try to make it は「たぶん 無理」"
    tags: { seed: 49, register: friend, pragmatic: indirect, features: [linking, contraction, overlap] }
    lines:
      - { who: cherry, at: 0, en: "Hey, Dom. Do you have a minute? It's about Friday.", ja: "ねえドム、ちょっといい？金曜のことなんだけど。" }
      - { who: dom, at: 0.4, en: "Sure. What's up? Is everything okay?", ja: "いいよ。どうしたの？大丈夫？" }
      - { who: cherry, at: 0.4, en: "Not really. My boss just asked me to fly to Fukuoka on Friday afternoon.", ja: "あんまり。上司に、金曜の午後に福岡へ飛んでって言われちゃって。" }
      - { who: dom, at: 0.4, en: "Oh no. So you can't make it to dinner?", ja: "えっ。じゃあ夕食は来られないの？" }
      - { who: cherry, at: 0.4, en: "I'm so sorry. I was really looking forward to that new Italian place.", ja: "本当にごめん。あの新しいイタリアンの店、すごく楽しみにしてたのに。" }
      - { who: dom, at: 0.4, en: "Me too. I booked the table two weeks ago, because it fills up fast.", ja: "ぼくも。すぐ埋まるから、二週間前に予約したんだ。" }
      - { who: cherry, at: 0.3, en: "I know, and I feel terrible about it.", ja: "わかってる。本当に申し訳なくて。" }
      - { who: dom, at: -0.3, en: "Hey, it's not your fault. Work is work.", ja: "いや、きみのせいじゃないよ。仕事は仕事だし。" }
      - { who: dom, at: 0.3, en: "I won't lie, I'm a little sad. But I get it.", ja: "正直、ちょっと残念だけど。でもわかるよ。" }
      - { who: cherry, at: 0.4, en: "Thanks for understanding. I'm only there for one night, so I'm back on Saturday.", ja: "わかってくれてありがとう。一泊だけだから、土曜には帰るの。" }
      - { who: cherry, at: 0.3, en: "Can we move dinner? I'm free Saturday night or Sunday.", ja: "夕食、日を変えられる？土曜の夜か日曜なら空いてる。" }
      - { who: dom, at: 0.4, en: "Saturday night could work. When does your flight get in?", ja: "土曜の夜ならいけるかも。飛行機は何時に着くの？" }
      - { who: cherry, at: 0.4, en: "Around six, if it's on time.", ja: "遅れなければ六時ごろ。" }
      - { who: dom, at: 0.4, en: "Then let's say eight. That gives you time to drop off your bags at home.", ja: "じゃあ八時にしよう。家に荷物を置く時間もあるし。" }
      - { who: cherry, at: 0.6, en: "Eight on Saturday... Okay, I'll try to make it. But I'll probably be pretty tired.", ja: "土曜の八時か…うん、行けるようにしてみる。でもたぶんかなり疲れてると思う。" }
      - { who: dom, at: 0.4, en: "Hmm. That doesn't really sound like a yes.", ja: "うーん。あんまり「行く」って感じに聞こえないな。" }
      - { who: cherry, at: 0.4, en: "Honestly? If I go out late after a work trip, I'll fall asleep at the table.", ja: "正直に言うと？出張のあとに夜遅く出かけたら、テーブルで寝ちゃう。" }
      - { who: dom, at: 0.3, en: "Ha. Okay, so not Saturday. What about Sunday?", ja: "はは。じゃあ土曜はなしだね。日曜は？" }
      - { who: cherry, at: 0.3, en: "Sunday is much better. Could we do lunch instead of dinner?", ja: "日曜のほうがずっといい。夕食じゃなくてランチにできる？" }
      - { who: dom, at: 0.4, en: "Sure. I think they open at eleven-thirty on weekends.", ja: "いいよ。週末は十一時半に開くはず。" }
      - { who: cherry, at: 0.3, en: "Let's meet at noon, then. It's quieter before the lunch rush.", ja: "じゃあ十二時に会おう。ランチの混む前のほうが静かだし。" }
      - { who: dom, at: 0.4, en: "Good. I'll call them and change the booking right after this.", ja: "いいね。この電話が終わったらすぐ店に電話して予約を変えるよ。" }
      - { who: cherry, at: 0.4, en: "Thank you. And lunch is on me this time, because I'm the one who canceled.", ja: "ありがとう。それと今回のランチは私のおごり。キャンセルしたのは私だから。" }
      - { who: dom, at: 0.3, en: "You don't have to do that.", ja: "そんなことしなくていいよ。" }
      - { who: cherry, at: -0.2, en: "I want to. Really.", ja: "そうしたいの。本当に。" }
      - { who: dom, at: 0.4, en: "Okay, okay. If they don't have a table at noon, I'll text you a new time.", ja: "わかった、わかった。十二時に席がなかったら、別の時間をメッセージするね。" }
      - { who: cherry, at: 0.3, en: "Perfect. I'll keep my phone on.", ja: "完璧。携帯の電源は入れておく。" }
      - { who: dom, at: 0.4, en: "Have a safe trip, and send me a message when you land.", ja: "気をつけて行ってきて。着いたら連絡してね。" }
      - { who: cherry, at: 0.3, en: "I will. See you on Sunday!", ja: "うん。じゃあ日曜にね！" }
    questions:
      - { type: gist, ask: "どんな 話？", line: 18, choices: ["Friday's dinner moves to lunch on Sunday.", "Friday's dinner moves to eight on Saturday.", "Friday's dinner is canceled, with no new day."], answer: 0, cja: ["金曜の夕食が日曜のランチになる", "金曜の夕食が土曜の八時になる", "金曜の夕食が中止になり、次の日は決まらない"], why: "出張で金曜は無理。土曜の八時も案に出たが、最後は日曜のランチ、十二時に決まった。" }
      - { type: mean, ask: "I'll try to make it の 本当の 意味は？", line: 14, choices: ["She'll be there at eight for sure.", "She probably won't come on Saturday.", "She wants to meet earlier than eight."], answer: 1, cja: ["八時に必ず行く", "土曜はたぶん来ない", "八時より早く会いたい"], why: "I'll try のすぐあとに疲れていると言い、ドムも sound like a yes じゃないと気づく。たぶん無理、という意味。" }
      - { type: attitude, ask: "金曜が 無理だと 聞いた ドムの 気持ちは？", line: 8, choices: ["Angry: she should say no to her boss.", "A little sad, but he understands her work.", "Happy: he didn't want to go out."], answer: 1, cja: ["怒っている：上司に断るべきだ", "少し残念だが、仕事のことはわかっている", "うれしい：金曜は出かけたくなかった"], why: "I'm a little sad. But I get it＝少し残念、でも理解している。it's not your fault とも言っている。" }
      - { type: next, ask: "ドムは 電話の あと 何を する？", line: 21, choices: ["He calls the restaurant to change the booking.", "He books a flight to Fukuoka for the weekend.", "He waits for her message first."], answer: 0, cja: ["店に電話して予約を変える", "週末の福岡行きの飛行機を予約する", "彼女の連絡を待ってから電話する"], why: "I'll call them and change the booking right after this＝すぐ店に電話して予約を変える。メッセージは着いたときの話。" }
    dict:
      - { line: 3, words: "can't make it to dinner", feature: linking }
      - { line: 7, words: "it's not your fault", feature: contraction }
      - { line: 13, words: "drop off your bags", feature: linking }

  - kind: long
    id: lg-kawa-party-invite
    name: 新しい 部屋の パーティー
    source: tts
    ctx: "会社の 帰り道。友だちが パーティーに 誘う"
    note: "I'm not a great cook は「料理は 持って いかない」"
    tags: { seed: 48, register: friend, pragmatic: indirect, features: [linking, contraction, numbers] }
    lines:
      - { who: bea, at: 0, en: "Julian! I'm glad I caught you. Are you free on Saturday the 14th?", tts: "Julian! I'm glad I caught you. Are you free on Saturday the fourteenth?", ja: "ジュリアン！会えてよかった。十四日の土曜日って空いてる？" }
      - { who: julian, at: 0.4, en: "Maybe. Why? What's happening?", ja: "たぶん。どうして？何かあるの？" }
      - { who: bea, at: 0.4, en: "I finally moved into my new place, so I'm having a housewarming party.", ja: "やっと新しい部屋に引っ越したから、引っ越し祝いのパーティーをするの。" }
      - { who: julian, at: 0.4, en: "That's great news! Where is it?", ja: "いいね！どこなの？" }
      - { who: bea, at: 0.4, en: "It's in Shimokitazawa, about five minutes from the station.", ja: "下北沢。駅から五分くらい。" }
      - { who: julian, at: 0.4, en: "Oh, that's a nice area, with lots of little cafés. What time does it start?", ja: "いいところだね、小さいカフェがたくさんあって。何時から？" }
      - { who: bea, at: 0.4, en: "Around six. People can come and go, so there's no need to be on time.", ja: "六時ごろ。出入り自由だから、時間どおりに来なくていいよ。" }
      - { who: julian, at: 0.4, en: "Is it a big party? How many people are coming?", ja: "大きなパーティー？何人くらい来るの？" }
      - { who: bea, at: 0.4, en: "About fifteen, I think. Mostly friends from work and from my old neighborhood.", ja: "十五人くらいかな。ほとんど会社の友だちと、前に住んでた近所の友だち。" }
      - { who: julian, at: 0.4, en: "Okay. The thing is, I have a friend's wedding that day in Yokohama.", ja: "そっか。じつはその日、横浜で友だちの結婚式があるんだ。" }
      - { who: bea, at: 0.3, en: "Oh no. When does that finish?", ja: "そうなんだ。何時に終わるの？" }
      - { who: julian, at: 0.4, en: "The dinner part ends at seven, I think. I could head over after that.", ja: "食事の部分は七時に終わると思う。そのあとそっちに行けるよ。" }
      - { who: bea, at: 0.3, en: "That's fine! We'll probably keep going until eleven or so.", ja: "大丈夫！たぶん十一時ごろまでやってるから。" }
      - { who: julian, at: 0.4, en: "Then I'll come, but it'll be around eight-thirty.", ja: "じゃあ行くよ。でも八時半ごろになる。" }
      - { who: bea, at: 0.4, en: "Perfect. Oh, and can you bring something?", ja: "ばっちり。あ、何か持ってきてもらえる？" }
      - { who: julian, at: 0.4, en: "Sure. Just so you know, though, I'm not a great cook.", ja: "いいよ。でも先に言っておくと、料理は得意じゃないんだ。" }
      - { who: bea, at: -0.4, en: "Ha, I remember your curry.", ja: "はは、あのカレー覚えてる。" }
      - { who: bea, at: 0.2, en: "Don't worry, a few people are making food. Drinks would be great.", ja: "心配しないで。料理は何人か作ってくれるから、飲み物だとうれしい。" }
      - { who: julian, at: 0.4, en: "Drinks I can do. Is it okay if I bring my sister? She just moved to Tokyo.", ja: "飲み物ならまかせて。妹を連れて行ってもいい？東京に来たばかりなんだ。" }
      - { who: bea, at: 0.4, en: "Of course! The more, the better. What's her name?", ja: "もちろん！多いほうが楽しいよ。名前は？" }
      - { who: julian, at: 0.4, en: "Kiki. She doesn't know many people here yet.", ja: "キキ。まだこっちに知り合いが少ないんだ。" }
      - { who: bea, at: 0.4, en: "Then she should definitely come. One more thing: please take your shoes off at the door.", ja: "じゃあぜひ来てほしい。あと一つ、玄関で靴を脱いでね。" }
      - { who: julian, at: 0.4, en: "Of course. What's the address?", ja: "もちろん。住所は？" }
      - { who: bea, at: 0.4, en: "I'll send it to you tonight, with a map. The building is behind a big bakery.", ja: "今夜、地図と一緒に送るね。建物は大きなパン屋さんの裏。" }
      - { who: julian, at: 0.4, en: "Behind a bakery. That's easy to remember, and I'll probably buy some bread.", ja: "パン屋さんの裏ね。覚えやすいし、たぶんパンも買っちゃう。" }
      - { who: bea, at: 0.4, en: "And it's on the fourth floor, but there's no elevator. Sorry!", ja: "それと四階なんだけど、エレベーターがないの。ごめんね！" }
      - { who: julian, at: 0.4, en: "That's okay. I'll text you when I leave Yokohama, so you know when to expect us.", ja: "大丈夫。横浜を出るときにメッセージするね。いつ着くかわかるように。" }
      - { who: bea, at: 0.4, en: "Great. I'm so happy you can come!", ja: "よかった。来てくれてすごくうれしい！" }
    questions:
      - { type: gist, ask: "どんな 話？", line: 2, choices: ["Bea invites him to a party at her new place.", "Bea asks him to help her move house on Saturday.", "Bea asks him to come to a friend's wedding in Yokohama."], answer: 0, cja: ["ビーが新しい部屋のパーティーに誘う", "ビーが土曜の引っ越しの手伝いを頼む", "ビーが横浜の友だちの結婚式に誘う"], why: "引っ越しはもう終わっていて、housewarming party＝引っ越し祝いに誘っている。結婚式はジュリアンの予定。" }
      - { type: mean, ask: "I'm not a great cook の 意味は？", line: 15, choices: ["He'd rather not bring food he made himself.", "He wants to cook curry for everyone.", "He can't bring anything at all."], answer: 0, cja: ["自分で作った料理は持って行きたくない", "みんなにカレーを作りたい", "パーティーに何も持って行けない"], why: "料理が得意じゃない＝作った料理は持って行かない、という意味。ビーも察して飲み物を頼み、彼は Drinks I can do。" }
      - { type: mean, ask: "ジュリアンは 何時ごろ 着く？", line: 13, choices: ["Around six, right when the party starts at her place.", "Around eight-thirty, after the wedding dinner.", "Around eleven, near the end of the party."], answer: 1, cja: ["彼女の家でパーティーが始まる六時ごろ", "結婚式の食事のあとの八時半ごろ", "パーティーが終わるころの十一時ごろ"], why: "結婚式の食事が七時に終わり、そのあと向かうので eight-thirty＝八時半ごろ。六時は始まり、十一時は終わりの時間。" }
      - { type: next, ask: "ジュリアンは 横浜を 出る とき どう する？", line: 26, choices: ["He texts Bea so she knows when they'll come.", "He buys food at the bakery near her building.", "He calls Bea to ask for the address and a map."], answer: 0, cja: ["いつ着くかわかるようにビーにメッセージする", "建物の近くのパン屋で食べ物を買う", "ビーに電話して住所と地図を聞く"], why: "I'll text you when I leave Yokohama＝出るときにメッセージ。住所と地図はビーが今夜送ってくれる。" }
    dict:
      - { line: 11, words: "I could head over after that", feature: linking }
      - { line: 18, words: "Is it okay if I", feature: linking }
      - { line: 23, words: "I'll send it to you", feature: contraction }

  - kind: long
    id: lg-kawa-diet-lunch
    name: ダイエット中の 昼ごはん
    source: tts
    ctx: "会社の 昼休み。同僚と どこで 食べるか 決める"
    note: "It's just that… の あとが 本当の 理由"
    tags: { seed: 18, register: friend, pragmatic: refusal, features: [linking, contraction, numbers] }
    lines:
      - { who: sherb, at: 0, en: "It's almost noon. Do you want to get lunch together?", ja: "もうすぐお昼だね。一緒にお昼食べない？" }
      - { who: audie, at: 0.4, en: "Sure. I'm starving, because I skipped breakfast. Where should we go?", ja: "いいよ。朝ごはん抜いたから、お腹ぺこぺこ。どこ行く？" }
      - { who: sherb, at: 0.4, en: "How about the ramen place on the corner? The pork ramen is amazing.", ja: "角のラーメン屋は？チャーシューメンが最高なんだ。" }
      - { who: audie, at: 0.6, en: "Ramen sounds great... It's just that I'm trying to eat a little lighter this month.", ja: "ラーメン、いいね…。ただ、今月はちょっと軽めにしようとしてて。" }
      - { who: sherb, at: 0.4, en: "Oh, right. You started that diet last week, didn't you?", ja: "あ、そうか。先週からダイエット始めたんだっけ？" }
      - { who: audie, at: 0.4, en: "Yeah. I signed up for a half marathon in March, so I'm being careful.", ja: "うん。三月のハーフマラソンに申し込んだから、気をつけてるの。" }
      - { who: sherb, at: 0.4, en: "A half marathon? Wow. Okay, so no ramen.", ja: "ハーフマラソン？すごい。じゃあラーメンはなしだね。" }
      - { who: audie, at: 0.5, en: "I mean, I could just get a small bowl.", ja: "まあ、小さいのにすればいいんだけど。" }
      - { who: sherb, at: -0.3, en: "Come on, you never get a small bowl.", ja: "いやいや、小さいのにしたことないでしょ。" }
      - { who: audie, at: 0.3, en: "That's true. And I always drink all the soup.", ja: "それはそう。しかもスープも全部飲んじゃう。" }
      - { who: sherb, at: 0.4, en: "Okay, what about the sandwich shop near the station?", ja: "じゃあ、駅の近くのサンドイッチ屋は？" }
      - { who: audie, at: 0.4, en: "Their sandwiches are good, but the line is so long at lunch.", ja: "サンドイッチはおいしいけど、お昼は列がすごく長いの。" }
      - { who: sherb, at: 0.4, en: "Right, and we only have an hour, because of the meeting at one.", ja: "そうだ、一時に会議があるから、一時間しかないんだった。" }
      - { who: audie, at: 0.4, en: "And I don't want to run back to the office like last time.", ja: "前みたいに会社まで走って戻るのはいやだし。" }
      - { who: sherb, at: 0.3, en: "Ha, yes. I was out of breath for the whole meeting.", ja: "はは、そうだね。会議の間ずっと息が切れてた。" }
      - { who: audie, at: 0.4, en: "What about that set-meal place across the street? They have grilled fish.", ja: "向かいの定食屋さんはどう？焼き魚があるよ。" }
      - { who: sherb, at: 0.4, en: "The one with the blue curtain? I walk past it every day, but I've never been inside.", ja: "青いのれんの店？毎日前を通るけど、入ったことないな。" }
      - { who: audie, at: 0.4, en: "It's really good. You get fish, rice, soup and a small salad for ¥980.", tts: "It's really good. You get fish, rice, soup and a small salad for nine hundred and eighty yen.", ja: "すごくおいしいよ。魚とご飯と汁物と小さいサラダで九百八十円。" }
      - { who: sherb, at: 0.4, en: "Under a thousand yen? That's cheaper than the ramen.", ja: "千円以下？ラーメンより安いじゃん。" }
      - { who: audie, at: 0.4, en: "And you can ask for half rice if you want.", ja: "それに、ご飯は半分にもできるの。" }
      - { who: sherb, at: 0.4, en: "I'm not doing half rice. I'm hungry.", ja: "半分にはしないよ。お腹すいてるし。" }
      - { who: audie, at: 0.3, en: "That's fine. You can have my other half.", ja: "いいよ。私の残り半分をあげる。" }
      - { who: sherb, at: 0.4, en: "Deal. Does it get busy around noon?", ja: "決まり。お昼どきは混む？" }
      - { who: audie, at: 0.4, en: "A little, but they're fast. We'll be back before one, for sure.", ja: "ちょっとね。でも早いから、一時までには絶対戻れる。" }
      - { who: sherb, at: 0.4, en: "Okay, let me grab my wallet. Do they take cards?", ja: "よし、財布取ってくる。カード使える？" }
      - { who: audie, at: 0.4, en: "No, it's cash only. Do you have any cash?", ja: "ううん、現金だけ。現金持ってる？" }
      - { who: sherb, at: 0.5, en: "Hmm, I'm almost out. Can we stop at the convenience store on the way?", ja: "うーん、ほとんどない。途中でコンビニに寄ってもいい？" }
      - { who: audie, at: 0.3, en: "Sure. There's one on the way.", ja: "いいよ。途中に一軒あるし。" }
    questions:
      - { type: gist, ask: "どんな 話？", line: 15, choices: ["They choose a set-meal place instead of ramen.", "They go for ramen, and she just gets a small bowl.", "They wait in line at the sandwich shop."], answer: 0, cja: ["ラーメンではなく定食屋に決める", "ラーメンに行き、彼女は小さいのだけにする", "サンドイッチ屋の列に並ぶ"], why: "ラーメンは彼女が軽めにしたいので見送り、サンドイッチ屋は列が長い。最後は向かいの焼き魚の定食屋。" }
      - { type: mean, ask: "It's just that… と 言った オーディの 本当の 気持ちは？", line: 3, choices: ["She doesn't want ramen this month.", "She'd like a small bowl of ramen instead.", "She isn't hungry yet, because it's before noon."], answer: 0, cja: ["今月はあまりラーメンを食べたくない", "代わりに小さいラーメンが食べたい", "お昼前なので、まだお腹がすいていない"], why: "sounds great と言ったあと It's just that＝ただ…で、軽めにしたいという理由。やんわり断っている。小さいのでもスープを全部飲んでしまう。" }
