  - kind: call
    id: call-hoshi-rental-oneway
    ask: "レンタカー会社と でんわ"
    ctx: "旅行前に、レンタカーの予約を変えたくて電話しています"
    scene: living
    channel: phone
    lines:
      - { who: diana, en: "Thanks for calling Coastline Rentals, this is Diana. I see a pickup in San Diego on the 14th. How can I help?", tts: "Thanks for calling Coastline Rentals, this is Diana. I see a pickup in San Diego on the fourteenth. How can I help?", ja: "コーストライン・レンタルのダイアナです。14日にサンディエゴでお受け取りのご予約ですね。ご用件は？" }
      - { who: me, en: "Hi. Could I push that back a day, to the 15th, and drop the car off in LA instead?", tts: "Hi. Could I push that back a day, to the fifteenth, and drop the car off in L A instead?", ja: "受け取りを1日遅らせて15日にして、返却をロサンゼルスにできますか？" }
      - { who: diana, en: "The 15th is no problem. One-way is doable, though I should mention there's a drop fee, usually around $75.", tts: "The fifteenth is no problem. One-way is doable, though I should mention there's a drop fee, usually around seventy-five dollars.", ja: "15日は問題ありません。乗り捨ても可能ですが、通常75ドルほどの乗り捨て料金がかかります。" }
      - { who: diana, en: "And for one-way rentals, the hold on your card goes up from $200 to $500, released once the car's checked in.", tts: "And for one-way rentals, the hold on your card goes up from two hundred to five hundred dollars, released once the car's checked in.", ja: "また乗り捨ての場合、カードの仮押さえが200ドルから500ドルに上がり、返却確認後に解除されます。" }
      - { who: me, en: "Five hundred? That's a lot to have tied up during a trip.", ja: "500ドル？旅行中にそれだけ押さえられるのはきついですね。" }
      - { who: diana, en: "I hear you. If you added our full coverage, we could waive the higher hold. That's $28 a day.", tts: "I hear you. If you added our full coverage, we could waive the higher hold. That's twenty-eight dollars a day.", ja: "わかります。フル補償をお付けいただければ、増額分の仮押さえは免除できます。1日28ドルです。" }
      - { who: me, en: "My credit card covers rental cars, I think.", ja: "クレジットカードにレンタカーの補償が付いていると思うんですが。" }
      - { who: diana, en: "A lot of them do. Some exclude one-way rentals, so it might be worth double-checking before you decline it at the counter.", ja: "多くのカードはそうです。ただ乗り捨てを対象外にしているものもあるので、カウンターでお断りになる前に確認されるといいかもしれません。" }
      - { who: diana, en: "Oh, and I misspoke earlier. The drop fee into LA specifically is $95, not $75. My apologies.", tts: "Oh, and I misspoke earlier. The drop fee into L A specifically is ninety-five dollars, not seventy-five. My apologies.", ja: "あ、先ほど言い間違えました。ロサンゼルス返却の乗り捨て料金は75ドルではなく95ドルです。失礼しました。", repair: true }
    half: [0, 0, 0, 0, 1, 1, 1, 1, 1]
    memo:
      - why: "受け取りは15日に変更。乗り捨て料金は最後に misspoke と訂正して95ドル。仮押さえは乗り捨てだと500ドルに上がる。"
        slots:
          - { ask: "受け取りは 何日？", options: ["14日", "15日", "16日"], answer: 1, cja: ["14日", "15日", "16日"] }
          - { ask: "乗り捨て料金は？", options: ["$28", "$75", "$95"], answer: 2, cja: ["28ドル", "75ドル", "95ドル"] }
          - { ask: "カードの 仮押さえは？", options: ["$200", "$500", "なし"], answer: 1, cja: ["200ドル", "500ドル", "なし"] }
      - why: "might be worth double-checking は遠回しな警告。乗り捨てはカードの補償の対象外かもしれない、と言っている。"
        slots:
          - { ask: "ダイアナが 遠回しに 言ったのは？", options: ["カードの 補償は 対象外 かも", "補償は いらない", "LAには 返せない"], answer: 0, cja: ["カードの補償は乗り捨てだと対象外かもしれない", "補償はいらない", "ロサンゼルスには返せない"] }
          - { ask: "仮押さえを 増やさない 方法は？", options: ["フル補償を つける", "現金で はらう", "14日に 受けとる"], answer: 0, cja: ["フル補償を付ける", "現金で払う", "14日に受け取る"] }
    note: "misspoke の後が正しい料金。might be worth は警告"
    tags: { seed: 7, register: service, pragmatic: hedge, conditions: [phone], features: [numbers, self-repair, stress] }

  - kind: call
    id: call-hoshi-hotel-walked
    ask: "ホテルから でんわ。予約の 件"
    ctx: "到着の前日、予約したホテルから電話が来ました"
    scene: living
    channel: phone
    lines:
      - { who: henry, en: "Good afternoon, this is Henry at the Harborview. I'm calling about your reservation for tomorrow night.", ja: "こんにちは、ハーバービューのヘンリーです。明日のご予約の件でお電話しました。" }
      - { who: henry, en: "We've had a plumbing issue on two floors, and as a result we're oversold. So, the short version is we won't be able to accommodate you here.", ja: "2つのフロアで配管のトラブルがあり、満室を超えてしまいまして。要するに、当館ではお泊めできない状況です。" }
      - { who: me, en: "Oh, no. So where does that leave me?", ja: "えっ。じゃあ私はどうなるんですか？" }
      - { who: henry, en: "We've reserved a comparable room at our sister property, the Bayside, at no extra cost, and we'll cover your cab from the airport.", ja: "系列のベイサイドに同等のお部屋を追加料金なしでご用意し、空港からのタクシー代もお持ちします。" }
      - { who: me, en: "Is it far? I picked your hotel because it's close to the convention center.", ja: "遠いですか？コンベンションセンターに近いからそちらにしたんです。" }
      - { who: henry, en: "It's a bit further out, about twenty minutes on foot from the convention center, but it's right by the light rail.", ja: "少し離れていて、コンベンションセンターから徒歩20分ほどですが、ライトレールの駅のすぐそばです。" }
      - { who: henry, en: "We'll also take ten percent off your stay. Actually, let me correct that: your first night is complimentary, on us.", tts: "We'll also take ten percent off your stay... Actually, let me correct that — your first night is complimentary, on us.", ja: "また宿泊料金を1割お引きします。あ、訂正します。1泊目は無料とさせていただきます。", repair: true }
      - { who: me, en: "Okay. And if a room becomes available there after all?", ja: "わかりました。もしそちらに空きが出たら？" }
      - { who: henry, en: "I can't promise anything, but I'll put a note on your file, and if something frees up for your second night, we'll move you back.", ja: "お約束はできませんが、記録に残しておき、2泊目に空きが出ればこちらに戻っていただきます。" }
    half: [0, 0, 0, 1, 1, 1, 0, 1, 1]
    memo:
      - why: "配管のトラブルで oversold（満室超過）。系列のベイサイドへ、タクシー代はホテル持ち。会場から徒歩20分だがライトレールの近く。"
        slots:
          - { ask: "泊まれない 理由は？", options: ["配管の トラブル", "予約の ミス", "工事の 騒音"], answer: 0, cja: ["配管のトラブル", "予約のミス", "工事の騒音"] }
          - { ask: "代わりの ホテルは？", options: ["同じ ホテルの 別の 階", "系列の ホテル", "自分で 探す"], answer: 1, cja: ["同じホテルの別の階", "系列のホテル", "自分で探す"] }
          - { ask: "会場まで 歩くと？", options: ["2分", "12分", "20分"], answer: 2, cja: ["2分", "12分", "20分"] }
      - why: "1割引きと言ってから let me correct that と訂正し、1泊目は無料。I can't promise anything＝期待はできない、という含み。"
        slots:
          - { ask: "1泊目は？", options: ["1割 引き", "無料", "半額"], answer: 1, cja: ["1割引き", "無料", "半額"] }
          - { ask: "2泊目に 戻れる？", options: ["必ず 戻れる", "空きが 出れば", "戻れない"], answer: 1, cja: ["必ず戻れる", "空きが出れば戻れる", "戻れない"] }
    note: "let me correct that の後が本当の条件"
    tags: { seed: 1, register: service, pragmatic: formula, conditions: [phone], features: [self-repair, numbers, linking] }

  - kind: call
    id: call-hoshi-movers-extras
    ask: "引っ越し業者と でんわ。見積もり"
    ctx: "見積もりのあと、引っ越し業者から電話が来ました"
    scene: living
    channel: phone
    lines:
      - { who: maple, en: "Hi, it's Maple from Sunrise Movers, following up on your quote. The base price for the 22nd is ¥86,000.", tts: "Hi, it's Maple from Sunrise Movers, following up on your quote. The base price for the twenty-second is eighty-six thousand yen.", ja: "サンライズ引越センターのメイプルです。お見積もりの件で。22日の基本料金は86,000円です。" }
      - { who: me, en: "Okay, that's about what I expected.", ja: "まあ、思っていたくらいですね。" }
      - { who: maple, en: "Now, that assumes the building has an elevator we can reserve. If we're carrying everything down the stairs, there's a surcharge.", ja: "ただ、それは予約できるエレベーターがある前提です。階段で全部下ろす場合は追加料金がかかります。" }
      - { who: me, en: "There's an elevator, but it's tiny. The sofa won't fit.", ja: "エレベーターはあるけど小さいんです。ソファは入りません。" }
      - { who: maple, en: "Then the sofa would likely need to be hoisted out the window, which runs ¥15,000, weather permitting.", tts: "Then the sofa would likely need to be hoisted out the window, which runs fifteen thousand yen, weather permitting.", ja: "それでしたらソファは窓から吊り下ろすことになると思います。15,000円で、天候しだいです。" }
      - { who: me, en: "And if it rains?", ja: "雨だったら？" }
      - { who: maple, en: "We'd reschedule that item, which, honestly, isn't ideal for anyone. If you're flexible, the 23rd is ¥8,000 cheaper, and it's looking clear.", tts: "We'd reschedule that item, which, honestly, isn't ideal for anyone. If you're flexible, the twenty-third is eight thousand yen cheaper, and it's looking clear.", ja: "その品だけ日を改めることになり、正直どなたにとっても好ましくありません。ご都合がつくなら23日は8,000円安く、天気もよさそうです。" }
      - { who: me, en: "The 23rd works. Let's do that.", tts: "The twenty-third works. Let's do that.", ja: "23日で大丈夫です。それでお願いします。", repair: true }
    half: [0, 0, 0, 0, 1, 1, 1, 1]
    memo:
      - why: "22日の基本料金は86,000円。ソファは窓から吊り下ろしで15,000円。23日なら8,000円安いので、日を23日に変えた。"
        slots:
          - { ask: "引っ越しは 何日に なった？", options: ["22日", "23日", "28日"], answer: 1, cja: ["22日", "23日", "28日"] }
          - { ask: "ソファの 作業は？", options: ["階段で 下ろす", "窓から 吊り下ろす", "置いて いく"], answer: 1, cja: ["階段で下ろす", "窓から吊り下ろす", "置いていく"] }
          - { ask: "吊り下ろしの 料金は？", options: ["8,000円", "15,000円", "50,000円"], answer: 1, cja: ["8,000円", "15,000円", "50,000円"] }
          - { ask: "isn't ideal で 言いたいのは？", options: ["雨の 日は 避けたい", "料金が 高すぎる", "ソファは 運べない"], answer: 0, cja: ["雨で延期になるのは避けたい", "料金が高すぎる", "ソファは運べない"] }
    note: "weather permitting＝天候しだい。日にちが変わる"
    tags: { seed: 33, register: service, pragmatic: hedge, conditions: [phone], features: [numbers, teen-ty, idiom] }

  - kind: call
    id: call-hoshi-camera-claim
    ask: "保険会社と でんわ。盗まれた カメラ"
    ctx: "旅行から帰って、旅行保険の会社に電話しています"
    scene: living
    channel: phone
    lines:
      - { who: walker, en: "Thanks for calling Atlas Travel Insurance, this is Walker. I've pulled up your policy. You're calling about the camera, I take it?", ja: "アトラス旅行保険のウォーカーです。ご契約を確認しました。カメラの件ですね？" }
      - { who: me, en: "Yes. It was stolen from a café in Barcelona on the last day of my trip.", ja: "はい。旅行の最終日に、バルセロナのカフェで盗まれたんです。" }
      - { who: walker, en: "Sorry to hear that. For theft, we'll need a police report filed locally, not one from back home, plus proof of purchase.", ja: "それは大変でしたね。盗難の場合は、帰国後ではなく現地で出した警察の届けと、購入の証明が必要です。" }
      - { who: me, en: "I did file a report there. The receipt might be harder to find, though. I bought it about four years ago.", ja: "現地で届けは出しました。ただ領収書は見つからないかもしれません。4年ほど前に買ったので。" }
      - { who: walker, en: "A bank statement's fine. Just bear in mind that for anything over three years old, we pay depreciated value, not replacement cost.", ja: "銀行の明細で大丈夫です。ただ、3年を超えた品物は、買い直す値段ではなく、古くなった分を引いた額のお支払いになります。" }
      - { who: me, en: "So I'd get less than what a new one costs.", ja: "つまり、新品の値段より少ないんですね。" }
      - { who: walker, en: "Considerably less, in all likelihood. Your deductible is ¥10,000, and claims have to be in within thirty days of the loss.", tts: "Considerably less, in all likelihood. Your deductible is ten thousand yen, and claims have to be in within thirty days of the loss.", ja: "おそらく、かなり少なくなります。自己負担額は1万円で、請求は盗難から30日以内に出していただく必要があります。" }
      - { who: walker, en: "Sorry, let me clarify that: thirty days from when you got home, so you actually have until the 28th.", tts: "Sorry, let me clarify that: thirty days from when you got home, so you actually have until the twenty-eighth.", ja: "すみません、正確に言います。帰国から30日なので、実際には28日まで大丈夫です。", repair: true }
      - { who: walker, en: "And between you and me, the sooner it's in, the fewer follow-up questions you tend to get.", ja: "ここだけの話、早く出していただくほど、あとからの問い合わせは少なくなるものです。" }
    half: [0, 0, 0, 0, 1, 1, 1, 1, 1]
    memo:
      - why: "締め切りは盗難から30日と言ったあと let me clarify で帰国から30日に。自己負担 deductible は1万円。届けは現地の警察のもの。"
        slots:
          - { ask: "請求の 締め切りは？", options: ["盗まれてから 30日", "帰国してから 30日", "3年 以内"], answer: 1, cja: ["盗まれてから30日", "帰国してから30日", "3年以内"] }
          - { ask: "自己負担額は？", options: ["¥1,000", "¥10,000", "¥30,000"], answer: 1, cja: ["1,000円", "10,000円", "30,000円"] }
      - why: "between you and me 以下は、早く出したほうがいいという遠回しなすすめ。depreciated value＝古くなった分を引いた額で、新品よりかなり少ない。"
        slots:
          - { ask: "ウォーカーが それとなく すすめたのは？", options: ["早めに 請求する", "締め切りまで 待つ", "領収書を 探しつづける"], answer: 0, cja: ["早めに請求する", "締め切りまで待つ", "領収書を探し続ける"] }
          - { ask: "支払われる 額は？", options: ["新品と 同じ", "新品より かなり 少ない", "1万円 だけ"], answer: 1, cja: ["新品と同じ", "新品よりかなり少ない", "1万円だけ"] }
    note: "clarify＝はっきりさせる。30日の数え方が変わる"
