      - { who: lopez, en: "Hi, this is Ryan with Sky Express. I'm calling about an international package that's being held at customs under your name.", ja: "スカイ・エクスプレスのライアンです。お客様のお名前で、税関で止まっている海外からの荷物の件でお電話しました。" }
      - { who: me, en: "Held at customs? I'm not expecting anything from overseas.", ja: "税関で？海外から何も届く予定はないんですが。" }
      - { who: lopez, en: "It's listed as a gift, so the sender's details are withheld. That happens a lot this time of year.", ja: "贈り物扱いなので、送り主の情報は伏せられています。この時期はよくあるんですよ。" }
      - { who: lopez, en: "To release it, there's an import duty of ¥3,980, and it has to be settled within two hours, or the package is sent back.", tts: "To release it, there's an import duty of three thousand nine hundred eighty yen, and it has to be settled within two hours, or the package is sent back.", ja: "受け取るには輸入関税が3,980円かかり、2時間以内にお支払いいただかないと、荷物は送り返されます。" }
      - { who: me, en: "Two hours? Can't I just pay when it's delivered?", ja: "2時間？届いたときに払うのではだめなんですか？" }
      - { who: lopez, en: "Customs doesn't allow cash on delivery, unfortunately. The quickest way is prepaid cards from any convenience store. You'd just read me the numbers on the back.", ja: "あいにく税関は代引きを認めていません。いちばん早いのは、コンビニで買えるプリペイドカードです。裏の番号を読み上げていただくだけです。" }
      - { who: lopez, en: "Oh, I misread that. The total is actually ¥5,180, because there's also a ¥1,200 storage fee.", tts: "Oh, I misread that. The total is actually five thousand one hundred eighty yen, because there's also a twelve hundred yen storage fee.", ja: "あ、読み間違えました。保管料が1,200円かかるので、合計は5,180円です。", repair: true }
      - { who: me, en: "What's the tracking number? I'd like to look it up myself.", ja: "追跡番号は？自分で調べたいので。" }
      - { who: lopez, en: "I can't give that out over the phone, for security reasons. But I'd hate for you to lose a gift over a few thousand yen.", ja: "安全上、お電話ではお伝えできません。ただ、数千円のために贈り物を失うのはもったいないと思いますよ。" }
      - { who: me, en: "I'll take my chances. Goodbye.", ja: "それでもけっこうです。失礼します。" }
