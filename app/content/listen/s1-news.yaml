    tags: { seed: 5, register: broadcast, pragmatic: literal, features: [linking, clock, numbers] }
    segments:
      - topic: island
        lines:
          - { en: "Good morning, everyone, and happy Wednesday. Here's what's going on around the island.", ja: "皆さん、おはようございます。水曜日ですね。島の話題をお伝えします。" }
          - { en: "Starting next week, the recycling center by the dock is changing its hours.", ja: "来週から、桟橋のそばのリサイクルセンターの営業時間が変わります。" }
          - { en: "It used to close at five, but it will now stay open until seven on weekdays.", ja: "これまでは五時に閉まっていましたが、これからは平日は七時まで開いています。" }
          - { en: "So if you have old cans or big boxes, you can drop them off on your way home from work.", ja: "古い缶や大きな箱があれば、仕事帰りに持っていけます。" }
      - topic: tokyo
        lines:
          - { en: "Turning to the city, a few train lines are carrying out track work this weekend.", ja: "続いて東京です。今週末はいくつかの路線で線路の工事があります。" }
          - { en: "On Saturday night, some trains will stop running about an hour earlier than usual.", ja: "土曜の夜は、一部の電車がいつもより一時間ほど早く終わります。" }
          - { en: "Buses will fill in on the closed section, but they take quite a bit longer.", ja: "運休区間はバスが代わりに走りますが、かなり時間がかかります。" }
          - { en: "So if you're heading out to dinner, check the last train before you go.", ja: "夕食に出かけるなら、出る前に終電を確認しておきましょう。" }
    gist:
      choices: ["Longer recycling hours and weekend track work", "A new recycling center and a train fare increase", "Shorter recycling hours and late-night buses", "Early meetings and weekend restaurant hours"]
      answer: 0
      trap: 2
      cja: ["リサイクルの 時間 延長と 週末の 線路 工事", "新しい リサイクル センターと 運賃の 値上げ", "リサイクルの 時間 短縮と 深夜バス", "朝の 会議と 週末の 店の 営業時間"]
