          - { en: "You can still pay with a bus card, and you can pick one up at the town hall for free.", ja: "今までどおりバスカードで払えます。カードは役場で無料でもらえます。" }
      - topic: tokyo
        lines:
          - { en: "Turning to the city, the long holidays at the start of May are coming up fast.", ja: "続いて東京です。五月初めの連休がもうすぐです。" }
          - { en: "If you're planning to take the shinkansen, reserved seats can be gone weeks ahead.", ja: "新幹線に乗るつもりなら、指定席は何週間も前になくなることがあります。" }
          - { en: "Seats usually go on sale one month before the travel date, at ten in the morning.", ja: "指定席はふつう乗る日の一か月前の朝十時に発売されます。" }
          - { en: "If you miss out, the non-reserved cars are an option, but be ready to stand for a while.", ja: "取れなかったら自由席もありますが、しばらく立つ覚悟をしておきましょう。" }
    gist:
