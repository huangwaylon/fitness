# まるごと 聞く S2 もり: two-and-a-half-minute everyday and travel scenes heard whole. Two or three speakers with mild
# overlap, relative clauses and reported speech ("She says it's behind…"), a self-correction that changes a detail,
# set phrases (a heads-up, out of stock); one meaning is implied (a polite no, a wary "how small?"). The questions ask
# the point, the detail after a correction, an implied meaning or attitude, and the next step.
schema: 1
unit: s2-long
game: long
stage: 3
track: life
seeds: [10, 39, 4, 31, 56]
features: { primary: self-repair, review: linking }
cando: "2〜3人の 会話を 通しで 聞いて、訂正された 情報と 遠回しな 気持ちが わかる"
status: draft
items:
  - kind: long
    id: lg-mori-rental-key
    name: 鍵の 番号と チェックアウト
    source: tts
    ctx: "札幌の 貸し部屋。到着前に 家主と ビデオ通話"
    note: "最初の 番号は 古い もの。訂正の 後を 聞く"
    tags: { seed: 10, register: service, pragmatic: hedge, conditions: [video], features: [self-repair, numbers, linking] }
    lines:
      - { who: lopez, at: 0, en: "Hi there, can you both hear me okay? The internet here is a little slow today.", ja: "こんにちは、お二人とも聞こえますか？今日はこっちのネットが少し遅くて。" }
      - { who: diana, at: 0.4, en: "We can hear you fine. Thanks for doing a video call, by the way.", ja: "よく聞こえます。ビデオ通話にしてくれてありがとうございます。" }
      - { who: lopez, at: 0.4, en: "No problem. I like to explain the key box before guests arrive, because it confuses a lot of people.", ja: "いえいえ。鍵の箱は迷う人が多いので、到着前に説明するようにしているんです。" }
      - { who: bob, at: 0.4, en: "Great. Our flight lands at four, so we should get to the house around six.", ja: "助かります。飛行機が四時に着くので、家には六時ごろ着くと思います。" }
      - { who: lopez, at: 0.4, en: "Perfect. So the key box is on the left side of the front door, just under the mailbox.", ja: "ばっちりです。鍵の箱は玄関の左側、郵便受けのすぐ下にあります。" }
      - { who: lopez, at: 0.5, en: "The code is four, seven, two, nine... wait, no, sorry. That's the old one. It's four, seven, nine, two.", ja: "番号は四、七、二、九…あ、違う、すみません。それは前のです。四、七、九、二です。" }
      - { who: diana, at: -0.3, en: "Four, seven, nine, two. Got it, I'm writing it down.", ja: "四、七、九、二。わかりました、メモします。" }
      - { who: lopez, at: 0.3, en: "Thanks. I changed it last week, after the cleaner who comes on Mondays lost her copy, and I still mix them up.", ja: "どうも。月曜に来る清掃の人が控えをなくしたので先週変えたんですが、まだ混ざっちゃって。" }
      - { who: bob, at: 0.5, en: "Can I ask about checkout? Our flight home isn't until the evening.", ja: "チェックアウトのことを聞いてもいいですか？帰りの便が夕方なんです。" }
      - { who: diana, at: 0.4, en: "The listing said checkout was at eleven, I think.", ja: "掲載ページには、チェックアウトは十一時って書いてあったと思うんですけど。" }
      - { who: lopez, at: 0.6, en: "Mm-hm, so the listing is a little out of date, and checkout is actually...", ja: "ええ、掲載ページは少し古くて、チェックアウトは実は…" }
      - { who: bob, at: 0.8, en: "Sorry, Mr. Lopez, I think you're on mute. We can't hear anything.", ja: "すみません、ロペスさん、ミュートになってるみたいです。何も聞こえません。" }
      - { who: lopez, at: 0.6, en: "Oh, sorry about that! My dog started barking, so I muted myself and forgot.", ja: "あ、失礼しました！犬が吠えだしたのでミュートにして、そのまま忘れてました。" }
      - { who: lopez, at: 0.4, en: "What I was saying is, the listing is old. It used to be eleven, but now checkout is at ten.", ja: "言いかけていたのは、掲載ページが古いということです。前は十一時でしたが、今は十時です。" }
      - { who: lopez, at: 0.4, en: "But I can push it back to one o'clock for a small fee, if that helps.", ja: "でも、少しの料金で一時まで延ばせますよ。よければ。" }
      - { who: bob, at: 0.5, en: "A small fee. How small are we talking?", ja: "少しの料金。どのくらいの「少し」ですか？" }
      - { who: lopez, at: 0.5, en: "It depends on the day. Usually it's around three thousand yen, but on weekends it's a bit more.", ja: "曜日によります。ふだんは三千円くらいですが、週末は少し高くなります。" }
      - { who: diana, at: 0.4, en: "Oh, that's not bad. That would give us the whole morning to pack.", ja: "あら、悪くないですね。午前中ずっと荷造りに使えるし。" }
      - { who: bob, at: -0.3, en: "Hang on. A bit more meaning what, exactly?", ja: "ちょっと待って。「少し高い」って、具体的には？" }
      - { who: lopez, at: 0.4, en: "It's hard to say until I see the other bookings. I'll let you know closer to the date.", ja: "ほかの予約を見ないと何とも。日が近くなったらお知らせします。" }
      - { who: bob, at: 0.5, en: "Okay. We're leaving on Sunday, though, so it'll be the weekend price. We'll think about it.", ja: "わかりました。でも帰るのは日曜なので、週末の料金ですよね。考えておきます。" }
      - { who: lopez, at: 0.4, en: "Sure, no pressure. Oh, and a heads-up: the heater in the bedroom takes a while to warm up.", ja: "どうぞ、急ぎませんので。あと一つ、寝室の暖房は暖まるまで時間がかかります。" }
      - { who: diana, at: 0.4, en: "Good to know. And if the code doesn't work for some reason, what should we do?", ja: "それは助かります。もし番号で開かなかったら、どうすればいいですか？" }
      - { who: lopez, at: 0.4, en: "Send me a text instead of calling. I'm at work until seven, and I can't always pick up.", ja: "電話ではなくメッセージをください。七時まで仕事で、出られないことが多いので。" }
      - { who: bob, at: 0.5, en: "Text, not call. Actually, why don't we text you before we leave the airport, so you know we're on our way?", ja: "電話じゃなくてメッセージですね。じゃあ、空港を出る前に連絡しましょうか。向かってるってわかるように。" }
      - { who: lopez, at: 0.4, en: "That would be great. Then I can turn the heater on from my phone, and the house will be warm when you get there.", ja: "それは助かります。そうすればスマホで暖房をつけておけるので、着くころには暖かいですよ。" }
      - { who: diana, at: 0.4, en: "Oh, you're a lifesaver. We really appreciate it.", ja: "わあ、助かります。本当にありがとうございます。" }
      - { who: lopez, at: 0.4, en: "My pleasure. And if you want the late checkout, just tell me by Friday.", ja: "どういたしまして。遅めのチェックアウトをご希望なら、金曜までに言ってくださいね。" }
      - { who: bob, at: 0.4, en: "We will, once we know what a bit more means.", ja: "そうします。「少し高い」がいくらかわかったら。" }
    questions:
      - { type: gist, ask: "どんな 通話？", line: 4, choices: ["A host explains the key box, checkout and the heater before the guests arrive.", "A host apologizes because the house isn't ready and offers a cheaper room.", "Two guests call the host to complain that the code for the key box doesn't work."], answer: 0, cja: ["家主が到着前に、鍵の箱、チェックアウト、暖房を説明する", "家の準備ができていないと家主が謝り、安い部屋をすすめる", "鍵の箱の番号で開かないと、二人が家主に苦情の電話をする"], why: "到着前のビデオ通話で、鍵の箱の場所と番号、チェックアウトの時間、暖房の注意を伝えている。番号で開かないのは、もしもの話。" }
      - { type: mean, ask: "鍵の 番号は？", line: 5, choices: ["Four, seven, two, nine.", "Four, seven, nine, two.", "Four, nine, seven, two."], answer: 1, cja: ["四、七、二、九", "四、七、九、二", "四、九、七、二"], why: "最初の four, seven, two, nine は that's the old one＝前の番号。言い直した four, seven, nine, two が正しい。" }
      - { type: mean, ask: "for a small fee が 示すのは？", line: 16, choices: ["Late checkout is free if they ask by Friday.", "Late checkout costs extra, and more on weekends.", "Late checkout is only possible on weekdays."], answer: 1, cja: ["金曜までに頼めば無料", "遅めのチェックアウトは有料で、週末は高め", "遅めのチェックアウトは平日だけ"], why: "a small fee＝無料ではない。ふだん三千円くらい、週末は a bit more。金曜までというのは頼む期限で、料金とは関係ない。" }
      - { type: attitude, ask: "ボブは 延長に ついて どう 思っている？", line: 18, choices: ["Pleased: three thousand yen is a good deal.", "Wary: the weekend price is still unclear.", "Annoyed: he wants to leave the house at ten o'clock no matter what."], answer: 1, cja: ["喜んでいる：三千円ならお得", "警戒している：遅めのチェックアウトの週末料金がまだはっきりしない", "いらいら：どうしても十時に出たい"], why: "How small are we talking? や A bit more meaning what? と金額を問いつめる。週末の値段があいまいなので警戒している。" }
      - { type: next, ask: "当日、2人は まず 何を する？", line: 24, choices: ["Call the host as soon as their plane lands in Sapporo.", "Text the host before they leave the airport.", "Turn the heater on themselves from the host's app."], answer: 1, cja: ["着陸したらすぐ家主に電話する", "空港を出る前に家主にメッセージを送る", "自分で家主のアプリから暖房をつける"], why: "家主は電話ではなくメッセージを希望。ボブが空港を出る前に送ると言い、家主はそれを見て暖房をつける。" }
    dict:
      - { line: 7, words: "who comes on Mondays", feature: weak-form }
      - { line: 14, words: "push it back to one", feature: linking }
      - { line: 23, words: "I can't always pick up", feature: t-glottal }

  - kind: long
    id: lg-mori-taxi-address
    name: よく 似た 名前
    source: tts
    ctx: "夜の 東京。客が タクシーで 恵比寿へ 向かう"
    note: "Court と Place。似た 名前の 聞き違いに 注意"
    tags: { seed: 4, register: service, pragmatic: literal, conditions: [phone], features: [self-repair, linking, weak-form] }
    lines:
      - { who: kappn, at: 0, en: "Good evening. Where can I take you tonight?", ja: "こんばんは。今夜はどちらまで？" }
      - { who: whitney, at: 0.4, en: "Hi. Garden Court in Ebisu, please. It's an apartment building near the park.", ja: "こんばんは。恵比寿のガーデンコートまでお願いします。公園の近くのマンションです。" }
      - { who: kappn, at: 0.4, en: "Garden Place in Ebisu. Sure, that's about fifteen minutes from here.", ja: "恵比寿のガーデンプレイスですね。ここから十五分くらいです。" }
      - { who: whitney, at: 0.5, en: "Great. I'm meeting a friend for dinner, and I'm already running a little late.", ja: "よかった。友だちと夕食なんですけど、もう少し遅れてて。" }
      - { who: kappn, at: 0.4, en: "Traffic isn't too bad tonight, so we should make good time.", ja: "今夜は道がそれほど混んでいないので、早めに着けると思いますよ。" }
      - { who: whitney, at: 0.5, en: "Is it okay if I pay by card? I only have a few thousand yen in cash.", ja: "カードで払ってもいいですか？現金は数千円しかなくて。" }
      - { who: kappn, at: 0.4, en: "Card is fine. You can tap it on the screen on the back of my seat.", ja: "カードで大丈夫です。私の座席の後ろの画面にかざしてください。" }
      - { who: whitney, at: 2.5, en: "Sorry, are we close? The map on my phone says we're going the wrong way.", ja: "すみません、もうすぐですか？スマホの地図だと、逆の方に向かってるみたいで。" }
      - { who: kappn, at: 0.4, en: "We're almost there. Garden Place is just past the next light, on the right.", ja: "もうすぐです。ガーデンプレイスは次の信号を過ぎて右です。" }
      - { who: whitney, at: -0.3, en: "Oh, no, wait. I said Garden Court, not Garden Place.", ja: "あ、違う、待ってください。ガーデンプレイスじゃなくて、ガーデンコートって言ったんです。" }
      - { who: kappn, at: 0.4, en: "Ah, I'm sorry. I heard Garden Place, which is the big shopping area. Do you have the address?", ja: "ああ、すみません。大きな商業施設のガーデンプレイスだと思いました。住所はありますか？" }
      - { who: whitney, at: 0.5, en: "Hold on, I'll call my friend. She can explain it better than I can.", ja: "ちょっと待ってください、友だちに電話します。私より上手に説明できるので。" }
      - { who: celeste, at: 1.2, en: "Hi! Let me guess. You're lost.", ja: "もしもし！当ててみようか。迷ったんでしょ。" }
      - { who: whitney, at: 0.4, en: "Sort of. The driver heard Garden Place, which I guess is somewhere else.", ja: "まあね。運転手さんがガーデンプレイスと聞き取って、そこは別の場所みたい。" }
      - { who: celeste, at: 0.4, en: "Don't worry, it's close. Tell him we're behind the old post office, on the street with the bakery.", ja: "大丈夫、近いよ。古い郵便局の裏で、パン屋がある通りだって伝えて。" }
      - { who: whitney, at: 0.6, en: "Okay, apparently it's on the bakery street, just behind that old post office.", ja: "えっと、パン屋の通りで、あの古い郵便局のすぐ裏だそうです。" }
      - { who: kappn, at: 0.5, en: "The post office on Komazawa Street? I know it. That's only about five minutes from here.", ja: "駒沢通りの郵便局ですね？わかります。ここから五分ほどです。" }
      - { who: whitney, at: 0.4, en: "Oh, good. Sorry, I should have shown you the address in the first place.", ja: "よかった。すみません、最初から住所を見せればよかったですね。" }
      - { who: kappn, at: 0.4, en: "Not at all. The two names sound almost the same, and it happens more often than you'd think.", ja: "いえいえ。二つの名前はほとんど同じに聞こえますし、思っているよりよくあることです。" }
      - { who: whitney, at: 0.5, en: "Will it cost a lot more? I'm not complaining, I'm just curious.", ja: "だいぶ高くなりますか？文句じゃなくて、ちょっと気になって。" }
      - { who: kappn, at: 0.5, en: "Maybe five or six hundred yen. But since it was my mistake, I'll stop the meter when we reach the post office.", ja: "五、六百円くらいでしょう。でも私の聞き違いなので、郵便局に着いたらメーターを止めます。" }
      - { who: whitney, at: 0.4, en: "Oh, you really don't have to do that.", ja: "え、そこまでしなくても大丈夫ですよ。" }
      - { who: kappn, at: 0.4, en: "It's fine. From there, could you guide me? Those little side streets are hard to find at night.", ja: "いいんです。そこからは案内してもらえますか？細い裏道は夜だと見つけにくくて。" }
      - { who: whitney, at: 0.5, en: "Sure. My friend told me to turn left at the bakery and look for a white building.", ja: "はい。友だちは、パン屋で左に曲がって白い建物を探してって言ってました。" }
      - { who: kappn, at: 2, en: "Here's the post office, and there's the bakery. Left here, you said?", ja: "郵便局に着きました。パン屋もありますね。ここを左でしたね？" }
      - { who: whitney, at: 0.4, en: "Yes, left. And that's the white building, and there she is, waving at us.", ja: "はい、左です。あれが白い建物で、ほら、友だちが手を振ってます。" }
      - { who: kappn, at: 0.5, en: "Then here we are. That comes to two thousand eight hundred yen.", ja: "では、到着です。二千八百円になります。" }
      - { who: whitney, at: 0.4, en: "Here's my card. Thank you so much for being so patient with me.", ja: "カードでお願いします。根気よく付き合ってくださって、本当にありがとうございました。" }
      - { who: kappn, at: 0.4, en: "My pleasure. And next time, just show the driver the address on your phone. Most of my foreign passengers do, and it saves everyone a lot of trouble.", ja: "どういたしまして。次からはスマホで住所を見せてください。海外のお客さんはたいていそうしますし、みんな助かりますから。" }
      - { who: whitney, at: 0.4, en: "Lesson learned. Have a good night!", ja: "勉強になりました。おやすみなさい！" }
    questions:
      - { type: gist, ask: "どんな 話？", line: 9, choices: ["The driver misheard the place, and they find it with the friend's help.", "The driver took a long way on purpose, and the passenger complains.", "The passenger gave the driver the wrong address, so her friend comes out to meet her."], answer: 0, cja: ["運転手が行き先を聞き違え、友だちの助けで見つける", "運転手がわざと遠回りし、客が文句を言う", "客が住所を間違えたので、友だちが外に迎えに来る"], why: "客は Garden Court と言ったのに、運転手は Garden Place と聞き違えた。友だちの説明で郵便局の裏だとわかり、着く。" }
      - { type: mean, ask: "ガーデンコートは どこ？", line: 14, choices: ["Next to the big shopping area, past the light.", "Behind the old post office, on the bakery's street.", "Across from the park, next to a white bakery."], answer: 1, cja: ["大きな商業施設の隣、信号の先", "古い郵便局の裏、パン屋の通り", "公園の向かい、白いパン屋の隣"], why: "友だちが behind the old post office, on the street with the bakery と説明。信号の先は聞き違えた場所。白いのは建物。" }
      - { type: mean, ask: "運転手が メーターを 止める わけは？", line: 20, choices: ["The passenger asked him to, because she's short of cash.", "It was his mistake that made the trip longer.", "Taxis in Tokyo always do that for foreign passengers."], answer: 1, cja: ["客が現金が足りないと頼んだから", "遠回りになったのは自分の聞き違いのせいだから", "東京のタクシーは海外の客にいつもそうするから"], why: "since it was my mistake＝自分の聞き違いだから。客は文句ではなく気になっただけで、カードで払うので現金の心配もない。" }
      - { type: attitude, ask: "最後の 客の 気持ちは？", line: 27, choices: ["Grateful that the driver was patient and fair.", "Upset that she arrived far too late for dinner.", "Embarrassed that her friend had to come outside."], answer: 0, cja: ["根気よく公平に対応してくれて感謝している", "夕食にひどく遅れて怒っている", "友だちに外に出てもらって恥ずかしい"], why: "Thank you so much for being so patient＝根気よく付き合ってくれて感謝。メーターも止めてもらった。怒りや恥ずかしさは言っていない。" }
      - { type: next, ask: "郵便局に 着いたら どう する？", line: 23, choices: ["Turn right at the light and stop by the park.", "Turn left at the bakery and find a white building.", "Wait at the post office for the friend."], answer: 1, cja: ["信号で右に曲がり、公園のそばで止まる", "パン屋で左に曲がり、白い建物を探す", "郵便局で友だちを待つ"], why: "友だちの言葉を伝えて turn left at the bakery and look for a white building。右に曲がるのは聞き違えた場所への道。" }
    dict:
      - { line: 3, words: "running a little late", feature: flap }
      - { line: 10, words: "Do you have the address", feature: weak-form }
      - { line: 17, words: "I should have shown you", feature: contraction }

  - kind: long
    id: lg-mori-plumber-visit
    name: 台所の 排水が 遅い
    source: tts
    ctx: "台所の 流しが 詰まり気味。業者が 見に 来る"
    note: "最初の 金額は 言い直し。部品込みの 値段を 聞く"
    tags: { seed: 31, register: service, pragmatic: literal, features: [self-repair, numbers, linking] }
    lines:
      - { who: gruff, at: 0, en: "Okay, I took a look under the sink. Do you want the good news or the bad news first?", ja: "さて、流しの下を見ました。いい知らせと悪い知らせ、どっちから聞きます？" }
      - { who: molly, at: 0.5, en: "The good news, please. It's been a long week.", ja: "いい方からお願いします。長い一週間だったので。" }
      - { who: gruff, at: 0.4, en: "The good news is, it's not the main pipe under the floor. That would be a much bigger job.", ja: "いい知らせは、床下の本管じゃないってこと。それだとずっと大がかりな工事になります。" }
      - { who: molly, at: 0.4, en: "Okay, that's a relief. And the bad news?", ja: "ああ、ほっとしました。で、悪い知らせは？" }
      - { who: gruff, at: 0.4, en: "The trap is pretty much full of grease. That's the U-shaped pipe right below the drain.", ja: "トラップが油でほぼいっぱいです。排水口のすぐ下にあるU字の管のことです。" }
      - { who: molly, at: -0.2, en: "The trap. Is that what's causing the smell?", ja: "トラップ。においの原因もそれですか？" }
      - { who: gruff, at: 0.3, en: "That's the smell, and it's why the water's taking so long to go down.", ja: "においもそれだし、水がなかなか流れないのもそのせいです。" }
      - { who: molly, at: 0.5, en: "I thought it was the dishwasher. My neighbor said hers did the same thing last year.", ja: "食洗機のせいだと思ってました。お隣さんが、去年うちも同じだったって言ってたので。" }
      - { who: gruff, at: 0.4, en: "Could be, in some buildings, but not here. Your dishwasher drains into a different pipe.", ja: "建物によってはありえますけど、ここは違います。食洗機は別の管に流れてますから。" }
      - { who: molly, at: 0.4, en: "So my neighbor was wrong.", ja: "じゃあ、お隣さんの話は違ったんですね。" }
      - { who: gruff, at: 0.3, en: "Her building, her pipes. Every place is a little different.", ja: "あちらの建物はあちらの配管ですから。家ごとに少しずつ違うんです。" }
      - { who: molly, at: 0.5, en: "So what are my options?", ja: "じゃあ、どうすればいいですか？" }
      - { who: gruff, at: 0.4, en: "Option one, I clean out the trap and run a snake through the pipe. That's a long metal cable that breaks up the clog.", ja: "一つ目は、トラップを掃除して、管にスネークを通す。詰まりを崩す長い金属のワイヤーです。" }
      - { who: gruff, at: 0.5, en: "That's eight thousand yen, and I can do it right now. But honestly, it might come back in a few months.", ja: "それは八千円で、今すぐできます。ただ正直、数か月でまた詰まるかもしれません。" }
      - { who: molly, at: 0.4, en: "Why would it come back?", ja: "どうしてまた詰まるんですか？" }
      - { who: gruff, at: 0.4, en: "Because the pipe itself is old, and the inside is rough, so grease sticks to it easily.", ja: "管そのものが古くて内側がざらざらなので、油がくっつきやすいんです。" }
      - { who: molly, at: 0.5, en: "And option two?", ja: "二つ目は？" }
      - { who: gruff, at: 0.4, en: "I replace the trap and the old pipe behind it. That's eighteen... sorry, no, twenty-two thousand, once you add the parts.", tts: "I replace the trap and the old pipe behind it. That's eighteen... sorry, no — twenty-two thousand, once you add the parts.", ja: "トラップと、その奥の古い管を交換します。一万八千…いや、すみません、部品を足すと二万二千円です。" }
      - { who: molly, at: -0.3, en: "Twenty-two, with the parts.", ja: "部品込みで二万二千円。" }
      - { who: gruff, at: 0.3, en: "Right. It costs more, but you won't be calling me again next spring.", ja: "そうです。高くはなりますけど、来年の春にまた私を呼ぶことはないでしょう。" }
      - { who: molly, at: 0.5, en: "Can you do that one today, too?", ja: "そっちも今日やってもらえますか？" }
      - { who: gruff, at: 0.4, en: "Not today, unfortunately. The pipe I need is out of stock at the shop, so the earliest would be Thursday.", ja: "あいにく今日は無理です。必要な管が店で品切れなので、早くて木曜です。" }
      - { who: molly, at: 0.5, en: "Thursday. Hmm. I really don't want to live with this smell until Thursday.", ja: "木曜か。うーん。木曜までこのにおいと暮らすのは、本当に嫌なんですよね。" }
      - { who: gruff, at: 0.4, en: "Here's what a lot of people do. I clean the trap today, no charge for the snake, and then I come back Thursday to replace it.", ja: "よくあるのはこうです。今日はトラップだけ掃除して、スネーク代はなし。木曜にまた来て交換します。" }
      - { who: molly, at: 0.4, en: "So I'd only pay the twenty-two thousand in the end?", ja: "じゃあ結局、払うのは二万二千円だけ？" }
      - { who: gruff, at: 0.4, en: "That's right. Today's visit would just be part of the same job.", ja: "そうです。今日の作業は、同じ工事の一部ということで。" }
      - { who: molly, at: 0.5, en: "Okay, let's do that. Thursday morning works for me, if you can come before ten.", ja: "じゃあ、それでお願いします。木曜の朝、十時前に来てもらえるなら大丈夫です。" }
      - { who: gruff, at: 0.4, en: "Nine-thirty it is. And until then, try not to pour any cooking oil down the sink.", ja: "では九時半に。それまでは、流しに料理の油を流さないようにしてください。" }
      - { who: molly, at: 0.5, en: "Where am I supposed to put it, then?", ja: "じゃあ、どこに捨てればいいんですか？" }
      - { who: gruff, at: 0.4, en: "Let it cool, wipe the pan with a paper towel, and throw that out with the burnable trash.", ja: "冷ましてから、フライパンをキッチンペーパーでふいて、燃えるごみに出してください。" }
      - { who: molly, at: 0.4, en: "That sounds like a lot of paper towels.", ja: "キッチンペーパーがたくさんいりそうですね。" }
      - { who: gruff, at: 0.3, en: "It is, but paper towels are a lot cheaper than me. Trust me on that one.", ja: "いりますね。でも、私を呼ぶよりずっと安いですよ。そこは信じてください。" }
      - { who: molly, at: 0.5, en: "Got it. And how long will the job take on Thursday?", ja: "わかりました。木曜の作業はどのくらいかかりますか？" }
      - { who: gruff, at: 0.4, en: "About an hour, maybe less. Just clear out the cabinet under the sink before I get there, so I'm not moving all your cleaning supplies around.", ja: "一時間くらい、もっと早いかも。来る前に流しの下の棚を空けておいてください。掃除用品をあちこち動かさずに済むので。" }
    questions:
      - { type: gist, ask: "どんな やり取り？", line: 23, choices: ["A plumber finds a grease clog and they agree on a two-day plan.", "A plumber says the main pipe under the floor is broken and needs a bigger job.", "A plumber blames the dishwasher and offers to replace it."], answer: 0, cja: ["業者が油の詰まりを見つけ、二日に分けた作業で決まる", "業者が床下の本管が壊れていると言い、大工事になる", "業者が食洗機のせいだと言い、交換をすすめる"], why: "原因はトラップの油。今日は掃除、木曜に交換する二段の計画で決まる。本管ではなく、食洗機も関係ない。" }
      - { type: mean, ask: "交換は いくら？", line: 17, choices: ["Eight thousand yen, done right now.", "Eighteen thousand yen, with the parts.", "Twenty-two thousand yen, with the parts."], answer: 2, cja: ["八千円、今すぐ", "部品込みで一万八千円", "部品込みで二万二千円"], why: "eighteen と言いかけて sorry, no と訂正し、部品を足して twenty-two thousand。八千円は掃除とスネークの方。" }
      - { type: mean, ask: "今日 交換 できない 理由は？", line: 21, choices: ["The plumber is booked until Thursday.", "The pipe he needs isn't in stock right now.", "The new pipe has to dry for a few days before he can fit it."], answer: 1, cja: ["業者が木曜まで予約でいっぱい", "必要な部品がまだ手に入らない", "新しい管を取りつける前に数日乾かす必要がある"], why: "The pipe I need is out of stock＝必要な管が品切れ。それで早くて木曜になる。予定がいっぱいとは言っていない。" }
      - { type: attitude, ask: "モリーが 木曜まで 待つ ことを どう 感じる？", line: 22, choices: ["Unhappy: the smell is too much.", "Relaxed: a few more days doesn't matter.", "Suspicious: she thinks he's making it up."], answer: 0, cja: ["不満：そんなに長くにおいに耐えられない", "気にしない：あと数日くらい平気", "疑っている：作り話だと思う"], why: "I really don't want to live with this smell until Thursday＝木曜までにおいと暮らすのは嫌。それで今日の掃除の案が出る。" }
      - { type: next, ask: "それまで 油は どう する？", line: 29, choices: ["Pour it down the sink with hot water.", "Wipe it up with paper and put it in the burnable trash.", "Keep it in a bottle under the sink and give it to the plumber on Thursday."], answer: 1, cja: ["お湯と一緒に流しに流す", "紙でふき取って燃えるごみに出す", "流しの下の瓶にためて、木曜に業者に渡す"], why: "冷まして、キッチンペーパーでふき、燃えるごみへ。流しに油を流すのが詰まりの原因なので、それはやめる。" }
    dict:
      - { line: 6, words: "taking so long to go down", feature: weak-form }
      - { line: 15, words: "the inside is rough", feature: linking }
      - { line: 28, words: "supposed to put it", feature: flap }

  - kind: long
    id: lg-mori-next-friday
    name: 「来週の 金曜」は いつ？
    source: tts
    ctx: "月曜の 夜。二人が 記念日の 食事を 決める"
    note: "next Friday は 人に よって 違う。日にちで 確かめる"
    tags: { seed: 56, register: partner, pragmatic: refusal, features: [stress, linking, contraction] }
    lines:
      - { who: julian, at: 0, en: "So, I have a surprise. I finally got us a table at that Italian place in Daikanyama.", ja: "ねえ、サプライズがあるんだ。代官山のあのイタリアンの席、やっと取れたよ。" }
      - { who: fauna, at: 0.4, en: "Wait, the one that's always booked? How did you manage that?", ja: "待って、いつも予約でいっぱいのお店？どうやって取ったの？" }
      - { who: julian, at: 0.4, en: "Someone canceled, and I happened to be checking the website at the right moment.", ja: "キャンセルが出て、ちょうどいいタイミングでサイトを見てたんだ。" }
      - { who: fauna, at: 0.4, en: "I tried for my sister's birthday, and they were booked solid for two months.", ja: "妹の誕生日に予約しようとしたら、二か月先までいっぱいだったのに。" }
      - { who: julian, at: 0.3, en: "I know. I've been refreshing that page every morning for a week.", ja: "だよね。一週間、毎朝そのページを更新してたんだ。" }
      - { who: fauna, at: 0.4, en: "That's amazing. When is it?", ja: "すごい。いつ？" }
      - { who: julian, at: 0.4, en: "Next Friday, at seven-thirty. For our anniversary.", ja: "来週の金曜、七時半。記念日だからね。" }
      - { who: fauna, at: 0.5, en: "This Friday? Oh, perfect, I'm free. I'll leave work early.", ja: "今週の金曜？ああ、ちょうどいい、空いてる。仕事を早めに切り上げるね。" }
      - { who: julian, at: -0.3, en: "No, no, not this Friday. Next Friday. The fourteenth.", ja: "いや、今週じゃなくて。来週の金曜。十四日。" }
      - { who: fauna, at: 0.4, en: "But today's Monday. To me, next Friday is this Friday, the one coming up.", ja: "でも今日は月曜でしょ。私にとって来週の金曜って、今度の金曜のことだよ。" }
      - { who: julian, at: 0.4, en: "Really? To me, this Friday is this week, and next Friday is the week after.", ja: "本当？ぼくにとっては今週の金曜は今週で、来週の金曜はその次の週だよ。" }
      - { who: fauna, at: 0.5, en: "Okay, well, either way, it's the fourteenth. And the fourteenth is... hmm.", ja: "まあ、どっちにしても十四日ね。十四日は…うーん。" }
      - { who: julian, at: 0.5, en: "That doesn't sound good.", ja: "その「うーん」、よくなさそう。" }
      - { who: fauna, at: 0.4, en: "That's the night of my team's farewell dinner for Sylvia. The one I told you about, who's moving to Fukuoka.", ja: "その夜は、チームのシルビアの送別会なの。福岡に引っ越すって話した人。" }
      - { who: julian, at: 0.5, en: "Oh, right. You did tell me. Can you skip it?", ja: "ああ、そうだった。聞いてた。休めない？" }
      - { who: fauna, at: 0.5, en: "I mean, I could, technically. I'm the one who organized it, but sure, I could skip it.", ja: "まあ、行かないこともできるけど。幹事は私なんだけどね。でも、まあ、休めなくはない。" }
      - { who: julian, at: 0.4, en: "Okay, I can tell that's a no.", ja: "わかった、それは「無理」ってことだね。" }
      - { who: fauna, at: 0.3, en: "It's not a no! It's just... a very uncomfortable yes.", ja: "無理じゃないよ！ただ…すごく気まずい「いいよ」なだけ。" }
      - { who: julian, at: 0.4, en: "Then let's not do that. What about Saturday, the fifteenth? Our actual anniversary is Sunday anyway.", ja: "じゃあそれはやめよう。土曜の十五日は？本当の記念日はどうせ日曜だし。" }
      - { who: fauna, at: 0.4, en: "Saturday works. But will they let you move a booking you only got because someone else canceled?", ja: "土曜なら大丈夫。でも、キャンセル待ちで取れた予約を変えさせてくれるかな？" }
      - { who: julian, at: 0.5, en: "No idea. The website says changes have to be made by phone, at least three days ahead.", ja: "わからない。サイトには、変更は電話で、三日前までにって書いてある。" }
      - { who: fauna, at: 0.4, en: "So you'd have to call them by Tuesday at the latest.", ja: "じゃあ遅くても火曜までに電話しないとね。" }
      - { who: julian, at: 0.4, en: "Actually, they open at noon tomorrow. I'll call them on my lunch break.", ja: "実は明日は十二時に開くんだ。昼休みに電話するよ。" }
      - { who: fauna, at: 0.4, en: "Ask for the same time if you can. Seven-thirty is perfect, because I can go home and change first.", ja: "できれば同じ時間で頼んで。七時半なら一度帰って着替えられるから、ちょうどいいの。" }
      - { who: julian, at: 0.3, en: "Seven-thirty, same table if they have it. Anything else, boss?", ja: "七時半、できれば同じ席。ほかにご注文は、ボス？" }
      - { who: fauna, at: 0.5, en: "And if Saturday's full?", ja: "もし土曜がいっぱいだったら？" }
      - { who: julian, at: 0.4, en: "Then I'll ask about Sunday. And if that's full too, we keep the fourteenth, and you go to your dinner first.", ja: "そしたら日曜を聞く。それもだめなら十四日のままにして、きみは先に送別会に行く。" }
      - { who: fauna, at: -0.2, en: "And come to dessert late? That's actually not a bad plan B.", ja: "で、デザートから合流？それ、予備の案としては悪くないね。" }
      - { who: julian, at: 0.4, en: "I'm full of good plans. Just not good at saying which Friday I mean.", ja: "いい案ならいくらでもあるよ。どの金曜か言うのが下手なだけで。" }
      - { who: fauna, at: 0.4, en: "From now on, we just say the date. No more this Friday, next Friday.", ja: "これからは日にちで言おう。今週の金曜とか来週の金曜とかはなし。" }
      - { who: julian, at: 0.4, en: "Deal. So, Saturday the fifteenth, seven-thirty, if they can still fit us in.", ja: "了解。じゃあ十五日の土曜、七時半。まだ入れてもらえればね。" }
      - { who: fauna, at: 0.4, en: "And if they ask why we're changing, please don't say it's because you can't count Fridays.", ja: "で、変更の理由を聞かれても、金曜が数えられないからなんて言わないでね。" }
      - { who: julian, at: 0.4, en: "I'll tell them my partner has a very busy social life.", ja: "パートナーがとても忙しい人だって言っとくよ。" }
      - { who: fauna, at: 0.4, en: "Which is true. And mention that it's our anniversary. Some places bring out a little cake if you ask.", ja: "それは本当。あと記念日だって伝えて。頼むと小さなケーキを出してくれるお店もあるから。" }
      - { who: julian, at: 0.4, en: "Now who's the one with all the good plans?", ja: "おや、いい案だらけなのはどっちかな？" }
    questions:
      - { type: gist, ask: "どんな 話？", line: 10, choices: ["They mean different Fridays and move the booking.", "They argue because he forgot their anniversary dinner.", "They cancel the dinner booking because the restaurant is full that night."], answer: 0, cja: ["別々の金曜を思っていて、夕食の予約を動かそうとする", "記念日の夕食を彼が忘れていてけんかになる", "その夜は店がいっぱいなので夕食の予約を取り消す"], why: "next Friday を彼女は今度の金曜、彼は翌週の十四日と思っていた。十四日は送別会なので、土曜に変えようとする。" }
      - { type: mean, ask: "予約は 何日？", line: 8, choices: ["This coming Friday.", "Friday the fourteenth.", "Saturday the fifteenth."], answer: 1, cja: ["今度の金曜", "十四日の金曜", "十五日の土曜"], why: "not this Friday. Next Friday. The fourteenth＝十四日。土曜の十五日は、これから変えたい日。" }
      - { type: mean, ask: "I could, technically が 示すのは？", line: 15, choices: ["She's happy to skip the farewell dinner.", "She really doesn't want to skip it, since she organized it.", "She can't decide yet if she'll go to the farewell dinner."], answer: 1, cja: ["喜んで送別会を休む", "幹事なので、本当は休みたくない", "送別会に行くかまだ決めていない"], why: "technically（できなくはない）と幹事だという話で、本音は休みたくない。彼も that's a no と気づき、彼女は「気まずい いいよ」と言う。" }
      - { type: next, ask: "ジュリアンは 明日 何を する？", line: 22, choices: ["Change the booking on the website tonight.", "Call the restaurant at lunch to ask about Saturday.", "Go to the restaurant at noon to book in person."], answer: 1, cja: ["今夜サイトで予約を変える", "昼休みに店に電話して土曜を聞く", "十二時に店に行って直接予約する"], why: "変更は電話のみ。店は十二時に開くので I'll call them on my lunch break。サイトでは変えられない。" }
    dict:
      - { line: 2, words: "at the right moment", feature: weak-form }
      - { line: 14, words: "Can you skip it", feature: linking }
      - { line: 19, words: "only got because", feature: t-glottal }
