  - kind: serial
    id: serial-tokyo-3
    chapter: 3
    title: "Number Forty-Two"
    line: "ブーケが くやくしょで じゅうしょを とどけます"
    ja: "日本では引っ越したら2週間以内に区役所へ届けを出す。月曜の朝、ブーケはアリゲッティの傘をさして区役所へ。案内のモーリーに言われて番号札（42番）を取り、用紙に記入して待つ。住所の書き方が逆で、日本は大きい方から書くと教わって書きなおすと、在留カードの裏に新しい住所が印字される。次は国民健康保険の窓口でまた番号札。同僚のチッチからは「次は本と、おやつを持っていって」。お昼までかかったけれど、新しい保険証を手にして大満足。傘を忘れてモーリーが走って届けてくれる。帰って返しに行くと、アリゲッティは土曜まで留守。トマトの水やりをたのむ書き置きがあった。"
    scene: office
    segments:
      - { who: narrator, en: "In Japan, when you move, you have to tell the ward office within two weeks. Rosie had a reminder on her phone, with three exclamation points." }
      - { who: narrator, en: "So on Monday morning, she took a few hours off work and walked to the ward office by the station. It was raining again." }
      - { who: narrator, en: "She took Gayle's umbrella. Of course she did. It was the only umbrella she had." }
      - { who: narrator, en: "The ward office was a big, busy building, full of signs, counters, and people waiting quietly in rows of chairs." }
      - { who: narrator, en: "Rosie stood in the middle of the lobby and turned around slowly, like someone looking for their car in a parking lot." }
      - { who: narrator, en: "A man at the information desk waved her over. He had a neat tie, a big smile, and a name tag: Orville." }
      - { who: orville, en: "Good morning! Welcome! How can I help you? Please, don't be shy. I'm practicing my English. I love to practice." }
      - { who: rosie, en: "Hi! I just moved here, and I think I need to register my address? I'm sorry, I don't really know how this works." }
      - { who: orville, en: "No problem at all. First, please take a number from the machine. Then fill out this form, and have a seat." }
      - { who: narrator, en: "The machine gave her a little paper ticket. Number forty-two. The screen above the counters said number twenty-nine." }
      - { who: rosie, en: "Okay. Thirteen people ahead of me. That's fine. I've got a pen. I've got a form. I can do this." }
      - { who: narrator, en: "The form had a lot of boxes. Name. Date of birth. Old address. New address. She filled them all out carefully, in her neatest handwriting." }
      - { who: narrator, en: "When number forty-two came up, Orville was at the counter, and he seemed very happy to see her again." }
      - { who: orville, en: "Ah, it's you! Let me see. Very good. Very good. Oh. Oh, I see. Your address is the other way around." }
      - { who: rosie, en: "The other way around? What do you mean?" , tts: "The other way around? Whaddaya mean?" }
      - { who: orville, en: "In America, you start small. Your apartment, your street, your city. In Japan, we start big. Tokyo first. Then the ward, the neighborhood, the block, then your building." }
      - { who: rosie, en: "Oh, that's funny. It's like zooming in on a map instead of out. Okay, give me one second.", tts: "Oh, that's funny. It's like zooming in on a map instead of out. Okay, gimme one second." }
      - { who: narrator, en: "She wrote it all again, from big to small. Orville checked every line with his finger, nodding at each one." }
      - { who: narrator, en: "Then he printed her new address on the back of her residence card and handed it to her with both hands." }
      - { who: orville, en: "Perfect. Now, one more thing. Health insurance. That's a different counter, over there on the right. Please take another number." }
      - { who: rosie, en: "Another number? Okay. Sure. Why not." }
      - { who: narrator, en: "The second number was fifty-eight. She sat down again. The lady next to her was knitting a tiny sweater. The man on her other side was asleep." }
      - { who: narrator, en: "She texted Nana, her coworker at the design studio in Ebisu, who had lived in Tokyo for years. Nana sent a voice message back." }
      - { who: nana, en: "Oh, the ward office! I remember. Next time, bring a book. And snacks. Don't worry, it's always slow, but it always works out." }
      - { who: narrator, en: "By the time she had her insurance card, it was almost one o'clock. It had taken all morning." }
      - { who: narrator, en: "But walking outside with a brand new card in her bag, she felt like she had won a prize." }
      - { who: orville, en: "Excuse me! Rosie! Wait, please! Your umbrella! You forgot your umbrella!" }
      - { who: narrator, en: "Orville came running down the front steps, holding Gayle's big navy umbrella over his head like a flag." }
      - { who: rosie, en: "Oh my gosh, thank you! It's not even mine. My neighbor would never forgive me. I owe you one, Orville." }
      - { who: orville, en: "You're welcome. And welcome to the neighborhood. Now it's official. You're on paper! Have a nice day!" }
      - { who: narrator, en: "For lunch, she found a tiny restaurant with plastic food in the window, and pointed at the grilled fish. It came with rice, soup, and pickles." }
      - { who: narrator, en: "On the way home, the rain stopped. She went straight to Gayle's door to give back the umbrella. She knocked. Nobody answered." }
      - { who: narrator, en: "There was only a little note on the door, in neat handwriting. Visiting my sister. Back on Saturday. Could you water my tomatoes? G." }
      - { who: narrator, en: "So Rosie watered the tomatoes, and carried the umbrella back upstairs. And that night, she stuck ticket number forty-two on her fridge." }
    ph:
      - { id: ph-take-a-number, en: "take a number", ja: "番号札を取る", match: "take (a|another) number", register: official, scene: "the ward office", trap: "数を取る ではなく、順番待ちの札を取る" }
