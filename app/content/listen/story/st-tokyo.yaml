# おやすみ ものがたり (docs/curriculum.md §7.1, docs/curriculum-wave2.md §3.2 B6): トウキョウ ひとりぐらし, a bedtime
# serial in seven chapters. Rosie, from a small town in Ohio, spends her first month living alone in Tokyo, in a small
# building by the Meguro River in Nakameguro: the trash schedule, the konbini at three a.m., the ward office, the shrine
# festival on her street, a small earthquake and the neighborhood drill, the bathhouse, and the harvest moon. The thread
# is Gayle's navy umbrella, lent in the first rain and given back for good in the last chapter (and Mochi, a festival
# goldfish). Everyday and cozy, nothing at stake. Extensive listening at ~95 % comprehension for a B1+ ear: no score, no
# questions, a sleep timer. The narrator is us-f3 (gentle, calm); every speaker is a US voice. Each chapter's `predict`
# is for the morning after; its `answer` is what the next chapter tells. Draft: voiced in batch A5 (after W2-R), shown
# only with the dev hooks until then. Checks: src/lib/kikimimi/stories.test.ts.
