    title: "A Small Room by the River"
    line: "ブーケが トウキョウで ひとりぐらしを はじめます"
    ja: "8月の最後の夜、オハイオの小さな町から来たブーケが、中目黒の目黒川ぞいの小さなアパートに着く。はじめてのひとり暮らし。大家のたぬきちが部屋を案内し、ごみの日（燃えるごみは火・金、プラは水、缶・びんは隔週の木曜）を説明する。真下の部屋のアリゲッティが声をかけてくれて「何かあったらノックしてね」。荷ほどきするつもりが、ブーケは服のまま、夜10時前に眠ってしまう。"
    scene: door
    segments:
      - { who: narrator, en: "On the last night of August, a little train pulled into Nakameguro Station, and Rosie stepped off it with two big suitcases." }
      - { who: narrator, en: "She also had a backpack that was much too full, a map on her phone, and a key she had never used." }
      - { who: narrator, en: "Two weeks ago, she was living in a small town in Ohio. Now she had a job in Tokyo, and an apartment of her own." }
      - { who: narrator, en: "It was her first time living alone. Her mom had cried at the airport. Rosie had cried a little on the plane, too." }
      - { who: narrator, en: "The air was hot and heavy, even at nine at night. The cicadas were still buzzing in the trees, like somebody had left a radio on." }
      - { who: narrator, en: "She rolled her suitcases along a narrow street by the Meguro River. The water was low and quiet, and cherry trees leaned over it from both sides." }
      - { who: rosie, en: "Okay. Left at the bakery, then right at the vending machine. Wait. There's a vending machine on every corner. This could take a while." }
      - { who: narrator, en: "Her building was small and white, just two floors, with stairs on the outside and a row of potted plants by the front door." }
      - { who: narrator, en: "The landlord, Tom Nook, was waiting under the light with a folder, smiling like he had been waiting all day." }
      - { who: tom-nook, en: "Welcome, welcome! You must be Rosie. How was your flight? Long, I'm sure. Come in, come in. Shoes off right here, please." }
      - { who: narrator, en: "The apartment was one room, six tatami mats, with a tiny kitchen, a tiny bathroom, and a sliding glass door to a tiny balcony." }
      - { who: narrator, en: "Everything was small and clean, and it all fit together like a puzzle. Rosie loved it right away." }
      - { who: tom-nook, en: "Now, this is very important. The trash schedule. Burnable trash on Tuesdays and Fridays. Plastic on Wednesdays. Cans and bottles every other Thursday." }
      - { who: rosie, en: "Every other Thursday. Okay. I'm going to need to write this down. Actually, can I just take a picture of it?", tts: "Every other Thursday. Okay. I'm gonna need to write this down. Actually, can I just take a picture of it?" }
      - { who: tom-nook, en: "Of course, of course. It's a lot to take in on your first night. Don't worry. You'll get the hang of it. Everybody does." }
      - { who: narrator, en: "He showed her how the hot water worked, which buttons on the toilet did what, and where to leave her shoes. Then he handed her the folder." }
      - { who: tom-nook, en: "Make yourself at home, Rosie. And if you need anything at all, my number's on the first page. Good night!" }
      - { who: narrator, en: "And then he was gone, and it was very, very quiet." }
      - { who: narrator, en: "Rosie sat down in the middle of her new room. There was no furniture yet. Just her suitcases, the folder, and the hum of the fridge." }
      - { who: rosie, en: "Hi, apartment. I'm Rosie. I guess we live together now. I promise I'll learn the trash schedule." }
      - { who: narrator, en: "She opened the glass door and stepped out onto the balcony. From there, she could see a little piece of the river, and the city lights beyond it." }
      - { who: narrator, en: "Somewhere down the street, a train went by. Somewhere else, a dog barked twice, and then thought better of it." }
      - { who: narrator, en: "Then a door opened downstairs, and a voice called up to her, soft and friendly." }
      - { who: gayle, en: "Hello? Are you the new neighbor? I heard the suitcases on the stairs. I'm Gayle. I live right below you." }
      - { who: narrator, en: "Gayle was an older lady with reading glasses on a chain, and she was holding a watering can, even though it was dark." }
      - { who: rosie, en: "Hi! Yes, I'm Rosie. I just got here. Sorry about the noise. Those suitcases weigh about as much as I do." }
      - { who: gayle, en: "Oh, don't worry about it, dear. I lived in California for ten years when I was young. I remember my first night there." }
      - { who: gayle, en: "Get some sleep. Tomorrow, everything will feel a little less strange. And come knock if you need anything." }
      - { who: narrator, en: "Rosie thanked her and went back inside. She meant to unpack. She meant to take a shower. She meant to call her mom." }
      - { who: narrator, en: "Instead, she lay down on the tatami for just a minute, still in her clothes, and she was out like a light." }
      - { who: narrator, en: "It wasn't even ten o'clock. Outside, the cicadas finally stopped, and the river kept going, slow and dark, under the cherry trees." }
