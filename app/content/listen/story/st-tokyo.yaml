  - kind: serial
    id: serial-tokyo-2
    chapter: 2
    title: "Three in the Morning"
    line: "ブーケが よなかの コンビニに いきます"
    ja: "時差ぼけで夜中の3時に目がさめたブーケは、角のコンビニへ。夜勤の大学生レムに鮭の弁当を温めてもらい、袋もはしも「イエス」。おにぎりの開け方（1、2、3の順）を教わるが、2つ目でのりがやぶれてしまう。川べりで卵サンドを食べ、空が明るくなったころ、とつぜんの夏の大雨。ずぶぬれのブーケを、散歩帰りのアリゲッティが紺色の大きな傘に入れてくれ、「しばらく使って。返すのはいつでも」とそのまま貸してくれる。"
    scene: street
    segments:
      - { who: narrator, en: "Rosie opened her eyes. The room was dark. For a moment, she had no idea where she was, or why the floor smelled like grass." }
      - { who: narrator, en: "Then she remembered. Tokyo. The tatami. Her phone said it was three in the morning, and she was wide awake." }
      - { who: rosie, en: "Oh no. This is jet lag, isn't it? My body thinks it's lunchtime. And I'm starving. I haven't eaten since the plane." }
      - { who: narrator, en: "There was nothing in her kitchen but a bottle of water and some tea bags from her mom. So she put on her sneakers and went out." }
      - { who: narrator, en: "The street was empty. But down at the corner there was a light, big and bright, like a lighthouse in the dark." }
      - { who: narrator, en: "It was a convenience store, open all night, like they always are in Japan. The doors slid open with a little song." }
      - { who: narrator, en: "Inside, it was cool and clean and full of everything. Rice balls. Sandwiches. Hot drinks in a warm little case. Ice cream. Socks. Even neckties." }
      - { who: narrator, en: "Behind the counter was a sleepy young goat with a name tag that said Sherb, a college student working the night shift." }
      - { who: sherb, en: "Oh, hey. Good morning. Or, um, good night? Honestly, I'm not sure anymore at this hour. Take your time.", tts: "Oh, hey. G'morning. Or, um, g'night? Honestly, I'm not sure anymore at this hour. Take your time." }
      - { who: narrator, en: "Rosie took her time. She picked out an egg sandwich, two rice balls, a little box of salmon and rice, and, after some thought, a pudding." }
      - { who: sherb, en: "Want me to heat that up for you? It only takes like a minute. And do you need a bag? Chopsticks?", tts: "Want me to heat that up for ya? It only takes like a minute. And d'you need a bag? Chopsticks?" }
      - { who: rosie, en: "Yes, please. And yes to the bag, and yes to chopsticks. And no, sorry, I don't have a points card. I just got here." }
      - { who: sherb, en: "No worries. Hey, is this your first konbini rice ball? Here, let me show you. There's a trick to it.", tts: "No worries. Hey, is this your first konbini rice ball? Here, lemme show you. There's a trick to it." }
      - { who: narrator, en: "He picked up one of the rice balls and showed her the little numbers printed on the plastic. One, two, three." }
      - { who: sherb, en: "Pull number one, straight down the middle. Then two, then three. And that's it. The seaweed stays nice and crispy." }
      - { who: narrator, en: "Rosie tried the second one herself. She pulled number one. Then number three. Then number two." }
      - { who: narrator, en: "The seaweed tore in half and stayed stuck inside the plastic. The rice fell into her hand in one big lump." }
      - { who: sherb, en: "Hey, that's okay. Everybody messes it up the first time. It still tastes the same. Seriously, don't worry about it.", tts: "Hey, that's okay. Ev'rybody messes it up the first time. It still tastes the same. Seriously, don't worry about it." }
      - { who: rosie, en: "Thank you. Really. You're only the third person I've really talked to in Tokyo. Thanks, Sherb." }
      - { who: narrator, en: "She ate the egg sandwich on a bench by the river. It was soft and sweet and perfect." }
      - { who: narrator, en: "Slowly, the sky turned gray, then pink. An old man walked by with a tiny dog in a stroller. A crow said something loud from a power line." }
      - { who: narrator, en: "And then, with no warning at all, it started to rain. Not a gentle rain. A big summer rain, warm and heavy, all at once." }
      - { who: rosie, en: "Oh, come on! Seriously? It was totally clear a second ago!", tts: "Oh, c'mon! Seriously? It was totally clear a second ago!" }
      - { who: narrator, en: "She ran home with the plastic bag over her head. By the time she reached her street, she was soaked. Only the pudding was dry." }
      - { who: narrator, en: "At the corner, someone was standing under a big navy umbrella with a wooden handle. It was Gayle, coming home from her morning walk." }
      - { who: gayle, en: "Good morning, dear! My goodness, look at you. Come here, come under. The weather changes its mind fast in summer." }
      - { who: narrator, en: "They walked home together under the big umbrella. At the front door, Gayle closed it, shook it once, and handed it to Rosie." }
      - { who: gayle, en: "Here. Keep this for now. It's supposed to rain all week, and you start work tomorrow, don't you? I have more umbrellas than I need." }
      - { who: rosie, en: "Are you sure? Thank you so much. I'll bring it right back, I promise. As soon as the rain stops." }
      - { who: gayle, en: "Oh, there's no hurry. Bring it back whenever. That's what neighbors are for." }
      - { who: narrator, en: "Upstairs, Rosie leaned the umbrella by her door, where she would see it. Then she ate the pudding, very slowly, and watched the rain." }
      - { who: narrator, en: "She fell asleep again right there by the window, with the spoon still in her hand. This time, she slept until noon." }
