      - { who: gayle, en: "Perfect timing! I'm going to the bathhouse. Why don't you come along? Nothing fixes a long day like a hot bath. Bring a towel." }
      - { who: rosie, en: "A public bath? With other people? Um. I've never done that. Is it, like, everybody together?", tts: "A public bath? With other people? Um. I've never done that. Is it, like, ev'rybody together?" }
      - { who: gayle, en: "Men on one side, women on the other. Don't worry, I'll show you everything. And if you hate it, you never have to go again." }
      - { who: narrator, en: "The bathhouse was three streets away, on a corner. It had a tall chimney, a blue cloth curtain over the door, and a sign Rosie couldn't read yet." }
      - { who: narrator, en: "Inside, they put their shoes in little lockers with wooden keys, and Gayle paid for both of them before Rosie could find her wallet." }
      - { who: gayle, en: "My treat. You're a first-timer, and first-timers don't pay. That's my rule, not theirs." }
      - { who: narrator, en: "In the changing room, a few older ladies were drying their hair. One of them smiled at Rosie, the kind of smile that says, oh, a new one." }
      - { who: narrator, en: "Rosie was nervous. But nobody was looking at anybody. Everyone was just there to get clean and warm, and to talk about their grandchildren." }
      - { who: gayle, en: "Rule number one. You wash first, sitting on a stool. Then you get in. The bath is for soaking, not for washing." }
      - { who: narrator, en: "So they sat on low plastic stools in front of little mirrors and washed. Then Rosie stood up, turned around, and saw the wall." }
      - { who: narrator, en: "It was covered with a huge painting of Mount Fuji. Blue sky, snow on top, and a blue lake at the bottom." }
      - { who: rosie, en: "Whoa. Gayle. There's a mountain. There's a whole mountain on the wall." }
      - { who: gayle, en: "Isn't it lovely? A lot of the old bathhouses have one. Somebody painted it by hand, and every few years, they touch it up." }
      - { who: narrator, en: "Then Rosie put one foot in the water, and pulled it right back out." }
      - { who: rosie, en: "Oh my gosh, it's so hot! How is anybody sitting in this? Are you sure this isn't soup?" }
      - { who: gayle, en: "Take it slow. One foot, then the other. Then sit, and don't move. Believe me, in a minute, you won't want to get out.", tts: "Take it slow. One foot, then the other. Then sit, and don't move. Believe me, in a minute, you won't wanna get out." }
      - { who: narrator, en: "Rosie went in very slowly. Then she sat down, up to her shoulders, and let out a long breath." }
      - { who: narrator, en: "The heat went into her shoulders, her back, and her tired feet. The ward office forms, the trash days, all of it just floated away." }
      - { who: rosie, en: "Okay. I take it back. This is the best thing that's ever happened to me. I'm never getting out. I live here now.", tts: "Okay. I take it back. This is the best thing that's ever happened to me. I'm never gettin' out. I live here now." }
      - { who: narrator, en: "An old lady across the bath laughed and said something to Gayle in Japanese. Gayle laughed too." }
      - { who: rosie, en: "Wait, what did she say? Was it about me?", tts: "Wait, what'd she say? Was it about me?" }
      - { who: gayle, en: "She said you look like you've been coming here for years. That's a compliment, dear. A big one." }
      - { who: narrator, en: "They soaked until their faces were pink. Then they got dressed, and Gayle bought two little glass bottles of coffee milk from a fridge by the door." }
      - { who: gayle, en: "Now, this is important. You drink it standing up, with one hand on your hip. Like this. Don't ask me why. It's just how it's done." }
      - { who: narrator, en: "So they stood side by side, each with one hand on her hip, and drank their coffee milk all at once. It was sweet and cold and perfect." }
      - { who: rosie, en: "Oh, that hits the spot. Gayle, I'm serious. Can we do this every Thursday?" }
      - { who: gayle, en: "Every Thursday. It's a date. But next time, you bring your own towel." }
