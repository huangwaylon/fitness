      - { id: ph-other-way-around, en: "the other way around", ja: "逆、反対", register: official, scene: "writing an address", trap: "別の道をまわる ではなく、順番や向きが逆" }
      - { id: ph-one-more-thing, en: "one more thing", ja: "もうひとつだけ", register: official, scene: "a second counter", trap: "もうひとつの物 ではなく、話を追加する合図" }
      - { id: ph-works-out, en: "it always works out", ja: "最後はなんとかなる", match: "works out", register: colleague, scene: "a slow office", trap: "work out＝運動する の意味もあるが、ここは「うまくいく」" }
      - { id: ph-owe-you-one, en: "I owe you one", ja: "ひとつ借りができたね", register: stranger, scene: "a forgotten umbrella", trap: "お金の借り ではなく、気軽なお礼" }
    predict:
      ask: "どようび、ブーケは どこへ いく？"
      choices:
        - "To the shrine festival on her own street."
        - "Back to the ward office, for a third number."
        - "To the airport, to pick up her mom."
      answer: 0
      ja: "自分の家の通りでひらかれる神社のお祭りへ。"

  - kind: serial
    id: serial-tokyo-4
    chapter: 4
    title: "The Festival on Our Street"
    line: "ブーケが まちの おまつりに いきます"
    ja: "土曜の午後、窓の外で太鼓の音。いつもの通りがちょうちんと屋台でいっぱいになっていた。浴衣のチッチと、焼きそば、チョコバナナ、かき氷。神輿がやってきて、町内会のたいへいたに「担いでみなよ！」と言われ、ブーケも「わっしょい」とさけびながら2ブロック担ぐ。川のそばでは、コンビニのレムがおじさんの金魚すくいの屋台を手伝っていた。ポイがやぶれて「もう少しだったのに！」。でもレムがこっそり1匹くれて、金魚の名前はモチ。帰り道、浴衣姿のアリゲッティが「傘はまだ持ってて。あしたは雨よ」。"
    scene: street
    segments:
      - { who: narrator, en: "On Saturday afternoon, Rosie heard drums. Not far away. Close. Right outside her window." }
