  - kind: serial
    id: serial-tokyo-5
    chapter: 5
    title: "The Night the Floor Moved"
    line: "ブーケが はじめて じしんに あいます"
    ja: "次の土曜の夜、歯みがき中に鏡がゆれだした。はじめての地震。ブーケは歯ブラシをくわえたまま固まってしまう。10秒ほどでおさまると、アリゲッティが「大丈夫？」と様子を見に来て、麦茶をいれてくれる。翌朝は小学校で町内の防災訓練。名簿を持ったたぬきち、消火器、煙の中を歩くテント、そして地震体験車。消防のチーフに「テーブルの下に入って、脚をしっかり持って。手を離すな」と教わる。午後はアリゲッティと赤い防災リュックを作る。水、懐中電灯、ラジオ、乾パン、そして「気持ちを落ちつける」ためのあめ。リュックは紺色の傘のとなりに。"
    scene: gate
    segments:
      - { who: narrator, en: "The next Saturday night, Rosie was brushing her teeth when the bathroom mirror began to shake." }
      - { who: narrator, en: "At first, she thought it was a truck. Then the ceiling light started to swing, and the water in Mochi's bowl moved like a tiny ocean." }
      - { who: rosie, en: "Oh. Oh no. Is this an earthquake? This is an earthquake. Okay. Okay. What do I do? What do I do?" }
      - { who: narrator, en: "She stood very still, with the toothbrush in her mouth. The floor creaked. The glasses in the kitchen rattled." }
      - { who: narrator, en: "After maybe ten seconds, it just stopped. The light swung a little more and was still. Outside, a dog barked once." }
      - { who: narrator, en: "Her heart was pounding. Then she heard footsteps on the stairs, and a gentle knock on her door." }
      - { who: gayle, en: "Rosie? It's Gayle. Are you all right, dear? I thought I'd better check on you. Was that your first one?" }
      - { who: rosie, en: "Yes! I just stood there. With a toothbrush. I didn't know what to do. Was that a big one?" }
      - { who: gayle, en: "Oh, no, that was a small one. We get those now and then. But there's a neighborhood drill tomorrow morning, at the school. Come with me." }
      - { who: narrator, en: "Gayle made them both cold barley tea, and they drank it on Rosie's floor until her hands stopped shaking." }
      - { who: narrator, en: "The next morning, the school playground was full of neighbors. Kids, grandparents, families with strollers. Tom Nook was there with a clipboard, of course." }
      - { who: tom-nook, en: "Good morning, everyone! Thank you for coming! Yes, yes. Please find your name on the list. And Rosie, welcome to your very first drill!" }
      - { who: narrator, en: "Firefighters had set up stations all around the playground. At one, people were taking turns with a fire extinguisher on a pretend fire." }
      - { who: narrator, en: "At another, there was a tent full of harmless white smoke, and you walked through it bent over low, a cloth over your mouth." }
      - { who: narrator, en: "And at the far end was a truck with a little kitchen built on the back. The sign said Earthquake Experience." }
      - { who: narrator, en: "The firefighter in charge was a gray wolf with a serious face and a loud voice. His name, of all things, was Chief." }
      - { who: chief, en: "All right. In this room, we make a real earthquake. When it starts, get under the table and hold on to the leg. Don't let go. Got it?" }
      - { who: rosie, en: "Got it. Under the table. Hold on to the leg. Don't let go. Wait. How big is big?" }
      - { who: chief, en: "Big enough. Don't worry, it's safe. It's better to feel it here, with me, than for the first time at home, alone." }
      - { who: narrator, en: "Rosie and Gayle sat down in the little kitchen. And then the whole room began to shake. Not a little. A lot. Like being inside a washing machine." }
      - { who: narrator, en: "Rosie dove under the table and held on to the leg with both hands. Next to her, Gayle was holding on too, and somehow she was laughing." }
      - { who: gayle, en: "Hold on tight, dear! Here comes the big part! Oh, my glasses! There they go!" }
      - { who: narrator, en: "When it stopped, Rosie crawled out. Her legs felt like noodles. Chief looked at her for a long moment. Then he gave her a thumbs-up." }
      - { who: chief, en: "Good. You stayed under. That's the most important thing. Now. Do you have an emergency bag at home?" }
      - { who: rosie, en: "An emergency bag? Um. I have a suitcase. And a few rice balls. Does that count?" }
      - { who: gayle, en: "Don't worry, I'll help you make one. Water, a flashlight, a radio, some crackers. You never know. Better safe than sorry." }
      - { who: narrator, en: "That afternoon, they filled a red backpack together. Bottles of water. A flashlight. A little radio. Hard crackers that would keep for years." }
      - { who: narrator, en: "Gayle also put in a pair of socks, a whistle, and a small bag of hard candy." }
      - { who: gayle, en: "The candy is for your nerves. That's not official. That's just my advice." }
      - { who: narrator, en: "Back home, Rosie put the red backpack by her door, next to Gayle's navy umbrella. Looking at them, she felt a little braver." }
      - { who: rosie, en: "Okay, Mochi. If the floor moves again, I'm getting under the table. And you're, well, you're already in the water. You'll be fine.", tts: "Okay, Mochi. If the floor moves again, I'm gettin' under the table. And you're, well, you're already in the water. You'll be fine." }
      - { who: narrator, en: "That night, a train went by, and the glasses rattled a little on the shelf. Rosie opened one eye. Then she smiled, and went back to sleep." }
