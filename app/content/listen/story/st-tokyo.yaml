      - { who: narrator, en: "She knew which vending machine had hot corn soup, and which bakery had melon bread at four o'clock. She didn't need the map anymore." }
      - { who: narrator, en: "On Friday afternoon, at the studio, Nana leaned over the little wall between their desks." }
      - { who: nana, en: "Hey, tonight's the harvest moon. It's kind of a thing here. You look at the moon, eat little white rice dumplings, and just hang out.", tts: "Hey, tonight's the harvest moon. It's kinda a thing here. You look at the moon, eat little white rice dumplings, and just hang out." }
      - { who: nana, en: "Oh, and when you move in somewhere, you're supposed to bring your neighbors a little gift. Like a box of sweets. Did you do that?", tts: "Oh, and when you move in somewhere, you're s'posed to bring your neighbors a little gift. Like a box of sweets. Did you do that?" }
      - { who: rosie, en: "A gift? When you move in? No! Nobody told me! It's been a whole month! And Gayle has done so much for me." }
      - { who: narrator, en: "So on the way home, Rosie stopped at the sweet shop by the station, and then at the convenience store, where Sherb was just starting his shift." }
      - { who: sherb, en: "Moon dumplings? Yeah, we've got them. You're lucky. Last two boxes. Are you having a party or something?", tts: "Moon dumplings? Yeah, we got 'em. You're lucky. Last two boxes. Are you havin' a party or somethin'?" }
      - { who: narrator, en: "Rosie bought both boxes, and just in case." }
      - { who: narrator, en: "That evening, she knocked on Gayle's door with a box of sweets, the big navy umbrella, and a very red face." }
      - { who: rosie, en: "Gayle, I'm so sorry. I just found out I was supposed to bring you a gift when I moved in. So, here. A month late." }
      - { who: rosie, en: "And here's your umbrella. Finally. Thank you for lending it to me." }
      - { who: gayle, en: "Oh, Rosie. You shouldn't have. You watered my tomatoes. You came to the bath with me. That's better than any box of sweets." }
