  - kind: serial
    id: serial-cafe-3
    chapter: 3
    title: "Too Many Drinks"
    line: "メニューと なまえを きめます"
    ja: "ジャスミンのメニューは22種類。キャラメルが試しに来るが、多すぎて選べない。マスターの「いちばん得意なものは？」で、5つにしぼる。店の名前は「リトル・ケトル」。メイベルが看板とカーテンを縫ってくれたが、看板のつづりが「LITLE」になっていた。ジャスミンは青くなるが、そのままにすることにする。"
    scene: cafe
    segments:
      - { who: narrator, en: "With the machine working, Pekoe sat down at the counter one night to write her menu. She was very excited. Maybe a little too excited." }
      - { who: narrator, en: "By midnight, the menu had twenty-two drinks on it. There was a pumpkin spice latte, a lavender honey oat milk thing, and something called the Midnight Mocha Supreme." }
      - { who: narrator, en: "The next morning, Goldie came by to be the very first taste tester. She sat down, opened the menu, and her smile slowly froze." }
      - { who: goldie, en: "Wow. Okay. This is a lot of choices. Like, a lot. Can you give me a minute? Maybe ten minutes?", tts: "Wow. Okay. This is a lotta choices. Like, a lot. Can ya gimme a minute? Maybe ten minutes?" }
      - { who: narrator, en: "Ten minutes later, she was still reading. Fifteen minutes later, she closed the menu, looked up, and asked very politely for a glass of water." }
      - { who: goldie, en: "I'm sorry, I just couldn't decide. Everything sounds good, but I kind of panicked halfway down the page.", tts: "I'm sorry, I just couldn't decide. Everything sounds good, but I kinda panicked halfway down the page." }
      - { who: narrator, en: "Pekoe made her a little of everything anyway. Goldie tried them all, bravely. By the end, she was talking very fast and her ears were twitching." }
      - { who: goldie, en: "Okay, that one's amazing. That one's also amazing. I think I can hear colors now. Is that normal? That can't be normal." }
      - { who: narrator, en: "That afternoon, Pekoe took the menu up to The Roost. Brewster read the whole thing from top to bottom without changing his face at all." }
      - { who: brewster, en: "Too many. What do you make best? Not what's interesting. What do you make best, when you're tired, on a Tuesday?" }
      - { who: narrator, en: "Pekoe thought about it on the walk home. She thought about the mornings on her porch, and what her friends always asked for again." }
      - { who: narrator, en: "In the end, she crossed out almost everything. The new menu fit on one small card." }
      - { who: narrator, en: "Drip coffee. A café latte. A pot of black tea. Hot cocoa. And honey toast." }
      - { who: pekoe, en: "Five things. That's it. And I'm going to make every one of them really, really well.", tts: "Five things. That's it. An' I'm gonna make every one of 'em really, really well." }
      - { who: narrator, en: "Then there was the question of a name. She wrote ideas on the back of receipts for days." }
      - { who: narrator, en: "The Pier Café. Bean There. Pekoe's Place. None of them felt right." }
      - { who: narrator, en: "And then one evening, the old kettle on her stove started to whistle, the same kettle she had used since she first moved to the island." }
      - { who: pekoe, en: "The Little Kettle. Oh, that's it. That's the one. That's exactly what it's supposed to feel like." }
      - { who: narrator, en: "Mabel heard about the name and offered to make a sign. She also offered to make curtains, cushions, and matching aprons, because Mabel can't help herself." }
      - { who: mabel, en: "Oh, honey, leave it to me. I'll stitch the sign myself. It'll be ready by Friday, I promise." }
      - { who: narrator, en: "On Friday, Mabel arrived with a big package wrapped in brown paper. The curtains were yellow with tiny white flowers. The aprons matched. Everything was perfect." }
      - { who: narrator, en: "Then they unrolled the sign. It was beautiful, stitched in blue thread on soft cream fabric." }
      - { who: narrator, en: "And it said, in big, proud letters, The Litle Kettle. With one T." }
      - { who: mabel, en: "Oh no. Oh, no, no, no. I was up so late finishing it. I'm so sorry, sweetie. I can take it all out and start over." }
      - { who: narrator, en: "Pekoe looked at the sign for a long moment. And then she started to laugh. And then Mabel started to laugh, and they couldn't stop." }
      - { who: pekoe, en: "Don't you dare change it. I love it. It's a little kettle. It doesn't need two T's. It's little.", tts: "Don'tcha dare change it. I love it. It's a little kettle. It doesn't need two T's. It's little." }
      - { who: narrator, en: "So they hung it over the door, just like that. And people would ask about it for years, and Pekoe would always tell them it was on purpose." }
      - { who: narrator, en: "That night, the café was ready. The menu was short, the curtains were up, and the sign was spelled wrong. Opening day was on Sunday." }
      - { who: narrator, en: "Pekoe checked the weather forecast on her phone before bed. She looked at it once, then twice, and then she decided not to look at it again." }
