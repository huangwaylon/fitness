items:
  - kind: serial
    id: serial-cafe-1
    chapter: 1
    title: "The Empty Shop by the Pier"
    line: "ジャスミンが きっさてんを ひらこうと きめます"
    ja: "ジャスミンは、桟橋のそばの空き家（昔のつりえさ屋）でカフェを開こうと決める。たぬきちに借りる話をして、ちゃちゃまるが掃除を手伝う。マスターに相談すると「小さく始めなさい」とひとこと。でも、いちばん大事なエスプレッソマシンを買うお金が足りない。"
    scene: door
    segments:
      - { who: narrator, en: "At the end of the pier, past the place where the fishermen like to sit, there was a little wooden building that nobody had used in years." }
      - { who: narrator, en: "It used to be a bait shop. The paint was peeling, one window was cracked, and if you stood close enough, it still smelled faintly of fish." }
      - { who: narrator, en: "Pekoe walked past it every morning on her way to the beach. And every morning, she slowed down a little more." }
      - { who: narrator, en: "She had been making coffee and tea for her friends for years." }
      - { who: narrator, en: "In her kitchen, on her porch, in a thermos on picnics. Everybody said she should open a café." }
      - { who: narrator, en: "And every time, she laughed and said, oh, someday. But one morning in October, she stopped in front of the old bait shop and didn't keep walking." }
      - { who: pekoe, en: "Okay. Okay, Pekoe. It's now or never. You're going to go talk to Tom Nook. Today.", tts: "Okay. Okay, Pekoe. It's now or never. You're gonna go talk to Tom Nook. Today." }
      - { who: narrator, en: "Tom Nook was behind his desk, as always, surrounded by papers and little stacks of leaf-shaped notes. He listened to her whole idea without saying a word." }
      - { who: tom-nook, en: "A café by the pier? Yes, yes! I think that's a wonderful idea. The building does need a little work, though. Quite a bit of work, actually." }
      - { who: pekoe, en: "I know. I don't mind. I'll fix it up myself, little by little. Could I pay the rent once a month?" }
      - { who: tom-nook, en: "Of course. And the first month is on me. Think of it as a welcome gift. Every new business deserves a fair start." }
      - { who: narrator, en: "Pekoe walked out holding a big, old-fashioned key, and she held it so tight that it left a little mark on her paw." }
      - { who: narrator, en: "The next morning, Dom showed up at the shop before she did. He had a mop, two buckets, and far too much energy for seven a.m." }
      - { who: dom, en: "Heard you're opening a café! I'm here to help. Cleaning counts as a workout, right? Let's do this!", tts: "Heard you're openin' a café! I'm here to help. Cleanin' counts as a workout, right? Let's do this!" }
      - { who: narrator, en: "They worked all day. They scrubbed the floor, took down the old fishing nets, and opened every window to let the sea air blow the smell away." }
      - { who: narrator, en: "Under the nets, they found a long wooden counter, old and solid and beautiful." }
      - { who: narrator, en: "Pekoe ran her hand along it and knew right away where the coffee would go." }
      - { who: narrator, en: "That evening, tired and happy, she walked up to the museum to visit The Roost, the island's only café. Brewster was behind the counter, drying a cup." }
      - { who: pekoe, en: "Mr. Brewster, I'm opening a little café by the pier. I hope that's okay. I was wondering if you had any advice for me?" }
      - { who: narrator, en: "Brewster didn't answer right away. He finished drying the cup. He put it on the shelf. Then he dried another one." }
      - { who: brewster, en: "Start small. Learn your regulars' names. And be patient. Coffee doesn't like to be rushed. Neither do people." }
      - { who: narrator, en: "That was all he said. But Pekoe wrote it on a napkin, and later, she taped it to the wall behind the counter." }
      - { who: narrator, en: "There was just one problem, and it was a big one. A café needs a coffee machine. A real one, with steam and pressure and shiny handles." }
      - { who: narrator, en: "She looked at the catalogs that night, curled up on her couch. Every machine she liked cost more than everything in her savings account." }
      - { who: pekoe, en: "Okay, so that one's way out of my price range. And that one. And, wow, that one costs more than the building.", tts: "Okay, so that one's way outta my price range. An' that one. And, wow, that one costs more than the building." }
      - { who: narrator, en: "She closed the catalog and looked out the window at the dark pier. The little shop was sitting there, clean and empty, waiting for her." }
      - { who: pekoe, en: "I'll figure something out. I always do. Just maybe not tonight.", tts: "I'll figure somethin' out. I always do. Just maybe not tonight." }
      - { who: narrator, en: "And then she went to bed." }
      - { who: narrator, en: "Down by the pier, the waves knocked softly against the posts, and the old shop, for the first time in years, did not smell like fish." }
    ph:
