  - kind: serial
    id: serial-cafe-5
    chapter: 5
    title: "Regulars"
    line: "マスターが はじめて おきゃくさんに なります"
    ja: "数週間たち、リトル・ケトルには常連ができた。毎朝同じものを頼むちゃちゃまる、窓ぎわで本を読むキャラメル、クロスワードをするたぬきち。ある休みの日、ついにマスターが客として来る。緊張しながらいれたコーヒーに、マスターはひとこと「うん。いいコーヒーだ」。そして、常連の名前をおぼえていることこそが仕事だと言う。閉店後、カップを洗い、灯りを消して、島は静かに眠る。"
    scene: cafe
    segments:
      - { who: narrator, en: "A few weeks went by, the way weeks do on an island. The days got shorter, the mornings got colder, and The Little Kettle got a little busier." }
      - { who: narrator, en: "Pekoe started to learn the rhythm of the place." }
      - { who: narrator, en: "Who came early, who came late, who wanted to talk, and who just wanted to be left alone with a cup." }
      - { who: narrator, en: "Dom came every morning at seven fifteen, right after his run. Every morning, he ordered an iced latte, even though it was almost winter." }
      - { who: dom, en: "The usual, please! I know, I know, it's cold out. But I'm, like, super warm from running. It works, trust me.", tts: "The usual, please! I know, I know, it's cold out. But I'm, like, super warm from runnin'. It works, trust me." }
      - { who: narrator, en: "Goldie came on Tuesdays and Thursdays and sat in her spot by the window. She read mystery novels and always guessed the ending, and always acted surprised anyway." }
      - { who: narrator, en: "Tom Nook came every afternoon at three for a drip coffee and the crossword puzzle. He did it in pen." }
      - { who: narrator, en: "He never asked for help, but sometimes he read a clue out loud, just in case." }
      - { who: tom-nook, en: "Five letters, a coffee drink with lots of milk. Hmm. Yes, yes, I believe I've got it. Thank you, Pekoe." }
      - { who: narrator, en: "She learned that Mabel liked her latte a little too hot, and that the fishermen liked their coffee black and their honey toast extra crispy." }
      - { who: narrator, en: "She learned everyone's name, and how they took their coffee, and what kind of day they were having, just from the way they opened the door." }
      - { who: narrator, en: "And then one quiet Wednesday morning, the door opened very slowly, and Brewster came in." }
      - { who: narrator, en: "Not to fix anything. Not to drop anything off. He came in and sat down." }
      - { who: narrator, en: "Pekoe almost dropped the cup she was holding. Dom stopped talking in the middle of a sentence. Even Goldie looked up from her book." }
      - { who: brewster, en: "It's my day off. One drip coffee, please. No rush." }
      - { who: narrator, en: "Pekoe's paws were shaking a little as she measured the beans. His beans, the ones from the paper bag." }
      - { who: narrator, en: "She did it slowly and carefully, the way he had taught her without ever really teaching her." }
      - { who: narrator, en: "She poured the hot water in slow circles and waited. Brewster watched every step without a word. The whole café was so quiet, you could hear the kettle." }
      - { who: narrator, en: "She set the cup down in front of him. He picked it up. He smelled it." }
      - { who: narrator, en: "He took one small sip. And then he put the cup down and looked at it for a very long time." }
      - { who: brewster, en: "Hm. Good. That's good coffee, Pekoe." }
      - { who: narrator, en: "That was all. A handful of words, which, from Brewster, is practically a speech." }
      - { who: narrator, en: "But Dom cheered so loudly that a seagull outside flew off the railing, and Goldie had to wipe her eyes with a napkin." }
      - { who: pekoe, en: "Thank you. Really. I couldn't have done any of this without you. The machine, the beans, the advice, all of it.", tts: "Thank you. Really. I couldn'ta done any of this without you. The machine, the beans, the advice, all of it." }
      - { who: brewster, en: "You did the hard part yourself. You know everyone's name. You know how they like their coffee. That's the whole job." }
      - { who: narrator, en: "He finished his coffee, left a coin on the counter, and nodded to her on his way out." }
      - { who: narrator, en: "And the next Wednesday, he came back. And the one after that." }
      - { who: narrator, en: "That night, after the last customer had gone home, Pekoe stayed late to close up, the way she did every night now." }
      - { who: narrator, en: "She washed the cups, one by one, and set them upside down to dry. She wiped the long wooden counter until it shined in the lamplight." }
      - { who: narrator, en: "She read the napkin on the wall, and the note next to it." }
      - { who: narrator, en: "She straightened the sign that said The Litle Kettle, and smiled at the missing T, like always." }
      - { who: narrator, en: "Then she turned off the lamps, one by one, until only the little light over the door was left. She stepped out and locked up." }
      - { who: narrator, en: "Outside, the island was asleep. The water was calm. A few windows were still glowing up the hill, and somewhere, somebody's kettle was starting to whistle." }
      - { who: narrator, en: "Pekoe walked home slowly, with her hands in her pockets and the smell of coffee still in her fur. Tomorrow, the usual. Goodnight." }
