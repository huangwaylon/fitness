# おやすみ ものがたり (docs/curriculum.md §7.1): ジャスミンの きっさてん, a bedtime serial in five chapters. Pekoe opens a
# little café in the old bait shop by the pier: the lease, a suspicious espresso machine from Redd, a menu that is far
# too long, a misspelled sign, opening day in the rain, and the first visit from Brewster, who says almost nothing. Small
# problems, kind neighbors, nothing at stake but cups. Extensive listening at ~95 % comprehension for a B1+ ear: no
# score, no questions, a sleep timer. The narrator is us-m5 (calm, steady); every speaker is a US voice. Each chapter's
# `predict` is for the morning after; its `answer` is what the next chapter tells. Checks: src/lib/kikimimi/stories.test.ts.
schema: 1
