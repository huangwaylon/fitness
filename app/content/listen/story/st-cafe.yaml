  - kind: serial
    id: serial-cafe-2
    chapter: 2
    title: "A Bargain from Redd"
    line: "つねきちから あやしい マシンを かいます"
    ja: "つねきちの船に「本物のイタリア製、ほとんど新品」のエスプレッソマシンが。安すぎるけれど、ジャスミンは買ってしまう。ところが、悲しいガチョウのような音を出して、蒸気をふきだすばかり。ちゃちゃまるが直そうとしてさらに悪化。そこへマスターが来て、それが昔の自分のマシンだと気づく。"
    scene: cafe
    segments:
      - { who: narrator, en: "A few days later, a small boat with a patched green sail pulled up to the pier." }
      - { who: narrator, en: "It belonged to Redd, who sold art, furniture, and other things of questionable origin." }
      - { who: redd, en: "Well, well. I heard a little bird say somebody's opening a café. And I just happen to have exactly what you need.", tts: "Well, well. I heard a little bird say somebody's openin' a café. And I jus' happen to have exactly what ya need." }
      - { who: narrator, en: "He pulled back a blanket. Underneath was an espresso machine." }
      - { who: narrator, en: "It was old, and a little dented, but it was copper and brass, and it gleamed in the sun." }
      - { who: redd, en: "Genuine Italian. Hardly used. Belonged to a famous barista, very hush-hush. For you? Half price. Because I like your face.", tts: "Genuine Italian. Hardly used. Belonged to a famous barista, very hush-hush. For you? Half price. 'Cause I like your face." }
      - { who: narrator, en: "Pekoe knew that a deal this good was usually too good to be true. Everyone on the island knew that about Redd." }
      - { who: narrator, en: "But it was so beautiful. And it was, for once, almost in her price range." }
      - { who: narrator, en: "She looked at it for a long time, and then she counted out her savings." }
      - { who: pekoe, en: "Okay. I'll take it. But if it doesn't work, I'm coming to find you. I know where your boat is." }
      - { who: redd, en: "Doesn't work? Please. That thing'll outlive both of us. Pleasure doing business with you, sweetheart.", tts: "Doesn't work? Please. That thing'll outlive both of us. Pleasure doin' business with ya, sweetheart." }
      - { who: narrator, en: "And his little green sail was gone around the point before she had even plugged it in." }
      - { who: narrator, en: "She filled it with water. She turned the big brass knob. The machine shivered. It rumbled." }
      - { who: narrator, en: "And then it made a long, sad sound, like a goose with a broken heart." }
      - { who: narrator, en: "A cloud of steam shot out of the side and fogged up every window in the shop. But no coffee came out. Not a single drop." }
      - { who: narrator, en: "Dom heard the noise all the way from the beach and came running, still holding his jump rope." }
      - { who: dom, en: "Whoa, what was that? It sounded like a goose. Is everybody okay in here? Is there a goose?", tts: "Whoa, what was that? It sounded like a goose. Is ev'rybody okay in here? Is there a goose?" }
      - { who: pekoe, en: "No goose. Just me, and the most expensive mistake I've ever made in my whole life." }
      - { who: dom, en: "Hey, don't worry about it. I'm pretty handy. Let me take a look. How hard can it be?", tts: "Hey, don't worry about it. I'm pretty handy. Lemme take a look. How hard can it be?" }
      - { who: narrator, en: "It turned out to be very hard. Dom found a wrench and tightened everything he could find." }
      - { who: narrator, en: "The machine made the goose noise again, only louder, and then it whistled." }
      - { who: narrator, en: "By the afternoon, they were sitting on the floor in a cloud of steam, and the machine seemed to be laughing at them." }
      - { who: narrator, en: "That's when the door opened, and Brewster walked in. He did not say hello." }
      - { who: narrator, en: "He walked straight to the machine and looked at it for a very long time." }
      - { who: brewster, en: "I know this machine. That dent on the side, I made that dent. This was my first machine, a long time ago." }
      - { who: pekoe, en: "Wait, it was yours? But Redd said it belonged to a famous barista in Italy." }
      - { who: brewster, en: "I've never been to Italy. I gave it away when I bought the new one. I'm not sure how it ended up on Redd's boat." }
      - { who: narrator, en: "He reached behind the machine and tapped the side twice, gently, the way you might wake up a sleeping cat. Then he waited." }
      - { who: brewster, en: "It needs a new rubber ring, here, by the handle. And you have to be patient with it. It takes a minute to wake up. Like me." }
      - { who: narrator, en: "The next morning, there was a small paper bag on the counter. Inside was a brand new rubber ring and a note that just said, B." }
      - { who: narrator, en: "Pekoe put the ring in, tapped the side twice, and waited. The machine hummed." }
      - { who: narrator, en: "And then, slowly, a thin stream of dark, perfect coffee came out into her cup." }
      - { who: pekoe, en: "Oh my gosh. Oh my gosh, it works. Dom! Dom, come here, it actually works!", tts: "Oh my gosh. Oh my gosh, it works. Dom! Dom, c'mere, it actually works!" }
      - { who: narrator, en: "That evening, Redd's green sail came back around the point. He leaned on the doorframe and smiled his biggest smile." }
      - { who: redd, en: "See? What did I tell you? Genuine Italian. You can't put a price on quality. Well, you can. And you did.", tts: "See? Whadda I tell ya? Genuine Italian. Ya can't put a price on quality. Well, you can. An' you did." }
      - { who: narrator, en: "Pekoe didn't argue. She just made him a cup of coffee, on the house. And Redd, for once in his life, didn't have anything to say." }
