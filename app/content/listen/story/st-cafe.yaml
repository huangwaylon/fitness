  - kind: serial
    id: serial-cafe-4
    chapter: 4
    title: "Opening Day, in the Rain"
    line: "あめの なか、オープンの ひです"
    ja: "オープンの日はどしゃぶり。最初の1時間、だれも来ない。ジャスミンが泣きそうになったとき、レインコートのちゃちゃまるが来る。それからキャラメル、メイベル、たぬきちも。店はぬれた傘でいっぱいになり、牛乳がなくなって、ちゃちゃまるが雨の中を走る。ドアの前には、Bとだけ書かれたコーヒー豆の袋が置いてあった。"
    scene: cafe
    segments:
      - { who: narrator, en: "Sunday morning, it rained. Not a little rain. It was the kind of rain that bounces off the pier and comes down sideways, like it's in a hurry." }
      - { who: narrator, en: "Pekoe had been up since five. The cups were lined up. The honey toast was ready to go into the oven. The machine was warm and humming." }
      - { who: narrator, en: "At eight o'clock exactly, she turned the little sign on the door from closed to open, and she stood behind the counter, and she waited." }
      - { who: narrator, en: "Nobody came. The rain drummed on the roof. The clock ticked. Every now and then, a seagull walked past the window, looked inside, and kept walking." }
      - { who: pekoe, en: "It's fine. It's totally fine. It's early, it's raining. Nobody wants to go out in this. It's fine.", tts: "It's fine. It's totally fine. It's early, it's rainin'. Nobody wants to go out in this. It's fine." }
      - { who: narrator, en: "By nine, it didn't feel fine. She sat down on a stool and looked at the five things on her little menu, and her eyes started to sting." }
      - { who: narrator, en: "And then the door banged open, and a big yellow raincoat came in, dripping all over the clean floor. Inside the raincoat was Dom." }
      - { who: dom, en: "Sorry I'm late! I did my run first. Bad idea. Really bad idea. Can I get the biggest coffee you've got?", tts: "Sorry I'm late! I did my run first. Bad idea. Really bad idea. Can I get the biggest coffee you got?" }
      - { who: narrator, en: "Pekoe made him the biggest coffee she had ever made. Her hands were shaking a little." }
      - { who: narrator, en: "He drank it at the counter and said it was the best coffee on the island." }
      - { who: narrator, en: "Ten minutes later, Goldie came in under a polka-dot umbrella, with a book under her arm. She sat by the window and ordered a pot of black tea." }
      - { who: goldie, en: "I'm planning to stay a while, if that's okay. Rainy days are reading days. This is my spot now, by the way.", tts: "I'm plannin' to stay a while, if that's okay. Rainy days are reading days. This is my spot now, by the way." }
      - { who: narrator, en: "Then Mabel came, to check that the curtains looked right in the rain. They did." }
