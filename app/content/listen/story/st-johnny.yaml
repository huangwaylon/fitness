  - kind: serial
    id: serial-johnny-3
    chapter: 3
    title: "The Slow Ferry"
    line: "ジョニーが せとないかいの フェリーの はなしを します"
    ja: "ジョニーは絵はがきを手に、瀬戸内海へ。島から島へ、のんびり進む小さなフェリーに乗る。レモン畑、港の猫、桟橋の大きな水玉のかぼちゃ。漁師のおじいさんにみかんをもらい、畳の席で昼寝をして、降りる港を3回も乗り過ごす。でも、いちばんいい間違いだった。"
    scene: platform
    segments:
      - { who: narrator, en: "On the third night, there was no wind at all. The sea was flat and silver under the moon, which, Gulliver said, was perfect for a ferry story." }
      - { who: narrator, en: "Cherry had come down with a bag of marshmallows to roast, and Dom was back, still in his running shorts, even though it was cold." }
      - { who: cherry, en: "So you went to Japan, just because of a postcard? Like, that's it? That's the whole reason?", tts: "So ya went to Japan, just 'cause of a postcard? Like, that's it? That's the whole reason?" }
      - { who: gulliver, en: "My dear, a postcard is the best reason there is. Most of my trips start with worse ones." }
      - { who: narrator, en: "He got a job on a ship heading for Japan, peeling potatoes in the kitchen. Six weeks of potatoes, he said. He still dreams about them." }
      - { who: narrator, en: "He got off in a little port town on the coast. The streets went steeply up the hill, and there were cats sleeping on almost every step." }
      - { who: gulliver, en: "One of them followed me all the way to the ferry. Big orange fellow. I think he wanted my sandwich more than my company." }
      - { who: narrator, en: "The ferry was small and white, just like the one in the postcard. It wasn't fast. It wasn't fancy. It was in no rush to get anywhere." }
      - { who: narrator, en: "It went from island to island, stopping at tiny piers where a few people got off and a few people got on, and somebody always waved." }
      - { who: narrator, en: "Inside, there was a room with a tatami floor, and people just lay down on it." }
      - { who: narrator, en: "Grandparents, students, a man in a suit with his shoes lined up neatly by the door." }
      - { who: dom, en: "Wait, people just sleep on the floor? On the ferry? That's awesome. I'd be out in, like, two minutes.", tts: "Wait, people jus' sleep on the floor? On the ferry? That's awesome. I'd be out in, like, two minutes." }
      - { who: gulliver, en: "That's the thing. I meant to stay awake. I really did. I had my postcard out and everything." }
      - { who: narrator, en: "The islands slid past the windows, green and soft and round, with lemon trees growing in rows down the hillsides, right to the water." }
      - { who: narrator, en: "On one island, a giant yellow pumpkin with black polka dots sat at the end of a pier, like it was waiting for a boat too." }
      - { who: cherry, en: "A giant pumpkin? With polka dots? Okay, now I know you're just messing with us.", tts: "A giant pumpkin? With polka dots? Okay, now I know you're jus' messin' with us." }
      - { who: gulliver, en: "It's art! Famous art! People come from all over the world just to take a picture with it." }
      - { who: narrator, en: "At the next stop, an old fisherman got on with a bucket and sat down next to Gulliver." }
      - { who: narrator, en: "He didn't say much. He just smiled and handed him a mikan.", tts: "He didn't say much. He just smiled and handed him a mee-kahn." }
      - { who: narrator, en: "Then another mikan. Then a third. By the time they had passed two islands, Gulliver had a little pile of orange peels on his lap.", tts: "Then another mee-kahn. Then a third. By the time they had passed two islands, Gulliver had a little pile of orange peels on his lap." }
      - { who: gulliver, en: "We didn't share a language, him and me. But we shared a lot of fruit. I think that counts for something." }
      - { who: narrator, en: "And then, with the sun on the tatami and the engine humming under the floor, Gulliver lay down, just to rest his eyes for a moment." }
      - { who: narrator, en: "When he opened them again, the ferry was back where it started. He had missed his stop." }
      - { who: dom, en: "Oh, man. That's rough. So what'd you do? Just get off and try again tomorrow?", tts: "Oh, man. That's rough. So what'dja do? Just get off an' try again tomorrow?" }
      - { who: gulliver, en: "Try again tomorrow? Nonsense. I stayed on and went right back the other way. And then I fell asleep again." }
      - { who: narrator, en: "He missed his stop three times that day. Back and forth, back and forth, across the same calm water." }
      - { who: narrator, en: "The ferry crew started to recognize him. On the last trip, one of them brought him a cup of green tea without being asked." }
      - { who: gulliver, en: "Honestly, it was the best mistake I've ever made. I saw every island twice, and I've never slept better in my life." }
      - { who: cherry, en: "Okay, I'll admit it, that's kind of perfect. So did you ever get off the boat?", tts: "Okay, I'll admit it, that's kinda perfect. So didja ever get off the boat?" }
      - { who: gulliver, en: "Eventually. At the very last port, as the sun went down, there was a big ship in the harbor with a sign. It said, Los Angeles." }
      - { who: narrator, en: "And Gulliver, who never could say no to a sign, picked up his bag and walked straight toward it." }
      - { who: narrator, en: "Dom was already yawning. Cherry ate the last marshmallow. And the moon sat on the flat, silver sea, as calm as a ferry with nowhere special to be." }
