  - kind: serial
    id: serial-johnny-1
    chapter: 1
    title: "Washed Up Again"
    line: "ジョニーが タイペイの よいちの はなしを します"
    ja: "朝の浜辺で、ちゃちゃまるがずぶぬれのジョニーを見つける。夜、たき火を囲んで、ジョニーは台北の夜市の話をする。行列のできる胡椒餅、臭豆腐、タピオカミルクティーのおばあさん。でも、その夜市で大事な真鍮のコンパスをなくしてしまった。"
    scene: street
    segments:
      - { who: narrator, en: "It was a quiet morning on the island, the kind where the tide is low and the sand is still cool from the night." }
      - { who: narrator, en: "Dom was out for his morning run when he spotted something blue and white near the water." }
      - { who: narrator, en: "At first he thought it was a pile of old laundry. Then the pile of laundry started to snore." }
      - { who: dom, en: "Whoa, whoa. Hey, buddy, are you okay? You're kind of soaked, man.", tts: "Whoa, whoa. Hey, buddy, you okay? You're kinda soaked, man." }
      - { who: narrator, en: "The laundry sat up, blinked at the sky, and fixed a sailor's cap that had seen much better days." }
      - { who: gulliver, en: "Ah, good morning, sailor! Tell me, is this Hawaii? It feels a little bit like Hawaii." }
      - { who: dom, en: "Nope, it's just our island. But hey, welcome back, Gulliver. This is, like, your fifth time.", tts: "Nope, it's jus' our island. But hey, welcome back, Gulliver. This is, like, your fifth time." }
      - { who: narrator, en: "Gulliver did not remember the island. He never did, no matter how many times he washed up on it. But he remembered the coffee." }
      - { who: narrator, en: "By evening, word had gotten around. A small fire was crackling on the beach, and a few neighbors had come down with mugs of cocoa." }
      - { who: goldie, en: "So, where were you this time? Last time it was Peru? Portugal? Someplace with a P.", tts: "So, where were ya this time? Last time it was... Peru? Portugal? Someplace with a P." }
      - { who: gulliver, en: "Taiwan! Taipei, to be exact. And let me tell you, I have never eaten so well in my whole life." }
      - { who: narrator, en: "His ship had docked near Taipei for two nights. On the first evening, the captain told the crew to go find their own dinner." }
      - { who: narrator, en: "So Gulliver followed the crowd, and the crowd led him to a night market on a long, narrow street near the river." }
      - { who: gulliver, en: "At one end there's this temple, all lit up in red and gold. And from there, the food stalls just go on and on." }
      - { who: narrator, en: "The air was warm and smelled like a hundred dinners at once. Grilled squid. Sweet sausage. Something fried." }
      - { who: narrator, en: "The first thing he noticed was a line. A long one. Maybe thirty people, all waiting patiently in front of one tiny stall." }
      - { who: gulliver, en: "Now, I have a rule. If the locals get in line for something, you get in line too. No questions asked." }
      - { who: narrator, en: "At the front, a man was pressing balls of dough onto the inside wall of a big clay oven." }
      - { who: narrator, en: "They were pepper buns. Crispy and golden on the outside, and inside, juicy pork with lots of green onion and black pepper." }
      - { who: gulliver, en: "I took one big bite, and it was so hot I burned my tongue. Totally worth it, though. Every single time." }
      - { who: goldie, en: "Hold on. Every single time? How many did you have, exactly?", tts: "Hold on. Every single time? How many didja have, exactly?" }
      - { who: gulliver, en: "Four. Possibly five. A sailor doesn't count, my dear. A sailor simply enjoys." }
      - { who: narrator, en: "A little farther down, he walked past a stall where the smell hit him like a wave. Strong, sharp, and honestly, a bit like old socks." }
      - { who: gulliver, en: "Stinky tofu. They call it that right on the sign. At least they're honest about it." }
      - { who: dom, en: "Dude, no way. Did you actually try it? I'd be way too scared, honestly.", tts: "Dude, no way. Didja actually try it? I'd be way too scared, honestly." }
      - { who: gulliver, en: "Of course I did. Smells like a gym bag, tastes like heaven. Crispy outside, soft inside, with pickled cabbage on top." }
      - { who: narrator, en: "Later, with tired feet, he stopped at a little drink stand run by an older woman with very quick hands." }
      - { who: narrator, en: "She made him a milk tea with chewy tapioca pearls at the bottom, and asked him, in careful English, where he was from." }
      - { who: gulliver, en: "I said, I'm from the sea, ma'am. She laughed and said everybody's from somewhere. Then she gave me extra pearls." }
      - { who: narrator, en: "He sat on a low plastic stool and watched the crowd go by, couples and families and students, all of them in no hurry at all." }
      - { who: narrator, en: "Somewhere in all that happiness, he took his old brass compass out of his pocket to check the way back to the ship." }
      - { who: narrator, en: "And that, he said, was the very last time he ever saw it." }
      - { who: goldie, en: "Oh no, your compass? Is that how you ended up here again?", tts: "Oh no, your compass? Is that how ya ended up here again?" }
      - { who: gulliver, en: "Well, one thing led to another, as they say. But that, my friends, is a story for tomorrow night." }
      - { who: narrator, en: "And with that, Gulliver pulled his cap down over his eyes and fell asleep before the fire burned down." }
      - { who: narrator, en: "Dom put a blanket over him. And the waves kept coming in, slow and steady, all night long." }
