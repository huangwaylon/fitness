      - { who: narrator, en: "Earl ordered the meatloaf. Gulliver asked Darlene what was good, and she leaned in and said, the cherry pie, hon. Trust me.", tts: "Earl ordered the meatloaf. Gulliver asked Darlene what was good, and she leaned in and said, the cherry pie, hun. Trust me." }
      - { who: narrator, en: "It came warm, with a scoop of vanilla ice cream melting slowly down the side. Pie à la mode, Darlene called it." }
