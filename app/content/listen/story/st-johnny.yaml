  - kind: serial
    id: serial-johnny-5
    chapter: 5
    title: "The Lighthouse in the Fog"
    line: "ジョニーが きりの とうだいの はなしを します"
    ja: "ジョニーは列車で大陸を横断し、メイン州へ。灯台守のウォルトと冬をすごす。レンズみがき、らせん階段のペンキぬり、ロブスターロール。ある霧の夜、霧笛がこわれ、帰れない漁船のために古い鐘を鳴らしつづけ、船は無事にもどる。お礼に新しいコンパスをもらったその夜、ジョニーはやっとルースに手紙を書き、フェリーの話をぜんぶ伝えた。春、そのコンパスを持って帰る途中、嵐にあって……この島に流れついた。コンパスはまたなくなっていた。翌朝、ジョニーの姿はなく、砂に書きおきが残っていた。"
    scene: living
    segments:
      - { who: narrator, en: "On the fifth night, more neighbors came than ever. Maple, Dom, and Goldie sat closest to the fire, with blankets over their knees." }
      - { who: goldie, en: "Okay, last one. I'm kind of sad, honestly. I've gotten used to this. Same time every night, you know?", tts: "Okay, last one. I'm kinda sad, honestly. I've gotten used to this. Same time every night, y'know?" }
      - { who: gulliver, en: "Me too, my dear. Me too. Now, where was I? Ah, yes. Maine." }
      - { who: narrator, en: "From the desert, he took a long train across the whole country. Four days of farms and rivers and little towns going by the window." }
      - { who: narrator, en: "At the end of it was a rocky coast, cold and gray and beautiful, and on the very last rock, a white lighthouse with a red roof." }
      - { who: narrator, en: "Darlene's brother was named Walt. He was tall and quiet and had a beard like a winter storm. He shook Gulliver's wing and said, you're late." }
      - { who: gulliver, en: "I said, I'm a sailor, Walt, I'm always late. And he laughed. Just once. I found out later that's about once a month for Walt." }
      - { who: narrator, en: "The work was simple, but there was a lot of it. Gulliver cleaned the big glass lens until it sparkled." }
      - { who: narrator, en: "And he painted the spiral stairs, all one hundred and twelve of them." }
      - { who: dom, en: "A hundred and twelve stairs? Every day? Dude, that's a serious leg workout. I'm kind of jealous.", tts: "A hundred an' twelve stairs? Every day? Dude, that's a serious leg workout. I'm kinda jealous." }
      - { who: narrator, en: "On Sundays, Walt drove them into town for lobster rolls. Big pieces of lobster in a buttered, toasted bun, eaten on a bench by the harbor." }
      - { who: gulliver, en: "Walt said, you don't eat a lobster roll inside. It's against the rules. So we sat outside and froze, and it was wonderful." }
      - { who: narrator, en: "Then one February night, the fog rolled in, so thick you couldn't see your own feet. And the old foghorn coughed once and went quiet." }
      - { who: narrator, en: "Walt listened to the radio and frowned. A small fishing boat was still out there. The captain couldn't find the harbor in the fog." }
      - { who: maple, en: "Oh no. That's so scary. Couldn't they just follow the light from the lighthouse?", tts: "Oh no. That's so scary. Couldn't they jus' follow the light from the lighthouse?" }
      - { who: gulliver, en: "That's what I thought, too. But in fog like that, the light just disappears. You can't see a thing. But you can still hear." }
      - { who: narrator, en: "There was an old brass bell on the rocks below the lighthouse, from the days before electric foghorns. Walt handed Gulliver the rope." }
      - { who: narrator, en: "Walt stayed on the radio, telling the captain to steer toward the sound. And Gulliver rang the bell. Slow and steady, again and again." }
      - { who: gulliver, en: "I rang that bell for two hours. My arms were shaking. I sang every sea song I know, just to keep the rhythm." }
      - { who: narrator, en: "And then, out of the white, they saw two small lights, red and green. The fishing boat came around the rocks and into the harbor, safe." }
      - { who: narrator, en: "The next morning, the captain came up the hill with a bag of fresh fish and a small wooden box. Inside the box was a brand new compass." }
      - { who: gulliver, en: "He said, a sailor should always know the way home. And I almost cried for the second time on this trip. Bottomless coffee was the first." }
      - { who: narrator, en: "That night, he finally wrote to Ruth and told her all about the ferry." }
      - { who: narrator, en: "When spring came, Gulliver said goodbye to Walt and got on a ship heading south, with the new compass safe in his pocket." }
      - { who: narrator, en: "And then, of course, there was a storm. A big one. The kind sailors tell stories about." }
      - { who: narrator, en: "And the next thing he knew, Dom was standing over him on the beach." }
      - { who: goldie, en: "Wait a sec. So where's the new compass? The one from the fishing captain?", tts: "Wait a sec. So where's the new compass? The one from the fishin' captain?" }
      - { who: narrator, en: "Gulliver patted his left pocket. Then his right pocket. Then the inside of his cap. He looked up at everyone with a very small smile." }
      - { who: gulliver, en: "Well. It seems I've lost it again. But you know, I'm starting to think that's not such a bad thing." }
      - { who: narrator, en: "Everybody laughed, and the fire popped, and for a while nobody said anything. They just watched the sparks go up into the dark." }
      - { who: narrator, en: "In the morning, Gulliver was gone. There was only a long line of footprints going down to the water, and a message written in the sand." }
      - { who: narrator, en: "It said, thank you for the coffee. Back soon. Probably by accident." }
      - { who: narrator, en: "And the tide came in, slowly, and smoothed the sand, the way it always does. Goodnight." }
