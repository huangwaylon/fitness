  - kind: serial
    id: serial-johnny-2
    chapter: 2
    title: "Snowed In in Vermont"
    line: "ジョニーが ゆきの やまごやの はなしを します"
    ja: "コンパスなしで乗った船は、まちがえてボストン行きだった。ジョニーはバスで北へ向かい、バーモントの山小屋に住む昔の船乗り仲間ルースを訪ねる。大雪で停電し、3日間とじこめられる。まきストーブ、トランプ、雪にメープルシロップをかけるお菓子。帰りぎわ、ルースは日本の古い絵はがきをくれた。"
    scene: living
    segments:
      - { who: narrator, en: "The next night was cooler, and the fire was a little bigger. Maple had brought a thermos of hot cider, and Kicks had brought his own folding chair." }
      - { who: kicks, en: "Okay, okay, so you lost the compass. Then what? Did you get on the wrong ship or something?", tts: "Okay, okay, so you lost the compass. Then what? Didja get on the wrong ship or somethin'?" }
      - { who: gulliver, en: "How did you know? That's exactly what happened. I got on a big cargo ship, and a month later, I was in Boston." }
      - { who: narrator, en: "Boston in March is not a place for a sailor in a thin jacket. The wind came off the harbor like it had something personal against him." }
      - { who: narrator, en: "So Gulliver did what any sensible bird would do. He bought a wool hat, a very large coffee, and a bus ticket north." }
      - { who: gulliver, en: "I have an old shipmate in Vermont. Ruth. We sailed together for years, and then she retired to a cabin in the woods." }
      - { who: narrator, en: "The bus wound its way up into the hills. Little white churches, red barns, and snow on everything, like someone had covered the world in frosting." }
      - { who: narrator, en: "Ruth met him at the bus stop in an old pickup truck. She was wearing a red plaid coat and the same big grin he remembered." }
      - { who: gulliver, en: "First thing she said was, you look terrible. Second thing she said was, get in, there's soup." }
      - { who: narrator, en: "The cabin was small and made of logs, with a wood stove in the middle that kept the whole place warm and smelling like pine." }
      - { who: narrator, en: "That night, it started to snow. Not the light, pretty kind. The serious kind, the kind that doesn't plan on stopping." }
      - { who: narrator, en: "By morning, the snow was halfway up the windows, and the power was out. They were snowed in, and the whole world was quiet and white." }
      - { who: maple, en: "Oh my gosh, that sounds so cozy. Weren't you scared, though, being stuck out there?", tts: "Oh my gosh, that sounds so cozy. Weren'tcha scared, though, bein' stuck out there?" }
      - { who: gulliver, en: "Not one bit. Ruth said, out here, you don't fight the snow. You just make more soup and wait it out." }
      - { who: narrator, en: "So that's what they did. They kept the stove going, played cards by candlelight, and told the same old sea stories they had told a hundred times." }
      - { who: narrator, en: "Ruth cheated at cards. Gulliver knew it, and Ruth knew he knew it, and neither of them said a word about it." }
      - { who: narrator, en: "On the second day, Ruth said she had a treat for him. She heated a pot of maple syrup on the stove until it was bubbling." }
      - { who: narrator, en: "Then she went outside, packed a pan full of clean, fresh snow, and poured the hot syrup over it in thin lines." }
      - { who: gulliver, en: "It turns into this soft, chewy candy, right there on the snow. You pick it up with a fork. They call it sugar on snow." }
      - { who: maple, en: "Wait, wait. Maple syrup on snow? Okay, I need to try that. Like, right now.", tts: "Wait, wait. Maple syrup on snow? Okay, I needa try that. Like, right now." }
      - { who: gulliver, en: "And here's the strange part. She served it with a plain donut and a sour pickle on the side." }
      - { who: kicks, en: "A pickle? Come on, man. You're making that up. Nobody eats a pickle with candy.", tts: "A pickle? C'mon, man. You're makin' that up. Nobody eats a pickle with candy." }
      - { who: gulliver, en: "I swear on my cap. The pickle cuts the sweetness, so you can keep eating. It's a Vermont thing. And it works." }
      - { who: narrator, en: "On the third day, they heard a low rumble through the trees." }
      - { who: narrator, en: "It was the snowplow, pushing a clean path down the road. And the power came back on." }
      - { who: narrator, en: "Gulliver was almost sad. He had gotten used to the quiet, and to losing at cards." }
      - { who: narrator, en: "Before he left, Ruth took a faded postcard out of an old wooden box." }
      - { who: narrator, en: "It showed a small white ferry on a calm blue sea, with green islands all around." }
      - { who: gulliver, en: "She said, it's in Japan. The Seto Inland Sea. I always meant to go and never did. So you go, and tell me about it." }
      - { who: narrator, en: "Gulliver put the postcard in his inside pocket, right where the compass used to be. And that's where he kept it, the whole way across the world." }
      - { who: kicks, en: "Dude, that's actually really sweet. Did you ever write to her?", tts: "Dude, that's actually really sweet. Didja ever write to her?" }
      - { who: gulliver, en: "Not yet. I'm still working on it. But first, I have to tell you about the ferry. Tomorrow night." }
      - { who: narrator, en: "Maple poured the last of the cider. And somewhere far away, it was snowing on a little log cabin in the woods." }
