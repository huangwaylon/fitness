# おやすみ ものがたり (docs/curriculum.md §7.1): ジョニーの たび, a bedtime serial in five chapters. ジョニー (Gulliver)
# washes up on the island again and, over five nights by a beach fire, tells the neighbors how he got there: a night
# market in Taipei, a snowed-in cabin in Vermont, a slow ferry in the Seto Inland Sea, a diner on Route 66 and a
# lighthouse in Maine. Extensive listening at ~95 % comprehension for a B1+ ear: no score, no questions, a sleep timer.
# The narrator is us-f5 (warm, quietly funny); every speaker is a US voice. Each chapter's `predict` is for the morning
# after, never during the story; its `answer` is what the next chapter tells. Checks: src/lib/kikimimi/stories.test.ts.
