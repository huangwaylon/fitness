# たちぎき S2 もり (a): three friends or colleagues talk over each other (negative `at`), say what they think, and one
# of them changes their mind. Rounds: who thinks what (each claim's speaker), who changed their mind, the plan.
schema: 1
unit: s2-tachi-a
game: tachi
stage: 3
track: people
seeds: [27, 38, 50, 52]
features: { primary: overlap, review: contraction }
cando: "3人の かいわで だれが どう 思っているか ききわけられる"
status: draft
items:
  - kind: tachi
    id: tachi-shibuya-dinner
    ask: "3人で 夕ごはんを 決めている"
    scene: street
    lines:
      - { who: tangy, at: 0, en: "Okay, it's almost eight. Are we doing ramen or what?", tts: "Okay, it's almost eight. Are we doin' ramen or what?", ja: "よし、もうすぐ8時。ラーメンにする？それとも？" }
      - { who: dom, at: 0.3, en: "I'm still up for ramen. That place by the station's open late.", ja: "僕はラーメンでいいよ。駅のそばの店、遅くまでやってるし。" }
      - { who: lopez, at: -0.3, en: "Not ramen again. We had it on Tuesday. What about that izakaya with the yakitori?", tts: "Not ramen again. We had it on Tuesday. Whaddabout that izakaya with the yakitori?", ja: "またラーメンはやめよう。火曜に食べたじゃないか。焼き鳥のあの居酒屋は？" }
      - { who: tangy, at: 0.2, en: "The one up the hill? You'd need a reservation there on a Friday, for sure.", tts: "The one up the hill? You'd need a reservation there on a Friday, fer sure.", ja: "坂の上のとこ？金曜だと、絶対に予約がいるでしょ。" }
      - { who: lopez, at: 0.4, en: "I'll call them. Worst case, they say no.", ja: "電話してみるよ。最悪、断られるだけだし。" }
      - { who: dom, at: -0.4, en: "Actually, yeah, yakitori sounds good. I could go for a beer anyway.", ja: "いや、やっぱり焼き鳥いいね。どうせビール飲みたかったし。" }
      - { who: tangy, at: 0.3, en: "Fine by me, as long as we're not waiting an hour. If they're full, it's ramen, no arguments.", tts: "Fine by me, as long as we're not waitin' an hour. If they're full, it's ramen, no arguments.", ja: "私はいいよ、1時間待ちとかじゃなければ。満席ならラーメン、文句なしね。" }
      - { who: lopez, at: 0.2, en: "Deal. Calling now.", ja: "決まり。今かける。" }
    rounds:
      - { type: opinions, claims: ["待つのは いや。満席なら ラーメン", "ラーメンは また？ 焼き鳥が いい", "ビールが 飲みたい"], answer: [tangy, lopez, dom], ctx: "金曜の夜、友だち3人が夕ごはんの店を決めています", why: "タンジーは満席ならラーメン。ロペスは Not ramen again で焼き鳥派。ドムは I could go for a beer（ビールが飲みたい）。" }
      - { type: changed, answer: dom, ctx: "ラーメンか居酒屋か、話がまとまっていきます", why: "ドムは最初 I'm still up for ramen だったが、Actually, yeah, yakitori sounds good で焼き鳥に。Actually が合図。" }
      - { type: plan, ask: "このあと どうなる？", choices: ["They'll call the izakaya and fall back on ramen if it's full.", "They'll go straight to the ramen place by the station.", "They'll book the izakaya for next Tuesday."], answer: 0, ja: "居酒屋に電話して、満席ならラーメンにする。", ctx: "最後に、このあとどうするかが決まります", why: "I'll call them と Deal. Calling now で居酒屋に電話する。満席なら it's ramen, no arguments。火曜はラーメンを食べた日。", cja: ["居酒屋に電話して、満席ならラーメンにする", "駅のそばのラーメン屋に直行する", "来週火曜の居酒屋を予約する"] }
    note: "Actually, yeah で意見が変わる。no arguments＝文句なし"
    tags: { seed: 50, register: friend, pragmatic: attitude, conditions: [street], features: [overlap, contraction, chain] }

  - kind: tachi
    id: tachi-hanami-spot
    ask: "お花見の 場所を 決めている"
    scene: cafe
    lines:
      - { who: rosie, at: 0, en: "So, hanami this Saturday. Meguro River, right? The lanterns are so pretty at night.", ja: "で、今週土曜のお花見。目黒川でいいよね？夜の提灯がすごくきれいなの。" }
      - { who: wolfgang, at: 0.3, en: "Pretty, sure. Also completely packed. You can't sit down there, you just shuffle along.", tts: "Pretty, sure. Also completely packed. You can't sit down there, ya just shuffle along.", ja: "きれいだけどね。めちゃくちゃ混んでるよ。座れないし、ぞろぞろ歩くだけ。" }
      - { who: nana, at: -0.3, en: "That's what I was going to say. I'd rather have a picnic somewhere. Shinjuku Gyoen?", tts: "That's what I was gonna say. I'd rather have a picnic somewhere. Shinjuku Gyoen?", ja: "それ言おうと思ってた。どこかでピクニックしたいな。新宿御苑は？" }
      - { who: wolfgang, at: 0.2, en: "Gyoen doesn't allow alcohol, though. Just so you know.", ja: "でも御苑はお酒禁止だよ。いちおう言っとくけど。" }
      - { who: nana, at: 0.3, en: "Oh, right. Yoyogi, then. You can bring whatever you want.", tts: "Oh, right. Yoyogi, then. Ya can bring whatever ya want.", ja: "あ、そっか。じゃあ代々木。何でも持ち込めるし。" }
      - { who: rosie, at: 0.4, en: "Hmm. Okay, fine, a picnic does sound nicer. But can we at least walk along the river after? Just for the lanterns?", ja: "うーん。わかった、ピクニックのほうがよさそう。でも、せめてそのあと川沿いを歩かない？提灯だけ見に。" }
      - { who: wolfgang, at: -0.5, en: "If we must. I'll bring the blanket.", ja: "仕方ないな。レジャーシートは持っていくよ。" }
      - { who: nana, at: 0.2, en: "And I'll grab drinks. Let's say Yoyogi at one?", tts: "An' I'll grab drinks. Let's say Yoyogi at one?", ja: "飲み物は私が買ってくる。代々木に1時でどう？" }
    rounds:
      - { type: opinions, claims: ["夜の ちょうちんが 見たい", "目黒川は 混みすぎ", "お酒も 持ちこめる 公園が いい"], answer: [rosie, wolfgang, nana], ctx: "カフェで、友だち3人が週末のお花見の相談をしています", why: "ロージーは夜の提灯が見たい。ウルフガングは completely packed（混みすぎ）。ナナは何でも持ち込める代々木がいい。" }
      - { type: changed, answer: rosie, ctx: "目黒川か公園か、意見が分かれます", why: "ロージーは目黒川を推していたが、a picnic does sound nicer でピクニックに賛成した。ただし川沿いの散歩は残した。" }
      - { type: plan, ask: "土曜の 予定は？", choices: ["A picnic in Shinjuku Gyoen with drinks.", "A picnic in Yoyogi at one, then the river in the evening.", "Meguro River all afternoon, then Yoyogi."], answer: 1, ja: "1時に代々木でピクニック、そのあと夜に川沿いへ。", ctx: "最後に、集合の時間と場所が決まります", why: "Let's say Yoyogi at one＝代々木に1時。そのあと夜に川沿いを歩く。新宿御苑はお酒禁止なのでやめた。", cja: ["新宿御苑で、飲み物を持ってピクニック", "1時に代々木でピクニック、夜は川沿いへ", "午後はずっと目黒川、そのあと代々木"] }
    note: "packed＝ぎゅうぎゅう。If we must＝仕方ない"
    tags: { seed: 50, register: friend, pragmatic: attitude, conditions: [cafe], features: [overlap, idiom, gonna] }

  - kind: tachi
    id: tachi-film-verdict
    ask: "映画の あと、感想を 言いあっている"
    scene: street
    lines:
      - { who: kid-cat, at: 0, en: "Okay, be honest. What did everyone think?", ja: "よし、正直に。みんなどうだった？" }
      - { who: audie, at: 0.3, en: "Oh, it was a masterpiece. Three hours, and I could've told you the ending after twenty minutes.", tts: "Oh, it was a masterpiece. Three hours, an' I coulda told ya the ending after twenty minutes.", ja: "いやあ、傑作だったわ。3時間もあって、結末は20分で読めたけど。" }
      - { who: zucker, at: -0.2, en: "Harsh! I thought the ending was the best part. I didn't see the twist coming at all.", tts: "Harsh! I thought the ending was the best part. I didn't see the twist comin' at all.", ja: "きびしいなあ！僕は結末がいちばん良かったけど。どんでん返し、全然読めなかった。" }
      - { who: kid-cat, at: 0.3, en: "I'm with Audie, honestly. The middle dragged. I almost fell asleep.", ja: "正直、オーディーに同意。中盤がだらだらしてて。寝そうになった。" }
      - { who: zucker, at: 0.3, en: "But the twist, though! The sister was the one sending the letters the whole time!", ja: "でもあのどんでん返しだよ！手紙を送ってたのはずっと妹だったんだよ！" }
      - { who: kid-cat, at: -0.4, en: "Wait, the sister? I thought it was the neighbor.", ja: "待って、妹？隣の人だと思ってた。" }
      - { who: audie, at: 0.3, en: "Ha! See? He was asleep.", ja: "ほら！やっぱり寝てたのよ。" }
      - { who: kid-cat, at: 0.4, en: "Okay, if it was the sister, that's actually pretty clever. Fine, I take it back. It was good.", ja: "そっか、妹だったなら、それはかなりうまいね。わかった、撤回する。良かったよ。" }
      - { who: zucker, at: 0.2, en: "Okay. Ramen's on me, and I'll walk you through it from the start.", tts: "Okay. Ramen's on me, an' I'll walk ya through it from the start.", ja: "よし。ラーメンおごるから、最初から説明してあげる。" }
    rounds:
      - { type: opinions, claims: ["結末が すぐ 読めた", "結末が いちばん よかった", "中盤が 長くて 眠かった"], answer: [audie, zucker, kid-cat], ctx: "映画館を出たところで、友だち3人が感想を話しています", why: "オーディーの masterpiece は皮肉で、結末はすぐ読めた。ザッカーは結末が best part。キッドキャットは The middle dragged。" }
      - { type: changed, answer: kid-cat, ctx: "どんでん返しの話で、ある人の評価が変わります", why: "キッドキャットは I'm with Audie と否定的だったが、妹が犯人と知って I take it back. It was good＝前言撤回。" }
      - { type: plan, ask: "このあと どうする？", choices: ["They'll buy tickets to see it again.", "They'll go home because it's late.", "They'll get ramen while one of them explains the plot."], answer: 2, ja: "ラーメンを食べながら、1人が話の筋を説明する。", ctx: "最後に、3人はこのあとの予定を決めます", why: "Ramen's on me（ラーメンおごる）、I'll walk you through it（最初から説明する）。もう一度見る話も、帰る話も出ていない。", cja: ["もう一度見るためにチケットを買う", "遅いので家に帰る", "ラーメンを食べながら、1人が筋を説明する"] }
    note: "masterpiece は皮肉。I take it back＝前言撤回"
    tags: { seed: 52, register: friend, pragmatic: sarcasm, conditions: [street], features: [overlap, intonation, contraction] }

  - kind: tachi
    id: tachi-farewell-dinner
    ask: "送別会の 日を 決めている"
    scene: office
    lines:
      - { who: goldie, at: 0, en: "So, Kenji's going-away dinner. Are we still doing Thursday?", ja: "で、ケンジの送別会。まだ木曜でいくの？" }
      - { who: pietro, at: 0.3, en: "I'd rather not, to be honest. The client deck's due Friday morning, and Thursday night is when it all goes wrong.", tts: "I'd rather not, to be honest. The client deck's due Friday mornin', an' Thursday night's when it all goes wrong.", ja: "正直、できれば避けたい。クライアント向けの資料が金曜の朝締め切りで、木曜の夜って大体何か起きるから。" }
      - { who: francine, at: -0.3, en: "Fair, but it's his last week. He's already off on Friday.", ja: "わかるけど、最終週なのよ。金曜はもう休みだし。" }
      - { who: goldie, at: 0.3, en: "What about Wednesday? Same place, the Thai one.", ja: "水曜はどう？同じ店、あのタイ料理の。" }
      - { who: pietro, at: 0.2, en: "Wednesday works for me.", ja: "水曜なら大丈夫。" }
      - { who: francine, at: 0.3, en: "Wednesday's my kid's school thing. I could come late, maybe eight-thirty?", ja: "水曜は子どもの学校の行事なの。遅れてなら行けるかな、8時半とか？" }
      - { who: goldie, at: -0.4, en: "Then let's do Wednesday, and we'll save you a seat. Better late than never.", ja: "じゃあ水曜にして、席を取っておくよ。来ないよりずっといい。" }
      - { who: francine, at: 0.2, en: "Okay, fine. Wednesday. I'll be the one still wearing the PTA lanyard.", tts: "Okay, fine. Wednesday. I'll be the one still wearin' the P T A lanyard.", ja: "わかった、水曜ね。PTAの名札を下げたまま行くわ。" }
    rounds:
      - { type: opinions, claims: ["木曜は 締め切り前で 避けたい", "水曜なら 遅れて 行ける", "水曜に して 席を 取っておく"], answer: [pietro, francine, goldie], ctx: "職場で、同僚3人が送別会の日を決めています", why: "ピエトロは I'd rather not で木曜を避けたい。フランシーヌは I could come late で水曜なら遅れて行ける。ゴールディは席を取っておく。" }
      - { type: changed, answer: francine, ctx: "木曜か水曜か、それぞれの都合が出てきます", why: "フランシーヌは最初 it's his last week と木曜を推したが、Okay, fine. Wednesday で水曜に変えた。" }
      - { type: plan, ask: "送別会は？", choices: ["Thursday, with one of them joining after work.", "Wednesday at the Thai place, with one of them arriving late.", "Friday lunch, as a surprise."], answer: 1, ja: "水曜にタイ料理の店で。1人は遅れて来る。", ctx: "最後に、日にちと店が決まります", why: "Same place, the Thai one＝あのタイ料理の店で水曜。1人は8時半ごろ遅れて来る。金曜はケンジがもう休み。", cja: ["木曜に、1人は仕事のあとで合流", "水曜にタイ料理の店で、1人は遅れて来る", "金曜のランチにサプライズで"] }
    note: "I'd rather not＝できれば避けたい。遠回しな反対"
    tags: { seed: 38, register: colleague, pragmatic: hedge, features: [overlap, contraction, clock] }

  - kind: tachi
    id: tachi-ballgame
    ask: "週末の 野球、どう 見るか 決めている"
    scene: street
    lines:
      - { who: kicks, at: 0, en: "So, the Cubs game on Saturday. Are we actually going, or just watching it at the bar?", tts: "So, the Cubs game on Saturday. Are we actually goin', or just watchin' it at the bar?", ja: "で、土曜のカブスの試合。本当に球場に行く？それともバーで見る？" }
      - { who: molly, at: 0.3, en: "Going, obviously. Summer at Wrigley, hot dogs, the seventh-inning stretch. You can't get that on TV.", ja: "行くに決まってるでしょ。夏のリグレー、ホットドッグ、7回のストレッチタイム。テレビじゃ味わえないよ。" }
      - { who: henry, at: -0.2, en: "You also can't get a seat. The bleachers are sold out, and the good seats are like ninety bucks each.", ja: "席も取れないけどね。外野席は売り切れで、いい席は1人90ドルくらいするよ。" }
      - { who: kicks, at: 0.3, en: "Ninety bucks? For that, I'd rather stay in and order wings.", tts: "Ninety bucks? For that, I'd rather stay in an' order wings.", ja: "90ドル？それなら家でチキンウイングでも頼みたいな。" }
      - { who: molly, at: 0.3, en: "Come on. My cousin can get us standing-room tickets for twenty-five.", ja: "ちょっと。いとこが立ち見券を25ドルで取ってくれるって。" }
      - { who: kicks, at: -0.4, en: "Twenty-five? Okay, that changes things. I'm in.", ja: "25ドル？それなら話は別。行く。" }
      - { who: henry, at: 0.3, en: "Standing for three hours? Pass. But I'll meet you guys after for wings.", tts: "Standin' for three hours? Pass. But I'll meet you guys after for wings.", ja: "3時間立ちっぱなし？パス。でも、あとでチキンウイングには合流するよ。" }
      - { who: molly, at: 0.2, en: "Deal. Gates open at five, so let's meet at the Addison stop at four-thirty.", ja: "決まり。開門は5時だから、4時半にアディソン駅で集合ね。" }
    rounds:
      - { type: opinions, claims: ["球場で 見るのが いちばん", "3時間 立つのは いや", "安いなら 行く"], answer: [molly, henry, kicks], ctx: "シカゴで、友だち3人が土曜の野球の話をしています", why: "モリーは You can't get that on TV で球場派。ヘンリーは3時間立つのは Pass。キックスは25ドルなら I'm in。" }
      - { type: changed, answer: kicks, ctx: "チケットの値段で、ある人の気持ちが変わります", why: "キックスは90ドルなら I'd rather stay in だったが、25ドルの立ち見券と聞いて that changes things. I'm in。" }
      - { type: plan, ask: "土曜は どうなる？", choices: ["All three watch the game at the bar.", "Two of them go on cheap tickets, and all three get wings after.", "They buy good seats for ninety dollars each."], answer: 1, ja: "2人は安い立ち見券で球場へ。あとで3人でチキンウイング。", ctx: "最後に、集合の時間と場所が決まります", why: "2人は25ドルの立ち見券で球場へ。ヘンリーは I'll meet you guys after for wings で、あとから合流。90ドルの席は買わない。", cja: ["3人ともバーで試合を見る", "2人は安い券で球場へ、あとで3人でチキンウイング", "1人90ドルのいい席を買う"] }
    note: "that changes things＝それなら話は別。Pass＝やめとく"
    tags: { seed: 27, register: friend, pragmatic: attitude, conditions: [street], features: [numbers, overlap, contraction] }
