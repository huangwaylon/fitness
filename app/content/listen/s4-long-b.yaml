items:
  - kind: long
    id: lg-dinner-news
    name: 金曜の 夕食
    source: tts
    ctx: "金曜の夜。友だち3人がレストランで"
    note: "just the soup の くり返しは お金の サイン"
    tags: { seed: 27, register: friend, pragmatic: indirect, features: [overlap, kinda, gonna] }
    lines:
      - { who: punchy, at: 0, en: "Okay, are we doing appetizers? I'm doing appetizers. The calamari here is unreal.", ja: "よし、前菜いく？俺はいく。ここのカラマリ、ありえないくらいうまいんだ。" }
      - { who: coco, at: 0.4, en: "I'm good, actually. I'll probably just get the soup.", ja: "私はいいかな。たぶんスープだけにする。" }
      - { who: punchy, at: 0.3, en: "Just the soup? Come on, it's Friday.", ja: "スープだけ？いいじゃん、金曜だよ。" }
      - { who: coco, at: 0.3, en: "I know, I know. I had a big lunch.", ja: "わかってる、わかってる。お昼をたくさん食べたの。" }
      - { who: dom, at: 0.3, en: "You had a granola bar at your desk. I saw you.", ja: "デスクでグラノーラバー食べてただけじゃん。見たよ。" }
      - { who: coco, at: 0.3, en: "That was a big granola bar.", ja: "大きいグラノーラバーだったの。" }
      - { who: punchy, at: 0.5, en: "Fine, more calamari for me. Dom, what about you? You're quiet tonight.", ja: "いいよ、カラマリは俺がもらう。ドムは？今夜は静かだね。" }
      - { who: dom, at: 0.6, en: "Am I? No, I'm just... thinking. I'll get the burger.", ja: "そう？いや、ちょっと…考え事してて。バーガーにする。" }
      - { who: punchy, at: 0.3, en: "Thinking about what? Work?", ja: "何を？仕事？" }
      - { who: dom, at: 0.4, en: "Kind of. Well— sort of the opposite of work, actually.", tts: "Kinda. Well— sorta the opposite of work, actually.", ja: "まあね。いや…どっちかっていうと仕事の反対、かな。" }
      - { who: coco, at: 0.3, en: "The opposite of work? What does that mean?", ja: "仕事の反対？どういう意味？" }
      - { who: dom, at: 0.6, en: "So, okay. Don't freak out. I gave my notice on Monday.", ja: "じゃあ言うね。驚かないで。月曜に辞表を出したんだ。" }
      - { who: punchy, at: -0.3, en: "You what?", ja: "何だって？" }
      - { who: coco, at: -0.2, en: "Wait, you quit? You quit quit?", ja: "待って、辞めたの？本当に辞めたの？" }
      - { who: dom, at: 0.2, en: "I quit quit. Last day's the twentieth.", ja: "本当に辞めた。最終日は20日。" }
      - { who: punchy, at: 0.3, en: "Dude. Did something happen? Was it your boss?", ja: "おい。何かあったのか？上司のせい？" }
      - { who: dom, at: 0.4, en: "No, no, nothing like that. I'm starting a food truck.", ja: "いやいや、そういうんじゃない。フードトラックを始めるんだ。" }
      - { who: coco, at: 0.4, en: "Shut up. Like, tacos?", ja: "うそでしょ。タコスとか？" }
      - { who: dom, at: 0.3, en: "Korean barbecue tacos. My mom's recipe for the marinade.", ja: "韓国風焼肉タコス。漬けダレは母さんのレシピ。" }
      - { who: punchy, at: 0.4, en: "Okay, that's actually amazing. I would eat there every single day.", ja: "おい、それ最高じゃん。毎日通うよ。" }
      - { who: dom, at: 0.3, en: "You say that now.", ja: "今はそう言うけどね。" }
      - { who: coco, at: 0.4, en: "No, seriously, Dom, that's huge. Are you scared?", ja: "ううん、本当にすごいことだよ、ドム。怖くない？" }
      - { who: dom, at: 0.5, en: "Terrified. I put most of my savings into the truck. So, you know, no pressure.", tts: "Terrified. I put most of my savings into the truck. So, y'know, no pressure.", ja: "めちゃくちゃ怖い。貯金のほとんどをトラックにつぎ込んだからね。まあ、プレッシャーなんてないけど。" }
      - { who: punchy, at: 0.4, en: "Well, this calls for a celebration. Let's get a bottle of wine. The good one.", ja: "じゃあお祝いしなきゃ。ワインをボトルで頼もう。いいやつを。" }
      - { who: coco, at: 0.5, en: "Oh— um, I'm okay with water, honestly. I've got an early morning.", ja: "あ…えっと、私は水で大丈夫。明日、朝が早いの。" }
      - { who: punchy, at: 0.3, en: "On a Saturday?", ja: "土曜なのに？" }
      - { who: coco, at: 0.4, en: "Yoga. Very early yoga.", ja: "ヨガ。すごく早い時間のヨガ。" }
      - { who: dom, at: 0.4, en: "Since when do you do yoga?", ja: "いつからヨガなんてやってるの？" }
      - { who: coco, at: 0.3, en: "Since... recently.", ja: "最近…から。" }
      - { who: punchy, at: 0.6, en: "Okay, whatever, I'm getting the bottle. And the steak. And we'll just split the check three ways at the end. Easy.", tts: "Okay, whatever, I'm gettin' the bottle. And the steak. And we'll just split the check three ways at the end. Easy.", ja: "まあいいや、ボトルは頼む。あとステーキも。会計は最後に3人で割り勘にしよう。簡単でしょ。" }
      - { who: coco, at: 0.7, en: "Mm. Or... we could each just pay for our own? It's just, I'm only having the soup, so...", ja: "うーん。それか…それぞれ自分の分を払うのは？ほら、私スープだけだし…" }
      - { who: punchy, at: 0.3, en: "Oh. Yeah, no, totally. That's fair. My bad.", ja: "あ。そうだよね、もちろん。それが公平だ。ごめん。" }
      - { who: dom, at: 0.4, en: "Actually, can I say something? Tonight's on me.", tts: "Actually, c'n I say something? Tonight's on me.", ja: "ねえ、ちょっといい？今夜は僕のおごり。" }
      - { who: coco, at: -0.3, en: "Dom, no. You just quit your job.", ja: "ドム、だめよ。仕事辞めたばっかりでしょ。" }
      - { who: dom, at: 0.2, en: "Which is exactly why. I'm celebrating. Let me do this.", tts: "Which is exactly why. I'm celebrating. Lemme do this.", ja: "だからこそだよ。お祝いなんだから。払わせて。" }
      - { who: punchy, at: 0.4, en: "Absolutely not. The guy who just spent his savings on a truck is not paying for my steak.", ja: "絶対だめ。貯金をトラックにはたいたばかりのやつに、俺のステーキ代は払わせない。" }
      - { who: dom, at: 0.3, en: "Then what do you suggest?", ja: "じゃあどうするのさ？" }
      - { who: punchy, at: 0.5, en: "Here's the deal. Coco pays for her soup, I pay for my steak and the wine, and your burger's on me. Congratulations present.", ja: "こうしよう。ココは自分のスープ、俺はステーキとワイン、で、お前のバーガーは俺のおごり。お祝いのプレゼント。" }
      - { who: coco, at: 0.4, en: "And I'll get your dessert. Then we're all celebrating.", ja: "じゃあデザートは私が出す。それでみんなでお祝いね。" }
      - { who: dom, at: 0.5, en: "You guys are going to make me cry in a restaurant.", tts: "You guys're gonna make me cry in a restaurant.", ja: "お前ら、レストランで泣かせる気かよ。" }
      - { who: punchy, at: 0.3, en: "Cry after the calamari. Speaking of which— excuse me! Hi, could we get the calamari to start?", tts: "Cry after the calamari. Speaking of which— 'scuse me! Hi, could we get the calamari to start?", ja: "泣くのはカラマリのあとにしな。そうだ…すみません！最初にカラマリをお願いできますか？" }
      - { who: coco, at: 0.4, en: "And could you bring some extra bread? I'm suddenly very hungry.", ja: "それとパンを多めにもらえますか？急にすごくお腹がすいてきちゃった。" }
    questions:
      - { type: gist, ask: "夕食での 大きな ニュースは？", line: 16, choices: ["A friend is moving away to open a restaurant in another city.", "A friend has quit his job to start his own food business.", "A friend lost his job after an argument with his boss."], answer: 1, cja: ["友だちが別の町でレストランを開くため引っ越す", "友だちが仕事を辞めて自分の食べ物の商売を始める", "友だちが上司と言い争って仕事を失った"], why: "ドムは月曜に辞表を出し、フードトラックを始める。上司のせいかと聞かれて nothing like that と否定している。" }
      - { type: mean, ask: "ココが just the soup と 言いつづける わけは？", line: 30, choices: ["She doesn't feel well and wants something light.", "She's a vegetarian, and there's little on the menu for her.", "She's trying not to spend much money tonight."], answer: 2, cja: ["体調が悪く軽いものにしたい", "菜食で、食べられるものが少ない", "今夜はあまりお金を使いたくない"], why: "お昼の話もヨガの話も言い訳。割り勘になりそうになると each just pay for our own と言う。お金を気にしている。" }
      - { type: attitude, ask: "ドムは 新しい 計画を どう 感じている？", line: 22, choices: ["Excited but scared, since most of his savings are in it.", "Sorry he left his job, and he wishes he hadn't.", "Calm, because his family is paying for the truck."], answer: 0, cja: ["わくわくしつつ怖い。貯金のほとんどをつぎ込んだ", "仕事を辞めたことを後悔している", "家族がトラック代を出すので落ち着いている"], why: "Terrified と言いつつ、no pressure と冗談めかす。貯金のほとんどを使った。母のレシピはタレのことで、お金の話ではない。" }
      - { type: mean, ask: "Since when do you do yoga? が 示すのは？", line: 27, choices: ["He wants to come along to her yoga class tomorrow.", "He doesn't believe her reason for skipping the wine.", "He thinks early yoga is too expensive for her."], answer: 1, cja: ["明日のヨガのクラスに一緒に行きたい", "ワインを断る理由を信じていない", "早朝ヨガは彼女には高すぎると思う"], why: "急に出てきたヨガの話を疑っている。ココも Since... recently と口ごもる。本当はお金を使いたくない。" }
      - { type: next, ask: "会計は どう なる？", line: 37, choices: ["They split the whole check three ways.", "Each pays for their own, and they treat Dom.", "Dom pays for everyone to celebrate his news."], answer: 1, cja: ["全部を3人で割り勘", "それぞれ自分の分を払い、ドムの分はおごる", "ドムがお祝いに全員分を払う"], why: "ココはスープ、パンチーはステーキとワインとドムのバーガー、ココがドムのデザート。割り勘もドムのおごりも却下。" }
    dict:
