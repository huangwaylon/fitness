  - kind: long
    id: lg-neighbor-tree
    name: お隣の 大きな 木
    source: tts
    ctx: "晴れた朝。隣人同士が庭先で"
    note: "葉っぱの 話は 遠回しの お願い"
    tags: { seed: 32, register: neighbour, pragmatic: indirect, features: [overlap, gonna, contraction] }
    lines:
      - { who: goldie, at: 0, en: "Morning, Cyd! Beautiful day, huh?", ja: "おはよう、シド！いいお天気ね。" }
      - { who: cyd, at: 0.5, en: "Hey, Goldie. Yeah, finally. I thought the rain was never going to stop.", tts: "Hey, Goldie. Yeah, finally. I thought the rain was never gonna stop.", ja: "やあ、ゴールディ。うん、やっとね。雨が永遠にやまないかと思ったよ。" }
      - { who: goldie, at: 0.3, en: "Tell me about it. Oh, hey, I've got a package of yours. It came Tuesday. I think they left it on my porch by mistake.", ja: "ほんとよね。そうそう、あなたの荷物を預かってるの。火曜に届いたのよ。間違えてうちの玄関に置いていったみたい。" }
      - { who: cyd, at: 0.3, en: "Oh, nice, thanks. I've been looking for that. It's a, uh, it's a new blade for the mower.", ja: "お、助かる、ありがとう。探してたんだ。それ、えっと、芝刈り機の新しい刃なんだ。" }
      - { who: goldie, at: 0.4, en: "Well, it's right inside the door. I'll grab it for you in a sec.", tts: "Well, it's right inside the door. I'll grab it for ya in a sec.", ja: "ドアのすぐ内側にあるから、あとで取ってくるわね。" }
      - { who: cyd, at: 0.3, en: "No rush. How's Biscuit doing? Still chasing squirrels?", tts: "No rush. How's Biscuit doin'? Still chasin' squirrels?", ja: "急がなくていいよ。ビスケットは元気？まだリスを追いかけてる？" }
      - { who: goldie, at: 0.4, en: "Oh, constantly. Actually, the squirrels have been having a field day lately. They love that big oak of yours.", ja: "もうずっとよ。実はね、最近リスたちがやりたい放題なの。あなたの大きなオークの木が大好きみたいで。" }
      - { who: cyd, at: 0.3, en: "Ha, yeah, that tree's basically a squirrel hotel.", ja: "はは、あの木はリスのホテルみたいなもんだからね。" }
      - { who: goldie, at: 0.5, en: "It's a gorgeous tree. Really. It's just... it's gotten so big. Some of the branches are hanging way over on my side now.", ja: "本当に立派な木よ。ただ…すごく大きくなったわよね。枝がいくつか、うちの側にかなり張り出してきてるの。" }
      - { who: cyd, at: 0.4, en: "Yeah, it's been a good year for it. All that rain.", ja: "ああ、今年はよく育ったからね。あれだけ雨が降れば。" }
      - { who: goldie, at: 0.5, en: "Mm-hm. And with the rain, the leaves have been, um, piling up in my gutters a little. I had a guy clean them out twice already this fall.", ja: "そうね。それで雨のせいで、葉っぱが、その、うちの雨どいにちょっとたまっちゃって。この秋だけでもう2回、業者に掃除してもらったのよ。" }
      - { who: cyd, at: 0.6, en: "Twice? Wow. Those gutter guys must be making a killing.", tts: "Twice? Wow. Those gutter guys must be makin' a killing.", ja: "2回も？へえ。雨どい業者はぼろ儲けだね。" }
      - { who: goldie, at: 0.4, en: "They are. They really are.", ja: "そうなのよ。本当にね。" }
      - { who: goldie, at: 1.0, en: "So I was kind of wondering if... maybe those branches could be cut back a little? Just the ones over the fence.", tts: "So I was kinda wondering if... maybe those branches could be cut back a little? Just the ones over the fence.", ja: "それでね、ちょっと思ってたんだけど…あの枝、少し切ってもらえないかしら？フェンスを越えてる分だけでいいの。" }
      - { who: cyd, at: 0.6, en: "Oh. Oh, I see. Huh. I mean, I hadn't really noticed it was bothering you.", ja: "あ。ああ、そういうことか。へえ。いや、迷惑になってるなんて気づかなかったよ。" }
      - { who: goldie, at: -0.2, en: "It's not bothering me, exactly—", ja: "迷惑ってほどじゃないのよ…" }
      - { who: cyd, at: 0.2, en: "No, no, it's fine, I get it. You should've said something sooner.", tts: "No, no, it's fine, I get it. You shoulda said somethin' sooner.", ja: "いやいや、いいんだ、わかるよ。もっと早く言ってくれればよかったのに。" }
      - { who: goldie, at: 0.3, en: "I didn't want to make a thing of it. You know how it is.", tts: "I didn't wanna make a thing of it. Y'know how it is.", ja: "大ごとにしたくなかったの。ほら、わかるでしょ。" }
      - { who: cyd, at: 0.5, en: "Sure. Okay. Well, trimming a tree that size isn't cheap, though. Last time I got a quote, it was, like, eight hundred bucks.", ja: "うん。わかった。でも、あのサイズの木を切るのは安くないんだよね。前に見積もりを取ったら、800ドルくらいだった。" }
      - { who: goldie, at: 0.4, en: "Oh, wow. Eight hundred.", ja: "まあ。800ドル。" }
      - { who: cyd, at: 0.4, en: "Yeah. So I've kind of been putting it off, to be honest.", tts: "Yeah. So I've kinda been puttin' it off, to be honest.", ja: "うん。だから正直、ずっと先延ばしにしてたんだ。" }
      - { who: goldie, at: 0.6, en: "Well, since the branches are over my side, what if we split it? Half and half?", ja: "じゃあ、枝はうちの側に出てるんだし、半分ずつ出すのはどう？折半で。" }
      - { who: cyd, at: 0.5, en: "You'd do that?", ja: "そうしてくれるの？" }
      - { who: goldie, at: 0.3, en: "Of course. It'd save me a fortune in gutter guys.", ja: "もちろん。雨どい業者に払う大金が浮くもの。" }
      - { who: cyd, at: 0.3, en: "Ha! Okay, then. Deal. I've got a buddy who does tree work. I'll call him this weekend and see when he can come out.", tts: "Ha! Okay, then. Deal. I've got a buddy who does tree work. I'll call 'im this weekend an' see when he can come out.", ja: "はは！よし、じゃあ決まり。木の仕事をしてる仲間がいるんだ。今週末に電話して、いつ来られるか聞いてみるよ。" }
      - { who: goldie, at: 0.3, en: "That'd be great. Thank you, Cyd. Really.", ja: "助かるわ。ありがとう、シド。本当に。" }
      - { who: cyd, at: 0.3, en: "Hey, no problem. Thanks for bringing it up. Nicely, I mean.", ja: "いいって。言ってくれてありがとう。やんわりとね。" }
      - { who: goldie, at: 0.4, en: "Oh, and while I've got you— I'm going to be away next week. My daughter's having her baby.", tts: "Oh, and while I've gotcha— I'm gonna be away next week. My daughter's having her baby.", ja: "そうだ、ついでに…来週留守にするの。娘に赤ちゃんが生まれるのよ。" }
      - { who: cyd, at: -0.2, en: "No way! Congratulations, Grandma!", ja: "うそ！おめでとう、おばあちゃん！" }
      - { who: goldie, at: 0.2, en: "Thank you! I'm a nervous wreck. Would you mind keeping an eye on the house? Just, you know, grab the mail, make sure nothing looks weird.", tts: "Thank you! I'm a nervous wreck. Would you mind keepin' an eye on the house? Just, y'know, grab the mail, make sure nothing looks weird.", ja: "ありがとう！もうどきどきよ。家を見ててもらえないかしら？郵便を取って、変なことがないか見るくらいでいいの。" }
      - { who: cyd, at: 0.4, en: "Yeah, of course. Want me to water your tomatoes too?", tts: "Yeah, of course. Want me ta water your tomatoes too?", ja: "もちろん。トマトにも水やろうか？" }
      - { who: goldie, at: 0.3, en: "Would you? There's a key under the frog by the back door.", ja: "いいの？裏口のカエルの置物の下に鍵があるから。" }
      - { who: cyd, at: 0.4, en: "Under the frog. Very secure.", ja: "カエルの下。防犯はばっちりだね。" }
      - { who: goldie, at: 0.3, en: "Don't tell anyone.", ja: "誰にも言わないでね。" }
      - { who: cyd, at: 0.3, en: "Your secret's safe with me. And hey, if the tree guy can come while you're gone, I'll just have him do it then.", tts: "Your secret's safe with me. And hey, if the tree guy can come while you're gone, I'll just have 'im do it then.", ja: "秘密は守るよ。それと、留守の間に木の業者が来られたら、そのときにやってもらうね。" }
      - { who: goldie, at: 0.4, en: "Perfect. Okay, let me get you that package before I forget.", tts: "Perfect. Okay, lemme getcha that package before I forget.", ja: "完璧。じゃあ、忘れないうちに荷物を取ってくるわね。" }
      - { who: cyd, at: 0.3, en: "Thanks. Oh— and say hi to Biscuit for me.", ja: "ありがとう。あ…ビスケットによろしく。" }
    questions:
      - { type: gist, ask: "2人が 決めた ことは？", line: 24, choices: ["To cut the whole tree down because of the squirrels.", "To share the cost of trimming a tree, and he'll watch her house.", "To complain together about the gutter cleaning company."], answer: 1, cja: ["リスのせいで木を丸ごと切り倒す", "木の剪定費用を折半し、彼が家を見ておく", "雨どい掃除の業者に一緒に苦情を言う"], why: "張り出した枝を半分ずつの費用で切ることにし、留守の間の家の見回りも頼まれる。木を切り倒す話ではない。" }
      - { type: mean, ask: "雨どいの 葉っぱの 話を するのは なぜ？", line: 10, choices: ["She's hinting that his tree is causing her a problem.", "She wants to recommend her gutter cleaner to him.", "She's complaining about how much it rained this fall."], answer: 0, cja: ["彼の木が困りごとの原因だとほのめかしている", "自分の雨どい業者を紹介したい", "この秋の雨の多さに文句を言っている"], why: "枝が張り出している、葉が雨どいにたまる、と遠回しに伝え、そのあと cut back を切り出す。シドは最初、気づかない。" }
