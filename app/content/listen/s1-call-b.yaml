items:
  - kind: call
    id: call-pizza-order
    ask: "ピザ屋から 電話。メモしよう"
    ctx: "持ち帰りのピザを頼んだ店から電話です"
    scene: living
    channel: phone
    lines:
      - { who: tangy, en: "Hi, this is Tangy from Slice House. I'm calling about your pickup order, the large veggie and the garlic knots?", tts: "Hi, this is Tangy from Slice House. I'm callin' about yer pickup order, the large veggie an' the garlic knots?", ja: "もしもし、スライスハウスのタンジーです。お持ち帰りのご注文、ベジタブルのLとガーリックノットの件でお電話しました。" }
      - { who: me, en: "Yes, that's me. Is everything okay?", ja: "はい、私です。何かありました？" }
      - { who: tangy, en: "So, we're all out of mushrooms tonight. Can we do green peppers instead, or would you rather skip them?", tts: "So, we're all outta mushrooms tonight. Can we do green peppers instead, or wouldja rather skip 'em?", ja: "実は今夜マッシュルームを切らしていて。代わりにピーマンでいいですか、それともなしにしますか？" }
      - { who: me, en: "Green peppers are fine.", ja: "ピーマンで大丈夫です。" }
      - { who: tangy, en: "Great. The knots come with marinara, and ranch is a dollar extra, if you want it.", tts: "Great. The knots come with marinara, an' ranch is a dollar extra, if ya want it.", ja: "ありがとうございます。ガーリックノットにはマリナーラが付きます。ランチソースは1ドル追加でお付けできます。" }
      - { who: tangy, en: "Oh, and sorry, I had the time wrong. It won't be ready at seven-fifteen. It'll be more like seven-forty. The oven's backed up.", tts: "Oh, an' sorry, I had the time wrong. It won't be ready at seven-fifteen. It'll be more like seven-forty. The oven's backed up.", ja: "あ、すみません、時間を間違えていました。7時15分には間に合いません。7時40分ごろになります。オーブンが詰まっていて。", repair: true }
      - { who: me, en: "Seven-forty. Got it. See you then.", ja: "7時40分ですね。了解です。ではそのときに。" }
    half: [0, 0, 0, 0, 1, 1, 1]
    memo:
      - why: "all out of mushrooms でマッシュルームの代わりにピーマン。マリナーラは付くが、ランチは a dollar extra。受け取りは言い直した7時40分。"
        slots:
          - { ask: "マッシュルームの 代わりは？", options: ["ピーマン", "なし", "オリーブ"], answer: 0, cja: ["ピーマン", "何ものせない", "オリーブ"] }
          - { ask: "ガーリックノットに 付くのは？", options: ["マリナーラ", "ランチ", "何も 付かない"], answer: 0, cja: ["マリナーラソース", "ランチソース", "何も付かない"] }
          - { ask: "ランチソースは？", options: ["1ドル 追加", "無料", "品切れ"], answer: 0, cja: ["1ドル追加", "無料", "品切れ"] }
          - { ask: "受け取りは 何時？", options: ["7:14", "7:15", "7:40"], answer: 2, cja: ["7時14分", "7時15分", "7時40分"] }
    note: "I had the time wrong の あとが 正しい 時間"
    tags: { seed: 27, register: service, pragmatic: literal, conditions: [phone], features: [self-repair, weak-form, numbers] }

  - kind: call
    id: call-coat-hold
    ask: "服屋から 電話。メモしよう"
    ctx: "取り寄せを頼んだ服屋から電話です"
    scene: living
    channel: phone
    lines:
      - { who: label, en: "Hi, this is Label from Able Sisters. You asked about the wool coat in a medium?", tts: "Hi, this is Label from Able Sisters. Ya asked about the wool coat in a medium?", ja: "もしもし、エイブル・シスターズのラベルです。ウールのコートのMサイズをお問い合わせいただいた件で。" }
      - { who: me, en: "Oh, yes! Did it come in?", ja: "あ、はい！ 入りました？" }
      - { who: label, en: "So, we're all out of the medium in gray, but we got it in navy. Or there's a large in gray, and it runs pretty small.", tts: "So, we're all oudda the medium in gray, but we got it in navy. Or there's a large in gray, an' it runs preddy small.", ja: "グレーのMは在庫がないんですが、ネイビーなら入りました。それか、グレーのLがあって、かなり小さめの作りです。" }
      - { who: me, en: "Hmm. I'll take the large in gray, I think.", ja: "うーん。グレーのLにしようかな。" }
      - { who: label, en: "Perfect. I can hold it for you until Saturday.", ja: "かしこまりました。土曜までお取り置きできます。" }
      - { who: label, en: "Oh, actually, no, sorry. We're closed this Saturday. So, until Friday at six. Is that okay?", ja: "あ、違いました、すみません。今週の土曜は休みなんです。なので金曜の6時まで。よろしいですか？", repair: true }
      - { who: me, en: "Friday at six. That works. Thanks so much!", ja: "金曜の6時ですね。大丈夫です。ありがとうございます！" }
    half: [0, 0, 0, 0, 1, 1, 1]
    memo:
      - why: "グレーのMだけ在庫切れ。グレーのLは runs pretty small（かなり小さめ）なのでLにした。土曜は休みなので、Actually, no で金曜6時までに変わった。"
        slots:
          - { ask: "グレーの M は？", options: ["在庫なし", "ある", "取り寄せ中"], answer: 0, cja: ["在庫がない", "在庫がある", "取り寄せている"] }
          - { ask: "選んだのは？", options: ["グレーの L", "ネイビーの M", "グレーの M"], answer: 0, cja: ["グレーのラージ", "ネイビーのミディアム", "グレーのミディアム"] }
          - { ask: "L の 作りは？", options: ["小さめ", "大きめ", "ふつう"], answer: 0, cja: ["小さめ", "大きめ", "ふつう"] }
          - { ask: "取り置きは いつまで？", options: ["金曜 6時", "土曜", "金曜 4時"], answer: 0, cja: ["金曜の6時", "土曜", "金曜の4時"] }
    note: "Actually, no の あとが 本当の 期限"
    tags: { seed: 26, register: service, pragmatic: literal, conditions: [phone], features: [self-repair, flap] }

  - kind: call
    id: call-neighbor-cat
    ask: "隣の 人から 電話。メモしよう"
    ctx: "夜、旅行中の隣の人から電話です"
    scene: living
    channel: phone
    lines:
      - { who: tom-nook, en: "Hey, it's Tom from next door. Sorry to call so late. I hate to ask, but my flight's delayed till tomorrow.", tts: "Hey, it's Tom from nex' door. Sorry ta call so late. I hay' ta ask, but my flight's delayed till tomorrow.", ja: "もしもし、隣のトムです。遅くにすみません。頼みにくいんですが、飛行機が明日まで遅れてしまって。" }
      - { who: me, en: "Oh, no! What do you need?", ja: "え、大変！ どうしたらいいですか？" }
      - { who: tom-nook, en: "Would you mind feeding Mochi tonight? Just half a can. She gets the fish one, not the chicken.", tts: "Wouldja mind feedin' Mochi tonight? Jus' half a can. She gets the fish one, not the chicken.", ja: "今夜、モチにごはんをあげてもらえませんか？ 缶を半分だけ。チキンじゃなくて、魚のほうです。" }
      - { who: me, en: "Sure, no problem. How do I get in?", ja: "いいですよ。どうやって入れば？" }
      - { who: tom-nook, en: "The spare key's under the mat. Oh, wait, no. I moved it. It's in the flower pot by the door, the blue one.", ja: "合鍵はマットの下に…あ、違った。移したんだ。ドアの横の植木鉢の中です。青いほう。", repair: true }
      - { who: tom-nook, en: "And just so you know, she'll act super hungry, but don't give her more. She's on a diet.", tts: "An' jus' so ya know, she'll act super hungry, but don't give 'er more. She's on a diet.", ja: "それと一応言っておくと、すごくお腹がすいたふりをしますが、それ以上あげないでください。ダイエット中なので。" }
      - { who: me, en: "Ha! Got it. Half a can of fish, blue flower pot.", ja: "はは！ わかりました。魚の缶を半分、青い植木鉢ですね。" }
    half: [0, 0, 0, 0, 1, 1, 1]
    memo:
      - why: "頼まれたのは猫のえさで、魚の缶を半分。鍵は Oh, wait, no で言い直した青い植木鉢の中。欲しがってもダイエット中なので、それ以上あげない。"
        slots:
          - { ask: "頼まれたのは？", options: ["猫に えさ", "植木に 水", "荷物の 受け取り"], answer: 0, cja: ["猫にえさをあげる", "植木に水をやる", "荷物を受け取る"] }
          - { ask: "えさは？", options: ["魚を 半分", "チキンを 半分", "魚を 1缶"], answer: 0, cja: ["魚の缶を半分", "チキンの缶を半分", "魚の缶を1つ"] }
          - { ask: "鍵は どこ？", options: ["青い 植木鉢", "マットの 下", "郵便受け"], answer: 0, cja: ["青い植木鉢の中", "マットの下", "郵便受けの中"] }
          - { ask: "もっと 欲しがったら？", options: ["あげない", "少し あげる", "チキンを あげる"], answer: 0, cja: ["それ以上あげない", "少しだけあげる", "チキンをあげる"] }
    note: "Oh, wait, no の あとが 本当の 鍵の 場所"
    tags: { seed: 37, register: neighbour, pragmatic: indirect, conditions: [phone], features: [self-repair, elision] }
