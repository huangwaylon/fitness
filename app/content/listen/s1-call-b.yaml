# ようじ でんわ S1 かわ (b): the calls of wave 2a's かわ units (docs/curriculum-wave2.md §3.1, §3.2: one per unit, its
# チェック from recipe v2), each with one complication: a pizza place out of an ingredient and running late (fd-order),
# a shop calling about a size it's out of (sh-shop), a neighbor's favor that grows (hm-neighbor), a clinic moving an
# appointment and a pharmacy's directions (hl-clinic), a weekend plan that changes on the line (mc-weekend), a friend
# who's bringing someone (gl-intro), an invitation half-declined (gl-invite). Unvoiced: batch A2.
schema: 1
unit: s1-call-b
game: call
stage: 2
track: life
seeds: [13, 14, 16, 26, 27, 32, 36, 37, 48, 49, 50, 51]
