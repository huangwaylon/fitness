# ことば タイル S2 もり (b): ordinary connected speech at natural speed (docs/curriculum.md "What's written", B4):
# a quiet h after a verb (ask him, his, her, he), weak function words (did you, what are you, could you, don't you),
# assimilation (ten minutes, in person), fillers (like, you know, I mean, um, well actually) and elision (last night,
# must be, next stop, first time, just, old). Everyday American talk; gonna and gotta are the only respelled tiles.
