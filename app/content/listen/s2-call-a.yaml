items:
  - kind: call
    id: call-gp-callback
    ask: "クリニックに でんわ。メモしよう"
    ctx: "熱が出て、クリニックに電話しています"
    scene: living
    channel: phone
    lines:
      - { who: me, en: "Hi, I'd like to see a doctor today if possible. I've had a fever since last night.", ja: "もしもし、できれば今日診ていただきたいんですが。昨夜から熱があって。" }
      - { who: ken, en: "Okay. We don't have any appointments left today, unfortunately, but I can put you down for a phone call with the doctor.", tts: "Okay. We don't have any appointments left today, unfortunately, but I c'n put you down for a phone call with the doctor.", ja: "わかりました。あいにく今日は予約枠が残っていないのですが、医師からの電話診察でしたらお入れできます。" }
      - { who: ken, en: "She'll call you sometime between two and four. What's the best number to reach you at?", tts: "She'll call ya sometime between two an' four. What's the best number ta reach you at?", ja: "2時から4時の間に医師からお電話します。おかけする番号は？" }
      - { who: me, en: "It's 090-2816-5390.", tts: "It's oh-nine-oh, two-eight-one-six, five-three-nine-oh.", ja: "090-2816-5390です。" }
      - { who: ken, en: "So that's 090-2861...", tts: "So that's oh-nine-oh, two-eight-six-one...", ja: "090-2861…ですね。" }
      - { who: me, en: "Sorry, it's 2816, not 2861.", tts: "Sorry, it's two-eight-one-six, not two-eight-six-one.", ja: "すみません、2816です。2861ではなくて。", repair: true }
      - { who: ken, en: "Got it, 2816. And if your breathing gets worse before then, don't wait for the call. Come right in.", tts: "Got it, two-eight-one-six. An' if yer breathing gets worse before then, don't wait for the call. Come right in.", ja: "2816ですね、承知しました。それまでに息苦しさがひどくなったら、電話を待たずにすぐ来てください。" }
    half: [0, 0, 0, 1, 1, 1, 1]
    memo:
      - why: "相手が 2861 と読み違え、自分が直した。正しいのは 2816。2時〜4時に医師から電話。悪くなったら come right in＝すぐ来院。"
        slots:
          - { ask: "医者からの 連絡は？", options: ["2時〜4時に でんわ", "4時に 来院", "あした でんわ"], answer: 0, cja: ["2時から4時に電話がある", "4時に来院する", "明日電話がある"] }
          - { ask: "番号の まん中は？", options: ["2816", "2861", "5390"], answer: 0, cja: ["2816", "2861", "5390"] }
          - { ask: "悪く なったら？", options: ["すぐ 行く", "でんわを 待つ", "救急車を よぶ"], answer: 0, cja: ["すぐ行く", "電話を待つ", "救急車を呼ぶ"] }
    note: "相手の読み上げに注意。直した番号が正しい"
    tags: { seed: 14, register: service, pragmatic: formula, conditions: [phone], features: [numbers, self-repair, weak-form] }

  - kind: call
    id: call-installer-signal
    ask: "じてんしゃ屋から でんわ。電波が 悪い"
    ctx: "修理に出した自転車の店から電話です"
    scene: office
    channel: phone
    lines:
      - { who: stitches, en: "Hi, this is Spoke and Chain, calling about your bike. So the back wheel's... and that's why it keeps clicking.", tts: "Hi, this is Spoke an' Chain, callin' about yer bike. So the back wheel's... an' that's why it keeps clickin'.", ja: "スポーク・アンド・チェーンです。自転車の件でお電話しました。後ろの車輪が…なので、カチカチ鳴るんですよ。" }
      - { who: me, en: "Sorry, you broke up there. What's wrong with the back wheel?", ja: "すみません、今途切れました。後ろの車輪がどうしたんですか？" }
      - { who: stitches, en: "It's bent. A new wheel's ¥9,000, plus ¥2,000 for labor.", tts: "It's bent. A new wheel's nine thousand yen, plus two thousand for labor.", ja: "曲がってます。新しい車輪が9,000円、工賃が2,000円です。" }
      - { who: me, en: "Okay. When would it be ready?", ja: "わかりました。いつできますか？" }
      - { who: stitches, en: "Friday. Oh, wait, the brake pads are almost gone, too. That's another ¥3,000, so ¥14,000 total.", tts: "Friday. Oh, wait, the brake pads are almost gone, too. That's another three thousand, so fourteen thousand total.", ja: "金曜です。あ、待ってください、ブレーキパッドもほぼすり減ってますね。それがプラス3,000円で、全部で14,000円です。", repair: true }
      - { who: me, en: "Fine, do the brakes too.", ja: "いいです、ブレーキもお願いします。" }
      - { who: stitches, en: "Will do. And bring your lock key on Friday. Last week we had to cut someone's lock, and nobody enjoyed that.", tts: "Will do. An' bring yer lock key on Friday. Last week we hadta cut someone's lock, an' nobody enjoyed that.", ja: "承知しました。それと金曜はカギを持ってきてください。先週お客さんのカギを切ることになって、誰も楽しくなかったので。" }
    half: [0, 0, 0, 0, 1, 1, 1]
    memo:
      - why: "車輪9,000円と工賃2,000円に、Oh, wait でブレーキの3,000円が追加。total＝合計14,000円。11,000円はブレーキ前の合計。bent＝曲がっている。"
        slots:
          - { ask: "どこが 悪い？", options: ["後ろの 車輪が 曲がっている", "チェーンが 切れた", "タイヤの パンク"], answer: 0, cja: ["後ろの車輪が曲がっている", "チェーンが切れた", "タイヤがパンクした"] }
          - { ask: "合計は？", options: ["9,000円", "11,000円", "14,000円"], answer: 2, cja: ["9,000円", "11,000円", "14,000円"] }
          - { ask: "いつ できる？", options: ["木曜", "金曜", "土曜"], answer: 1, cja: ["木曜", "金曜", "土曜"] }
          - { ask: "とりに 行く ときは？", options: ["カギを 持っていく", "お金を 先に 払う", "電話してから 行く"], answer: 0, cja: ["カギを持っていく", "お金を先に払う", "電話してから行く"] }
    note: "total＝合計。ブレーキの 3,000円も 入る"
    tags: { seed: 25, register: service, pragmatic: literal, conditions: [phone, signal], features: [numbers, self-repair, weak-form] }

  - kind: call
    id: call-leak-again
    ask: "ともだちに でんわ。いえへの 行きかた"
    ctx: "友だちの家に向かう途中、駅から電話しています"
    scene: street
    channel: phone
    lines:
      - { who: me, en: "Hey, Tom, I'm at the station. Which exit do I take for your place?", ja: "もしもし、トム、駅に着いたよ。家に行くには何口から出ればいい？" }
      - { who: tom-nook, en: "Oh, hey! Take the north exit and go straight, past the convenience store.", tts: "Oh, hey! Take the north exit an' go straight, past the convenience store.", ja: "おっ、やあ！ 北口から出て、コンビニを過ぎてまっすぐ。" }
      - { who: me, en: "North exit, past the convenience store. Okay.", ja: "北口、コンビニを過ぎて。了解。" }
      - { who: tom-nook, en: "Wait, no, the east exit. The north one's closed for construction this month. Sorry!", ja: "待って、違う、東口だ。北口は今月工事で閉まってるんだった。ごめん！", repair: true }
      - { who: tom-nook, en: "Then it's the second left, and we're the gray building, 3C. Oh, and could you grab some ice? We kind of underestimated.", tts: "Then it's the second left, an' we're the gray building, three C. Oh, an' couldja grab some ice? We kinda underestimated.", ja: "そこから2つめを左で、グレーの建物の3C。あ、それと氷買ってきてくれる？ ちょっと見積もりが甘かった。" }
      - { who: me, en: "Sure. East exit, second left, 3C, and ice.", tts: "Sure. East exit, second left, three C, and ice.", ja: "いいよ。東口、2つめを左、3C、それと氷ね。" }
      - { who: tom-nook, en: "You're a lifesaver. The buzzer's broken, so just text me when you're downstairs.", ja: "助かる。インターホンが壊れてるから、下に着いたらメッセージして。" }
    half: [0, 0, 0, 1, 1, 1, 1]
    memo:
      - why: "Wait, no＝北口は工事中で東口に訂正。second left＝2つめを左。部屋は3C。氷を頼まれた。インターホンが壊れていて、着いたら text する。"
        slots:
          - { ask: "出口は？", options: ["北口", "東口", "南口"], answer: 1, cja: ["北口", "東口", "南口"] }
          - { ask: "曲がる ところは？", options: ["1つめを 左", "2つめを 左", "2つめを 右"], answer: 1, cja: ["1つめを左", "2つめを左", "2つめを右"] }
          - { ask: "部屋は？", options: ["3B", "3C", "4C"], answer: 1, cja: ["3ビー号室", "3シー号室", "4シー号室"] }
          - { ask: "買って いく ものは？", options: ["氷", "飲みもの", "紙の お皿"], answer: 0, cja: ["氷", "飲み物", "紙のお皿"] }
          - { ask: "着いたら？", options: ["メッセージする", "インターホンを おす", "ドアを ノック"], answer: 0, cja: ["メッセージを送る", "インターホンを押す", "ドアをノックする"] }
    note: "Wait, no の あと：北口は 工事中で 東口"
    tags: { seed: 30, register: friend, pragmatic: indirect, conditions: [phone, street], features: [self-repair, kinda, numbers] }

  - kind: call
    id: call-host-parking
    ask: "宿の ホストから でんわ"
    ctx: "旅行先の宿のホストから電話です"
    scene: street
    channel: phone
    lines:
      - { who: daisy-mae, en: "Hi! It's Daisy, your host. Just calling to walk you through check-in, since I won't be there.", tts: "Hi! It's Daisy, yer host. Just callin' ta walk ya through check-in, since I won't be there.", ja: "こんにちは！ホストのデイジーです。私は行けないので、チェックインの説明をしようと思って。" }
      - { who: daisy-mae, en: "So the lockbox is on the front porch, and you've got one parking spot out back. It's number 14.", tts: "So the lockbox is on the front porch, an' you've got one parking spot out back. It's number fourteen.", ja: "ロックボックスは玄関ポーチにあって、裏に駐車スペースが1台分あります。14番です。" }
      - { who: me, en: "Spot 14. Okay.", tts: "Spot fourteen. Okay.", ja: "14番ですね。" }
      - { who: daisy-mae, en: "Oh, wait, no, 14 is my neighbor's. Sorry! Yours is 40. Four-oh.", tts: "Oh, wait, no, fourteen is my neighbor's. Sorry! Yours is forty. Four-oh.", ja: "あ、待って、14はお隣さんのだ。ごめんね！あなたのは40番。よん、ゼロ。", repair: true }
      - { who: daisy-mae, en: "And the AC's kind of temperamental. If it beeps, just... unplug... and you'll...", tts: "An' the A C's kinda temperamental. If it beeps, just... unplug... an' you'll...", ja: "あと、エアコンがちょっと気まぐれで。ピーッて鳴ったら…コンセントを…" }
      - { who: me, en: "Sorry, you're breaking up. What do I do if it beeps?", ja: "すみません、途切れてます。鳴ったらどうするんですか？" }
      - { who: daisy-mae, en: "Sorry, I'm on the train! Just unplug it and plug it back in. Works every time.", tts: "Sorry, I'm on the train! Just unplug it an' plug it back in. Works every time.", ja: "ごめん、電車の中なの！コンセントを抜いて、また差して。それで毎回直るから。" }
    half: [0, 0, 0, 1, 1, 1, 1]
    memo:
      - why: "14 is my neighbor's＝14番は隣の人の。four-oh で40番。fourteen と forty は強く言う位置がちがう。エアコンは抜いて差し直す。"
        slots:
          - { ask: "ロックボックスは どこ？", options: ["玄関の ポーチ", "裏の 駐車場", "ポストの 中"], answer: 0, cja: ["玄関のポーチ", "裏の駐車場", "郵便受けの中"] }
          - { ask: "駐車スペースは？", options: ["14番", "40番", "41番"], answer: 1, cja: ["14番", "40番", "41番"] }
          - { ask: "エアコンが 鳴ったら？", options: ["コンセントを ぬいて さしなおす", "ホストに でんわ", "窓を あける"], answer: 0, cja: ["コンセントを抜いて差し直す", "ホストに電話する", "窓を開ける"] }
    note: "14 is my neighbor's＝14は隣の人の。40が正解"
    tags: { seed: 10, register: service, pragmatic: literal, conditions: [phone, signal, train], features: [numbers, teen-ty, self-repair] }

  - kind: call
    id: call-hotel-extra-night
    ask: "ホテルに でんわ。予約を 変える"
    ctx: "ホテルに電話して、予約の延長を頼んでいます"
    scene: living
    channel: phone
    lines:
      - { who: me, en: "Hi, I have a reservation for tomorrow night, under Wei. I was wondering if I could add a second night.", ja: "明日一泊、ウェイの名前で予約しているんですが、もう一泊追加できないかと思って。" }
      - { who: poppy, en: "Let me take a look. So that's arriving on the 12th... yes, I can add two nights, so you'd check out on the 15th.", tts: "Lemme take a look. So that's arrivin' on the twelfth... yes, I can add two nights, so you'd check out on the fifteenth.", ja: "お調べします。12日ご到着で…はい、2泊追加できますので、15日のチェックアウトになります。" }
      - { who: me, en: "Sorry, just one more night. So checking out on the 14th.", tts: "Sorry, just one more night. So checking out on the fourteenth.", ja: "すみません、追加は1泊だけです。なので14日チェックアウトで。", repair: true }
      - { who: poppy, en: "Of course, my mistake. Two nights total, checking out on the 14th.", tts: "Of course, my mistake. Two nights total, checkin' out on the fourteenth.", ja: "失礼いたしました。合計2泊、14日チェックアウトですね。" }
      - { who: poppy, en: "The second night's a little more, since it's a Friday. It'd be ¥22,000 instead of ¥18,000.", tts: "The second night's a little more, since it's a Friday. It'd be twenty-two thousand yen instead of eighteen.", ja: "2泊目は金曜のため少し料金が上がりまして、1万8千円ではなく2万2千円になります。" }
      - { who: me, en: "That's fine. Oh, and I'm getting in pretty late, maybe around eleven.", ja: "大丈夫です。あと、到着がかなり遅くて、11時ごろになりそうです。" }
      - { who: poppy, en: "No problem at all. The front desk is open 24 hours, so just give your name when you arrive.", tts: "No problem at all. The front desk is open twenty-four hours, so just give yer name when you arrive.", ja: "まったく問題ございません。フロントは24時間開いておりますので、ご到着の際にお名前をおっしゃってください。" }
    half: [0, 0, 0, 0, 1, 1, 1]
    memo:
      - why: "相手は2泊追加と取り違えて15日と言ったが、just one more night と直して14日に。2泊目は金曜なので22,000円（18,000円ではない）。到着は11時ごろ。"
        slots:
          - { ask: "チェックアウトは？", options: ["13日", "14日", "15日"], answer: 1, cja: ["13日", "14日", "15日"] }
          - { ask: "2泊目の 料金は？", options: ["18,000円", "20,000円", "22,000円"], answer: 2, cja: ["1万8千円", "2万円", "2万2千円"] }
          - { ask: "到着は？", options: ["11時ごろ", "7時ごろ", "チェックインの 時間"], answer: 0, cja: ["11時ごろ", "7時ごろ", "チェックインの時間"] }
    note: "自分の訂正も聞く。15日ではなく14日まで"
    tags: { seed: 3, register: service, pragmatic: formula, conditions: [phone], features: [numbers, teen-ty, self-repair] }
