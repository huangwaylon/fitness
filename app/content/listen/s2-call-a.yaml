# ようじ でんわ S2 もり (a): calls at native speed: a callback number read back wrong, a bike shop's quote on a bad
# line, a friend's directions corrected mid-call, a host who corrects her own parking spot on a train, a booking whose
# dates the caller has to correct.
schema: 1
unit: s2-call-a
game: call
stage: 3
track: life
seeds: [3, 10, 14, 25, 30]
