    lines:
      - { who: kid-cat, at: 0, en: "Let's watch a scary movie tonight.", ja: "今夜はこわい映画を見ようよ。" }
      - { who: audie, at: 0.4, en: "No, thanks. Scary movies give me bad dreams.", ja: "いや、いい。こわい映画を見ると、悪い夢を見るの。" }
      - { who: tammy, at: 0.4, en: "How about a funny movie? I want to laugh.", ja: "おもしろい映画はどう？笑いたいな。" }
      - { who: kid-cat, at: 0.3, en: "Okay, okay. A funny movie is fine.", ja: "わかった、わかった。おもしろい映画でいいよ。" }
      - { who: audie, at: 0.3, en: "Great. I'll make the popcorn.", ja: "よかった。ポップコーンは私が作るね。" }
      - { who: tammy, at: 0.3, en: "And I'll get the drinks.", ja: "じゃあ私は飲み物を用意する。" }
    rounds:
      - { type: opinions, claims: ["こわい 映画は いや", "笑える 映画が いい", "最初は こわい 映画が よかった"], answer: [audie, tammy, kid-cat], ctx: "夜、3人が家で見る映画を選んでいます", why: "オーディーは bad dreams を見るのでいや。タミーは I want to laugh。キッドキャットは a scary movie と言っていた。" }
      - { type: changed, answer: kid-cat, ctx: "こわい映画がいやな人がいます", why: "キッドキャットはこわい映画がよかったが、Okay, okay. A funny movie is fine と変えた。" }
      - { type: plan, ask: "今夜は？", choices: ["A scary movie, with popcorn.", "An action movie at the theater.", "A funny movie, with popcorn."], answer: 2, ja: "ポップコーンを食べながら、おもしろい映画を見る。", ctx: "最後に、今夜の映画が決まります", why: "A funny movie is fine に決まり、ポップコーンと飲み物を用意する。こわい映画はやめた。映画館には行かない。", cja: ["ポップコーンとこわい映画", "映画館でアクション映画", "ポップコーンとおもしろい映画"] }
