  - kind: tachi
    id: tachi-hama-station-hotel
    ask: "どの ホテルに する？"
    scene: gate
    lines:
      - { who: olivia, at: 0, en: "This hotel is near the station. It's ¥12,000.", tts: "This hotel is near the station. It's twelve thousand yen.", ja: "このホテルは駅の近く。12,000円だよ。" }
      - { who: zucker, at: 0.4, en: "That's a lot. This one is only ¥7,000.", tts: "That's a lot. This one is only seven thousand yen.", ja: "高いな。こっちはたった7,000円だよ。" }
      - { who: pietro, at: 0.4, en: "But that one is far. It's forty minutes by bus.", ja: "でもそっちは遠いよ。バスで40分。" }
      - { who: zucker, at: 0.3, en: "Forty minutes? That's too far. You're right.", ja: "40分？遠すぎるね。そのとおりだ。" }
