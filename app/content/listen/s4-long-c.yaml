items:
  - kind: long
    id: rl-canyon-questions
    name: グランドキャニオン Q&A
    source: real
    ctx: "国立公園のレンジャー2人が、ネットの質問に答える"
    note: "rocks with dirt…は冗談だが的外れでもない"
    tags: { seed: 68, register: colleague, pragmatic: humour, features: [overlap, filler, numbers] }
    speakers:
      a: { name: "Brendan", ja: "ブレンダン", g: m }
      b: { name: "Kate", ja: "ケイト", g: f }
    credit:
      title: "Your Questions Answered"
      by: "National Park Service, Grand Canyon National Park: Behind the Scenery podcast (2021)"
      url: "https://www.nps.gov/podcasts/behind-the-scenery.htm#episode-9C758953-ED57-E082-A9EB917A11DEFCE0"
      file: "https://www.nps.gov/common/uploads/podcasts/9BB28973-DAD1-6094-F873DE54D485362C.mp3"
      sha256: "12aab59019fb8ab77c9a3a4f10de73c458625742acce9859698d2d555e86a97d"
      start: 155.2
      end: 338.5
      licence: "Public domain (a work of the US federal government)"
      licenceUrl: "https://www.nps.gov/aboutus/disclaimer.htm"
      attribution: "Audio: National Park Service, Grand Canyon National Park, “Behind the Scenery” podcast, “Your Questions Answered” (2021). Public domain. Excerpt, loudness-normalized and re-encoded."
    lines:
      - { who: a, t: [0.0, 11.285], en: "So, Kate Hensel, if you could help me out, because I went on the Internet and searched for all the most commonly asked questions on various websites.", ja: "ケイト・ヘンゼルさん、ちょっと手伝ってほしいんだ。ネットでいろんなサイトの「よくある質問」を検索してみたんだよ。" }
      - { who: a, t: [11.285, 15.575], en: "And this is what the Internet wants to know.", ja: "で、これがネットのみんなが知りたいこと。" }
      - { who: a, t: [15.575, 24.625], en: "And I was wondering if you could help me answer these. So I just, like, punched in Grand Canyon and, like, question mark into Google, and then I just let it auto-populate.", ja: "答えるのを手伝ってもらえないかなと思って。グーグルに「グランドキャニオン」と「？」を打ち込んで、あとは自動で候補を出させたんだ。" }
      - { who: a, t: [24.625, 29.405], en: "So this is what we came up with. So the first one, Kate Hensel, are you ready?", ja: "それで出てきたのがこれ。じゃあ最初の質問。ケイト・ヘンゼルさん、準備はいい？" }
      - { who: b, t: [29.405, 30.155], en: "I'm ready.", ja: "いいわよ。" }
      - { who: a, t: [30.155, 31.935], en: "What is Grand Canyon?", ja: "グランドキャニオンとは何か？" }
      - { who: b, t: [31.935, 44.225], en: "Grand Canyon is a big drainage ditch that goes from, well, like, kind of the border with Utah to the border with Nevada,", ja: "グランドキャニオンは大きな排水溝みたいなもので、だいたいユタとの州境からネバダとの州境まで、" }
      - { who: b, t: [44.225, 48.265], en: "just across northern Arizona.", ja: "アリゾナ北部を横切っているの。" }
      - { who: a, t: [48.265, 50.715], en: "And what is Grand Canyon made of?", ja: "で、グランドキャニオンは何でできている？" }
      - { who: b, t: [50.715, 59.355], en: "Rock. So many rocks. Really old rocks, and then kind of old rocks, and then crazy old rocks at the way—", ja: "岩。とにかく岩。すごく古い岩と、まあまあ古い岩と、それから一番…" }
      - { who: a, t: [59.355, 67.265], en: "Bottom. One ranger told me, when I asked him something similar, he said, Grand Canyon is rocks with dirt and dirty rocks.", ja: "底のほうに、とんでもなく古い岩ね。前にあるレンジャーに似たことを聞いたら、「グランドキャニオンは土のついた岩と、汚れた岩だ」って言われたよ。" }
      - { who: a, t: [67.265, 71.745], en: "Oh, that's good. And I'm like, that's not incorrect. Yeah.", ja: "うまいこと言うよね。で、まあ間違ってはいないなって。うん。" }
      - { who: b, t: [71.745, 76.635], en: "Yeah, so it's a lot of sedimentary rocks from, I think, the Precambrian era, for the most part.", ja: "そう、だいたいは先カンブリア時代の堆積岩が多いのよ、たしか。" }
      - { who: b, t: [76.635, 79.975], en: "I think the top gets into the Cambrian era. I think—", ja: "一番上はカンブリア紀に入るのかな。たしか…" }
      - { who: a, t: [79.975, 82.405], en: "Old rocks, kind of young canyon.", ja: "岩は古いけど、峡谷は割と若い、と。" }
      - { who: b, t: [82.405, 84.735], en: "What are the oldest rocks at Grand Canyon?", ja: "グランドキャニオンで一番古い岩は？" }
      - { who: a, t: [84.735, 92.275], en: "Well, the oldest one, well, Grand Canyon's like a stack of pancakes, where the oldest and coldest pancakes on a stack of pancakes would be at the bottom.", ja: "一番古いのは…そうだな、グランドキャニオンはパンケーキを重ねたようなもので、一番古くて冷めたパンケーキが一番下にあるんだ。" }
      - { who: a, t: [92.275, 96.915], en: "And as you go higher up the stack of pancakes, you have the newer and fresher pancakes.", ja: "上に行くほど、新しくて焼きたてのパンケーキになる。" }
      - { who: a, t: [96.915, 100.055], en: "So the oldest rock would be the basement rocks at the bottom.", ja: "だから一番古い岩は、一番下の基盤岩ってこと。" }
      - { who: a, t: [100.055, 102.545], en: "This is my favorite one. Grand Canyon, how big?", ja: "これ、僕のお気に入り。グランドキャニオンの大きさは？" }
      - { who: b, t: [102.545, 112.195], en: "Depends on where you are. But at the North Rim and South Rim, where they look across the canyon to each other, it's 10 miles across as the bird flies,", ja: "場所によるわね。でもノースリムとサウスリムが峡谷を挟んで向かい合っているところだと、直線距離で10マイル、" }
      - { who: b, t: [112.195, 114.505], en: "or 21 miles to hike.", ja: "歩けば21マイル。" }
      - { who: a, t: [114.505, 117.025], en: "What if I wanted to drive from the South Rim to the North Rim?", ja: "サウスリムからノースリムまで車で行きたかったら？" }
      - { who: b, t: [117.025, 119.325], en: "Oh, it's like two hundred-some miles. Yeah,", ja: "200何マイルかしらね。そう、" }
      - { who: a, t: [119.325, 122.185], en: "despite it only being 10 miles wide.", ja: "幅は10マイルしかないのに。" }
      - { who: b, t: [122.185, 129.725], en: "Yeah. And then it's the river length of Grand Canyon, so how long Grand Canyon is, is 277 miles.", ja: "そう。それと川の長さで言うと、グランドキャニオンの長さは277マイルね。" }
      - { who: a, t: [129.725, 131.965], en: "And how do I get to Grand Canyon?", ja: "で、グランドキャニオンへの行き方は？" }
      - { who: b, t: [131.965, 139.195], en: "You can drive to the North Rim and South Rim sides of it, and pretty much drive almost right up to the rim.", ja: "ノースリム側にもサウスリム側にも車で行けて、ほとんど崖の縁のすぐそばまで運転できるわ。" }
      - { who: b, t: [139.195, 143.495], en: "It's in northern Arizona, right below the Arizona Strip.", ja: "アリゾナ北部、アリゾナ・ストリップのすぐ下にあるの。" }
      - { who: b, t: [143.495, 150.585], en: "So you can come into Flagstaff and then drive north from there, drive from Las Vegas, which, how long is that drive?", ja: "だからフラッグスタッフまで来てそこから北へ走るか、ラスベガスから運転するか。あれって何時間かかるんだっけ？" }
      - { who: b, t: [150.585, 157.175], en: "You can also get here on the Colorado River, or come in from the Green River if you're doing a big river trip.", ja: "コロラド川を下って来ることもできるし、大がかりな川旅ならグリーン川から入ってくることもできるわ。" }
      - { who: a, t: [157.175, 159.085], en: "Well, you do have the dam in the way now.", ja: "でも今はダムがあって邪魔だよね。" }
      - { who: b, t: [159.085, 161.815], en: "Oh, that's true. I mean, you can just jump the dam.", ja: "あ、そうね。まあ、ダムを飛び越えちゃえばいいのよ。" }
      - { who: a, t: [161.815, 166.395], en: "If you get enough speed and just, like, launch yourself.", ja: "スピードをつけて、こう、自分を打ち上げれば。" }
      - { who: b, t: [166.395, 168.805], en: "Put, like, a glider on your boat? That'd be cool.", ja: "ボートにグライダーをつけるとか？かっこいいわね。" }
      - { who: a, t: [168.805, 177.335], en: "I think get, like, one of those sweet, like, ramps. Like a big, like, Evel Knievel-style ramp, and just hit it.", ja: "僕なら、こう、イカしたジャンプ台を用意するかな。イーブル・ニーブル風のでっかいやつ。で、一気に突っ込む。" }
      - { who: b, t: [177.335, 183.3], en: "Yeah. Please don't do this. Disclaimer, do not do that.", ja: "うん。絶対やらないでね。念のため言っておくけど、やっちゃだめよ。" }
    questions:
      - { type: gist, ask: "2人は 何を している？", line: 2, choices: ["Planning a hiking route from one rim of the canyon to the other.", "Answering popular online questions about the canyon, joking along the way.", "Explaining the park's safety rules to a group of visitors."], answer: 1, cja: ["峡谷の縁から縁へのハイキングルートを計画している", "ネットでよくある峡谷の質問に、冗談をまじえて答えている", "来園者のグループに公園の安全規則を説明している"], why: "グーグルの自動入力で出た質問を一つずつ読み、ケイトが答える。ダムを飛び越える話は冗談で、ルート計画や安全講習ではない。" }
      - { type: mean, ask: "rocks with dirt and dirty rocks に ついて 言いたいのは？", line: 11, choices: ["It's the official scientific description of the canyon.", "Rangers aren't allowed to give that answer anymore.", "It's a joke, but it isn't actually wrong."], answer: 2, cja: ["峡谷の公式な科学的説明だ", "レンジャーはもうその答えを言ってはいけない", "冗談だが、実は間違ってもいない"], why: "that's not incorrect＝間違いではない。冗談めいた言い方だが、岩と土でできているのは事実、という含み。" }
      - { type: mean, ask: "パンケーキの 話を するのは なぜ？", line: 16, choices: ["To show that the oldest rock is at the bottom.", "To describe a famous breakfast place near the canyon.", "To show how the river dug out the canyon layer by layer."], answer: 0, cja: ["一番古い岩が一番下にあると示すため", "峡谷近くの有名な朝食の店を紹介するため", "川が峡谷を一層ずつ削った様子を示すため"], why: "重ねたパンケーキは下ほど古く、上ほど新しい。同じように一番古い岩は一番下の basement rocks、というたとえ。" }
      - { type: attitude, ask: "ダムを 飛び越える 話は どれくらい 本気？", line: 36, choices: ["Not at all: it's a joke, and they tell people not to try it.", "Quite serious: they say it's how most boaters get around the dam.", "Unsure: they think it might be allowed with a permit."], answer: 0, cja: ["まったく本気でない：冗談で、まねしないよう言う", "かなり本気：ボートの多くはそうしてダムを越えると言う", "迷っている。許可があればできるかもと思っている"], why: "グライダーやジャンプ台は悪ふざけ。最後に Please don't do this. Disclaimer, do not do that. と慌てて打ち消す。" }
    dict:
      - { line: 0, words: "help me out", feature: linking }
      - { line: 9, words: "kind of old rocks", feature: kinda }
      - { line: 32, words: "just jump the dam", feature: elision }

  - kind: long
    id: rl-desert-island
    name: 無人島に 持って行く もの
    source: real
    ctx: "宇宙飛行士の候補生たちが、ポッドキャストで質問ゲーム"
    note: "No guarantees＝味の保証なし。控えめな冗談"
    tags: { seed: 69, register: colleague, pragmatic: humour, features: [overlap, gonna, weak-form] }
    speakers:
      a: { name: "Nilufar (host)", ja: "ニルファー（司会）", g: f }
      b: { name: "Mel", ja: "メル", g: f }
      c: { name: "Anna", ja: "アナ", g: f }
      d: { name: "Ben", ja: "ベン", g: m }
    credit:
      title: "On a Desert Island with the 2025 Class of Astronaut Candidates"
      by: "NASA Johnson Space Center: Houston We Have a Podcast, episode 402 (2025)"
      url: "https://www.nasa.gov/podcasts/houston-we-have-a-podcast/on-a-desert-island-with-the-2025-class-of-astronaut-candidates/"
      file: "https://www.nasa.gov/wp-content/uploads/2025/09/ep402-on-a-desert-island-with-the-2025-class-of-astronaut-candidates.mp3"
      sha256: "03f6e849cc016dbc3eb557729e60c4edfd02c3ccf2afa815addb7f09cbd28a7b"
      start: 221.8
      end: 406.2
      licence: "Public domain (NASA: a work of the US federal government)"
      licenceUrl: "https://www.nasa.gov/nasa-brand-center/images-and-media/"
      attribution: "Audio: NASA Johnson Space Center, “Houston We Have a Podcast” episode 402, “On a Desert Island with the 2025 Class of Astronaut Candidates” (2025). Public domain. Excerpt, loudness-normalized and re-encoded."
    lines:
      - { who: a, t: [0.0, 9.725], en: "Great. Okay, so, you're going to be on a desert island for a full year, and all your basic needs are provided for, like your food, your shelter, and clothing,", ja: "いいわね。じゃあ、みんなは無人島で丸1年過ごすことになります。食べ物や住む所、服みたいな基本的なものは全部用意されてる。" }
      - { who: a, t: [9.725, 13.195], en: "but you also get to bring three other things with you.", ja: "でもそれとは別に、3つのものを持って行けます。" }
      - { who: a, t: [13.195, 18.645], en: "And these three things are a book, a music item, and a luxury item.", ja: "その3つは、本、音楽、それにぜいたく品。" }
      - { who: a, t: [18.645, 24.775], en: "Think about what those three things are, and I'm going to start with Mel.", ja: "何にするか考えてね。メルから始めましょう。" }
      - { who: b, t: [24.775, 28.205], en: "Oh, goodness. Okay, right on the spot.", ja: "うわあ。いきなりね。" }
      - { who: b, t: [28.205, 32.915], en: "The book was first, I believe, and I really enjoy cooking.", ja: "最初は本だったよね。私は料理がすごく好きなの。" }
      - { who: b, t: [32.915, 45.475], en: "I'm not very good at it, but I really enjoy it, and so I think I would bring some sort of cookbook that had the plants or animals from that island, so that I could incorporate some maybe original recipes and keep people happy and fed.", ja: "上手じゃないけど、本当に好き。だから、その島の植物や動物が載っている料理本を持って行くかな。オリジナルのレシピを考えて、みんなを満腹で幸せにできるように。" }
      - { who: b, t: [45.475, 58.375], en: "(Very smart.) As far as a music album, I just got a record player, and I've been into picking random records based off of purely picture alone.", ja: "（司会：賢いわね。）音楽のアルバムは…最近レコードプレーヤーを買って、ジャケットの絵だけで適当にレコードを選ぶのにはまってるの。" }
      - { who: b, t: [58.375, 61.425], en: "So, it's kind of like a choose-your-own-adventure. So, I don't know.", ja: "ちょっとした冒険みたいなものね。だから、どうだろう。" }
      - { who: b, t: [61.425, 64.505], en: "Maybe I'd pull a random album, and we'll see how that goes.", ja: "適当に一枚引いて、どうなるかお楽しみ、かな。" }
      - { who: b, t: [64.505, 68.575], en: "It might get me voted off the island, but that's probably what I'd do.", ja: "そのせいで島から追い出されるかもしれないけど、たぶんそうする。" }
      - { who: b, t: [68.575, 71.975], en: "Or Metallica. I like Metallica. So, something along those lines.", ja: "それかメタリカ。メタリカ好きなの。そんな感じ。" }
      - { who: b, t: [71.975, 74.625], en: "As far as a luxury item, ooh, I don't know.", ja: "ぜいたく品は…うーん、どうしよう。" }
      - { who: b, t: [74.625, 80.395], en: "I think I'm going to stretch the item a little bit, and I'm going to say, I'm going to bring my cat Meatball.", ja: "ちょっとルールを広げて、うちの猫のミートボールを連れて行くことにする。" }
      - { who: b, t: [80.395, 83.915], en: "He's 22, and I bring him everywhere I can.", ja: "22歳で、連れて行ける所にはどこにでも連れて行くの。" }
      - { who: b, t: [83.915, 87.605], en: "He's 22. Yeah, I think he would totally fit in as an island cat.", ja: "22歳よ。うん、島の猫にぴったりだと思う。" }
      - { who: b, t: [87.605, 92.885], en: "Meatball, he'd love hanging out under the palm trees, soaking up the sun.", ja: "ミートボールなら、ヤシの木の下でのんびり日向ぼっこするのが大好きなはず。" }
      - { who: b, t: [92.885, 97.295], en: "Yeah. He's got that island cat vibe. Absolutely.", ja: "うん。島の猫っぽい雰囲気があるの。間違いない。" }
      - { who: a, t: [97.295, 102.485], en: "Those are three great luxury items, and if I was with you, I'd love for you to cook for me.", ja: "どれもすてきね。私も一緒だったら、ぜひ料理を作ってほしいな。" }
      - { who: b, t: [102.485, 105.595], en: "Absolutely. Anytime. No guarantees, but...", ja: "もちろん。いつでも。味の保証はないけど…" }
      - { who: a, t: [105.595, 107.835], en: "We'll experiment. Anna, why don't you go next?", ja: "実験しましょ。アナ、次どうぞ。" }
      - { who: c, t: [107.835, 119.085], en: "Sure. All right. So, for book, I might be stretching this a little bit, but I would take the Throne of Glass boxed set of books.", ja: "はい。えっと、本は、ちょっとずるいかもしれないけど、『ガラスの王女』シリーズのセットを持って行きます。" }
      - { who: a, t: [119.085, 121.675], en: "Box set. Smart.", ja: "セットね。賢い。" }
      - { who: c, t: [121.675, 124.315], en: "Or a Kindle with all of that series in it.", ja: "それか、そのシリーズが全部入ったキンドル。" }
      - { who: a, t: [124.315, 127.785], en: "Oh, that's great, too.", ja: "それもいいわね。" }
      - { who: c, t: [127.785, 138.135], en: "And for music album, I have a very eclectic music taste, so I would probably take a,", ja: "音楽のアルバムは、私は趣味がすごく幅広いので、たぶん…" }
      - { who: c, t: [138.135, 144.115], en: "like, if I'm allowed to take, like, a mixed tape of, like, salsa music or country music.", ja: "もしいいなら、サルサとかカントリーのミックステープを持って行きたい。" }
      - { who: c, t: [144.115, 150.805], en: "(Love that.) Salsa, I feel like, would be fun, because you could bring some dancing to the island. (Oh, yeah. You could teach her some moves.) Yes.", ja: "（いいわね。）サルサは楽しいと思うの。島にダンスを持ち込めるから。（そうそう、ステップを教えてあげられるね。）そう。" }
      - { who: d, t: [150.805, 153.705], en: "Is there, like, salsa country fusion?", ja: "サルサとカントリーの融合ってあるの？" }
      - { who: c, t: [153.705, 157.395], en: "There, yes, that's... there is, and that might be the way to go.", ja: "あるのよ、それ。それがいいかもね。" }
      - { who: c, t: [157.395, 164.645], en: "All right. Great idea. And then for luxury item, I would bring a coffee maker with some coffee.", ja: "よし、名案。それからぜいたく品は、コーヒーメーカーとコーヒー。" }
      - { who: c, t: [164.645, 170.655], en: "And I acknowledge that there might not be electricity, in which case I would bring, you know, like, a French press variety.", ja: "電気がないかもしれないのはわかってるので、その場合はフレンチプレスみたいなのにします。" }
      - { who: a, t: [170.655, 172.145], en: "Yes, that's... those are great.", ja: "いいわね、どれもすてき。" }
      - { who: d, t: [172.145, 175.565], en: "There is electricity. We're going to need it later.", ja: "電気はあるよ。あとで必要になるから。" }
      - { who: a, t: [175.565, 184.4], en: "I said all of your basic needs, like food, shelter, and clothing, are provided for you, so we're going to assume electricity is part of that. Great.", ja: "食べ物、住む所、服みたいな基本的なものは全部用意されてるって言ったでしょ。だから電気もそこに含まれることにしましょう。よし。" }
    questions:
      - { type: gist, ask: "何を している？", line: 2, choices: ["Planning a real vacation together on a tropical island after their training.", "Playing a game where each person picks three things to take to an island.", "Discussing the supplies that astronauts take into space."], answer: 1, cja: ["訓練のあと、南の島での本当の休暇をいっしょに計画している", "一人ずつ島に持って行く3つのものを選ぶゲームをしている", "宇宙に持って行く物資について話し合っている"], why: "無人島に1年、本・音楽・ぜいたく品を一つずつ持って行けるなら、という質問ゲーム。本当の旅行や宇宙の物資の話ではない。" }
      - { type: mean, ask: "voted off the island と 言うのは なぜ？", line: 10, choices: ["She plans to play her music too loudly at night on the island.", "A random album might annoy the others.", "She doesn't really care what kind of music she brings."], answer: 1, cja: ["島で夜に音楽を大音量でかけるつもりだから", "適当に選んだアルバムだと、みんなに嫌がられるかもしれないから", "どんな音楽を持って行くかはどうでもいいから"], why: "ジャケットだけで選ぶので、ひどい曲かもしれない。島から追い出される（voted off）は、みんなに嫌がられるかもという冗談。" }
      - { type: attitude, ask: "No guarantees と 言う メルの 気持ちは？", line: 19, choices: ["Proud: she thinks she's an excellent cook who never fails.", "Unwilling: she doesn't want to cook for anyone but herself.", "Modest: she loves cooking but can't promise it'll taste good."], answer: 2, cja: ["自信満々：失敗しない料理上手だと思っている", "気が進まない：自分以外のために料理したくない", "控えめ：料理は好きだが、おいしいとは約束できない"], why: "最初に I'm not very good at it と言っている。いつでも作るけど、味の保証はない、という控えめな冗談。" }
      - { type: next, ask: "ベンの 番は どう なりそう？", line: 33, choices: ["He'll pick the same coffee maker as Anna.", "He'll skip his turn because he can't decide.", "He'll choose something that needs electricity."], answer: 2, cja: ["アナと同じコーヒーメーカーを選ぶ", "決められず番を飛ばす", "電気が必要なものを選ぶ"], why: "We're going to need it later＝あとで電気が要る。自分の番で電気を使うものを選ぶつもりだとほのめかしている。" }
    dict:
      - { line: 13, words: "going to stretch", feature: gonna }
      - { line: 18, words: "for you to cook", feature: weak-form }
      - { line: 20, words: "why don't you", feature: yod }

  - kind: long
    id: rl-space-food
    name: 宇宙で 食べる 味
    source: real
    ctx: "NASAのポッドキャスト。食品研究者に話を聞く"
    note: "you live in Texas＝辛いもの好きをからかう"
    tags: { seed: 69, register: colleague, pragmatic: humour, features: [filler, kinda, dunno] }
    speakers:
      a: { name: "Gary (host)", ja: "ゲーリー（司会）", g: m }
      b: { name: "Takiyah", ja: "タキヤ", g: f }
    credit:
      title: "Space Food"
      by: "NASA Johnson Space Center: Houston We Have a Podcast, episode 4 (2017)"
      url: "https://www.nasa.gov/podcasts/houston-we-have-a-podcast/space-food/"
      file: "https://www.nasa.gov/wp-content/uploads/2023/07/ep4_space_food.mp3"
      sha256: "9e8561ae6439f6272fc6b8d2f8ad2ce02cf33fbae62bfdbba2e5540b5282d6e4"
      start: 836.95
      end: 1047.9
      licence: "Public domain (NASA: a work of the US federal government)"
      licenceUrl: "https://www.nasa.gov/nasa-brand-center/images-and-media/"
      attribution: "Audio: NASA Johnson Space Center, “Houston We Have a Podcast” episode 4, “Space Food”. Public domain. Excerpt, loudness-normalized and re-encoded."
    lines:
      - { who: a, t: [0.0, 5.725], en: "So you work in the food lab, so I'm assuming you've tried a bunch of the different meals.", ja: "食品ラボで働いてるってことは、いろんな食事を試してるんでしょうね。" }
      - { who: b, t: [5.725, 6.995], en: "I like food.", ja: "食べるのが好きなんです。" }
      - { who: a, t: [6.995, 9.465], en: "Yeah. So what are some of your favorites?", ja: "ですよね。じゃあ、お気に入りは？" }
      - { who: b, t: [9.465, 13.575], en: "I really like the meatloaf. I think it's really flavorful.", ja: "ミートローフが大好きです。すごく味がしっかりしてて。" }
      - { who: b, t: [13.575, 17.675], en: "It's better than the meatloaf that I make at home, which I don't know if that's saying a lot.", ja: "家で作るミートローフよりおいしいんです。それがほめ言葉になるかはわからないけど。" }
      - { who: b, t: [17.675, 23.315], en: "I'm really fond of anything sweet. So the dessert category, I'm always dipping in a dessert category.", ja: "甘いものなら何でも好き。だからデザートのカテゴリーにはいつも手を出しちゃう。" }
      - { who: b, t: [23.315, 27.165], en: "We have chocolate pudding cake, lemon curd cake, cherry blueberry cobbler.", ja: "チョコプディングケーキ、レモンカードケーキ、チェリーブルーベリーのコブラーがあって。" }
      - { who: b, t: [27.165, 29.205], en: "So those are probably some of my favorites.", ja: "そのあたりが好きですね。" }
      - { who: a, t: [29.205, 34.035], en: "I've tried the cherry blueberry cobbler. That one is really good. Really good.", ja: "チェリーブルーベリーのコブラー、食べました。あれは本当においしい。本当に。" }
      - { who: b, t: [34.035, 37.255], en: "Anything sweet, I think, is one of my favorites.", ja: "甘いものは全部好きかな。" }
      - { who: a, t: [37.255, 47.015], en: "So I know, but in space, I think it's a little bit different, because I guess there's something where the astronauts over time start to lose, I guess, a little bit of their taste sensitivity.", ja: "ただ、宇宙だと少し違うんですよね。宇宙飛行士はだんだん味覚が少し鈍くなるとか。" }
      - { who: a, t: [47.015, 50.475], en: "So they start to enjoy spicier foods.", ja: "それで辛いものを好むようになるそうで。" }
      - { who: a, t: [50.475, 51.975], en: "But is there a reason for that?", ja: "それには理由があるんですか？" }
      - { who: b, t: [51.975, 56.005], en: "So the perception of taste changes a little bit.", ja: "味の感じ方が少し変わるんです。" }
      - { who: b, t: [56.005, 59.735], en: "Number one, they're in microgravity. So there's a fluid shift.", ja: "まず、微小重力の中にいるので、体液が移動します。" }
      - { who: b, t: [59.735, 64.435], en: "And so it's kind of like eating with a head cold. There's still flavor there, but everything is muted.", ja: "だから鼻かぜをひいて食べているような感じ。味はあるけど、全部ぼんやりするんです。" }
      - { who: b, t: [64.435, 68.215], en: "And so the preference for spicy foods is because you can always taste spicy foods.", ja: "辛いものが好まれるのは、辛さならいつでも感じられるからです。" }
      - { who: b, t: [68.215, 72.485], en: "It gives you a little bit more kick. And so we always provide a variety of condiments.", ja: "ちょっとした刺激になる。だから調味料はいつもいろいろ用意しています。" }
      - { who: b, t: [72.485, 76.835], en: "They have pepper on station, not in a powder form, but... it's not in a granulated form.", ja: "ステーションにはこしょうもあります。粉じゃなくて…粒状じゃなくて。" }
      - { who: b, t: [76.835, 82.575], en: "I'm sorry. It's dissolved in an oil, so they can squeeze a drop and touch it to the product, and they can spice up their foods.", ja: "失礼。油に溶かしてあるので、一滴しぼって食べ物につけて、味を足せるんです。" }
      - { who: b, t: [82.575, 85.855], en: "We have a number of hot sauce. Hot sauce is always on the menu.", ja: "ホットソースもいくつかあります。ホットソースはいつもメニューに入ってる。" }
      - { who: b, t: [85.855, 86.835], en: "Different kinds of hot sauce.", ja: "いろんな種類のホットソース。" }
      - { who: a, t: [86.835, 89.575], en: "I love hot sauce. I would bring so much hot sauce if I went up to orbit.", ja: "ホットソース大好きです。もし宇宙に行くなら、山ほど持って行くな。" }
      - { who: b, t: [89.575, 94.035], en: "Well, you live in Texas, so that's understandable. So a lot of hot sauce will spice up their foods.", ja: "まあ、テキサスに住んでるんですもの、当然ね。それでホットソースで料理に刺激を足すんです。" }
      - { who: b, t: [94.035, 98.045], en: "One of the favorites is shrimp cocktail, because it has a spicy kick in it.", ja: "人気の一つはシュリンプカクテル。ピリッとした辛さがあるから。" }
      - { who: b, t: [98.045, 101.375], en: "And I guess anything spicy.", ja: "あとは辛いものなら何でも、かな。" }
      - { who: a, t: [101.375, 108.575], en: "Anything spicy. Yeah. Yeah. So how about sweet? Is sweet a little bit enhanced, or is the sweetness muted, so they add more sugar or something like that?", ja: "辛いもの全般ね。では甘さは？甘さは少し強く感じるのか、それとも弱まって砂糖を足したりするんですか？" }
      - { who: b, t: [108.575, 113.185], en: "I've not heard that they add more sugar, and I haven't had very many complaints about sweet products.", ja: "砂糖を足すという話は聞かないし、甘いものへの苦情もあまりないですね。" }
      - { who: b, t: [113.185, 118.895], en: "I think it comes down to a preference. If you like sweet products before you go into space, you'll still have a sweet tooth when you go into space, and vice versa.", ja: "結局は好みだと思います。宇宙に行く前に甘いものが好きなら、宇宙でも甘党のまま。逆も同じ。" }
      - { who: a, t: [118.895, 122.135], en: "Oh, okay. Wait, does preference change at all?", ja: "なるほど。待って、好みが変わることはあるんですか？" }
      - { who: b, t: [122.135, 127.815], en: "I've heard that preference does change. (Interesting.) So before any crew member goes into space, they sit down with our dietitian.", ja: "好みが変わるという話は聞きます。（へえ。）宇宙に行く前に、クルーはみんな栄養士と話し合うんです。" }
      - { who: b, t: [127.815, 131.985], en: "And we have one dietitian on staff who essentially shows them the entire menu.", ja: "スタッフに栄養士が一人いて、基本的にメニューを全部見せるんです。" }
      - { who: b, t: [131.985, 135.275], en: "So they'll work their way through all 200 different menu items.", ja: "200種類のメニューを全部、順番に試していくの。" }
      - { who: a, t: [135.275, 138.475], en: "That sounds like a great day. A great day.", ja: "最高の一日ですね。最高の一日。" }
      - { who: b, t: [138.475, 142.715], en: "But they do it over several days. So they'll come maybe four different times to have lunch with us.", ja: "でも何日かに分けてやるんです。4回くらい、私たちとランチに来る感じ。" }
      - { who: b, t: [142.715, 147.395], en: "And it's just so that they know what to expect, and they understand how the food is going to taste when they get into space.", ja: "何が出てくるか、宇宙でどんな味になるか、わかっておいてもらうためです。" }
      - { who: b, t: [147.395, 150.165], en: "Or hopefully how it's going to taste when they get into space.", ja: "というか、宇宙でそういう味だといいな、という味ね。" }
      - { who: b, t: [150.165, 154.055], en: "They rate all the products, and then items that are scored pretty high,", ja: "全部の品を採点してもらって、点数の高かったものは、" }
      - { who: b, t: [154.055, 159.575], en: "we add those to their crew-specific container, which is essentially like a bonus container.", ja: "そのクルー専用のコンテナに入れます。おまけのコンテナみたいなもの。" }
      - { who: b, t: [159.575, 163.955], en: "It's separate from the standard menu, so it's just for that particular crew member.", ja: "通常のメニューとは別で、その人だけのものです。" }
      - { who: b, t: [163.955, 168.405], en: "And we do that in case they really like one item and we don't provide enough of it", ja: "ある品がすごく気に入ったのに、こちらの用意が足りない場合に備えて、" }
      - { who: b, t: [168.405, 172.085], en: "in the standard menu. They can have some just for themselves.", ja: "通常メニューとは別に、自分だけの分を持てるようにしてるんです。" }
      - { who: b, t: [172.085, 177.435], en: "(All right.) And so we've heard that they come in to evaluate foods, and they score it really high.", ja: "（なるほど。）それで、試食に来てすごく高い点をつけたのに、" }
      - { who: b, t: [177.435, 180.385], en: "And then when they get into space, they're like, oh, I don't want this product anymore. (Really?)", ja: "宇宙に行ったら「もうこれ要らない」ってなることもあるそうで。（本当に？）" }
      - { who: b, t: [180.385, 182.445], en: "It's really hard to accommodate that.", ja: "それに対応するのは本当に難しいんです。" }
      - { who: a, t: [182.445, 190.305], en: "Wow. That would stink if you really enjoyed one item, and you're like, for example, the cherry blueberry cobbler.", ja: "うわあ。それはつらいですね。ある品がすごく好きで、たとえばチェリーブルーベリーのコブラーとか。" }
      - { who: a, t: [190.305, 193.335], en: "And you're like, oh, that's my favorite dessert, and I'm going to have a bunch of that.", ja: "「これが一番好きなデザートだから、たくさん持って行こう」って思って。" }
      - { who: a, t: [193.335, 197.145], en: "And then you put it in your personal, and you take up all this space, and then you're like, I really don't want it.", ja: "で、自分用のコンテナに入れて場所を取ったのに、「やっぱり要らない」ってなったら。" }
      - { who: a, t: [197.145, 199.545], en: "I've had too much cherry blueberry cobbler.", ja: "「チェリーブルーベリーのコブラーはもうたくさん」って。" }
      - { who: b, t: [199.545, 200.745], en: "Yeah, well, I mean, you live and you learn.", ja: "まあ、失敗から学ぶものですから。" }
      - { who: a, t: [200.745, 202.405], en: "Yeah, I guess.", ja: "そうですね。" }
      - { who: b, t: [202.405, 209.515], en: "But they trade a lot of foods on Space Station. So if you said that you wanted one product, and it doesn't taste the same when you get into space, I'm sure someone else would like that product.", ja: "でもステーションでは食べ物をよく交換するんです。だから欲しかった品が宇宙で同じ味じゃなくても、きっとほかの誰かが欲しがります。" }
      - { who: b, t: [209.515, 210.95], en: "So it works out, usually.", ja: "だから、たいていうまくいくんです。" }
    questions:
      - { type: gist, ask: "主に 何の 話？", line: 13, choices: ["How astronauts' sense of taste and food choices change in space.", "Why astronauts aren't allowed to eat sweets in orbit.", "How to cook the station's meatloaf and cobbler at home."], answer: 0, cja: ["宇宙で宇宙飛行士の味覚や食べ物の好みがどう変わるか", "宇宙飛行士が軌道上で甘いものを禁止されている理由", "ステーションのミートローフとコブラーを家で作る方法"], why: "微小重力で味がぼやけるので辛いものが好まれる、事前に試食して好きな品を個人用に入れる、宇宙で好みが変わる、という話。" }
      - { type: mean, ask: "like eating with a head cold とは？", line: 15, choices: ["Astronauts often catch colds from the food.", "Food still has flavor, but it's muted.", "Food in space has to be eaten hot to taste like anything."], answer: 1, cja: ["宇宙飛行士は食べ物でよくかぜをひく", "味はあるが、ぼんやりする", "宇宙の食べ物は温かくないと味がしない"], why: "鼻かぜのときのように There's still flavor there, but everything is muted。味はあるがぼんやりする、というたとえ。" }
      - { type: mean, ask: "Well, you live in Texas と 言ったのは？", line: 23, choices: ["She means he can't fly to space from Texas.", "She's reminding him that hot sauce comes from Texas.", "She's teasing him: Texans are known for loving spicy food."], answer: 2, cja: ["テキサスからは宇宙に行けないという意味", "ホットソースはテキサス産だと教えている", "テキサスの人は辛いもの好きで有名、とからかっている"], why: "ホットソースを山ほど持って行くと言った司会に、テキサス住まいなら当然ね（that's understandable）と軽くからかっている。" }
      - { type: attitude, ask: "宇宙で 好みが 変わる 話に 司会は どう 反応する？", line: 45, choices: ["He thinks the astronauts are being too picky.", "He sympathizes, imagining getting sick of a favorite dessert.", "He's surprised the kitchen lets them choose their own food at all."], answer: 1, cja: ["宇宙飛行士がわがままだと思っている", "好きなデザートに飽きる自分を想像して同情している", "自分で食べ物を選ばせてもらえること自体に驚いている"], why: "That would stink＝それはつらい。好物のコブラーを場所を取って持って行ったのに飽きたら、と自分に置き換えて同情している。" }
      - { type: next, ask: "要らなく なった 食べ物は ふつう どう なる？", line: 51, choices: ["It goes back to Earth on the next cargo flight.", "Someone else on the station takes it in a trade.", "The dietitian replaces it with a new item from the menu."], answer: 1, cja: ["次の補給便で地球に戻される", "ステーションのほかの誰かと交換する", "栄養士がメニューの別の品と取り替える"], why: "they trade a lot of foods on Space Station＝ステーションではよく食べ物を交換する。ほかの誰かが欲しがるので、たいていうまくいく。" }
    dict:
      - { line: 4, words: "I don't know", feature: dunno }
      - { line: 15, words: "kind of like eating", feature: kinda }
      - { line: 46, words: "going to have a bunch", feature: gonna }

