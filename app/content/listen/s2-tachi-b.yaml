items:
  - kind: tachi
    id: tachi-leaving-gift
    ask: "ターゲットで 同僚への プレゼントを 決めている"
    scene: street
    lines:
      - { who: maple, at: 0, en: "Okay, Dana's going-away party is Friday, and we're standing in Target with no plan. I was thinking a nice bottle of wine.", ja: "さて、ダナの送別会は金曜なのに、ノープランでターゲットに立ってるわけ。いいワインを考えてたんだけど。" }
      - { who: beau, at: 0.3, en: "She doesn't drink, though, does she? I've never seen her have anything stronger than iced tea.", tts: "She doesn't drink, though, does she? I've never seen 'er have anything stronger than iced tea.", ja: "でも彼女、飲まないよね？アイスティーより強いものを飲んでるところ、見たことないよ。" }
      - { who: ken, at: -0.2, en: "Yeah, no, wine's a bad call. And not a gift card, either. That's what you get your mail carrier.", tts: "Yeah, no, wine's a bad call. An' not a gift card, either. That's whatcha get yer mail carrier.", ja: "うん、いや、ワインはやめたほうがいい。ギフトカードもなしね。それって郵便屋さんにあげるものだよ。" }
      - { who: maple, at: 0.3, en: "Ugh, but a gift card's so easy. There's a whole wall of them right there, by checkout.", tts: "Ugh, but a gift card's so easy. There's a whole wall of 'em right there, by checkout.", ja: "えー、でもギフトカードって楽なのに。レジの横に壁一面あるし。" }
      - { who: beau, at: 0.3, en: "She's moving to Denver for the hiking, isn't she? Get her something for that. Camping stuff's in the back.", tts: "She's movin' to Denver for the hiking, isn't she? Get 'er something for that. Camping stuff's in the back.", ja: "彼女、山歩きのためにデンバーに引っ越すんだよね？それ用のものにしよう。キャンプ用品は奥だよ。" }
      - { who: ken, at: -0.4, en: "Ooh, a good thermos. And the place in the mall can engrave the team name on it.", tts: "Ooh, a good thermos. An' the place in the mall can engrave the team name on it.", ja: "お、いい水筒ね。モールの店でチーム名を彫ってもらえるし。" }
      - { who: maple, at: 0.3, en: "Okay, I'm sold. A thermos from here, engraved at the mall. If we drop it off today, it's ready Thursday.", ja: "わかった、それで決まり。ここで水筒を買って、モールで名入れ。今日持っていけば木曜にできる。" }
      - { who: ken, at: 0.2, en: "You're the best. I'll grab a card and get everyone to sign it.", ja: "さすが。カードを買って、みんなに寄せ書きしてもらうよ。" }
    rounds:
      - { type: opinions, claims: ["彼女は お酒を 飲まない", "ギフトカードは 気持ちが こもらない", "今日 持っていけば 木曜に できる"], answer: [beau, ken, maple], ctx: "量販店で、同僚3人が送別の贈り物を探しています", why: "ボーは She doesn't drink。ケンは not a gift card で、気持ちがこもらない派。メイプルは今日持っていけば木曜にできると言う。" }
      - { type: changed, answer: maple, ctx: "ワイン、ギフトカードと、案が変わっていきます", why: "メイプルはワイン、次にギフトカードと言ったが、水筒の案に Okay, I'm sold＝それで決まり。sold は「納得した」。" }
      - { type: plan, ask: "プレゼントは？", choices: ["A bottle of good wine.", "A thermos from here, engraved at the mall.", "A gift card from the wall by checkout."], answer: 1, ja: "ここで買った水筒に、モールで名入れする。", ctx: "最後に、贈り物と準備の分担が決まります", why: "ここで水筒を買い、モールで名入れする。ケンは寄せ書きのカードを買う。ワインもギフトカードも却下。", cja: ["いいワインを1本", "ここで買った水筒に、モールで名入れ", "レジ横のギフトカード"] }
    note: "Yeah, no＝いや、ちがう。I'm sold＝賛成"
    tags: { seed: 54, register: colleague, pragmatic: attitude, features: [overlap, h-drop, idiom] }

  - kind: tachi
    id: tachi-bootcamp
    ask: "朝の トレーニングに さそっている"
    scene: cafe
    lines:
      - { who: kicks, at: 0, en: "So, are we doing the six a.m. bootcamp in Yoyogi or not? It's only ¥3,000 a month.", tts: "So, are we doin' the six a m bootcamp in Yoyogi or not? It's only three thousand a month.", ja: "で、代々木の朝6時のブートキャンプ、やるの？やらないの？月3000円だけだよ。" }
      - { who: bunnie, at: 0.3, en: "I'm so in. I need something to get me out of bed.", ja: "絶対やる。ベッドから出るきっかけが欲しいの。" }
      - { who: katt, at: 0.3, en: "That sounds really fun. I'll definitely think about it.", ja: "楽しそうだね。ぜひ考えてみる。" }
      - { who: kicks, at: -0.3, en: "That's a no, isn't it?", ja: "それ、ノーってことでしょ？" }
      - { who: katt, at: 0.3, en: "It's not a no! It's just... six a.m. In January. Outside.", tts: "It's not a no! It's just... six a m. In January. Outside.", ja: "ノーじゃないよ！ただ…朝6時でしょ。1月に。外で。" }
      - { who: bunnie, at: 0.3, en: "There's an indoor option on rainy days, and the first week's free.", tts: "There's an indoor option on rainy days, an' the first week's free.", ja: "雨の日は室内でやるし、最初の1週間は無料だよ。" }
      - { who: katt, at: -0.4, en: "Free? Well, that's different. Fine, I'll come for the free week and see.", ja: "無料？それなら話は別。いいよ、無料の週だけ行ってみる。" }
      - { who: kicks, at: 0.2, en: "Ha! Monday, six sharp. I'll pick you both up at a quarter to.", tts: "Ha! Monday, six sharp. I'll pick ya both up at a quarter to.", ja: "やった！月曜6時ぴったりね。2人とも5時45分に迎えに行くよ。" }
    rounds:
      - { type: opinions, claims: ["「考えてみる」は 断りだと 見ぬいた", "朝 起きる きっかけが ほしい", "冬の 朝6時に 外は きつい"], answer: [kicks, bunnie, katt], ctx: "カフェで、友だちが朝のトレーニングに誘っています", why: "キックスは That's a no, isn't it? で断りを見抜いた。バニーは get me out of bed。キャットは冬の朝6時に外はきつい。" }
      - { type: changed, answer: katt, ctx: "乗り気でなかった人に、新しい情報が届きます", why: "キャットの I'll definitely think about it は遠回しの断り。最初の1週間は無料と聞いて that's different に変わった。" }
      - { type: plan, ask: "月曜の 朝は？", choices: ["Only two of them go, at six.", "They'll try the indoor class on a rainy day.", "All three go, and one picks the others up at 5:45."], answer: 2, ja: "3人とも行く。1人が5時45分に迎えに行く。", ctx: "最後に、月曜の朝の段取りが決まります", why: "Monday, six sharp で3人とも行く。a quarter to＝6時の15分前で、5時45分に迎えに行く。", cja: ["2人だけが6時に行く", "雨の日に室内クラスを試す", "3人とも行き、1人が5時45分に迎えに行く"] }
    note: "I'll think about it は断りのことが多い"
    tags: { seed: 18, register: friend, pragmatic: refusal, conditions: [cafe], features: [overlap, intonation, clock] }

  - kind: tachi
    id: tachi-fireworks-rain
    ask: "花火大会に 行くか 話している"
    scene: living
    lines:
      - { who: audie, at: 0, en: "The forecast says a 70% chance of rain on Saturday. Are we still going to the fireworks?", tts: "The forecast says a seventy percent chance of rain on Saturday. Are we still goin' to the fireworks?", ja: "土曜の降水確率70%だって。それでも花火大会行く？" }
      - { who: kid-cat, at: 0.3, en: "Of course we are. They only cancel for a real storm. A little drizzle never stopped anybody.", ja: "もちろん行くよ。中止になるのは本格的な嵐のときだけ。霧雨くらいで誰もやめないって。" }
      - { who: octavian, at: -0.2, en: "Standing in a wet yukata for two hours with a million people? Can't wait.", tts: "Standin' in a wet yukata for two hours with a million people? Can't wait.", ja: "濡れた浴衣で100万人と2時間立ちっぱなし？楽しみで仕方ないね。" }
      - { who: audie, at: 0.3, en: "He's got a point. Last year the trains afterward were a nightmare, even when it was dry.", ja: "一理あるよ。去年は晴れてても帰りの電車が地獄だったし。" }
      - { who: kid-cat, at: 0.3, en: "Okay, how about this. My buddy has an apartment in Asakusa with a balcony. You can see the whole thing from there.", tts: "Okay, how 'bout this. My buddy has an apartment in Asakusa with a balcony. Ya can see the whole thing from there.", ja: "じゃあこうしよう。友だちが浅草にベランダ付きの部屋を持ってるんだ。そこから全部見えるよ。" }
      - { who: octavian, at: -0.4, en: "A balcony? With a roof? Okay, I'm in. I'll bring snacks.", ja: "ベランダ？屋根付き？よし、行く。お菓子持っていくよ。" }
      - { who: audie, at: 0.3, en: "I'll check the official site Saturday morning. If it's called off, we'll just get takeout at his buddy's place.", tts: "I'll check the official site Saturday morning. If it's called off, we'll just get takeout at 'is buddy's place.", ja: "土曜の朝、公式サイトを確認するね。中止なら、その友だちの家でテイクアウトにしよう。" }
      - { who: kid-cat, at: 0.2, en: "Done deal.", ja: "決まり。" }
    rounds:
      - { type: opinions, claims: ["少しの 雨なら 平気", "屋根が あるなら 行く", "帰りの 電車が 心配"], answer: [kid-cat, octavian, audie], ctx: "家で、友だち3人が雨の予報と花火大会の話をしています", why: "キッドキャットは A little drizzle は平気。オクタヴィアンは屋根付きなら I'm in。オーディーは帰りの電車が a nightmare。" }
      - { type: changed, answer: octavian, ctx: "見る場所について、新しい案が出てきます", why: "オクタヴィアンの Can't wait は皮肉で、行きたくない。屋根付きのベランダと聞いて Okay, I'm in に変わった。" }
      - { type: plan, ask: "土曜は どうする？", choices: ["Watch from a friend's balcony in Asakusa.", "Stand by the river in yukata.", "Stay home and watch it on TV."], answer: 0, ja: "浅草の友だちの部屋のベランダから見る。", ctx: "最後に、土曜の見方が決まります", why: "浅草の友だちのベランダから見る。中止なら、その部屋でテイクアウト。川沿いで立つ案は皮肉で却下された。", cja: ["浅草の友だちのベランダから見る", "浴衣で川沿いに立って見る", "家でテレビで見る"] }
    note: "Can't wait は皮肉。濡れて立つのは嫌という意味"
    tags: { seed: 50, register: friend, pragmatic: sarcasm, features: [overlap, numbers, h-drop] }

  - kind: tachi
    id: tachi-noisy-neighbour
    ask: "マンションの 住人が 話している"
    scene: door
    lines:
      - { who: poppy, at: 0, en: "Did either of you hear the guy in 405 last night? Drilling. At midnight.", tts: "Did either of you hear the guy in four-oh-five last night? Drilling. At midnight.", ja: "昨日の夜、405号室の人の音聞こえた？ドリル。夜中の12時に。" }
      - { who: maple, at: 0.3, en: "I did. I was going to go up and say something, but I didn't want to make it awkward.", tts: "I did. I was gonna go up an' say something, but I didn't wanna make it awkward.", ja: "聞こえた。上に行って何か言おうかと思ったけど、気まずくしたくなくて。" }
      - { who: tom-nook, at: -0.3, en: "Honestly, I'd just leave a note at the management office. Let them deal with it.", tts: "Honestly, I'd just leave a note at the management office. Let 'em deal with it.", ja: "正直、管理事務所にメモを残すだけでいいと思うよ。向こうに対応してもらえば。" }
      - { who: poppy, at: 0.3, en: "A note? He'll never know it's about him. I say we just knock on his door.", tts: "A note? He'll never know it's about 'im. I say we just knock on 'is door.", ja: "メモ？自分のことだって気づかないよ。直接ドアをノックすればいいと思う。" }
      - { who: maple, at: 0.3, en: "I'd rather not knock. He's huge.", ja: "ノックはちょっと…。すごく大きい人なのよ。" }
      - { who: tom-nook, at: 0.3, en: "He's actually really nice. He helped me carry my bike up last week. He probably just doesn't realize how thin the walls are.", ja: "実はすごくいい人だよ。先週、自転車を上まで運ぶのを手伝ってくれた。壁の薄さに気づいてないだけじゃないかな。" }
      - { who: maple, at: -0.4, en: "Oh. Well, if he's nice... maybe a friendly word is better than a note, then.", ja: "あら。いい人なら…メモより直接やんわり言ったほうがいいかもね。" }
      - { who: poppy, at: 0.2, en: "Great. We'll go up together after work. Safety in numbers.", ja: "よし。仕事のあと、一緒に行こう。人数がいれば安心。" }
    rounds:
      - { type: opinions, claims: ["直接 ドアを ノックすべき", "管理事務所に メモで いい", "気まずく したくない"], answer: [poppy, tom-nook, maple], ctx: "マンションで、住人3人が上の階の騒音の話をしています", why: "ポピーは knock on his door（直接ノック）。トム・ヌックは管理事務所に note。メイプルは make it awkward（気まずく）したくない。" }
      - { type: changed, answer: maple, ctx: "騒音の主について、意外な話が出てきます", why: "メイプルは I'd rather not knock と嫌がっていたが、いい人だと聞いて a friendly word is better に変えた。" }
      - { type: plan, ask: "どうする？", choices: ["They'll leave a note at the management office.", "They'll go and talk to him together after work.", "They'll wait and see if it happens again."], answer: 1, ja: "仕事のあと、一緒に直接話しに行く。", ctx: "最後に、どう伝えるかが決まります", why: "We'll go up together after work＝仕事のあと一緒に上へ行く。Safety in numbers＝人数がいれば安心。メモの案は採らない。", cja: ["管理事務所にメモを残す", "仕事のあと、一緒に直接話しに行く", "また起きるか様子を見る"] }
    note: "I'd rather not＝できれば嫌。遠回しな拒否"
    tags: { seed: 32, register: neighbour, pragmatic: indirect, features: [overlap, gonna, h-drop] }

  - kind: tachi
    id: tachi-credit-stolen
    ask: "友だちが 仕事の ぐちを 言っている"
    scene: cafe
    lines:
      - { who: label, at: 0, en: "So guess whose name was on the slides at the board meeting. Not mine.", ja: "ねえ、役員会議のスライドに誰の名前が載ってたと思う？私じゃないの。" }
      - { who: rosie, at: 0.3, en: "No way! Your manager's? After you stayed till ten every night?", ja: "うそ！上司の？毎晩10時まで残ってたのに？" }
      - { who: bob, at: -0.2, en: "Classic. You should email the director. Just, like, casually mention it was your work.", tts: "Classic. You should email the director. Just, like, casually mention it was yer work.", ja: "あるあるだね。部長にメールすればいいよ。さりげなく自分の仕事だって書いてさ。" }
      - { who: rosie, at: 0.3, en: "Hmm, I'd talk to the manager first. Going over her head could backfire.", tts: "Hmm, I'd talk to the manager first. Goin' over 'er head could backfire.", ja: "うーん、私ならまず上司と話すかな。頭越しにやると裏目に出るかも。" }
      - { who: label, at: 0.3, en: "Ugh, I hate confrontation. I was just going to let it go.", tts: "Ugh, I hate confrontation. I was just gonna let it go.", ja: "うわ、対立って苦手。そのまま流そうと思ってたのに。" }
      - { who: bob, at: -0.4, en: "If you let it go, she'll do it again. Trust me.", ja: "流したら、またやられるよ。ほんとに。" }
      - { who: label, at: 0.3, en: "Yeah... you're right. Okay. I'll ask her for a quick chat tomorrow. Not an angry one, just... a chat.", ja: "そうだよね…その通り。わかった。明日ちょっと話す時間をもらう。怒るんじゃなくて…話すだけ。" }
      - { who: rosie, at: 0.2, en: "Good for you. And keep your old drafts. Just in case.", tts: "Good for you. An' keep yer old drafts. Just in case.", ja: "えらい。それと、前の下書きは取っておいてね。念のため。" }
    rounds:
      - { type: opinions, claims: ["部長に メールすべき", "まず 上司と 話すべき", "対立は 苦手"], answer: [bob, rosie, label], ctx: "カフェで、友だち2人が職場のぐちを聞いています", why: "ボブは部長にメール。ロージーは talk to the manager first（まず上司）。レイベルは I hate confrontation（対立は苦手）。" }
      - { type: changed, answer: label, ctx: "流すか動くか、本人の気持ちが揺れます", why: "レイベルは I was just going to let it go と流すつもりだったが、またやられると言われて you're right に変わった。" }
      - { type: plan, ask: "あした どうする？", choices: ["She'll email the director about the slides.", "She'll let it go this time.", "She'll have a calm chat with her manager."], answer: 2, ja: "上司と落ち着いて話す。", ctx: "最後に、明日することが決まります", why: "I'll ask her for a quick chat＝上司と少し話す。Not an angry one＝怒るのではない。部長へのメールはボブの案で、採らなかった。", cja: ["スライドの件を部長にメールする", "今回は流す", "上司と落ち着いて話す"] }
    note: "go over her head＝頭越しに上へ訴える"
    tags: { seed: 57, register: friend, pragmatic: attitude, conditions: [cafe], features: [overlap, h-drop, gonna] }
