# まるごと 聞く S4 ほし (a): travel, generated. Three 2-4 minute scenes with three speakers each: a hotel problem in
# the middle of the night, a delayed flight and a missed connection, a haggle at a flea market. The meaning is implied,
# not signposted (a refusal said politely, sarcasm, a sales trick); people interrupt and talk over each other (a
# negative `at`); a light Southern (us-f6) and a light New York voice (us-m6) among them. Questions: the gist, the
# implied meaning, the attitude, the next step; dictation lines on the connected speech.
schema: 1
unit: s4-long-a
game: long
stage: 5
track: life
