          - { ask: "お店は？", options: ["パイン通りの イタリアン", "パイン通りの タイ料理", "駅前の イタリアン"], answer: 0, cja: ["パイン通りのイタリア料理の店", "パイン通りのタイ料理の店", "駅前のイタリア料理の店"] }
