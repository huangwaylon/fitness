      - { who: me, en: "Okay. Can you narrow that down at all?", ja: "わかりました。もう少し絞れませんか？" }
      - { who: tammy, en: "Sorry, that's the window. But I'll have him text you when he's on his way. And just so you know, the visit's eighty-five, but it goes toward the repair.", tts: "Sorry, that's the window. But I'll have 'im text ya when 'e's on 'is way. An' just so ya know, the visit's eighty-five, but it goes toward the repair.", ja: "すみません、その時間帯になります。でも、向かうときに本人からメッセージを送らせます。それと、出張費は85ドルですが、修理代に充てられます。" }
