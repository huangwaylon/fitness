      - { who: tammy, en: "Someone over eighteen has to be there, yeah.", ja: "はい、18歳以上の方がいらっしゃる必要があります。" }
      - { who: tammy, en: "Oh, hang on. I'm seeing the part's on back order, so it won't be Thursday. Let's make it Friday, same window.", tts: "Oh, hang on. I'm seein' the part's on back order, so it won't be Thursday. Let's make it Friday, same window.", ja: "あ、少々お待ちください。部品が取り寄せ中なので、木曜は無理ですね。金曜の同じ時間帯にしましょう。", repair: true }
      - { who: me, en: "Friday, eight to noon. That works.", ja: "金曜の8時から12時ですね。大丈夫です。" }
