  - kind: call
    id: call-dinner-six
    ask: "チェリーから 電話。メモしよう"
    ctx: "土曜の夕食を予約した友だちから電話です"
    scene: living
    channel: phone
    lines:
      - { who: cherry, en: "Hey! So I booked dinner for Saturday. Rosa's, the Italian place on Pine Street. Seven-thirty, for five of us.", tts: "Hey! So I booked dinner fer Saturday. Rosa's, the Italian place on Pine Street. Seven-thirty, fer five of us.", ja: "もしもし！ 土曜の夕食、予約したよ。パイン通りのイタリアン、ローザズ。7時半に5人で。" }
      - { who: me, en: "Nice! Who's coming?", ja: "いいね！ 誰が来るの？" }
      - { who: cherry, en: "You, me, Punchy, Judy and Kid Cat. Oh, and Kid Cat's allergic to nuts, so remind the server, 'cause I'll forget.", tts: "You, me, Punchy, Judy an' Kid Cat. Oh, an' Kid Cat's allergic ta nuts, so remind the server, 'cause I'll forget.", ja: "あなた、私、パンチー、ジュディ、キッド・キャット。あ、キッド・キャットはナッツのアレルギーだから、店員さんに言ってね。私、忘れちゃうから。" }
      - { who: me, en: "Got it. Nuts. Anything else?", ja: "了解、ナッツね。ほかには？" }
      - { who: cherry, en: "Oh, Judy just texted. She's bringing her sister, so we're six now. And they can't do six at seven-thirty.", tts: "Oh, Judy just texted. She's bringin' her sister, so we're six now. An' they can't do six at seven-thirty.", ja: "あ、今ジュディからメッセージ。妹を連れてくるから、6人になった。でもお店、7時半に6人は無理なんだって。", repair: true }
      - { who: cherry, en: "So I moved it to eight-fifteen. Sorry, I know that's kind of late.", tts: "So I moved it ta eight-fifteen. Sorry, I know that's kinda late.", ja: "だから8時15分にずらした。ごめん、ちょっと遅いよね。" }
      - { who: me, en: "Eight-fifteen's fine. See you there!", ja: "8時15分で大丈夫。じゃあお店で！" }
    half: [0, 0, 0, 0, 1, 1, 1]
