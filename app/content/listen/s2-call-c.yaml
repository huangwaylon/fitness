    ask: "ダイアナから 電話。メモしよう"
    ctx: "友だちの結婚式の前に、付き添い役から電話です"
    scene: living
    channel: phone
    lines:
      - { who: diana, en: "Hey, it's Diana! Quick wedding stuff. You're coming to the rehearsal dinner Friday, right? It's at seven, at Luigi's.", tts: "Hey, it's Diana! Quick weddin' stuff. You're comin' to the rehearsal dinner Friday, right? It's at seven, at Luigi's.", ja: "もしもし、ダイアナ！ 結婚式のことでちょっとだけ。金曜の前夜の食事会、来るよね？ 7時、ルイージの店で。" }
      - { who: me, en: "Yep, I'll be there. What should I wear on Saturday?", ja: "うん、行くよ。土曜は何を着ればいい？" }
      - { who: diana, en: "Cocktail attire. Oh, and the shuttle to the ceremony leaves from the hotel lobby at three-fifteen. It won't wait, so don't be late.", tts: "Cocktail attire. Oh, an' the shuttle to the ceremony leaves from the hotel lobby at three-fifteen. It won't wait, so don't be late.", ja: "少しきちんとした服で。あ、それと式場行きのシャトルはホテルのロビーから3時15分に出るよ。待ってくれないから遅れないでね。" }
      - { who: me, en: "Three-fifteen, the lobby. Got it. Should I bring anything?", ja: "3時15分、ロビーね。了解。何か持っていったほうがいい？" }
      - { who: diana, en: "Nope. If you wanna get them something, just use the registry. They'll ship it to the house.", tts: "Nope. If ya wanna get 'em somethin', just use the registry. They'll ship it to the house.", ja: "ううん。何か贈りたいなら、ほしい物リストを使って。家に届けてくれるから。" }
      - { who: diana, en: "Oh, wait, sorry. Molly just texted me. The rehearsal dinner's at six-thirty now, not seven. Her parents have an early flight.", tts: "Oh, wait, sorry. Molly just texted me. The rehearsal dinner's at six-thirty now, not seven. Her parents've got an early flight.", ja: "あ、待って、ごめん。今モリーからメッセージが来た。食事会は7時じゃなくて6時半になったって。ご両親の飛行機が朝早いから。", repair: true }
      - { who: me, en: "Six-thirty at Luigi's. See you Friday!", ja: "6時半にルイージの店ね。じゃあ金曜に！" }
