  - kind: call
    id: call-doctor-chart
    ask: "クリニックから 電話。メモしよう"
    ctx: "診察の翌日、クリニックから電話です"
    scene: living
    channel: phone
    lines:
      - { who: pashmina, en: "Hi, this is Pashmina from Dr. Julian's office. I'm calling about your prescription and your follow-up.", tts: "Hi, this is Pashmina from Dr. Julian's office. I'm callin' about yer prescription an' yer follow-up.", ja: "もしもし、ジュリアン先生のクリニックのパシュミナです。お薬と、次の診察の件でお電話しました。" }
      - { who: me, en: "Oh, great. Thanks for calling.", ja: "あ、どうも。お電話ありがとうございます。" }
      - { who: pashmina, en: "So, we sent the prescription to the pharmacy on Main Street. It's one tablet twice a day, for seven days.", tts: "So, we sent the prescription ta the pharmacy on Main Street. It's one tablet twice a day, fer seven days.", ja: "お薬はメイン通りの薬局に送りました。1回1錠、1日2回、7日間です。" }
      - { who: me, en: "Okay. And when should I come back?", ja: "わかりました。次はいつ行けばいいですか？" }
      - { who: pashmina, en: "He wants to see you in two weeks. The soonest we have is Thursday the twentieth, at nine-fifteen.", tts: "He wants ta see you in two weeks. The soonest we have is Thursday the twentieth, at nine-fifteen.", ja: "先生は2週間後に診たいそうです。いちばん早いのは20日の木曜、9時15分です。" }
      - { who: pashmina, en: "Oh, sorry, I was looking at the wrong chart. Yours is for ten days, not seven. And it went to the pharmacy by the station, not Main Street.", tts: "Oh, sorry, I was lookin' at the wrong chart. Yours is fer ten days, not seven. An' it went to the pharmacy by the station, not Main Street.", ja: "あ、すみません、別の方のカルテを見ていました。あなたのは7日ではなく10日間です。それと、お薬はメイン通りではなく、駅のそばの薬局に送っています。", repair: true }
      - { who: me, en: "Ten days, the one by the station, and Thursday at nine-fifteen. Got it.", ja: "10日間、駅のそばの薬局、それと木曜の9時15分ですね。わかりました。" }
    half: [0, 0, 0, 0, 1, 1, 1]
    memo:
      - why: "別の人のカルテを見ていたと訂正。薬は7日ではなく10日間で、送り先は駅のそばの薬局。飲み方は1日2回。次の診察は20日の木曜、9時15分。"
        slots:
          - { ask: "何日間 飲む？", options: ["7日間", "10日間", "14日間"], answer: 1, cja: ["7日間", "10日間", "14日間"] }
          - { ask: "1日 何回？", options: ["1回", "2回", "3回"], answer: 1, cja: ["1日1回", "1日2回", "1日3回"] }
