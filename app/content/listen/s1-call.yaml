    channel: phone
    lines:
      - { who: coco, en: "Hi, it's Coco from Bayside Dental. I'm calling about your appointment on Thursday.", ja: "ベイサイド歯科のココです。木曜日のご予約の件でお電話しました。" }
      - { who: coco, en: "Unfortunately Dr Lee's off sick, so we need to move you. Would Tuesday at a quarter past three work?", tts: "Unfortunately Doctor Lee's off sick, so we need ta move you. Would Tuesday at a quarter past three work?", ja: "あいにくリー先生が病欠でして、ご予約を移させていただきたいんです。火曜の3時15分はいかがですか？" }
      - { who: me, en: "Tuesday afternoon's tricky. Have you got anything in the morning?", ja: "火曜の午後はちょっと厳しくて。午前中は空いてますか？" }
      - { who: coco, en: "Let me see... Wednesday at ten forty? Oh, no, sorry, that's just gone. Friday at ten forty, then.", tts: "Lemme see... Wednesday at ten forty? Oh, no, sorry, that's just gone. Friday at ten forty, then.", ja: "ええと…水曜の10時40分は？あ、いえ、すみません、今埋まってしまいました。では金曜の10時40分で。", repair: true }
      - { who: me, en: "Friday's fine.", ja: "金曜で大丈夫です。" }
      - { who: coco, en: "Lovely. And since we moved it, there's no change fee, of course. Just come in ten minutes early to fill in a form.", tts: "Lovely. An' since we moved it, there's no change fee, of course. Just come in ten minutes early ta fill in a form.", ja: "よかったです。こちらの都合なので、もちろん変更手数料はかかりません。問診票の記入があるので10分前にお越しください。" }
    half: [0, 0, 0, 1, 1, 1]
    memo:
