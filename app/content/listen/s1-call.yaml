  - kind: call
    id: call-film-rebook
    ask: "友だちから でんわ。チケットを 取りなおす"
    scene: living
    channel: phone
    lines:
      - { who: kid-cat, en: "Hey, so, bad news. My train's stuck outside Shinagawa. Some kind of signal problem.", tts: "Hey, so, bad news. My train's stuck outside Shinagawa. Some kinda signal problem.", ja: "ねえ、悪い知らせ。電車が品川の手前で止まってて。信号トラブルか何かみたい。" }
      - { who: me, en: "Oh no. The film starts at seven.", ja: "うそ。映画7時からだよ。" }
      - { who: kid-cat, en: "Yeah, I know. I'm not going to make seven. Is there a later showing, by any chance?", tts: "Yeah, I know. I'm not gonna make seven. Is there a later showing, by any chance?", ja: "うん、わかってる。7時には間に合わない。もしかして、遅い回ってある？" }
      - { who: me, en: "There's one at nine fifteen.", ja: "9時15分のがあるよ。" }
      - { who: kid-cat, en: "Nine fifteen... Actually, no, I've got an early start tomorrow. Could we just do tomorrow at seven instead?", ja: "9時15分か…いや、やっぱり明日朝早いんだ。明日の7時にできない？", repair: true }
      - { who: kid-cat, en: "And, um, those recliner seats were kind of pricey, weren't they? Just saying.", tts: "An', um, those recliner seats were kinda pricey, weren't they? Just sayin'.", ja: "それと、えーと、リクライナー席ってけっこう高かったよね？いや、言ってみただけ。" }
      - { who: me, en: "Ha, okay. Regular seats it is.", ja: "はは、了解。普通の席にするね。" }
