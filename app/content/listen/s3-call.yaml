      - { who: maple, en: "Thank you. So I can see we put a hold on your card this morning. There was a charge from an electronics store in Lisbon, for €189.", tts: "Thank you. So I can see we put a hold on yer card this morning. There was a charge from an electronics store in Lisbon, for a hundred eighty-nine euros.", ja: "ありがとうございます。今朝、お客様のカードを一時停止しております。リスボンの家電店から189ユーロの請求がありまして。" }
      - { who: me, en: "That wasn't me. I've never even been to Portugal.", ja: "それは私じゃありません。ポルトガルに行ったこともないです。" }
      - { who: maple, en: "Okay, so I'll cancel that card and send you a new one. It'll go to your address in Setagaya, and it should be there in five to seven business days.", tts: "Okay, so I'll cancel that card an' send ya a new one. It'll go ta yer address in Setagaya, an' it should be there in five ta seven business days.", ja: "承知しました。そのカードは停止して新しいカードをお送りします。世田谷のご住所宛てで、5〜7営業日で届く予定です。" }
      - { who: me, en: "Oh, sorry, I moved. It's Nakano now. I thought I'd updated it.", ja: "あ、すみません、引っ越したんです。今は中野です。更新したと思ってたんですが。", repair: true }
      - { who: maple, en: "Hmm, it's not showing. Unfortunately, I can't change the address over the phone, so you'd need to do that in the app first, then call us back and we'll send the card.", tts: "Hmm, it's not showin'. Unfortunately, I can't change the address over the phone, so you'd need ta do that in the app first, then call us back an' we'll send the card.", ja: "うーん、反映されていませんね。申し訳ありませんが電話では住所変更ができないので、先にアプリで変更していただいて、それから改めてお電話ください。カードをお送りします。" }
