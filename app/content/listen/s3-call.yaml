  - kind: call
    id: call-roaming-refund
    ask: "携帯会社と でんわ。ローミング料金"
    scene: living
    channel: phone
    lines:
      - { who: henry, en: "Hi, you've reached roaming support. I understand you've been transferred a couple of times, so I apologize for that.", tts: "Hi, you've reached roamin' support. I understand you've been transferred a couple of times, so I apologize for that.", ja: "ローミングサポートです。何度か転送されたとのことで、申し訳ございません。" }
      - { who: me, en: "That's okay. I was charged ¥23,000 for data in Seoul, but I had the travel pass.", tts: "That's okay. I was charged twenty-three thousand yen for data in Seoul, but I had the travel pass.", ja: "大丈夫です。ソウルでのデータ通信で23,000円請求されたんですが、トラベルパスに入っていたんです。" }
      - { who: henry, en: "Okay, let me take a look. So the pass was active from the 3rd, but you landed on the 2nd, and it's that first day that got charged.", tts: "Okay, lemme take a look. So the pass was active from the third, but you landed on the second, an' it's that first day that got charged.", ja: "お調べします。パスは3日から有効でしたが、ご到着は2日で、その初日分が請求されていますね。" }
      - { who: me, en: "But I bought it before I flew.", ja: "でも出発前に買いましたよ。" }
      - { who: henry, en: "You did, yes, but it starts at midnight Japan time. Unfortunately, that's in the terms.", tts: "You did, yes, but it starts at midnight Japan time. Unfortunately, that's in the terms.", ja: "はい、ご購入はされていますが、日本時間の午前0時開始なんです。あいにく規約にそう記載がありまして。" }
      - { who: henry, en: "What I can do, as a one-time courtesy, is take off half. So that'd be ¥11,500. Actually, let me just credit the whole thing, since you've been bounced around twice.", tts: "What I can do, as a one-time courtesy, is take off half. So that'd be eleven thousand five hundred. Actually, lemme just credit the whole thing, since you've been bounced around twice.", ja: "今回限りの対応として、半額お引きできます。そうすると11,500円ですね。いえ、二度もたらい回しにしてしまったので、全額にしましょう。", repair: true }
      - { who: me, en: "Oh! That's really nice of you. Thank you.", ja: "えっ！ありがとうございます。助かります。" }
