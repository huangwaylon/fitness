    channel: phone
    lines:
      - { who: me, en: "Hi, I'd like to cancel my gym membership, please.", ja: "ジムの会員を解約したいんですが。" }
      - { who: audie, en: "Oh, I'm sorry to hear that! Can I ask why? Is it the price? Because I can do three months at half price.", tts: "Oh, I'm sorry ta hear that! Can I ask why? Is it the price? 'Cause I c'n do three months at half price.", ja: "それは残念です！理由を伺ってもいいですか？料金でしょうか？3か月半額にできますよ。" }
      - { who: me, en: "No, thanks. I'm moving, and there isn't a location near my new place.", ja: "いえ、結構です。引っ越すんですが、新居の近くに店舗がないので。" }
      - { who: audie, en: "Totally get it. You know, we do have a home workout app, though. That's just ¥980 a month.", tts: "Totally get it. Y'know, we do have a home workout app, though. That's just nine-eighty a month.", ja: "わかります。でも、自宅トレーニングのアプリもあるんですよ。月980円だけです。" }
      - { who: me, en: "I'm sure it's great, but I'd just like to cancel.", ja: "いいとは思いますが、解約だけでお願いします。" }
      - { who: audie, en: "Of course. So your last day will be the 30th, and you'll be charged for this month. Oh, sorry, there's a one-month notice period, so it'll actually be the end of next month.", tts: "Of course. So yer last day'll be the thirtieth, an' you'll be charged for this month. Oh, sorry, there's a one-month notice period, so it'll actually be the end of next month.", ja: "かしこまりました。最終日は30日で、今月分は請求されます。あ、すみません、1か月前の予告が必要なので、実際は来月末になります。", repair: true }
      - { who: me, en: "Seriously? Fine. Can you email me a confirmation?", ja: "本当に？わかりました。確認のメールを送ってもらえますか？" }
