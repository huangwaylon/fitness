# たちぎき S4 ほし: three friends at fast natural speed, travel decisions with money and a catch in them. Opinions held by
# implication (sarcasm, understatement, a hedge that means no); the change of mind implied, never announced; precise
# vocabulary (nonrefundable, prorated, layover) and idioms (on the fence, a stretch, the catch is). Two mild overlaps;
# the party bed under a party. A claim for the one who changes says what they held first (最初は…).
schema: 1
unit: s4-tachi
game: tachi
stage: 5
track: people
seeds: [3, 7, 8, 11, 27, 36, 50, 52, 53]
features: { primary: intonation, review: idiom }
cando: "速い 3人の 会話で 遠回しな 意見と 言わずに 変わる 考えが わかる"
status: draft
items:
  - kind: tachi
    id: tachi-hoshi-extend-trip
    ask: "旅行を 延ばす？ 帰る？"
    scene: cafe
    lines:
      - { who: whitney, at: 0, en: "So the hotel says we can keep the room through Thursday, at the same rate. I'm just putting that out there.", ja: "ホテルが、木曜まで同じ料金で部屋を延長できるって。一応言っておくね。" }
      - { who: sterling, at: 0.4, en: "Same rate is nice, but our flights are nonrefundable. Changing them isn't exactly free.", ja: "同じ料金はいいけど、飛行機は払い戻し不可だよ。変更はタダってわけにいかない。" }
      - { who: kitt, at: 0.3, en: "How much is the change fee, out of curiosity?", ja: "ちなみに、変更手数料っていくら？" }
      - { who: sterling, at: 0.3, en: "A hundred and fifty each, plus whatever the fare difference is. Which, this week, is not nothing.", ja: "1人150ドル、それに運賃の差額。今週だと、それがばかにならない。" }
      - { who: kitt, at: -0.3, en: "Right. And I've got that thing on Wednesday that I'd technically be skipping.", ja: "だよね。それに水曜のあれ、厳密にはすっぽかすことになるし。" }
      - { who: whitney, at: 0.4, en: "The \"thing\" being a dentist appointment you've rescheduled three times.", ja: "「あれ」って、もう3回も延ばした歯医者でしょ。" }
      - { who: kitt, at: 0.3, en: "Four, actually. Which is sort of my point.", ja: "4回だよ、実は。だからこそ言ってるんだけど。" }
      - { who: sterling, at: 0.4, en: "Hang on. If the airline waives the fee for the storm on Tuesday, the math is completely different.", ja: "待って。火曜の嵐で航空会社が手数料を免除してくれるなら、計算がまるで変わる。" }
      - { who: whitney, at: 0.3, en: "Is that a real thing, or wishful thinking?", ja: "それって本当にあるの？それとも希望的観測？" }
      - { who: sterling, at: 0.4, en: "It's on their site. Free changes for anyone flying out Tuesday. Okay, I'm calling the hotel back.", ja: "サイトに出てる。火曜出発の人は無料で変更可。よし、ホテルに折り返し電話する。" }
      - { who: kitt, at: -0.2, en: "And I'll be calling my dentist. Again.", ja: "で、私は歯医者に電話ね。また。" }
    rounds:
      - { type: opinions, claims: ["延長を それとなく 勧めている", "予定が あって 乗り気で ない", "手数料しだい で 考えが 変わる"], answer: [whitney, kitt, sterling], ctx: "旅先のカフェで、3人が帰る日を相談しています", why: "ホイットニーは putting that out there で延長を勧める。キットは水曜の予定を理由にしぶる。スターリングは手数料が免除なら計算が変わると言う。" }
      - { type: changed, answer: sterling, ctx: "嵐の影響で、航空会社の対応がわかります", why: "スターリングは払い戻し不可で費用がかかると渋ったが、無料変更と知り I'm calling the hotel back と延長に動いた。" }
      - { type: plan, ask: "このあと どうなる？", choices: ["They'll fly home Tuesday as planned to save money.", "Only the one with the appointment will fly home early.", "They'll pay the change fee and stay through Thursday.", "They'll extend the stay, and one of them will move an appointment again."], answer: 3, ja: "滞在を延ばし、1人はまた予約を変える。", ctx: "最後に、帰る日の結論が出ます", why: "手数料は嵐で免除なので払わない。ホテルに延長の電話をし、キットは Again と歯医者をまた延期。1人だけ帰る話はない。", cja: ["節約のため予定どおり火曜に帰る", "予約のある1人だけ先に帰る", "変更手数料を払って木曜まで残る", "滞在を延ばし、1人はまた予約を変える"] }
    note: "not nothing＝ばかにならない額。Again は渋々"
    tags: { seed: 8, register: friend, pragmatic: understatement, features: [intonation, idiom, numbers, overlap] }

  - kind: tachi
    id: tachi-hoshi-bad-rental
    ask: "ひどい 貸し部屋。どうする？"
    scene: living
    lines:
      - { who: cherry, at: 0, en: "Well, the listing did say \"cozy.\" I guess that's what they meant by cozy.", ja: "まあ、掲載には「こぢんまり」って書いてあったしね。こういう意味だったんだ。" }
      - { who: apollo, at: 0.4, en: "Cozy is one word for it. The second bedroom is basically a closet with a window.", ja: "こぢんまり、ねえ。2つめの寝室なんて、窓のついた物置だよ。" }
      - { who: agnes, at: 0.3, en: "I mean, the location's great, and we're barely going to be here.", ja: "でも場所はいいし、ほとんどここにいないじゃない。" }
      - { who: apollo, at: -0.3, en: "Says the person who got the room with the actual bed.", ja: "ちゃんとしたベッドの部屋を取った人が言うかね。" }
      - { who: cherry, at: 0.4, en: "Okay, but here's the thing. The photos showed a washer, and there's no washer. That's a misrepresentation.", ja: "それより問題はね、写真には洗濯機があったのに、ないの。これは掲載と違うってこと。" }
      - { who: agnes, at: 0.3, en: "Huh. If that's in writing, we could ask for a partial refund, right?", ja: "へえ。それが書いてあるなら、一部返金を頼めるよね？" }
      - { who: cherry, at: 0.3, en: "I'd go further. The policy says we can cancel within twenty-four hours of check-in and get the rest prorated.", ja: "私ならもっと言う。規約だと、チェックインから24時間以内ならキャンセルできて、残りは日割りで返ってくるの。" }
      - { who: apollo, at: 0.4, en: "Now you're speaking my language.", ja: "そうこなくちゃ。" }
      - { who: agnes, at: 0.4, en: "But then we're hunting for a new place at nine p.m. in peak season. That seems like a stretch.", ja: "でもそうしたら、繁忙期の夜9時に新しい宿探しだよ。それはちょっと無理がない？" }
      - { who: cherry, at: 0.3, en: "Not if we book the hotel down the street first. They had rooms an hour ago.", ja: "先に通りの先のホテルを押さえれば大丈夫。1時間前は空いてたよ。" }
      - { who: agnes, at: 0.4, en: "...Fine. Book it, and then we'll message the host. In that order.", ja: "…わかった。先に予約して、それからホストに連絡。その順番ね。" }
    rounds:
      - { type: opinions, claims: ["部屋の 狭さに 不満", "掲載と 違うから 解約 できる", "夜に 宿を 探すのは 無理が ある"], answer: [apollo, cherry, agnes], ctx: "着いたばかりの貸し部屋で、3人が中を見ています", why: "アポロは a closet with a window と皮肉。チェリーは洗濯機がなく掲載と違うので解約と日割り返金。アグネスは夜の宿探しは a stretch。" }
      - { type: changed, answer: agnes, ctx: "近くのホテルの空き状況がわかります", why: "アグネスは場所がいいからと残る派で、宿探しも無理と言ったが、ホテルを先に押さえると聞いて Fine. Book it に変わった。" }
      - { type: plan, ask: "次に 何を する？", choices: ["Message the host first and wait for the refund.", "Book the nearby hotel, then contact the host.", "Stay the night and ask for a partial refund.", "Look for a new place on the app tonight."], answer: 1, ja: "近くのホテルを予約してから、ホストに連絡する。", ctx: "最後に、やることの順番が決まります", why: "Book it, and then we'll message the host. In that order＝ホテルが先、ホストが後。一部返金は途中の案。新しい宿探しはしない。", cja: ["先にホストに連絡し、返金を待つ", "近くのホテルを予約し、それからホストに連絡", "一泊して一部返金を頼む", "今夜アプリで新しい宿を探す"] }
    note: "cozy は皮肉。In that order＝この順番で"
    tags: { seed: 50, register: friend, pragmatic: sarcasm, features: [intonation, idiom, overlap] }

  - kind: tachi
    id: tachi-hoshi-red-eye
    ask: "夜行便か、もう1泊か"
    scene: gate
    lines:
      - { who: diana, at: 0, en: "Okay, two options. The red-eye tonight, or the 7 a.m. tomorrow and one more night at the airport hotel.", tts: "Okay, two options. The red-eye tonight, or the seven a.m. tomorrow and one more night at the airport hotel.", ja: "選択肢は2つ。今夜の夜行便か、明日の朝7時の便にして空港ホテルにもう1泊か。" }
      - { who: curt, at: 0.4, en: "The red-eye's eighty bucks cheaper. And we'd save the hotel, too.", ja: "夜行便のほうが80ドル安い。ホテル代も浮くしね。" }
      - { who: tammy, at: 0.3, en: "Sure, if you can sleep sitting up. Some of us can't.", ja: "まあ、座ったまま眠れる人ならね。眠れない人もいるの。" }
      - { who: curt, at: -0.3, en: "It's five hours. You'll survive.", ja: "5時間だよ。死にはしないって。" }
      - { who: diana, at: 0.4, en: "The catch is the layover. It's in Denver, and it's only forty minutes.", ja: "問題は乗り継ぎ。デンバーで、たった40分しかない。" }
      - { who: tammy, at: 0.3, en: "Forty minutes in Denver in January. What could possibly go wrong?", ja: "1月のデンバーで40分ね。何の問題もなさそう。" }
      - { who: curt, at: 0.4, en: "Okay, that's... tighter than I thought. If we miss it, we're stuck there all day.", ja: "あー…思ったよりきついな。乗り遅れたら一日足止めだ。" }
      - { who: diana, at: 0.3, en: "Whereas the morning flight is nonstop. We'd land by noon either way.", ja: "一方、朝の便は直行。どっちにしても昼には着くよ。" }
      - { who: curt, at: 0.4, en: "What does the hotel run us, split three ways?", ja: "ホテルは3人で割るといくら？" }
      - { who: diana, at: 0.3, en: "About sixty each, breakfast included.", ja: "1人60ドルくらい。朝食付き。" }
      - { who: curt, at: 0.4, en: "Then the red-eye's not really saving us much. Book the room before it's gone.", ja: "なら夜行便はたいして安くならないな。なくなる前に部屋を取ろう。" }
    rounds:
      - { type: opinions, claims: ["座ったままでは 眠れない", "乗り継ぎが 短すぎる", "安い ほうが いい"], answer: [tammy, diana, curt], ctx: "空港で、3人が帰りの便を選んでいます", why: "タミーは Some of us can't と眠れないことを皮肉まじりに。ダイアナは The catch is the layover で40分を問題視。カートは安さを推した。" }
      - { type: changed, answer: curt, ctx: "乗り継ぎとホテル代がわかります", why: "カートは夜行便が安いと推したが、40分の乗り継ぎと1人60ドルと聞き、not really saving us much と部屋を取る側に。" }
      - { type: plan, ask: "どうする？", choices: ["They'll take the red-eye and connect in Denver tonight.", "They'll stay at the airport hotel and fly nonstop in the morning.", "They'll take the red-eye and book a hotel in Denver.", "They'll split up and take different flights."], answer: 1, ja: "空港ホテルに泊まり、朝の直行便で帰る。", ctx: "最後に、帰り方が決まります", why: "Book the room before it's gone＝ホテルに泊まる。朝の便は nonstop。デンバーのホテルは足止めの話で、予約ではない。", cja: ["夜行便でデンバー乗り継ぎで帰る", "空港ホテルに泊まり、朝の直行便で帰る", "夜行便に乗り、デンバーでホテルを取る", "別々の便で帰る"] }
    note: "What could possibly go wrong? は皮肉"
    tags: { seed: 8, register: friend, pragmatic: sarcasm, features: [intonation, idiom, numbers, overlap] }

  - kind: tachi
    id: tachi-hoshi-wine-bill
    ask: "お会計、どう 分ける？"
    scene: cafe
    lines:
      - { who: octavian, at: 0, en: "So the total's ¥48,600, service included. Easiest thing is to just split it three ways, right?", tts: "So the total's forty-eight thousand six hundred yen, service included. Easiest thing is to just split it three ways, right?", ja: "合計はサービス料込みで48,600円。いちばん楽なのは3等分だよね？" }
      - { who: gayle, at: 0.4, en: "Easiest, sure. Though I'd point out that I had the pasta and tap water.", ja: "楽なのはね。ただ一応言っておくと、私はパスタと水道水だったけど。" }
      - { who: ankha, at: 0.3, en: "And someone, who shall remain nameless, ordered the second bottle of Barolo.", ja: "それに、名前は伏せるけど、バローロの2本目を頼んだ人がいたよね。" }
      - { who: octavian, at: -0.3, en: "In my defense, you both had some.", ja: "言わせてもらうと、2人とも飲んだじゃない。" }
      - { who: gayle, at: 0.3, en: "One glass. Which I'd hardly call splitting a bottle.", ja: "1杯ね。1本を分けたとはとても言えないけど。" }
      - { who: ankha, at: 0.4, en: "Look, I'm not trying to be petty, but the wine alone came to ¥18,000.", tts: "Look, I'm not trying to be petty, but the wine alone came to eighteen thousand yen.", ja: "ねえ、細かいことを言いたいわけじゃないけど、ワインだけで18,000円だったんだよ。" }
      - { who: octavian, at: 0.3, en: "Fair enough. What if I cover the wine, and we split whatever's left?", ja: "それはそうだ。ワインは僕が持って、残りを分けるのはどう？" }
      - { who: gayle, at: 0.3, en: "That works for me.", ja: "それなら私はいいよ。" }
      - { who: ankha, at: 0.3, en: "Same. Although, if we're being precise, the dessert was also mostly him.", ja: "私も。ただ正確に言うなら、デザートもほとんど彼だったけどね。" }
      - { who: octavian, at: 0.4, en: "Don't push your luck.", ja: "調子に乗らないで。" }
      - { who: gayle, at: -0.3, en: "Okay, I'm paying on the app before anyone does any more math.", ja: "はい、これ以上誰かが計算を始める前に、アプリで払うね。" }
    rounds:
      - { type: opinions, claims: ["安い ものしか 頼んで いない", "ワイン代が 高すぎる と 遠回しに", "最初は 3等分を 提案"], answer: [gayle, ankha, octavian], ctx: "レストランで食事のあと、3人がお会計の話をしています", why: "ゲイルは pasta and tap water と、3等分は不公平だと遠回しに言う。アンカはワインだけで18,000円と指摘。オクタヴィアンは3等分と言っていた。" }
      - { type: changed, answer: octavian, ctx: "ワインの値段の話が出ます", why: "オクタヴィアンは3等分がいいと言ったが、ワインだけで18,000円と聞き、Fair enough. What if I cover the wine と自分から変えた。" }
      - { type: plan, ask: "お会計は どうなる？", choices: ["The whole bill is split evenly, as first suggested.", "Each of them pays for exactly what they ordered.", "One pays for the wine; the rest is split three ways.", "One pays for the wine and the dessert as well."], answer: 2, ja: "1人がワイン代を払い、残りを3人で分ける。", ctx: "最後に、払い方が決まります", why: "ワインは1人が持ち、残りを分ける案に2人が賛成。デザートは Don't push your luck で却下。注文した分ずつでもない。", cja: ["最初の案どおり全額を3等分する", "それぞれ自分が頼んだ分だけ払う", "1人がワイン代を払い、残りを3等分", "1人がワインとデザートの代金も払う"] }
    note: "push your luck＝調子に乗る。デザートは却下"
    tags: { seed: 27, register: friend, pragmatic: sarcasm, conditions: [cafe], features: [intonation, idiom, numbers, overlap] }

  - kind: tachi
    id: tachi-hoshi-last-train
    ask: "パーティー。終電は どうする？"
    scene: living
    lines:
      - { who: reneigh, at: 0, en: "Heads-up: the last train's at 12:10, and it's a fifteen-minute walk to the station.", tts: "Heads-up: the last train's at twelve ten, and it's a fifteen-minute walk to the station.", ja: "お知らせ。終電は12時10分で、駅まで歩いて15分だよ。" }
      - { who: lucky, at: 0.4, en: "It's barely eleven-thirty. Things are just getting going.", ja: "まだ11時半になったばかりだよ。ちょうど盛り上がってきたところなのに。" }
      - { who: cyrano, at: 0.3, en: "Says the guy who lives two stops away. Some of us have a transfer.", ja: "2駅先に住んでる人はいいよね。乗り換えがある人もいるんだよ。" }
      - { who: lucky, at: -0.3, en: "There's always a taxi.", ja: "タクシーって手もあるし。" }
      - { who: reneigh, at: 0.3, en: "From here to Kichijoji? That's nine thousand yen, minimum, and that's if we can even find one at one a.m.", ja: "ここから吉祥寺まで？最低でも9,000円だし、それも夜中の1時にタクシーがつかまればの話。" }
      - { who: cyrano, at: 0.4, en: "Which, on a Saturday in Shibuya, is a big if.", ja: "土曜の渋谷で、それはかなりあやしいよね。" }
      - { who: lucky, at: 0.3, en: "Okay, but they're about to bring out the cake, and leaving before the cake is just rude.", ja: "わかったけど、もうすぐケーキが出てくるんだよ。ケーキの前に帰るのは失礼でしょ。" }
      - { who: reneigh, at: 0.4, en: "Then we eat the cake fast and go at five to twelve. Actually, no, make it a quarter to. Five to is cutting it way too close.", ja: "じゃあケーキを急いで食べて、12時5分前に出よう。いや、やっぱり15分前。5分前はぎりぎりすぎる。" }
      - { who: cyrano, at: 0.3, en: "A quarter to it is. I'm setting an alarm, because I know us.", ja: "15分前で決まり。アラームかけとく。私たちのことだからね。" }
      - { who: lucky, at: 0.4, en: "Fine. I'll walk out with you. No point being the last one here.", ja: "わかったよ。いっしょに出る。最後の1人になっても仕方ないし。" }
    rounds:
      - { type: opinions, claims: ["タクシーは 高いし つかまらない", "乗り換えが あって 遅く なれない", "最初は 残りたかった"], answer: [reneigh, cyrano, lucky], ctx: "友だちの家のパーティーで、夜遅くに3人が話しています", why: "レネーは9,000円、それもつかまればの話と言う。シラノは Some of us have a transfer と皮肉。ラッキーは残りたがった。" }
      - { type: changed, answer: lucky, ctx: "タクシーの値段と、つかまりにくさの話が出ます", why: "ラッキーは残ってタクシーでいいと言ったが、最後は I'll walk out with you と、いっしょに出ることにした。帰るとはっきり言っていない。" }
      - { type: plan, ask: "このあと どうなる？", choices: ["They'll stay until the end and share a taxi.", "They'll leave at five to twelve, right after the cake.", "All three will leave at a quarter to twelve.", "Two will leave at a quarter to twelve; one will stay on."], answer: 2, ja: "3人とも12時15分前に出る。", ctx: "最後に、帰る時間が決まります", why: "five to と言ってから make it a quarter to と言い直した。ラッキーも walk out with you で3人とも出る。タクシーは使わない。", cja: ["最後まで残ってタクシーで帰る", "ケーキのあと12時5分前に出る", "3人とも12時15分前に出る", "2人が12時15分前に出て、1人は残る"] }
    note: "a quarter to＝15分前。five to は言い直し"
    tags: { seed: 53, register: friend, pragmatic: sarcasm, conditions: [party], features: [clock, self-repair, idiom, overlap] }

  - kind: tachi
    id: tachi-hoshi-ridge-storm
    ask: "明日の 山歩き、行く？"
    scene: living
    lines:
      - { who: fang, at: 0, en: "So the forecast says a sixty percent chance of thunderstorms after two. I'd call that a solid maybe.", ja: "で、予報は2時以降、雷雨の確率60パーセント。まあ、かなりの「たぶん」だね。" }
      - { who: sylvia, at: 0.4, en: "A solid maybe, on a ridge with no shelter. Sounds relaxing.", ja: "かなりの「たぶん」ね。逃げ場のない尾根で。くつろげそう。" }
      - { who: teddy, at: 0.3, en: "We could start at six instead of nine. We'd be off the ridge by noon, well ahead of it.", ja: "9時じゃなくて6時に出ればいい。昼までには尾根を下りられる。余裕で前に。" }
      - { who: sylvia, at: -0.3, en: "Six a.m. On my day off.", ja: "朝6時。休みの日に。" }
      - { who: fang, at: 0.3, en: "The bigger issue is the bus. The first one up to the trailhead isn't till 7:40.", tts: "The bigger issue is the bus. The first one up to the trailhead isn't till seven forty.", ja: "もっと問題なのはバス。登山口までの始発は7時40分まで来ない。" }
      - { who: teddy, at: 0.4, en: "Then we drive. My cousin's car is just sitting there.", ja: "じゃあ車で行こう。いとこの車、置きっぱなしだから。" }
      - { who: sylvia, at: 0.3, en: "Your cousin, who still hasn't forgiven you for the dent?", ja: "あのへこみのことで、まだあなたを許してないいとこ？" }
      - { who: teddy, at: 0.3, en: "That's been mostly resolved. Mostly.", ja: "あれはだいたい解決したよ。だいたいね。" }
      - { who: fang, at: 0.4, en: "Look, if the sky looks iffy by the halfway point, we turn around. No arguments.", ja: "いい？半分の地点で空があやしかったら、引き返す。文句なしで。" }
