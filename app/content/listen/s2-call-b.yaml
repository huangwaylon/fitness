  - kind: call
    id: call-bag-found
    ask: "航空会社から でんわ"
    channel: phone
    lines:
      - { who: orville, en: "Hi, this is Dodo Airlines baggage services, calling about your missing bag. Good news, we found it. It went to Sapporo by mistake.", tts: "Hi, this is Dodo Airlines baggage services, callin' about yer missing bag. Good news, we found it. It went to Sapporo by mistake.", ja: "ドードー航空の手荷物サービスです。お探しのバッグの件でお電話しました。朗報です、見つかりました。間違って札幌に行っていました。" }
      - { who: orville, en: "It'll be on the first flight tomorrow, and a driver will drop it off at your hotel by noon.", tts: "It'll be on the first flight tomorrow, an' a driver'll drop it off at yer hotel by noon.", ja: "明日の始発便で運んで、配送ドライバーが正午までにホテルへお届けします。" }
      - { who: me, en: "Great. Do I need a reference number?", ja: "よかった。照会番号は必要ですか？" }
      - { who: orville, en: "Yep, it's HND 42075.", tts: "Yep, it's H, N, D, four-two-oh-seven-five.", ja: "はい、HND42075です。" }
      - { who: orville, en: "Oh, sorry, I'm just hearing the morning flight's full, so it'll be the afternoon one. Make that by six p.m. instead of noon.", tts: "Oh, sorry, I'm just hearin' the mornin' flight's full, so it'll be the afternoon one. Make that by six p m instead of noon.", ja: "あ、すみません、朝の便が満席だと今聞きました。午後の便になります。正午ではなく夕方6時までのお届けです。", repair: true }
      - { who: me, en: "That's fine. I'll be out, though. Can they leave it at the front desk?", ja: "大丈夫です。ただ出かけているので、フロントに預けてもらえますか？" }
      - { who: orville, en: "Sure thing. Just let the hotel know it's coming, and you'll need ID to pick it up.", tts: "Sure thing. Just let the hotel know it's comin', an' you'll need I D ta pick it up.", ja: "大丈夫ですよ。ホテルに届くことを伝えておいてください。受け取りには身分証が必要です。" }
    half: [0, 0, 0, 0, 1, 1, 1]
    memo:
      - slots:
          - { ask: "照会番号は？", options: ["HND 42075", "HND 40275", "HND 42057"], answer: 0 }
          - { ask: "いつまでに 届く？", options: ["正午", "夕方 6時", "あしたの 朝"], answer: 1 }
          - { ask: "受けとりに いるのは？", options: ["身分証", "搭乗券", "照会番号の メール"], answer: 0 }
          - { ask: "バッグは どこに あった？", options: ["札幌", "成田", "ソウル"], answer: 0 }
    note: "Make that～＝言い直し。正午ではなく夕方6時"
    tags: { seed: 6, register: service, pragmatic: literal, conditions: [phone], features: [numbers, self-repair, weak-form] }

  - kind: call
    id: call-parcel-express
    ask: "配送会社に でんわ。海外へ 荷物を 送る"
    scene: living
    channel: phone
    lines:
      - { who: me, en: "Hi, I'd like to send a package to Chicago. It's about three kilos.", ja: "シカゴに荷物を送りたいんですが。3キロくらいです。" }
      - { who: pekoe, en: "Sure. There are three options. Economy's about three weeks, and that comes to ¥4,200.", tts: "Sure. There are three options. Economy's about three weeks, an' that comes to four thousand two hundred yen.", ja: "はい。プランは3つございます。エコノミーは約3週間で、4,200円です。" }
      - { who: pekoe, en: "Standard's a week to ten days, for ¥6,800. Express is three days, but that's ¥11,000.", tts: "Standard's a week to ten days, for six thousand eight hundred. Express is three days, but that's eleven thousand.", ja: "スタンダードは1週間から10日で6,800円。エクスプレスは3日ですが、11,000円になります。" }
      - { who: me, en: "Standard, please. It's a birthday present, so it needs to get there by the 20th.", tts: "Standard, please. It's a birthday present, so it needs to get there by the twentieth.", ja: "スタンダードでお願いします。誕生日プレゼントなので、20日までに着かないといけないんです。" }
      - { who: pekoe, en: "Oh. Today's the 14th, so standard might be cutting it close. Honestly, I'd go express.", tts: "Oh. Today's the fourteenth, so standard might be cuttin' it close. Honestly, I'd go express.", ja: "今日が14日ですから、スタンダードだとぎりぎりかもしれません。正直、私ならエクスプレスにしますね。" }
      - { who: me, en: "Hmm. Okay, express, then.", ja: "うーん。じゃあ、エクスプレスで。", repair: true }
      - { who: pekoe, en: "Great. And it'll need a customs form, since it's going overseas. Just list what's inside and roughly what it's worth.", tts: "Great. An' it'll need a customs form, since it's goin' overseas. Just list what's inside an' roughly what it's worth.", ja: "かしこまりました。海外宛てなので税関申告書が必要です。中身とだいたいの金額を書いてください。" }
    half: [0, 0, 0, 1, 1, 1, 1]
    memo:
      - slots:
          - { ask: "えらんだ プランは？", options: ["エコノミー", "スタンダード", "エクスプレス"], answer: 2 }
          - { ask: "料金は？", options: ["4,200円", "6,800円", "11,000円"], answer: 2 }
          - { ask: "書くものは？", options: ["中身と だいたいの 金額", "相手の でんわ番号", "自分の パスポート番号"], answer: 0 }
    note: "I'd go express＝私ならエクスプレス。最後に変更"
    tags: { seed: 24, register: service, pragmatic: indirect, conditions: [phone], features: [numbers, teen-ty, self-repair] }

  - kind: call
    id: call-handouts-favour
    ask: "同僚から 朝の でんわ"
    scene: office
    channel: phone
    lines:
