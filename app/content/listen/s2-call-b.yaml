  - kind: call
    id: call-jacket-exchange
    ask: "服の 店に でんわ。サイズ交換"
    scene: living
    channel: phone
    lines:
      - { who: me, en: "Hi, I ordered a jacket online last week, but it's too small. Can I exchange it for a large?", ja: "先週ネットでジャケットを注文したんですが、小さすぎて。Lサイズに交換できますか？" }
      - { who: label, en: "Sure! Let me just pull up your order. Okay, the navy one, size medium?", tts: "Sure! Lemme just pull up yer order. Okay, the navy one, size medium?", ja: "はい！ご注文をお調べしますね。ネイビーのMサイズですね？" }
      - { who: me, en: "That's right.", ja: "そうです。" }
      - { who: label, en: "So we're out of navy in a large, unfortunately. We do have it in olive or charcoal.", tts: "So we're outta navy in a large, unfortunately. We do have it in olive or charcoal.", ja: "あいにくネイビーのLは在庫切れなんです。オリーブかチャコールならございます。" }
      - { who: me, en: "Charcoal's fine.", ja: "チャコールでいいです。" }
      - { who: label, en: "Great. Return shipping is free, so just send the medium back with the label in the box. Oh, wait. That jacket was on sale, wasn't it? Sale exchanges have to be mailed within seven days, so get it in the mail by Friday.", tts: "Great. Return shipping is free, so just send the medium back with the label in the box. Oh, wait. That jacket was on sale, wasn't it? Sale exchanges hafta be mailed within seven days, so get it in the mail by Friday.", ja: "では。返送は無料なので、箱に入っているラベルでMを送り返してください。あ、待ってください。そのジャケット、セール品でしたよね？セール品の交換は7日以内の発送が必要なので、金曜までに出してください。", repair: true }
      - { who: me, en: "Okay, I'll drop it off tomorrow.", ja: "わかりました。明日出します。" }
