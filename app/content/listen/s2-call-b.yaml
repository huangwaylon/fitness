      - { who: me, en: "Oh no, I hope he's okay.", ja: "大変だね、大丈夫だといいけど。" }
      - { who: audie, en: "He'll live. Anyway, the thing is, I was supposed to present at the ten o'clock with the Nagoya team.", tts: "He'll live. Anyway, the thing is, I was supposta present at the ten o'clock with the Nagoya team.", ja: "大丈夫、たいしたことないの。それでね、10時の名古屋チームとの会議で私が発表することになってて。" }
      - { who: audie, en: "Would you mind printing the handouts? It's the file called Q3 final. Twelve copies should do it.", tts: "Would you mind printin' the handouts? It's the file called Q three final. Twelve copies should do it.", ja: "資料を印刷してもらえないかな？「Q3最終版」っていうファイル。12部あれば足りると思う。" }
      - { who: audie, en: "Actually, make it fifteen. Their manager's joining, and she always brings people.", tts: "Actually, make it fifteen. Their manager's joinin', an' she always brings people.", ja: "やっぱり15部にして。向こうの部長も来るし、いつも何人か連れてくるから。", repair: true }
      - { who: audie, en: "Oh, and it's not in Room B anymore. They moved us to the big one on the fourth floor. I'll call in.", tts: "Oh, an' it's not in Room B anymore. They moved us ta the big one on the fourth floor. I'll call in.", ja: "あ、それとB会議室じゃなくなって、4階の大きい部屋に変わったの。私はオンラインで入るね。" }
      - { who: me, en: "No problem, I'll take care of it.", ja: "了解、やっておくね。" }
