  - kind: tachi
    id: tachi-standup-blocked
    ask: "朝の ミーティング。だれが 止まっている？"
    scene: office
    channel: video
    lines:
      - { who: pietro, at: 0, en: "Okay, quick round. Agnes, you first.", ja: "よし、手短にいこう。アグネスから。" }
      - { who: agnes, at: 0.2, en: "Yesterday I finished the login screens. Today I'm on the payment flow, but I'm stuck till I get the new API keys from Lucky's team.", tts: "Yesterday I finished the login screens. Today I'm on the payment flow, but I'm stuck till I get the new A P I keys from Lucky's team.", ja: "昨日はログイン画面を仕上げました。今日は決済の流れに入りますが、ラッキーさんのチームから新しいAPIキーをもらうまで止まってます。" }
      - { who: lucky, at: -0.3, en: "Yeah, about that. Security hasn't signed off on them yet. Could be Thursday.", tts: "Yeah, about that. Security hasn't signed off on 'em yet. Could be Thursday.", ja: "あー、それね。セキュリティの承認がまだ下りてないんだ。木曜になるかも。" }
      - { who: pietro, at: 0.2, en: "Thursday? The demo's Wednesday.", ja: "木曜？デモは水曜だよ。" }
      - { who: lucky, at: 0.3, en: "I know, I know. I'll bug them this morning. Worst case, she can use the test keys for the demo.", tts: "I know, I know. I'll bug 'em this mornin'. Worst case, she c'n use the test keys for the demo.", ja: "わかってる、わかってる。今朝せっついてみる。最悪、デモはテスト用のキーでいけるよ。" }
      - { who: agnes, at: -0.4, en: "Test keys won't show the real card screen, though. That's the whole point of the demo.", ja: "でもテスト用のキーだと本物のカード画面が出ないの。それがデモの肝なのに。" }
      - { who: pietro, at: 0.3, en: "Okay, then let's not risk it. We push the demo to Friday, and I'll tell the client. Lucky, keys by Thursday, no later.", tts: "Okay, then let's not risk it. We push the demo to Friday, an' I'll tell the client. Lucky, keys by Thursday, no later.", ja: "わかった、じゃあ無理はしない。デモは金曜にずらして、クライアントには僕から言う。ラッキー、キーは木曜まで、それ以上は待てない。" }
      - { who: lucky, at: 0.2, en: "Thursday. Got it.", ja: "木曜ね。了解。" }
    rounds:
      - { type: opinions, claims: ["テスト用では デモの 意味が ない", "最悪 テスト用で いける", "デモを 金曜に ずらす"], answer: [agnes, lucky, pietro], ctx: "朝のビデオ会議で、チームが進み具合を報告しています", why: "アグネスはテスト用のキーではデモの意味がない。ラッキーは Worst case, the test keys。ピエトロは push the demo to Friday。" }
      - { type: changed, answer: pietro, ctx: "キーが遅れると分かり、予定が揺れます", why: "ピエトロは The demo's Wednesday と水曜にこだわっていたが、テスト用では意味がないと聞いて金曜に延期した。" }
      - { type: plan, ask: "結論は？", choices: ["The demo stays on Wednesday with the test keys.", "The demo moves to Friday, and the keys must come by Thursday.", "The payment flow is dropped from the demo."], answer: 1, ja: "デモは金曜に延期。キーは木曜までに。", ctx: "最後に、デモとキーの期限が決まります", why: "デモは金曜に延期。keys by Thursday, no later＝キーは木曜まで。テスト用のキーで水曜、の案は却下。", cja: ["デモは水曜のまま、テスト用のキーで", "デモは金曜に延期、キーは木曜までに", "決済の部分をデモから外す"] }
    note: "stuck till～＝〜まで作業が止まる。誰が原因か"
    tags: { seed: 44, register: colleague, pragmatic: literal, conditions: [video], features: [overlap, contraction, chain] }

  - kind: tachi
    id: tachi-launch-hedge
    ask: "リリース日の 前倒しを 相談している"
    scene: office
    lines:
      - { who: henry, at: 0, en: "So, the client wants to move the launch up to March 1st. Is that doable?", tts: "So, the client wants ta move the launch up to March first. Is that doable?", ja: "で、クライアントがローンチを3月1日に前倒ししたいそうです。いけますか？" }
      - { who: goldie, at: 0.3, en: "It might be tricky. I mean, it's not impossible, but we'd be cutting corners on testing.", tts: "It might be tricky. I mean, it's not impossible, but we'd be cuttin' corners on testing.", ja: "ちょっと厳しいかもね。まあ、不可能じゃないけど、テストで手を抜くことになる。" }
      - { who: teddy, at: -0.3, en: "Tricky? Come on, we're already behind. There's no way we're ready by March.", ja: "厳しい？いやいや、もう遅れてるんだよ。3月なんて絶対無理。" }
      - { who: henry, at: 0.3, en: "They're offering a bonus if we hit it, apparently. Twenty percent on top.", ja: "間に合えばボーナスを出すそうです。20%上乗せで。" }
      - { who: teddy, at: 0.2, en: "...Okay, twenty percent's not nothing. If we drop the Android version for launch, maybe.", tts: "...Okay, twenty percent's not nothin'. If we drop the Android version for launch, maybe.", ja: "…まあ、20%はばかにできないな。ローンチでAndroid版を外すなら、もしかしたら。" }
      - { who: goldie, at: -0.4, en: "I'm not crazy about dropping Android. Half their users are on it.", ja: "Android外しは気が進まないな。ユーザーの半分がAndroidだから。" }
      - { who: henry, at: 0.3, en: "What if Android follows two weeks later? I can sell them on that.", ja: "Androidを2週間遅れで出すのはどうでしょう？それなら先方を説得できます。" }
      - { who: goldie, at: 0.3, en: "Fine. iOS on the 1st, Android by the 15th. But I want that in writing.", tts: "Fine. I O S on the first, Android by the fifteenth. But I want that in writing.", ja: "いいわ。iOSは1日、Androidは15日まで。ただし書面でね。" }
    rounds:
      - { type: opinions, claims: ["Androidを 外せば 間に合う かも", "Androidは ユーザーの 半分", "2週間 遅れなら 先方を 説得できる"], answer: [teddy, goldie, henry], ctx: "会議で、3人がリリースの前倒しを相談しています", why: "テディは Android を外せば maybe。ゴールディは Half their users are on it。ヘンリーは先方を sell できる。" }
      - { type: changed, answer: teddy, ctx: "ボーナスの話で、ある人の態度が変わります", why: "テディは There's no way（絶対無理）と言ったが、20%のボーナスと聞いて not nothing、maybe に変わった。" }
      - { type: plan, ask: "決まったことは？", choices: ["Both versions launch on March 1st.", "The launch stays on the original date.", "iOS launches on the 1st and Android by the 15th."], answer: 2, ja: "iOSは1日、Androidは15日までに出す。", ctx: "最後に、2つの版の日程が決まります", why: "iOS on the 1st, Android by the 15th＝iOSは1日、Androidは15日まで。in writing＝書面で。両方1日の案ではない。", cja: ["両方の版を3月1日に出す", "最初の予定日のまま", "アイフォーン版は1日、アンドロイド版は15日までに"] }
    note: "might be tricky は遠回しの反対。20%で気が変わる"
    tags: { seed: 40, register: boss, pragmatic: hedge, features: [overlap, numbers, ellipsis] }

  - kind: tachi
    id: tachi-bbq-gossip
    ask: "バーベキューで うわさ話"
    scene: street
    lines:
      - { who: rosie, at: 0, en: "Okay, don't look now, but Kenta and Yui just showed up. Together.", ja: "ねえ、今見ないでね。ケンタとユイが来たの。一緒に。" }
      - { who: kicks, at: -0.3, en: "Together together? Or just the same train?", ja: "一緒って、そういう一緒？それとも同じ電車だっただけ？" }
      - { who: tia, at: 0.2, en: "Same train, obviously. She's been seeing that guy from her climbing gym forever.", tts: "Same train, obviously. She's been seein' that guy from 'er climbing gym forever.", ja: "同じ電車でしょ、どう考えても。彼女、クライミングジムの人とずっと付き合ってるもの。" }
      - { who: rosie, at: 0.3, en: "Not anymore. They broke up in, like, January.", ja: "もう違うよ。1月くらいに別れたの。" }
      - { who: tia, at: -0.4, en: "Did they? Oh. Well, then, I guess... he did bring her a drink without asking what she wanted.", tts: "Did they? Oh. Well, then, I guess... he did bring 'er a drink without askin' what she wanted.", ja: "そうなの？あら。それなら…たしかに彼、何がいいか聞かずに彼女に飲み物を持ってきてたわね。" }
      - { who: kicks, at: 0.3, en: "That's nothing. I brought you a drink without asking.", ja: "そんなの何でもないよ。僕だって君に聞かずに飲み物持ってきたし。" }
      - { who: tia, at: 0.2, en: "You brought me a warm beer. That's different.", ja: "あなたが持ってきたのはぬるいビールよ。それとは違う。" }
      - { who: rosie, at: -0.3, en: "Shh, they're coming over. Act normal. Someone say something about the weather.", ja: "しっ、こっち来る。普通にして。誰か天気の話して。" }
    rounds:
      - { type: opinions, claims: ["ユイは 前の 彼と 別れた", "飲み物 くらいで 決めつけない", "彼の 飲み物の 渡し方に 気づいた"], answer: [rosie, kicks, tia], ctx: "バーベキューで、友だち3人がうわさ話をしています", why: "ロージーは They broke up in January（前の彼と別れた）。キックスは That's nothing と決めつけない。ティアは飲み物の渡し方に気づいた。" }
      - { type: changed, answer: tia, ctx: "新しい情報で、ある人の見方が変わります", why: "ティアは Same train, obviously と否定していたが、別れたと聞いて Oh. Well, then… と見方を変えた。" }
      - { type: plan, ask: "このあと どうなる？", choices: ["One of them will ask the couple directly.", "The two will come over, and they'll act casual.", "They'll leave to buy more drinks."], answer: 1, ja: "二人がこっちに来るので、何気なくふるまう。", ctx: "最後に、話題の2人が近づいてきます", why: "they're coming over＝こっちに来る。Act normal＝普通にして。天気の話でごまかす。直接聞く話は出ていない。", cja: ["1人が二人に直接聞く", "二人が来るので、何気なくふるまう", "飲み物を買いに行く"] }
    note: "together together＝恋人として一緒、の強調"
    tags: { seed: 53, register: friend, pragmatic: attitude, conditions: [street], features: [overlap, h-drop, intonation] }

  - kind: tachi
    id: tachi-surprise-party
    ask: "サプライズパーティーの 段取り"
    scene: living
    lines:
      - { who: molly, at: 0, en: "Okay, so the cake's getting picked up at five, and the restaurant's holding the back room from seven.", ja: "よし、ケーキは5時に受け取り、レストランは7時から奥の部屋を押さえてもらってる。" }
      - { who: stitches, at: 0.3, en: "And she still thinks we're just having a quiet dinner, right? Not twenty people.", tts: "An' she still thinks we're just havin' a quiet dinner, right? Not twenty people.", ja: "で、彼女はまだ静かな夕食だと思ってるんだよね？20人じゃなくて。" }
      - { who: shep, at: -0.3, en: "Hang on. Who's picking up the cake? I thought you said you would.", tts: "Hang on. Who's pickin' up the cake? I thought you said you would.", ja: "待って。ケーキは誰が受け取るの？君がやるって言ってたと思うけど。" }
      - { who: molly, at: 0.3, en: "I said I'd order it. I can't do five, I'm at the hair salon till five-thirty.", ja: "注文するって言ったの。5時は無理。5時半まで美容院なの。" }
      - { who: stitches, at: 0.2, en: "I'll get it, then. It's on my way.", ja: "じゃあ俺が取りに行く。通り道だし。" }
      - { who: shep, at: -0.4, en: "Wait, no, you're the one taking her to the restaurant. You can't show up with a cake box.", ja: "待って、だめだ、彼女をレストランに連れていくのは君だろ。ケーキの箱を持って現れちゃまずい。" }
      - { who: stitches, at: 0.3, en: "Good point. Fine, you do the cake, then.", ja: "たしかに。じゃあケーキは君ね。" }
      - { who: molly, at: -0.5, en: "Shh! She's here. So, uh, yes, the report's due Monday, everyone.", ja: "しっ！来た。えー、そう、みなさん、報告書は月曜締め切りです。" }
    rounds:
      - { type: opinions, claims: ["5時は 美容院で 行けない", "連れていく 人が ケーキを 持つのは だめ", "最初は 自分が 取りに 行くと 言った"], answer: [molly, shep, stitches], ctx: "家で、3人がサプライズパーティーの段取りをしています", why: "モリーは美容院で5時は無理。シェップは連れて行く人が cake box を持つのはだめ。スティッチズは最初 I'll get it と言った。" }
      - { type: changed, answer: stitches, ctx: "ケーキの受け取りで、役割が入れかわります", why: "スティッチズは I'll get it と言ったが、連れて行く役だと指摘されて Good point. Fine, you do the cake に変えた。" }
      - { type: plan, ask: "ケーキは だれが？", choices: ["The one taking her to dinner, on the way.", "The one who pointed out the problem.", "The one at the hair salon, at five-thirty."], answer: 1, ja: "問題を指摘した人が受け取りに行く。", ctx: "最後に、ケーキの係が決まります", why: "you do the cake の you は、問題を指摘したシェップ。連れて行く人はケーキを持てず、美容院の人は5時半まで動けない。", cja: ["夕食に連れて行く人が、途中で", "問題を指摘した人", "美容院の人が5時半に"] }
    note: "the report は話をそらすための作り話"
    tags: { seed: 54, register: friend, pragmatic: humour, features: [overlap, contraction, clock] }

  - kind: tachi
    id: tachi-train-tourists
    ask: "電車で 旅行者の 会話。どこで 降りる？"
    scene: platform
    lines:
      - { who: stitches, at: 0, en: "So is it this stop or the next one for the big temple?", ja: "大きなお寺って、この駅？次の駅？" }
      - { who: bea, at: 0.3, en: "Asakusa? We're not even on the right line for that. This is going to Shinjuku.", tts: "Asakusa? We're not even on the right line for that. This is goin' to Shinjuku.", ja: "浅草？そもそも路線が違うよ。これは新宿行き。" }
      - { who: reneigh, at: -0.2, en: "Which is fine, because we said Shinjuku Gyoen first, didn't we? The garden. Then the temple tomorrow.", ja: "それでいいのよ、先に新宿御苑って言ったでしょ？庭園。お寺は明日。" }
      - { who: stitches, at: 0.3, en: "Did we? I thought the garden was closed on Mondays.", ja: "そうだっけ？庭園って月曜休みじゃなかった？" }
      - { who: reneigh, at: 0.2, en: "Today's Tuesday, hon.", ja: "今日は火曜日よ。" }
      - { who: stitches, at: -0.4, en: "Is it? Wow. Okay. Garden it is.", ja: "そうなの？うわ。じゃあ庭園で。" }
      - { who: bea, at: 0.3, en: "Then we want Shinjuku-gyoemmae, not Shinjuku. Which means changing at Yotsuya. That's... two stops from here.", tts: "Then we want Shinjuku-gyoemmae, not Shinjuku. Which means changin' at Yotsuya. That's... two stops from here.", ja: "それなら新宿じゃなくて新宿御苑前。つまり四ツ谷で乗り換え。ここから…2駅。" }
      - { who: reneigh, at: 0.2, en: "Perfect. Grab your bags, then.", ja: "完璧。じゃあ荷物持って。" }
    rounds:
      - { type: opinions, claims: ["路線が ちがうと 気づいた", "今日は 庭園、お寺は あした", "庭園は 休みだと 思っていた"], answer: [bea, reneigh, stitches], ctx: "電車の中で、旅行者3人が降りる駅を相談しています", why: "ビーは not even on the right line（路線がちがう）。レネイは今日は庭園。スティッチズは closed on Mondays と思っていた。" }
      - { type: changed, answer: stitches, ctx: "曜日の勘ちがいがわかります", why: "スティッチズは庭園は月曜休みと思っていたが、Today's Tuesday と聞いて Garden it is に変えた。" }
      - { type: plan, ask: "3人は どこで 降りる？", choices: ["Yotsuya, to change for the garden.", "Shinjuku, at the end of the line.", "Asakusa, for the temple."], answer: 0, ja: "四ツ谷で降りて、庭園へ乗り換える。", ctx: "最後に、乗り換えの駅が決まります", why: "changing at Yotsuya＝四ツ谷で乗り換え。新宿ではなく新宿御苑前に行くので、終点まで乗らない。浅草は明日。", cja: ["四ツ谷で降りて、庭園へ乗り換える", "終点の新宿で降りる", "浅草で降りてお寺へ"] }
    note: "hon は親しい呼びかけ。乗換駅で降りる"
