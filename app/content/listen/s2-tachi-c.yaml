items:
  - kind: tachi
    id: tachi-urgent-care
    ask: "ルームメイトが 足を ひねった"
    scene: living
    lines:
      - { who: kid-cat, at: 0, en: "It's fine, it's just a little swollen. I'll put some ice on it and sleep it off.", tts: "It's fine, it's jus' a little swollen. I'll put some ice on it an' sleep it off.", ja: "大丈夫、ちょっと腫れてるだけ。氷で冷やして寝れば治るよ。" }
      - { who: bea, at: 0.3, en: "Dude, it's the size of a grapefruit. You can't even put your shoe on.", tts: "Dude, it's the size of a grapefruit. Ya can't even put yer shoe on.", ja: "ちょっと、グレープフルーツくらいに腫れてるよ。靴も履けないじゃん。" }
      - { who: phoebe, at: -0.3, en: "I'd go to urgent care, not the ER. The ER's going to be a four-hour wait on a Saturday night.", tts: "I'd go to urgent care, not the E R. The E R's gonna be a four-hour wait on a Saturday night.", ja: "救急病院じゃなくて、夜間の診療所に行くべきだと思う。土曜の夜の救急は4時間待ちだよ。" }
      - { who: kid-cat, at: 0.3, en: "Urgent care is like a hundred and fifty bucks without insurance, though.", tts: "Urgent care is like a hundred an' fifty bucks without insurance, though.", ja: "でも夜間の診療所って、保険なしだと150ドルくらいするんだよ。" }
      - { who: bea, at: 0.3, en: "You have insurance. Through work. You literally showed me the card last month.", tts: "You have insurance. Through work. Ya literally showed me the card las' month.", ja: "保険あるでしょ。会社の。先月カード見せてくれたじゃん。" }
      - { who: kid-cat, at: -0.4, en: "Oh. Right. Okay, fine, if it's covered, I'll go. But I'm not going in an ambulance.", tts: "Oh. Right. Okay, fine, if it's covered, I'll go. But I'm not goin' in an ambulance.", ja: "あ、そっか。わかった、保険がきくなら行く。でも救急車には乗らないよ。" }
      - { who: phoebe, at: 0.3, en: "Nobody said ambulance. The one on Fifth closes at ten, so we should leave now.", ja: "救急車なんてだれも言ってないよ。5番街のところは10時に閉まるから、もう出なきゃ。" }
      - { who: bea, at: 0.2, en: "I'll drive. Phoebe, grab his insurance card and a bag of frozen peas.", tts: "I'll drive. Phoebe, grab 'is insurance card an' a bag of frozen peas.", ja: "私が運転する。フィービー、彼の保険証と冷凍のグリーンピースを持ってきて。" }
    rounds:
      - { type: opinions, claims: ["救急病院より 夜間の 診療所が いい", "救急車には 乗りたくない", "自分が 車で 連れて行く"], answer: [phoebe, kid-cat, bea], ctx: "家で、ルームメイト3人がけがの話をしています", why: "フィービーは救急は4時間待ちなので urgent care 派。キッドキャットは救急車には乗らないと言う。ベアは I'll drive と運転を買って出る。" }
      - { type: changed, answer: kid-cat, ctx: "行かないと言っていた人に、ある事実が伝えられます", why: "キッドキャットは寝れば治ると言っていたが、会社の保険があると言われて if it's covered, I'll go に変わった。" }
      - { type: plan, ask: "このあと どうする？", choices: ["Call an ambulance right away.", "Ice it tonight and see a doctor on Monday.", "Drive to urgent care before it closes at ten."], answer: 2, ja: "10時に閉まる前に、車で夜間の診療所へ行く。", ctx: "最後に、出発の段取りが決まります", why: "5番街の診療所は10時に閉まるので、すぐ出る。ベアが運転する。救急車は本人が嫌がり、月曜まで待つ案は消えた。", cja: ["すぐ救急車を呼ぶ", "今夜は冷やして、月曜に医者に行く", "10時に閉まる前に、車で夜間の診療所へ行く"] }
    note: "urgent care＝予約なしで行ける夜間・休日の診療所"
    tags: { seed: 15, register: friend, pragmatic: attitude, features: [overlap, h-drop, numbers] }

  - kind: tachi
    id: tachi-movers-or-truck
    ask: "引っ越しの やり方を 決めている"
    scene: living
    lines:
      - { who: maple, at: 0, en: "So, the move's on the twenty-eighth. Do we rent a truck, or just pay movers?", ja: "引っ越しは28日。トラックを借りる？それとも業者に頼む？" }
      - { who: bob, at: 0.3, en: "Truck. Movers quoted me eight hundred bucks. A truck's like ninety for the day.", tts: "Truck. Movers quoted me eight hundred bucks. A truck's like ninety fer the day.", ja: "トラック。業者は800ドルって見積もりだった。トラックなら1日90ドルくらい。" }
      - { who: diana, at: -0.3, en: "Sure, and who's carrying the couch down four flights of stairs? Not me.", tts: "Sure, an' who's carryin' the couch down four flights of stairs? Not me.", ja: "そうね、で、だれがソファーを4階分運び下ろすの？私はやらない。" }
      - { who: bob, at: 0.3, en: "We'll get the guys from soccer. Pizza and beer, done.", tts: "We'll get the guys from soccer. Pizza an' beer, done.", ja: "サッカー仲間を呼べばいい。ピザとビールで決まり。" }
      - { who: maple, at: 0.3, en: "Last time you said that, two of them flaked and you threw your back out.", tts: "Las' time ya said that, two of 'em flaked an' you threw yer back out.", ja: "前にもそう言って、2人がドタキャンして、あなたは腰を痛めたよね。" }
      - { who: diana, at: -0.2, en: "What if we do both? Movers just for the big stuff, and we drive the boxes ourselves.", tts: "What if we do both? Movers jus' for the big stuff, an' we drive the boxes ourselves.", ja: "両方にしたら？大きいものだけ業者に頼んで、箱は自分たちで運ぶ。" }
      - { who: bob, at: 0.3, en: "Huh. That's, what, half the price? Okay, yeah, my back says yes.", ja: "へえ。それなら半額くらい？よし、うん、腰も賛成してる。" }
      - { who: maple, at: 0.2, en: "Great. I'll call them for a quote on just the couch, the bed and the fridge.", tts: "Great. I'll call 'em fer a quote on jus' the couch, the bed an' the fridge.", ja: "よし。ソファーとベッドと冷蔵庫だけで、見積もりを電話で頼むね。" }
    rounds:
      - { type: opinions, claims: ["ソファーを 運ぶのは いや", "前回は 仲間が 来なかった", "半額なら 両方の 案に 賛成"], answer: [diana, maple, bob], ctx: "家で、3人が引っ越しの方法を相談しています", why: "ダイアナは Not me でソファー運びはいや。メイプルは前回 two of them flaked と覚えている。ボブは half the price? で両方の案に乗った。" }
      - { type: changed, answer: bob, ctx: "安く済ませたい人に、別の案が出てきます", why: "ボブはトラックだけで安く済ませる派だったが、大物だけ業者に頼めば半額くらいと聞いて my back says yes に変わった。" }
      - { type: plan, ask: "引っ越しは どうなる？", choices: ["Movers for the big furniture; they drive the boxes.", "They rent a truck and ask friends from soccer.", "Movers do everything for eight hundred dollars."], answer: 0, ja: "大きな家具は業者、箱は自分たちで運ぶ。", ctx: "最後に、引っ越しのやり方が決まります", why: "大きな家具だけ業者に頼み、箱は自分たちの車で運ぶ。トラックと仲間の案は前回の失敗で消え、全部業者は高すぎる。", cja: ["大きな家具は業者に、箱は自分たちで運ぶ", "トラックを借りて、サッカー仲間に頼む", "800ドルで業者に全部頼む"] }
    note: "flake＝ドタキャンする。throw out one's back＝腰を痛める"
    tags: { seed: 33, register: friend, pragmatic: humour, features: [overlap, numbers, h-drop] }

  - kind: tachi
    id: tachi-family-plan
    ask: "スマホの プランを まとめるか 話している"
    scene: cafe
    lines:
      - { who: audie, at: 0, en: "Okay, my plan's going up to sixty-five a month. I'm switching carriers.", ja: "私のプラン、月65ドルに上がるの。キャリアを変えるつもり。" }
      - { who: punchy, at: 0.3, en: "Why don't we just do a family plan? Three lines is like forty each.", tts: "Why don't we jus' do a family plan? Three lines is like forty each.", ja: "みんなで家族プランにしたら？3回線なら1人40ドルくらいだよ。" }
      - { who: tia, at: -0.3, en: "Forty each, plus taxes and fees. It's never actually forty.", tts: "Forty each, plus taxes an' fees. It's never actually forty.", ja: "1人40ドル、プラス税金と手数料ね。本当に40ドルで済んだためしがない。" }
      - { who: audie, at: 0.3, en: "Even at fifty, I'm still saving fifteen bucks. I'm in.", ja: "50ドルでも15ドル浮くし。私は乗る。" }
      - { who: tia, at: 0.3, en: "My worry is, who's paying the bill? Last time we split something, I chased you guys for three months.", tts: "My worry is, who's payin' the bill? Las' time we split something, I chased you guys fer three months.", ja: "心配なのは、だれが請求を払うか。前に割り勘したとき、3か月も二人を追いかけたんだから。" }
      - { who: punchy, at: -0.4, en: "Okay, that was one time. Fine, autopay. Everyone's share goes out on the first, automatically.", tts: "Okay, that was one time. Fine, autopay. Everyone's share goes out on the firs', automatically.", ja: "あれは一回だけでしょ。じゃあ自動払いにしよう。毎月1日に、各自の分が自動で引き落とされる。" }
      - { who: tia, at: 0.3, en: "Automatically? Okay. If it's automatic, I'm in too. But the account's in my name.", ja: "自動で？それならいい。自動なら私も乗る。でも契約は私の名義ね。" }
      - { who: audie, at: 0.2, en: "Deal. I'll port my number over this weekend.", ja: "決まり。今週末、番号を移すね。" }
    rounds:
      - { type: opinions, claims: ["契約は 自分の 名義に したい", "今の プランが 値上がりする", "家族プランを 言い出した"], answer: [tia, audie, punchy], ctx: "カフェで、3人がスマホの料金の話をしています", why: "ティアは契約を in my name にしたい。オーディーは今のプランが月65ドルに上がる。パンチは family plan を言い出した。" }
      - { type: changed, answer: tia, ctx: "支払いを心配する人に、ある仕組みが提案されます", why: "ティアは前に3か月も取り立てたので渋っていたが、毎月1日の自動払いと聞いて I'm in too に変わった。" }
      - { type: plan, ask: "このあと どうなる？", choices: ["One of them switches carriers alone.", "They share a family plan with autopay on the first.", "They split the bill in cash every month."], answer: 1, ja: "毎月1日の自動払いで、家族プランを3人で使う。", ctx: "最後に、支払い方が決まります", why: "3人で家族プランにして、毎月1日に自動払い。契約はティアの名義で、オーディーは週末に番号を移す。現金の割り勘は前回の失敗で避けた。", cja: ["一人だけ別の会社に移る", "毎月1日の自動払いで、家族プランを3人で使う", "毎月、現金で割り勘する"] }
    note: "port a number＝番号をそのまま移す"
    tags: { seed: 22, register: friend, pragmatic: hedge, conditions: [cafe], features: [overlap, numbers, elision] }

  - kind: tachi
    id: tachi-rental-compact
    ask: "旅行の 朝、レンタカーを 決めている"
    scene: street
    lines:
      - { who: raymond, at: 0, en: "So the rental place says the compact's ready, but the SUV won't be back till three.", tts: "So the rental place says the compact's ready, but the S U V won't be back till three.", ja: "レンタカー屋が言うには、小型車はすぐ出せるけど、SUVは3時まで戻らないって。" }
      - { who: dom, at: 0.3, en: "Three? We'd hit Friday traffic out of the city. Let's just take the compact.", tts: "Three? We'd hit Friday traffic outta the city. Let's jus' take the compact.", ja: "3時？それだと金曜の渋滞にはまるよ。小型車にしよう。" }
      - { who: cherry, at: -0.3, en: "With three suitcases and the cooler? We won't fit. I'm not riding with a cooler on my lap for four hours.", tts: "With three suitcases an' the cooler? We won't fit. I'm not ridin' with a cooler on my lap fer four hours.", ja: "スーツケース3つとクーラーボックスで？入らないよ。4時間もクーラーボックスを膝に乗せていくのはいや。" }
      - { who: raymond, at: 0.3, en: "We could ship the suitcases ahead. The hotel takes deliveries.", ja: "スーツケースは先にホテルへ送れるよ。ホテルで受け取ってくれる。" }
      - { who: dom, at: 0.3, en: "Oh, nice. So it's just the cooler and our backpacks. That fits easy.", tts: "Oh, nice. So it's jus' the cooler an' our backpacks. That fits easy.", ja: "お、いいね。それならクーラーボックスとリュックだけ。余裕で入る。" }
      - { who: cherry, at: -0.4, en: "Fine, if the bags go ahead, the compact's okay. But I'm not driving the mountain part.", tts: "Fine, if the bags go ahead, the compact's okay. But I'm not drivin' the mountain part.", ja: "わかった、荷物を先に送るなら小型車でいい。でも山道は運転しないからね。" }
      - { who: raymond, at: 0.3, en: "I'll take the mountain part. Dom, you drive us out of the city, and we leave at noon.", tts: "I'll take the mountain part. Dom, ya drive us outta the city, an' we leave at noon.", ja: "山道は僕が運転する。ドム、街を出るまでは運転して。正午に出発しよう。" }
      - { who: dom, at: 0.2, en: "Noon it is. I'll drop the suitcases at the convenience store on the way.", ja: "正午ね。途中のコンビニでスーツケースを出していく。" }
    rounds:
      - { type: opinions, claims: ["山道は 自分が 運転する", "金曜の 渋滞を 避けたい", "山道は 運転したくない"], answer: [raymond, dom, cherry], ctx: "旅行の朝、友だち3人がレンタカーの相談をしています", why: "レイモンドは山道を I'll take と引き受ける。ドムは金曜の渋滞を避けたい。チェリーは山道は運転しないと言う。" }
      - { type: changed, answer: cherry, ctx: "荷物が入らないと言う人に、ある案が出ます", why: "チェリーは We won't fit と小型車に反対だったが、スーツケースを先に送ると聞いて the compact's okay に変わった。" }
      - { type: plan, ask: "どうする？", choices: ["Wait for the SUV and leave at three.", "Take the train and ship everything ahead.", "Take the compact at noon and ship the suitcases ahead."], answer: 2, ja: "正午に小型車で出発し、スーツケースは先に送る。", ctx: "最後に、車と出発の時間が決まります", why: "スーツケースはコンビニから先に送り、正午に小型車で出る。街はドム、山道はレイモンドが運転する。SUVを待つと渋滞にはまる。", cja: ["大きい車を待って、3時に出る", "電車にして、荷物は全部先に送る", "正午に小型車で出て、スーツケースは先に送る"] }
    note: "ship ahead＝先に送る（宅配便）"
    tags: { seed: 7, register: friend, pragmatic: literal, features: [overlap, numbers, elision] }

  - kind: tachi
    id: tachi-parents-visit
    ask: "きょうだいで 両親の 来日を 相談している"
    scene: cafe
    lines:
      - { who: rosie, at: 0, en: "So Mom and Dad land on the ninth. Are they staying with us, or should I book a hotel?", ja: "お母さんとお父さんは9日に着くって。うちに泊まる？それともホテルを取る？" }
      - { who: marshal, at: 0.3, en: "With us, obviously. Mom would be so hurt if we put them in a hotel.", tts: "With us, obviously. Mom'd be so hurt if we put 'em in a hotel.", ja: "うちに決まってるよ。ホテルにしたら、母さんすごく傷つくって。" }
      - { who: whitney, at: -0.3, en: "Marshal, you have a studio. Where's Dad going to sleep, the bathtub?", tts: "Marshal, ya have a studio. Where's Dad gonna sleep, the bathtub?", ja: "マーシャル、あなたワンルームでしょ。お父さんはどこで寝るの、バスタブ？" }
      - { who: rosie, at: 0.3, en: "My place has the spare room, but the bed's really just a futon on the floor. Dad's back can't take that.", tts: "My place has the spare room, but the bed's really jus' a futon on the floor. Dad's back can't take that.", ja: "うちには空き部屋があるけど、床に敷いた布団なの。お父さんの腰には無理。" }
      - { who: whitney, at: 0.3, en: "There's a business hotel two minutes from your station. Clean, cheap, and they'd still eat dinner with us every night.", tts: "There's a business hotel two minutes from yer station. Clean, cheap, an' they'd still eat dinner with us every night.", ja: "あなたの駅から2分のところにビジネスホテルがあるよ。きれいで安いし、夕食は毎晩一緒に食べられる。" }
      - { who: marshal, at: -0.4, en: "Every night? Okay... if we do dinner together every night, Mom won't feel shut out. Fine, hotel.", ja: "毎晩？そうか…毎晩一緒に夕食なら、母さんものけ者だと思わないか。わかった、ホテルで。" }
      - { who: rosie, at: 0.3, en: "I'll book it tonight. Six nights, the ninth through the fifteenth.", tts: "I'll book it tanight. Six nights, the ninth through the fifteenth.", ja: "今夜予約する。9日から15日まで、6泊ね。" }
      - { who: whitney, at: 0.2, en: "And I'll pick them up at the airport. Marshal, you're on dinner reservations.", tts: "An' I'll pick 'em up at the airport. Marshal, you're on dinner reservations.", ja: "空港には私が迎えに行く。マーシャルは夕食の予約係ね。" }
    rounds:
      - { type: opinions, claims: ["空港に 迎えに 行く", "ホテルを 今夜 予約する", "毎晩 一緒に 夕食なら ホテルで いい"], answer: [whitney, rosie, marshal], ctx: "カフェで、きょうだい3人が両親の来日の話をしています", why: "ホイットニーは空港に迎えに行く。ロージーは今夜ホテルを予約する。マーシャルは毎晩一緒に夕食なら hotel でいいと言う。" }
      - { type: changed, answer: marshal, ctx: "家に泊めたい人に、別の案が出てきます", why: "マーシャルは母が傷つくと家に泊める派だったが、夕食は毎晩一緒に食べられると聞いて Fine, hotel に変わった。" }
      - { type: plan, ask: "両親は どこに 泊まる？", choices: ["A business hotel by the station, six nights.", "The spare room, on a futon.", "The studio apartment.", "A hotel near the airport."], answer: 0, ja: "駅の近くのビジネスホテルに6泊。", ctx: "最後に、泊まる場所と分担が決まります", why: "駅から2分のビジネスホテルに9日から15日まで6泊。布団は父の腰に無理で、ワンルームは狭すぎる。空港の話は迎えのこと。", cja: ["駅の近くのビジネスホテルに6泊", "空き部屋の布団", "ワンルームの部屋", "空港の近くのホテル"] }
    note: "can't take that＝耐えられない。shut out＝のけ者にされる"
    tags: { seed: 50, register: friend, pragmatic: attitude, conditions: [cafe], features: [overlap, numbers, h-drop] }
