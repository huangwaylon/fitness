# 修理を 頼む (hm-repair): wave 2b, もり, いえ (docs/curriculum.md "The 21 units"). A landlord and repair people on the
# phone and at the door: the window ("between eight and noon"), the vague promise ("should be fine", "I'll have him
# call you"), the cost ("it's gonna run you…", "worst case…"), shutting off the water, taking a look. Catch the time
# window, the cost and how firm the promise is. The sound: the dropped h (have 'im call, tell 'er, 'is truck, give 'im
# a call, on 'is way). Who recurs: Cyd the landlord, Tex the plumber, Lily's leaking kitchen sink in 3B, Tammy at
# Fix-It Appliance. 近所の 人's "a heads-up" and "stop by", おいわいする's "at my place", よていを かえる's "running late"
# and "can't make it", ききかえす's "I mean" and "I meant" and お店で 聞く's "honestly" are recycled.
# Its call: call-dryer-window (content/listen/s2-call-c.yaml).
# きょうの ひとこと: "Worst case, I'll have him call you." (最悪の 場合、彼から 電話させるね。)
schema: 1
unit: hm-repair
name: 修理を 頼む
stage: mori
domain: ie
host: cyd
scene: living
sound: h-drop
cando:
  who: 大家や 業者
  does: 修理の 日程と 内容を 話す
  cond: 電話で
  catch: 時間帯・費用・あいまいな 約束
  short: 修理の 時間帯と 費用が わかる
  en: "I can follow a landlord or a repair person talking about when they'll come and what the repair involves, on the phone, and catch the time window, the cost, and how firm the promise really is."
status: voiced
letter:
  en: "Hey, it's Cyd. Your sink's fixed, and you caught every word of it: the window, the cost, even when Tex dropped his h's. I'll have him send you the bill... kidding, it's on me. Next time something breaks, it should be fine. Worst case, you call me. I'll take a look myself."
  ja: "やあ、サイドだよ。きみの へやの シンクは なおったし、ぜんぶ ききとれたね。じかんたいも、ひようも、テックスの くずれた はつおんまで。かれに せいきゅうしょを おくらせるよ…じょうだん、ぼくの もちだ。こんど なにか こわれても、たぶん だいじょうぶ。さいあくの ばあいは、ぼくに でんわして。じぶんで みに いくから。"
ph:
  - { id: ph-between, en: "between eight and noon", ja: "8時から 12時の 間に", match: "\\bbetween (\\d{1,2}(:\\d{2})?|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|noon)( ?(a\\.?m\\.?|p\\.?m\\.?))? and\\b", register: service, scene: "a repair window", trap: "その 時間に 来る ではない。間の どこかで 来る" }
  - { id: ph-should-be-fine, en: "it should be fine", ja: "たぶん 大丈夫", match: "\\bshould be (fine|okay|good|done|ready)\\b", register: service, scene: "a vague promise", trap: "should＝たぶん。保証 ではない" }
  - { id: ph-have-him-call, en: "I'll have him call you", ja: "彼から 電話させます", match: "\\bhave (him|her|them|someone|somebody|[A-Z][a-z]+) (call|text|email|come)\\b", register: service, scene: "passing on a message", trap: "have 'im＝彼に させる。電話するのは 彼" }
  - { id: ph-run-you, en: "it's gonna run you…", ja: "（費用が）〜かかる", match: "\\b(run|runs|cost|costs) you\\b", register: service, scene: "an estimate", trap: "run＝走る ではなく「費用が かかる」" }
  - { id: ph-worst-case, en: "worst case", ja: "最悪の 場合", match: "\\bworst[- ]case\\b", register: service, scene: "the bad outcome", trap: "起きる とは 限らない。最悪の 想定" }
  - { id: ph-take-a-look, en: "take a look at it", ja: "見て みる", match: "\\b(take|have) a look\\b", register: service, scene: "before the repair", trap: "見る だけ。まだ 直すと 決まって いない" }
  - { id: ph-shut-off, en: "shut off the water", ja: "水を 止める", match: "\\b(shut|shutting|turn|turning) off the (water|power|gas|valve)\\b|\\b(shut|turn) (it|the water) off\\b", register: service, scene: "a leak", trap: "shut off＝元栓を 止める。閉める 窓 ではない" }
  - { id: ph-on-his-way, en: "when he's on his way", ja: "向かって いる ときに", match: "\\bon (his|her|my|their|our) way\\b", register: service, scene: "the arrival", trap: "on 'is way。h が 落ちて「オニズウェイ」" }
