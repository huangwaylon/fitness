also: [tomodachi]
host: poppy
scene: living
sound: linking
cando:
  who: ともだちや どうりょう
  does: たんじょうびの パーティーに さそって、かんぱいする
  cond: パーティーの にぎやかな なかで
  catch: いつ・どこで、なにを もっていくか
  short: パーティーの さそいが わかる
  en: "I can follow friends and coworkers inviting me to a birthday party and making a toast, in a lively room, and catch when and where it is, what to bring and who the surprise is for."
status: voiced
letter:
  en: "Thank you for helping with Tia's party! You caught every detail: the time, the cake, the don't-tell-her part. She had no idea, and she totally cried when we all jumped out. I saved you a slice. Next year the party's at my place, and you'd better be there. Here's to you!"
  ja: "ティアの パーティーを てつだってくれて ありがとう！ じかんも ケーキも「ないしょね」も、ぜんぶ ききとって くれたね。ティアは ぜんぜん きづかなくて、みんなで とびだしたら ないちゃったの。ケーキを ひときれ とって あるよ。らいねんの パーティーは うちで やるから、ぜったい きてね。あなたに かんぱい！"
