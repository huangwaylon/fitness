# おいわいする (ev-bday): wave 1, かわ, イベント (docs/curriculum-units.md §9, §12). Friends planning a surprise birthday
# for Tia: the invitation (when, where, what to bring, who it's for, don't tell her), the gift everyone chips in for,
# hiding behind the couch and the toast in a loud room. Invitations by phone recycle ききかえす and でんわを おえる.
# きょうの ひとこと: "Here's to us. Same time next year?" (ふたりに かんぱい。らいねんも また ね？)
schema: 1
