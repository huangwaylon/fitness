# ききかえす (gl-clarify): wave 1, かわ's first glue unit (docs/curriculum-units.md §9, §12). Both directions of a repair:
# hearing a friend or a server put it right ("Sorry, I meant the 13th"), and picking your own move ("Did you say…?",
# "Could you say the last bit again?"). Mostly a noisy café, with a few calls; phrases from でんわを おえる recycled.
# きょうの ひとこと: "Sorry, say that again? I just like hearing your voice." (もう いっかい いって？ こえが ききたいだけ。)
schema: 1
unit: gl-clarify
name: ききかえす
stage: kawa
domain: glue
host: brewster
scene: cafe
sound: numbers
cando:
  who: ともだちや おみせの ひと
  does: ききかえされて いいなおす
  cond: カフェの ざわざわの なかで
  catch: なおした すうじや なまえ
  en: "I can follow a friend or a server repeating, rephrasing or correcting themselves when I ask again, at natural speed in a noisy café, and catch the corrected number, name or detail."
status: voiced
ph:
  - { id: ph-say-again, en: "say that again", ja: "もう いちど いって", match: "say (that|it) again", register: friend, scene: "a noisy café", trap: "「ワンモア」より Could you say that again?" }
  - { id: ph-i-meant, en: "I meant", ja: "いや、〜の つもりだった", register: friend, scene: "putting a detail right", trap: "mean の 過去形。まえの ことばを なおす 合図" }
  - { id: ph-actually-no, en: "actually, no", ja: "やっぱり ちがう", match: "\\bactually,? no\\b", register: friend, scene: "changing your mind mid-sentence", trap: "Actually, no の あとが ほんとうの こたえ" }
  - { id: ph-did-you-say, en: "did you say", ja: "〜って いった？", register: service, scene: "checking a number or a word", trap: "あがり調子で きく。A or B で きくと はやい" }
  - { id: ph-do-you-mean, en: "do you mean", ja: "〜って こと？", register: friend, scene: "two things that sound alike", trap: "Do you mean A or B? で どっちか きめてもらう" }
  - { id: ph-last-bit, en: "the last bit", ja: "さいごの ところ", match: "\\b(last|first|middle) (bit|part)\\b", register: friend, scene: "a word lost in the noise", trap: "bit＝すこし ではなく「ぶぶん」" }
  - { id: ph-sorry-q, en: "Sorry?", ja: "え、なに？", match: "(^|[.!?] )Sorry\\?", register: service, scene: "not catching something", trap: "あがり調子の Sorry? は あやまって いない" }
  - { id: ph-so-thats, en: "so that's", ja: "じゃあ 〜ね", register: friend, scene: "checking back what you heard", trap: "So that's 〜＝くりかえして かくにん。答えは Yep" }
  - { id: ph-i-mean, en: "I mean", ja: "つまり", match: "\\bI mean\\b", register: friend, scene: "saying it another way", trap: "I mean の あとが ほんとうに いいたい こと" }
