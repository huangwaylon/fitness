# でんわを おえる (gl-endcall): wave 1, かわ's second glue unit (docs/curriculum.md "Playing together", "The 21 units"). Pre-closings:
# a friend or a colleague winding up a call without saying so ("Anyway…", "I'll let you go", "I've got to run"), heard
# by mean and next, and the last thing agreed ("So that's Sunday at ten, then"), which recycles ききかえす's phrases.
# きょうの ひとこと: "Anyway, I'll let you go… just kidding, I'm never letting you go." (じゃあ そろそろ…うそ、ずっと はなさない。)
schema: 1
unit: gl-endcall
name: でんわを おえる
stage: kawa
domain: glue
host: goldie
scene: living
sound: gotta
cando:
  who: ともだちや しごとの あいて
  does: はっきり いわずに でんわを おえようと する
  cond: でんわの こもった おとで
  catch: もう きりたい きもちと さいごの やくそく
  short: でんわを おえたい サインが わかる
  en: "I can follow a friend or a colleague winding up a phone call without saying so directly, over a phone line, and catch that they want to hang up and what we agreed at the end."
status: voiced
letter:
  en: "I called you last night and talked for an hour without getting to the point. Anyway, I'm so glad you can tell when someone's ready to hang up. I never can! Thanks for listening to all my stories. It was so much fun. Talk soon, okay? Hugs from your favorite pup."
  ja: "ゆうべ でんわして、1じかんも はなしたのに ほんだいに たどりつかなかったね。まあ とにかく、あいてが そろそろ きりたい ときに きづいて くれて、うれしかった！ わたしは いつも きづけないの。たくさんの はなしを きいてくれて ありがとう。ほんとうに たのしかった。また はなそうね。あなたの おきにいりの こいぬより、ハグを こめて。"
ph:
  - { id: ph-let-you-go, en: "I'll let you go", ja: "そろそろ 切るね", match: "let you (go|get back)", register: friend, scene: "the end of a call", trap: "いかせて あげる ではなく「もう 切るね」" }
  - { id: ph-gotta-run, en: "I've got to run", ja: "もう いかなきゃ", match: "(got to|gotta|have to|need to) (run|go|dash|jump|head off|head out)", register: friend, scene: "a call cut short", trap: "run＝はしる ではなく「いそいで 切る」" }
  - { id: ph-anyway, en: anyway, ja: "まあ、とにかく", match: "^anyway\\b|[.!?,] anyway\\b", register: friend, scene: "winding a chat up", trap: "文の あたまの Anyway は おわりの 合図" }
  - { id: ph-talk-soon, en: "talk soon", ja: "またね", match: "\\b(talk|speak) (to you )?(soon|later|tomorrow|then)\\b", register: friend, scene: "saying goodbye on the phone", trap: "Talk soon＝またね。すぐ はなす やくそく ではない" }
  - { id: ph-keep-you, en: "I won't keep you", ja: "ひきとめないよ", match: "won't keep you|don't want to keep you", register: colleague, scene: "someone busy on the line", trap: "もう 切ろう の やさしい 言いかた" }
  - { id: ph-text-me, en: "text me", ja: "メッセージして", match: "\\btext (me|you)\\b", register: friend, scene: "after the call", trap: "text＝メッセージを おくる。テキスト ではない" }
  - { id: ph-see-you-then, en: "see you then", ja: "じゃあ その ときに", match: "\\bsee (you|ya) (then|there|in a (sec|bit|minute)|on|at|tomorrow|saturday|sunday|friday|thursday)\\b", register: friend, scene: "the last thing agreed", trap: "then＝その ときに。いつかを ききのがさない" }
  - { id: ph-catch-up, en: "good to catch up", ja: "はなせて よかった", match: "(good|nice|great|lovely) (to catch up|catching up)|really catch up", register: friend, scene: "a long chat ending", trap: "catch up＝きんきょうを はなす。おいつく ではない" }
