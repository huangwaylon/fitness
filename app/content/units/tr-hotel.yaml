# ホテルで こまった (tr-hotel): wave 1, もり. The front desk on a room problem: what they can do, what they can't, and
# what it costs. The main sound is contrast ("not tonight, but tomorrow"; "free till twelve, half the rate after").
# Reused: level 4's nine hotel items (the dry run's); new: mu-/dmu- items, inline.
# きょうの ひとこと: "What I can do is make dinner tonight." (かわりに、こんやは わたしが ばんごはんを つくるね。)

schema: 1
unit: tr-hotel
name: ホテルで こまった
stage: mori
domain: tabi
host: diana
scene: lobby
sound: contrast
cando:
  who: ホテルの フロントの ひと
  does: へやの もんだいへの たいおうを せつめいする
  cond: ていねいだけど はやい ことばで
  catch: できる こと・できない ことと ついかの りょうきん
  short: ホテルの もんだいを ききとれる
  en: I can follow hotel front-desk staff explaining what they can do about a room problem, in polite but fast speech at the desk or on the phone, and catch what's possible, what isn't, and any extra charge.
status: voiced
letter:
  en: "I'm afraid I have a confession: I was the guest with the leaky sink. You followed every word at that front desk, even over all the lobby noise. Thank you, darling. They gave me a complimentary breakfast for my trouble. Next time you travel, take me along. I'll do the complaining, and you do the listening."
  ja: "あいにく、うちあけたい ことが あるの。あの みずもれの へやの きゃくは、わたしだったのよ。ロビーが ざわざわ して いたのに、フロントの はなしを ぜんぶ ききとって くれたわね。ありがとう。おわびに、むりょうの ちょうしょくを もらったの。こんど りょこう する ときは、わたしも つれていって。もんくを いうのは わたし、きくのは あなたよ。"
ph:
  - { id: ph-im-afraid, en: I'm afraid, ja: あいにく, register: service, scene: hotel desk, trap: 「こわい」ではなく「あいにく」。悪い知らせの合図 }
  - { id: ph-fully-booked, en: fully booked, ja: 満室です, register: service, scene: hotel desk, trap: booked は「予約済み」。本の book ではない }
  - { id: ph-what-i-can-do, en: what I can do is, match: \bwhat (I|we) can do is\b, ja: かわりに できるのは, register: service, scene: hotel desk, trap: 断りの後の代案。ここから先が本題 }
  - { id: ph-best-i-can-do, en: the best I can do, ja: これが せいいっぱい, register: service, scene: hotel desk, trap: 最大限の譲歩。これ以上の交渉は難しい }
  - { id: ph-small-charge, en: a small charge, match: \bsmall (additional |extra )?(charge|supplement|fee)\b, ja: すこし ついかりょうきん, register: service, scene: hotel desk, trap: small でも有料。無料と早合点しない }
  - { id: ph-complimentary, en: complimentary, ja: むりょうの, register: service, scene: hotel desk, trap: compliment（ほめる）ではなく「無料」 }
  - { id: ph-waive, en: waive the fee, match: \bwaive\b, ja: りょうきんを めんじょする, register: service, scene: hotel desk, trap: wave（手を振る）と同じ音。免除＝払わなくていい }
  - { id: ph-send-up, en: send someone up, match: "\\bsend (\\w+ ){1,3}up\\b", ja: へやに むかわせる, register: service, scene: hotel phone, trap: up＝客室へ。人や物を部屋に届ける }
  - { id: ph-meantime, en: in the meantime, ja: それまでの あいだ, register: service, scene: hotel desk, trap: 修理などが済むまでの「つなぎ」の提案 }
items:
  - id: dmu-twin-beds
    lv: 4
    type: gist
    en: Hi, checking in. Lopez, two nights. Welcome. Ah, I'm afraid you've been booked into two queens, not a king, and we're fully booked tonight. Sorry, did you say two queens? Oh. That's not ideal. It's kind of our anniversary. What I can do is move you to a king tomorrow, and breakfast is complimentary both mornings. OK, that works. Thanks for taking care of it. My pleasure. Enjoy your stay.
    ja: 明日キングの部屋に移れて、朝食が無料。
    note: 今夜は満室で無理。What I can do is の後が代案
    speaker: lopez
    voice: us
    cast: us-m6
    choices: [ "A king tomorrow, plus free breakfast.", "A king tonight, for a small charge.", A free upgrade to a suite tonight. ]
    answer: 0
    focus: What I can do is
    ask: ホテルが できる ことは？
    tags: { seed: 3, register: service, pragmatic: hedge, conditions: [ desk ], features: [ contrast ] }
    lines:
      - who: lopez
        cast: us-m6
        en: Hi, checking in. Lopez, two nights.
        ja: こんにちは、チェックインを。ロペスで2泊です。
      - who: diana
        cast: us-f4
        en: Welcome. Ah, I'm afraid you've been booked into two queens, not a king, and we're fully booked tonight.
        ja: ようこそ。あ、申し訳ありません、キングではなくクイーン2台のお部屋になっておりまして、今夜は満室なんです。
      - who: lopez
        cast: us-m6
        en: Sorry, did you say two queens? Oh. That's not ideal. It's kind of our anniversary.
        ja: すみません、クイーン2台って言いました？ えっ。それはちょっと。一応、記念日なんですよ。
        tts: Sorry, did you say two queens? Oh. That's not ideal. It's kinda our anniversary.
      - who: diana
        cast: us-f4
        en: What I can do is move you to a king tomorrow, and breakfast is complimentary both mornings.
        ja: かわりに、明日キングのお部屋にお移りいただけます。朝食も2日とも無料でご用意します。
      - who: lopez
        cast: us-m6
        en: OK, that works. Thanks for taking care of it.
        ja: わかりました、それで大丈夫です。対応ありがとう。
      - who: diana
        cast: us-f4
        en: My pleasure. Enjoy your stay.
        ja: どういたしまして。ごゆっくりどうぞ。
