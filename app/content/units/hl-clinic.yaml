# 受付と 薬局 (hl-clinic): wave 2a, かわ, からだ (docs/curriculum-wave2.md §3.1). A clinic's front desk on the phone and at
# the counter (the soonest slot, coming in early, the insurance card) and a pharmacist explaining how to take a medicine
# (twice a day, with food) and whether you're allergic. The numbers: times (ten-fifteen / ten-fifty), the 13th / 30th,
# doses, a callback number. "Your prescription's ready" replaces the overused drowsy line (wave 2 §3.1 †).
# ききかえす's "did you say", "so that's", "Sorry?" and "I meant" and でんわを おえる's "see you then" are recycled.
# Its call: call-clinic-move (content/listen/s1-call-b.yaml).
# きょうの ひとこと: "Take care of yourself, twice a day. With food." (1日2回、ちゃんと 自分を 大事にしてね。ごはんと 一緒に。)
schema: 1
unit: hl-clinic
name: 受付と 薬局
stage: kawa
domain: karada
host: pashmina
scene: clinic
sound: numbers
cando:
  who: 受付や 薬剤師
  does: 予約と 飲み方を 説明する
  cond: 電話や カウンターで
  catch: 日時・回数・注意
  short: 予約と 薬の 飲み方が わかる
  en: "I can follow a receptionist or a pharmacist explaining an appointment and how to take a medicine, on the phone or at the counter, and catch the day and time, how often, and what to watch out for."
status: draft
letter:
  en: "Your prescription's ready, and so are you! You caught the soonest appointment, a quarter after ten, and twice a day with food, even on a noisy phone line. Next time, come in a few minutes early and bring your insurance card. And take care of yourself, okay? I mean it!"
  ja: "おくすり できたよ、あなたも ばっちりね！ いちばん はやい よやくも、10じ 15ふんも、1にち 2かい しょくじと いっしょにも、ざつおんの おおい でんわで ちゃんと ききとれた。こんどは すこし はやめに きて、ほけんしょうも もってきてね。それと、からだを だいじに してね。ほんとうよ！"
ph:
  - { id: ph-twice-a-day, en: "twice a day", ja: "1日 2回", match: "\\b(once|twice|three times|four times) a day\\b", register: service, scene: "the pharmacy counter", trap: "twice＝2回。2日 ではない" }
  - { id: ph-with-food, en: "with food", ja: "食事と 一緒に（食後に）", match: "\\bwith (food|a meal|meals)\\b", register: service, scene: "how to take it", trap: "空腹で 飲まない。食べ物に まぜる ではない" }
  - { id: ph-soonest, en: "the soonest we have", ja: "いちばん 早い 空き", match: "\\b(the )?(soonest|earliest) (we have|I have|I can do|we can do)\\b", register: service, scene: "booking an appointment", trap: "soonest＝最短。それより 前は 無理" }
  - { id: ph-allergic, en: "are you allergic to…?", ja: "〜に アレルギーは ありますか？", match: "\\ballergic to\\b", register: service, scene: "before a prescription", trap: "発音は「アラージック」。アレルギー と 違う" }
  - { id: ph-prescription-ready, en: "your prescription's ready", ja: "お薬が できました", match: "\\bprescription('s| is)?( not)?( quite| all)? ready\\b", register: service, scene: "picking up medicine", trap: "prescription＝処方薬。説明書 ではない" }
  - { id: ph-come-in, en: "can you come in at…?", ja: "〜に 来院 できますか？", match: "\\b(come|coming) in (at|on|today|tomorrow|this|next|early|around|for|about|ten|a few|in)\\b", register: service, scene: "an appointment time", trap: "come in＝(病院に) 来る。中に 入って ではない" }
  - { id: ph-insurance, en: "your insurance card", ja: "保険証", match: "\\binsurance\\b", register: service, scene: "the front desk", trap: "insurance＝保険。毎回 カードを 見せる" }
  - { id: ph-minutes-early, en: "a few minutes early", ja: "数分 早めに", match: "\\b(a few|\\w+) minutes early\\b", register: service, scene: "before a visit", trap: "early＝早めに 着く。予約が 早まる ではない" }
items:
  # ---- であい: booking, then the pharmacy ----
  - id: dk-booking
    lv: 3
    type: gist
    speaker: pashmina
    voice: us
    cast: us-f5
    en: "Sunny Clinic, this is Pashmina. How can I help you? Hi, I'd like to make an appointment. I've had a sore throat for a few days. Okay. The soonest we have is Thursday at 10:15. Does that work? Sorry, did you say 10:15 or 10:50? 10:15. A quarter after ten. And please come in a few minutes early. Got it. Thursday at 10:15. Thanks!"
    ja: "木曜の10時15分。数分早めに行く。"
    note: "ten-fifTEEN＝10:15。a quarter after ten とも"
    choices: ["Thursday at 10:15, a few minutes early.", "Thursday at 10:50.", "Today, as soon as possible."]
    answer: 0
    cja: ["木曜の10時15分。数分早めに。", "木曜の10時50分。", "今日、できるだけ早く。"]
    why: "最短の空きは木曜。15か50かを聞き返し、A quarter after ten（10時15分）と確かめた。a few minutes early は「数分早めに」。"
    ctx: "のどが痛くて、クリニックに電話しています"
    focus: "The soonest we have is Thursday at 10:15."
    ask: "予約は いつ？"
    scene: living
    channel: phone
    cond: { kind: phone, level: light }
    tags: { seed: 14, register: service, pragmatic: literal, conditions: [phone], features: [numbers, teen-ty] }
    lines:
      - { who: pashmina, cast: us-f5, en: "Sunny Clinic, this is Pashmina. How can I help you?", ja: "サニークリニック、パシュミナです。どうなさいましたか？" }
      - { who: kid-cat, cast: us-m1, en: "Hi, I'd like to make an appointment. I've had a sore throat for a few days.", ja: "こんにちは、予約を取りたいんです。数日前からのどが痛くて。" }
      - { who: pashmina, cast: us-f5, en: "Okay. The soonest we have is Thursday at 10:15. Does that work?", tts: "Okay. The soonest we have is Thursday at ten-fifteen. Does that work?", ja: "わかりました。いちばん早い空きは木曜の10時15分です。ご都合はいかがですか？" }
      - { who: kid-cat, cast: us-m1, en: "Sorry, did you say 10:15 or 10:50?", tts: "Sorry, did you say ten-fifteen or ten-fifty?", ja: "すみません、10時15分ですか、10時50分ですか？" }
      - { who: pashmina, cast: us-f5, en: "10:15. A quarter after ten. And please come in a few minutes early.", tts: "Ten-fifteen. A quarter after ten. And please come in a few minutes early.", ja: "10時15分、10時を15分過ぎたところです。それと、数分早めにお越しください。" }
      - { who: kid-cat, cast: us-m1, en: "Got it. Thursday at 10:15. Thanks!", tts: "Got it. Thursday at ten-fifteen. Thanks!", ja: "わかりました。木曜の10時15分ですね。ありがとう！" }
  - id: dk-pharmacy-pick
    lv: 3
    type: next
    speaker: tia
    voice: us
    cast: us-f4
    en: "Hi there! Your prescription's ready. Can I get your date of birth? Sure. March 3rd. Perfect. Take one tablet twice a day, with food. Any questions?"
    ja: "確認ですが、朝と夜、食事のあとですね？"
    note: "twice a day, with food＝1日2回、食事と 一緒に"
    choices: ["Just to check, morning and night, after meals?", "Food? No thanks, I already ate.", "Twice? So I come back again later?"]
    answer: 0
    cja: ["確認ですが、朝と夜、食事のあとですね？", "食べ物？ いえ、もう食べました。", "2回？ じゃあ、あとでまた来るんですか？"]
    why: "twice a day は「1日2回」、with food は「食事と一緒に」。朝晩・食後かと確かめるのが自然。食事をすすめられたわけでも、2回来るわけでもない。"
    ctx: "薬局で、処方薬を受け取ります"
    focus: "Take one tablet twice a day, with food."
    ask: "次の ひとことは？"
    scene: pharmacy
    tags: { seed: 13, register: service, pragmatic: literal, features: [numbers] }
    lines:
      - { who: tia, cast: us-f4, en: "Hi there! Your prescription's ready. Can I get your date of birth?", ja: "こんにちは！ お薬ができていますよ。生年月日をお願いできますか？" }
      - { who: dom, cast: us-m1, en: "Sure. March 3rd.", tts: "Sure. March third.", ja: "はい。3月3日です。" }
      - { who: tia, cast: us-f4, en: "Perfect. Take one tablet twice a day, with food. Any questions?", ja: "ありがとうございます。1日2回、1錠ずつ、食事と一緒に飲んでください。何かご質問は？" }
