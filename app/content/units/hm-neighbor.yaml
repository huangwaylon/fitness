  catch: 頼みごとと 本当の 用件
  short: 近所の 人の 頼みが わかる
  en: "I can follow a neighbor making small talk and asking a favor at the door, at natural speed, and catch what they're asking for and the real reason they came by."
status: draft
letter:
  en: "Thanks for keeping an eye on things while I was away. My package arrived safe, and the plants are still alive! I hate to ask again so soon, but would you mind joining us for dinner Saturday? It's no big deal, just a few neighbors. Just knock when you're ready. Yes, yes!"
  ja: "るすの あいだ、いろいろ みて いて くれて ありがとう。にもつは ぶじに とどいたし、うえきも まだ げんき！ また すぐ たのむのは きが ひけるけど、どようの ゆうごはんに きて もらえないかな？ たいした ことじゃ ないよ、きんじょの ひとが すこし あつまる だけ。じゅんびが できたら ノックしてね。はいはい！"
ph:
  - { id: ph-just-so-you-know, en: "just so you know", ja: "念のため 言って おくと", match: "\\bjust so (you|ya) know\\b", register: neighbour, scene: "the real point of a chat", trap: "前置き。このあとが 本当の 用件" }
  - { id: ph-hate-to-ask, en: "I hate to ask, but…", ja: "頼みにくいんだけど", match: "\\bhate to (ask|bother you)\\b", register: neighbour, scene: "a favor at the door", trap: "嫌い ではなく、お願いの 前ぶれ" }
  - { id: ph-no-big-deal, en: "no big deal", ja: "大した ことじゃない", match: "\\b(no|not a) big deal\\b", register: neighbour, scene: "softening a request", trap: "大きい 取引 ではなく「気にしないで」" }
  - { id: ph-would-you-mind, en: "would you mind…?", ja: "〜して もらえますか？", match: "\\b(would|do) you mind\\b", register: neighbour, scene: "a polite request", trap: "Yes は「いやだ」。OK なら Not at all" }
  - { id: ph-keep-an-eye, en: "keep an eye on", ja: "見て おく・気を つける", match: "\\bkeep(ing)? an eye on\\b", register: neighbour, scene: "while someone's away", trap: "目を 置く ではなく「見守る」" }
  - { id: ph-heads-up, en: "a heads-up", ja: "前もって 知らせる", match: "\\bheads[- ]up\\b", register: neighbour, scene: "news about the building", trap: "頭を 上げろ ではなく「予告」" }
  - { id: ph-stop-by, en: "stop by", ja: "ちょっと 寄る", match: "\\b(stop|drop|swing) by\\b", register: neighbour, scene: "a quick visit", trap: "止まる ではなく「立ち寄る」" }
  - { id: ph-any-chance, en: "any chance you could…?", ja: "〜して もらえたり する？", match: "\\bany chance\\b", register: friend, scene: "a soft favor", trap: "可能性の 話 ではなく、遠回しな お願い" }
