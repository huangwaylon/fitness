# 近所の 人 (hm-neighbor): wave 2a, かわ, いえ (docs/curriculum-wave2.md §3.1). A neighbor at the door: small talk that
# carries a favor ("I hate to ask…", "Would you mind…?", "Any chance you could…?"), a soft complaint ("No big deal,
# but…"), a heads-up, and the real point after "Just so you know". The elision: jus' so ya know, nex' door, las' night,
# I hay' ta ask. The trap of "Would you mind?": not at all means yes. でんわを おえる's "anyway", "I'll let you go",
# "talk soon" and ききかえす's "so that's" are recycled. Its call: call-neighbor-cat (content/listen/s1-call-b.yaml).
# きょうの ひとこと: "I hate to ask, but would you mind giving me a hug?" (頼みにくいんだけど、ハグして くれない？)
schema: 1
