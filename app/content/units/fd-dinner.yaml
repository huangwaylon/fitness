# 食事で 決める (fd-dinner): wave 2b, もり, たべもの (docs/curriculum.md "The 21 units"). Friends deciding where and what
# to eat ("what do you feel like?", "I'm good with whatever", "let's share a few plates") and a server's specials and
# allergy questions ("does it have nuts in it?", "I can't do dairy"), then the split. Catch what they settled on and who
# can't eat what. The sound: chains, words run together (whaddaya, nutsinnit, goodwith, sharea few, splittit). The
# people who recur: Kid Cat's nut allergy, Judy's no dairy, Cherry's no spicy. ききかえす's "actually, no" and "I mean",
# 注文する's "I'm good", "comes with" and "extra", 受付と 薬局's "allergic to" and お店で 聞く's "honestly" are recycled.
# Its call: call-dinner-six (content/listen/s2-call-c.yaml).
# きょうの ひとこと: "What do you feel like? I'm good with whatever." (何 食べたい？ 私は 何でも いいよ。)
schema: 1
unit: fd-dinner
name: 食事で 決める
stage: mori
domain: tabemono
host: cherry
scene: restaurant
sound: chain
cando:
  who: 友だちと 店員
  does: おすすめや 食事制限を 話す
  cond: 速い 会話で
  catch: 何に 決まったか・誰が 何を 食べられないか
  short: 何を 食べるかと 食事制限が わかる
  en: "I can follow friends and a server talking about the specials and what people can't eat, in fast casual speech, and catch what we settled on and who can't eat what."
status: voiced
letter:
  en: "Okay, I'm impressed. You caught the specials, the nuts in the pesto, and who can't do dairy, all at full speed. Next time someone asks what you feel like, don't just say you're good with whatever. Pick something! Then we'll share a few plates and split it. My treat for dessert."
  ja: "ねえ、すごいじゃない。きょうの おすすめも、ジェノベーゼの ナッツも、だれが にゅうせいひんを たべられないかも、ぜんぶ はやくちで ききとれたね。こんど「なに たべたい？」って きかれたら、「なんでも いい」じゃなくて、なにか えらんでね！ そしたら みんなで いくつか たのんで、わりかんに しよう。デザートは わたしの おごり。"
ph:
  - { id: ph-feel-like, en: "what do you feel like?", ja: "何 食べたい？", match: "\\bwhat (do|did) you feel like\\b|\\bfeel like (eating|having|getting)\\b", register: friend, scene: "choosing where to eat", trap: "気分 ではなく「何が いい？」。whaddaya と つながる" }
  - { id: ph-special, en: "the special tonight", ja: "今夜の おすすめ", match: "\\bspecials?\\b", register: service, scene: "the server's specials", trap: "特別な ではなく、その日の おすすめ 料理" }
  - { id: ph-good-with-whatever, en: "I'm good with whatever", ja: "何でも いいよ", match: "\\b(good|fine|okay|cool) with (whatever|anything)\\b", register: friend, scene: "deciding together", trap: "本当に 何でも いいとは 限らない。後の 一言を 聞く" }
  - { id: ph-in-it, en: "does it have nuts in it?", ja: "〜は 入って いますか？", match: "\\bhave (any )?[a-z]+ in (it|them)\\b", register: service, scene: "asking about ingredients", trap: "in it が「イニッ」と つながる。乗って いる ではない" }
  - { id: ph-share-plates, en: "share a few plates", ja: "何品か 頼んで みんなで 分ける", match: "\\bshar(e|ing) (a few|some|a couple of|the) (plates|things|dishes)\\b", register: friend, scene: "ordering for the table", trap: "皿を 分け合う ではなく、料理を 取り分ける" }
  - { id: ph-cant-do, en: "I can't do dairy", ja: "乳製品は だめなの", match: "\\bcan't (do|have|eat) (dairy|gluten|spicy|meat|pork|shellfish|nuts|onions|garlic|red meat)\\b", register: friend, scene: "what you can't eat", trap: "do＝食べる。「できない」 ではなく 食べられない" }
  - { id: ph-in-the-mood, en: "I'm in the mood for…", ja: "〜の 気分", match: "\\bin the mood for\\b", register: friend, scene: "what you want to eat", trap: "機嫌 ではなく「〜が 食べたい 気分」" }
  - { id: ph-split, en: "split it", ja: "分ける・割り勘に する", match: "\\bsplit (it|the (bill|check)|this|everything|[a-z]+ ways)\\b", register: friend, scene: "dessert or the bill", trap: "split it が「スプリッティッ」と つながる" }
