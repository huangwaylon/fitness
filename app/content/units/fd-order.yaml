# 注文する (fd-order): wave 2a, かわ, たべもの (docs/curriculum-wave2.md §3.1). A server checking an order in a busy
# American diner: what comes with it, what's on the side, what costs extra, and the table talk around it ("Are you
# still working on that?", "I'm good"). The weak forms of or / for / of / to ("soup er salad", "fer here er ta go").
# ききかえす's "Sorry?", "did you say" and "so that's" are recycled. Its call: call-pizza-order (content/listen/s1-call-b.yaml).
# きょうの ひとこと: "Are you still working on that? …Can I have a bite?" (まだ 食べてる？…ひとくち ちょうだい。)
schema: 1
unit: fd-order
name: 注文する
stage: kawa
domain: tabemono
host: brewster
scene: restaurant
sound: weak-form
cando:
  who: 店員
  does: 注文の 確認や 質問を する
  cond: レストランの ざわざわの 中で
  catch: 何が 来るか・追加の 料金
  short: 注文の 確認が 聞き取れる
  en: "I can follow a server checking my order and asking questions, over a busy restaurant at natural speed, and catch what's coming and any extra charge."
status: draft
letter:
  en: "You ordered like a regular today. Soup or salad, for here or to go, dressing on the side: you caught every question, even with the lunch crowd. Next time, try the pie. It comes with a little extra whipped cream, on the house. I'll have a cup ready for you. Coo."
  ja: "きょうは じょうれんさん みたいに ちゅうもん できたね。スープか サラダか、てんないか もちかえりか、ドレッシングは べつで。おひるの こみあいの なかでも、ぜんぶの しつもんが きこえてた。こんどは パイを ためして みて。ホイップクリームを すこし おおめに、おみせからの サービスで。コーヒーも 1ぱい よういして おくよ。クルッ。"
ph:
  - { id: ph-for-here, en: "for here or to go", ja: "店内で？ 持ち帰り？", match: "\\bfor here\\b", register: service, scene: "a counter or a café", trap: "to go＝持ち帰り。「行く」ではない" }
  - { id: ph-soup-salad, en: "soup or salad", ja: "スープか サラダか", match: "\\bsoup or (a )?salad\\b", register: service, scene: "what comes with a main", trap: "「スーパーサラダ」ではない。A か B かの質問" }
  - { id: ph-on-the-side, en: "on the side", ja: "別添えで", match: "\\bon the side\\b", register: service, scene: "sauce and dressing", trap: "横に置く ではなく「別の器で」" }
  - { id: ph-still-working, en: "are you still working on that?", ja: "まだ 食べて いますか？", match: "\\bstill working on (that|this|it|those|the)\\b", register: service, scene: "clearing plates", trap: "仕事ではない。「お皿を下げても いい？」" }
  - { id: ph-right-back, en: "I'll be right back with…", ja: "すぐ お持ちします", match: "\\b(be|coming|come) right (back|out|over)\\b", register: service, scene: "the server leaving the table", trap: "戻るだけでなく「持ってくる」約束" }
  - { id: ph-comes-with, en: "it comes with", ja: "〜が 付いて きます", match: "\\bcomes? with\\b", register: service, scene: "what's included", trap: "一緒に来る人 ではなく「セットで付く」" }
  - { id: ph-im-good, en: "I'm good", ja: "大丈夫です（いりません）", match: "\\b(I'm|we're) good\\b", register: service, scene: "turning down more", trap: "元気です ではなく「結構です」" }
  - { id: ph-extra, en: "it's two dollars extra", ja: "追加料金が かかる", match: "\\b(dollars?|bucks|\\$[0-9.]+) extra\\b|\\bextra (charge|fee)\\b|\\b(is|it's|that's) extra\\b", register: service, scene: "add-ons and swaps", trap: "extra＝追加料金。「おまけ」ではない" }
items:
  # ---- であい: an order at a diner ----
  - id: dk-diner-order
    lv: 3
    type: gist
    speaker: brewster
    voice: us
    cast: us-m3
    en: "Hi there! Are you guys ready to order, or do you need a minute? I think we're ready. Can I get the chicken sandwich? Sure. That comes with fries or a side salad. Salad, please, with the dressing on the side. You got it. Anything to drink? Just water, thanks! Perfect. I'll be right back with your water."
    ja: "チキンサンドとサラダ。ドレッシングは別添え。"
    note: "on the side＝別添え。サラダに かけずに 来る"
    choices: ["A chicken sandwich and a salad, dressing on the side.", "A chicken sandwich and fries.", "A salad with the dressing already on it."]
    answer: 0
    cja: ["チキンサンドとサラダ。ドレッシングは別添え。", "チキンサンドとポテト。", "ドレッシングがかかったサラダ。"]
    why: "fries or a side salad から Salad を選んだ。dressing on the side は別の器で来るので、かかっていない。ポテトは選ばなかった。"
    ctx: "ダイナーで、店員が注文を取りに来ました"
    focus: "with the dressing on the side"
    ask: "何が 来る？"
    scene: cafe
    cond: { kind: cafe, level: light }
    tags: { seed: 27, register: service, pragmatic: literal, conditions: [cafe], features: [weak-form] }
    lines:
      - { who: brewster, cast: us-m3, en: "Hi there! Are you guys ready to order, or do you need a minute?", ja: "いらっしゃいませ！ ご注文お決まりですか、それとももう少しお待ちしましょうか？" }
      - { who: maple, cast: us-f3, en: "I think we're ready. Can I get the chicken sandwich?", ja: "決まったと思います。チキンサンドをお願いできますか？" }
      - { who: brewster, cast: us-m3, en: "Sure. That comes with fries or a side salad.", ja: "かしこまりました。ポテトかサラダが付きます。" }
      - { who: maple, cast: us-f3, en: "Salad, please, with the dressing on the side.", ja: "サラダで、ドレッシングは別にしてください。" }
      - { who: brewster, cast: us-m3, en: "You got it. Anything to drink?", ja: "承知しました。お飲み物は？" }
      - { who: maple, cast: us-f3, en: "Just water, thanks!", ja: "お水だけで、ありがとう！" }
      - { who: brewster, cast: us-m3, en: "Perfect. I'll be right back with your water.", ja: "かしこまりました。すぐお水をお持ちします。" }
