    why: "For here or to go? は「店内で食べるか、持ち帰りか」。to go を「行く」と取ると、行き先を答えてしまう。Here you are は物を渡すときの言葉。"
    ctx: "サンドイッチ店のカウンターで注文中です"
    focus: "For here or to go?"
    ask: "次の ひとことは？"
