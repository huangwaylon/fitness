    speaker: kid-cat
    voice: us
    cast: us-m1
    en: "Quick question. Does the pad thai have peanuts in it? It does, but I can ask the kitchen to leave them off. Sorry? Leave them what? Leave them off. No peanuts. Or I can put them on the side for your friend. Oh, perfect. No peanuts, then. Thanks!"
    ja: "ピーナッツなしのパッタイが来る。"
    note: "leave off＝入れない。on the side は 別添え"
    choices: ["The pad thai will come with no peanuts.", "It'll come with peanuts on top.", "He'll order a different dish."]
    answer: 0
    cja: ["ピーナッツなしのパッタイが来る。", "ピーナッツがのって来る。", "別の料理を頼む。"]
    why: "leave them off は「入れないでおく」。on the side（別添え）という案も出たが、最後に No peanuts, then と決めた。料理は変えていない。"
    ctx: "タイ料理店で、料理の中身を聞いています"
    focus: "No peanuts, then."
    ask: "パッタイは どう なる？"
    scene: cafe
    cond: { kind: cafe, level: light }
    tags: { seed: 27, register: service, pragmatic: literal, conditions: [cafe], features: [weak-form] }
    lines:
      - { who: kid-cat, cast: us-m1, en: "Quick question. Does the pad thai have peanuts in it?", ja: "ちょっと質問です。パッタイにピーナッツは入っていますか？" }
      - { who: cherry, cast: us-f6, en: "It does, but I can ask the kitchen to leave them off.", ja: "入っていますが、抜くようキッチンに頼めますよ。" }
      - { who: kid-cat, cast: us-m1, en: "Sorry? Leave them what?", ja: "え？ 何て？" }
      - { who: cherry, cast: us-f6, en: "Leave them off. No peanuts. Or I can put them on the side for your friend.", ja: "抜くんです。ピーナッツなし。それか、お連れの方用に別添えにもできます。" }
      - { who: kid-cat, cast: us-m1, en: "Oh, perfect. No peanuts, then. Thanks!", ja: "あ、ばっちり。じゃあピーナッツなしで。ありがとう！" }
