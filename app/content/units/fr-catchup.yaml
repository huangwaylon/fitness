# 久しぶりに 会う (fr-catchup): wave 2b, もり, ともだち (docs/curriculum.md "The 21 units"). Friends catching up at a café:
# "how have you been?", "you'll never guess…", "long story short", "wait, back up", "whatever happened with…?",
# "that sounds rough", "good for you!", "catch me up". Catch what happened and how they feel about it. The sound:
# self-repair, the story told and fixed on the fly (Denver, no, Boulder; the 13th, I meant the 30th; her brother, I
# mean her cousin). Who recurs: Maple quit the bank and teaches yoga; Goldie broke her wrist skiing; Whitney moved to
# Boulder and adopted Biscuit; Rosie sold her car; Maple's brother is getting married in July. ("No way!" is heard, the
# st-johnny story's phrase.) ききかえす's "actually, no", "I mean" and "I meant", でんわを おえる's "anyway", "gotta run"
# and "text me", よていを かえる's "work for" and お店で 聞く's "honestly" are recycled.
# Its call: call-brunch-moved (content/listen/s2-call-c.yaml).
# きょうの ひとこと: "How have you been? Catch me up!" (元気だった？ 近況 聞かせて！)
schema: 1
unit: fr-catchup
name: 久しぶりに 会う
stage: mori
domain: tomodachi
host: rosie
scene: cafe
sound: self-repair
cando:
  who: 友だち
  does: 近況や 出来事を 話す
  cond: カフェの ざわざわで
  catch: 何が あったか・相手の 気持ち
  short: 友だちの 近況と 気持ちが わかる
  en: "I can follow friends catching up on their news and telling stories, in a noisy café, and catch what happened and how they feel about it."
status: voiced
letter:
  en: "How have you been? Wait, don't answer, I already know: you've been listening! You caught every story today, even when Maple fixed hers halfway through. Long story short, I'm so proud of you. Good for you! Let's get brunch again soon, and you can catch me up on everything."
  ja: "げんきだった？ まって、こたえなくて いいよ。もう しってる。ずっと ききとりを がんばってたんだよね！ きょうは どの はなしも ききとれた。メイプルが とちゅうで いいなおした ときもね。てみじかに いうと、すごく ほこらしい。よく がんばったね！ また すぐ ブランチ しよう。そのとき ぜんぶ きかせてね。"
ph:
  - { id: ph-youll-never-guess, en: "you'll never guess…", ja: "聞いて、びっくりするよ", match: "\\byou'?ll never guess\\b", register: friend, scene: "starting a story", trap: "当てて ほしい ではない。話の 前置き" }
  - { id: ph-long-story-short, en: "long story short", ja: "手短に 言うと", match: "\\blong story short\\b", register: friend, scene: "skipping to the end", trap: "長い 話を するの ではなく、結論だけ 言う" }
  - { id: ph-wait-back-up, en: "wait, back up", ja: "待って、ちょっと 戻って", match: "\\bwait,? back up\\b|\\bback up a (sec|second|bit|minute)\\b", register: friend, scene: "a detail you missed", trap: "後ろに 下がる ではなく、話を 戻して" }
  - { id: ph-sounds-rough, en: "that sounds rough", ja: "それは 大変だね", match: "\\b(that's|that sounds|sounds|that) (so |really |super |pretty )?(rough|tough)\\b", register: friend, scene: "hearing bad news", trap: "rough＝大変。荒い・乱暴 ではない" }
  - { id: ph-what-happened-with, en: "whatever happened with…?", ja: "〜って その後 どう なった？", match: "\\b(what|whatever) happened (with|to)\\b", register: friend, scene: "asking for an update", trap: "事故 ではない。その後の 話を 聞く" }
  - { id: ph-how-have-you-been, en: "how have you been?", ja: "元気だった？", match: "\\bhow (have you|ya|you) been\\b", register: friend, scene: "meeting after a long time", trap: "How ya been。今の 様子より「最近 どう」" }
  - { id: ph-good-for-you, en: "good for you!", ja: "よかったね・えらい！", match: "\\bgood for (you|her|him|them)\\b", register: friend, scene: "good news", trap: "体に いい ではなく、ほめる・祝う 一言" }
  - { id: ph-catch-me-up, en: "catch me up", ja: "近況を 聞かせて", match: "\\bcatch (me|you|us) up\\b", register: friend, scene: "arriving late", trap: "追いつく ではなく「何が あったか 教えて」" }
