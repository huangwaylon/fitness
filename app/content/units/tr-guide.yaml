# ともだちを あんない (tr-guide): wave 1, もり. A friend visiting Tokyo: the learner is the host, the friend's questions
# and worries are the listening, the replies are the learner's lines (plan §12's writers' note). The main sound is dunno
# ("I dunno if", "kinda worried": the worry said softly). Reused: r4-ginza (the dry run's one item); new: mu-/dmu- items.
# きょうの ひとこと: "The thing is, I don't want this trip to end." (じつは、この たびが おわって ほしくない。)

schema: 1
unit: tr-guide
name: ともだちを あんない
stage: mori
domain: tabi
also:
  - machi
host: gulliver
scene: street
sound: dunno
cando:
  who: とうきょうに きた ともだち
  does: いきたい ところや こまっている ことを はなす
  cond: えきや まちの ざつおんの なかで
  catch: なにが したいかと なにが しんぱいか
  short: ともだちの したい ことが わかる
  en: I can follow a friend visiting Tokyo talking about where they want to go and what's confusing them, over station and street noise at natural speed, and catch what they want to do and what's worrying them.
status: voiced
letter:
  en: "Ahoy, matey! Thanks for showing me around Tokyo. The thing is, I never told you how nervous I was about getting lost. I nearly missed the last train twice! You always knew what I was asking, even when I mumbled. And that view from the tower? Amazing. How about another adventure next time I wash ashore?"
  ja: "やあ、あいぼう！ とうきょうを あんない して くれて ありがとう。じつは、まいごに ならないか すごく ドキドキ してたって、いって なかったよな。しゅうでんにも 2かい のりおくれ そうに なったし！ ぼくが もごもご いっても、いつも わかって くれたね。タワーからの けしき、さいこう だったな。こんど また ながれついたら、また いっしょに ぼうけん しない？"
ph:
  - { id: ph-dunno-if, en: I don't know if, match: \b(don't know|dunno) (if|whether|which|how|where|what)\b, ja: 〜か どうか わからない, register: friend, scene: showing a friend around, trap: dunno［ダノウ］＝don't know。迷いと心配のサイン }
  - { id: ph-kinda-worried, en: kind of worried, match: \b(kind of|kinda|a bit|a little) (worried|nervous)\b, ja: ちょっと しんぱい, register: friend, scene: showing a friend around, trap: kind of でぼかしても本気の心配 }
  - { id: ph-is-it-ok-to, en: is it OK to, match: \bis it (OK|okay|rude|weird) (to|if)\b, ja: 〜して いいの？, register: friend, scene: manners in Tokyo, trap: マナーの確認。体調の OK? ではない }
  - { id: ph-worth-it, en: worth it, ja: いく かちが ある, register: friend, scene: planning the day, trap: わざわざ行く価値。値段の話とは限らない }
  - { id: ph-ive-heard, en: I've heard, match: \bI('ve)? heard\b, ja: 〜って きいたけど, register: friend, scene: planning the day, trap: ネットやうわさの情報。本当か確かめたい }
  - { id: ph-the-thing-is, en: the thing is, ja: じつは, register: friend, scene: showing a friend around, trap: The thing is の後が本当の困りごと }
  - { id: ph-last-train, en: the last train, ja: しゅうでん, register: friend, scene: a night out, trap: last train＝終電。late train（遅い電車）と別 }
  - { id: ph-up-for, en: up for, match: \bup for\b, ja: 〜したい・のりき, register: friend, scene: planning the day, trap: up for＝乗り気。up to（〜次第）と混同しない }
