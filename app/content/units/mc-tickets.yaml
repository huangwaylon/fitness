# チケットを 取る (mc-tickets): wave 2b, もり, まち (docs/curriculum.md "The 21 units"). The box office, the ticket line on
# the phone and a friend racing an online sale: sold out, standing room, the matinee, an aisle seat (heard as "I'll"),
# a ticket limit, face value, plus fees, row G, will call. Catch the day and time, the seats and the price. The sound:
# numbers, with letters (row G / B / D, F as in Frank), prices before and after fees, seat numbers, show times that
# move. Who recurs: Kicks, who'll queue for anything; Pekoe at the box office; Curt on the ticket line; Tia at the
# window. 週末 どこ行く's "sold out" and "let me check", 近所の 人's "just so you know" and "a heads-up", お店で 聞く's
# "in the back" and "honestly", 誘う・断る's "count me in" and ききかえす's "did you say" and "I meant" are recycled.
# Its call: call-matinee-meet (content/listen/s2-call-c.yaml).
# きょうの ひとこと: "It's sold out, but the matinee has seats. Aisle or together?" (売り切れ だけど、昼の 公演なら 席が あるよ。通路側？ 隣どうし？)
