letter:
  en: "Two for Sunday, row G, on the aisle. That's what you'd ask for now, right? You caught the matinee, the fees, the ticket limit, even F as in Frank. Saturday's always sold out, but standing room's a blast. Next time, I'll grab the tickets at face value, and you buy the snacks. Deal?"
  ja: "にちようの 2まい、ジーれつ、つうろがわ。いまなら そう たのめるよね？ ひるの こうえんも、てすうりょうも、まいすうせいげんも、エフの ききわけまで できた。どようは いつも うりきれだけど、たちみも さいこうだよ。こんどは ぼくが ていかで チケットを とるから、きみは おやつ たんとう。きまり？"
