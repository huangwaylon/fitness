# しごとの ざつだん (wk-chat): wave 1, もり. Coffee-machine small talk: the weekend, being busy, and the lunch line. The
# listening task is telling a real plan (a day, a time: "Are you free Thursday?") from a friendly "one of these days".
# The main sound is filler (um, like, y'know, -ish). Reused: the dry run's five items, and ya-w-whatcha (level 6) under
# review; new: mu-/dmu- items, inline.
# きょうの ひとこと: "We should grab lunch one of these days. Are you free Saturday?" (そのうち ランチ いこうよ。…で、どようび あいてる？)

schema: 1
unit: wk-chat
name: しごとの ざつだん
stage: mori
domain: shigoto
host: raymond
scene: office
sound: filler
cando:
  who: しょくばの どうりょう
  does: しゅうまつや しごとの ざつだんを する
  cond: オフィスの ざわざわの なかで
  catch: わだいと、「こんど ランチ」が ほんきか
  short: ざつだんの わだいが わかる
  en: I can follow coworkers making small talk about the weekend and work by the coffee machine, in fast casual speech over office noise, and tell what they're talking about and whether 'let's grab lunch' is a real plan.
status: voiced
letter:
  en: "Nice catch at the coffee machine today. When someone says we should grab lunch one of these days, that's just being friendly. When they name a day, it's a real plan. So here's a real plan: are you free Thursday? There's a new ramen place by the station. Noon-ish. Okay, back to my spreadsheets."
  ja: "きょう コーヒーマシンの まえで よく ききとれたね。「そのうち ランチでも」は、ただの あいさつ。ひにちを いったら、ほんとうの よてい。だから ほんとうの よていを ひとつ。もくようび あいてる？ えきの そばに あたらしい ラーメンやが できたんだ。おひる ごろ。さて、ひょうけいさんに もどるか。"
