# しごとの ざつだん (wk-chat): wave 1, もり. Coffee-machine small talk: the weekend, being busy, and the lunch line. The
# listening task is telling a real plan (a day, a time: "Are you free Thursday?") from a friendly "one of these days".
# The main sound is filler (um, like, y'know, -ish). Reused: the dry run's five items, and ya-w-whatcha (level 6) under
# review; new: mu-/dmu- items, inline.
# きょうの ひとこと: "We should grab lunch one of these days. Are you free Saturday?" (そのうち ランチ いこうよ。…で、どようび あいてる？)

schema: 1
unit: wk-chat
name: しごとの ざつだん
stage: mori
domain: shigoto
host: raymond
scene: office
sound: filler
cando:
