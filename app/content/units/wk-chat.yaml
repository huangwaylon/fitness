  - { id: ph-one-of-these-days, en: one of these days, match: \b(one of these days|at some point)\b, ja: そのうち, register: colleague, scene: office small talk, trap: 「そのうち」は予定ではない。社交辞令の目印 }
  - { id: ph-free-on, en: are you free Thursday, match: \b(are you|you're|you) free (on |this |next )?(monday|tuesday|wednesday|thursday|friday|tomorrow)\b, ja: 〜ようび あいてる？, register: colleague, scene: office small talk, trap: 曜日が出たら本気の誘い。free＝無料ではない }
  - { id: ph-weekend, en: how was your weekend, match: \b(how was|good|do anything nice at) (your |the )?weekend\b, ja: しゅうまつ どうだった？, register: colleague, scene: Monday morning, trap: あいさつ。一言で答えて聞き返す }
