# よていを かえる (fr-replan): wave 1, かわ, ともだち (docs/curriculum-units.md §9, §12). A friend calling from the street
# to move our plans: the new day, time and place, and whether it's a real new plan or a soft cancel ("another time").
# Calls end with でんわを おえる's closings and check back with ききかえす's (both recycled).
# きょうの ひとこと: "Something's come up: I just really want to see you tonight." (きゅうようが できた。こんや どうしても あいたい。)
schema: 1
unit: fr-replan
