# 結婚式に 出る (ev-wedding): wave 2b, もり, イベント (docs/curriculum-wave2.md §3.1). A friend's wedding, the generic US
# way (the sign-off: no ご祝儀): the save-the-date and the invitation (RSVP by…, a plus-one, the dress code), the gift
# (a registry, no set amount), then the reception: the best man's toast, raise your glasses, a bride's "fine" that
# isn't, an uncle's flat "Oh, great". The sound: intonation (a flat "great" is sarcasm, a rise is surprise, "chicken
# or fish↘" asks you to pick, a pause before the punch line). The facts that recur: Molly and Sterling, Saturday,
# June 14th, RSVP by May 1st, cocktail attire. ききかえす's "did you say" and "actually, no", 紹介する's "how do you
# know" and "we go way back", 誘う・断る's "count me in", おいわいする's "wouldn't miss it" are recycled.
# Its call: call-wedding-rsvp (content/listen/s2-call-c.yaml).
# きょうの ひとこと: "I couldn't be happier for you. Raise your glass!" (これ以上ないくらい うれしい。乾杯！)
schema: 1
unit: ev-wedding
name: 結婚式に 出る
stage: mori
domain: ibento
host: diana
scene: party
sound: intonation
cando:
  who: 友人や 新郎新婦
  does: 招待・スピーチ・乾杯を する
  cond: 披露宴の にぎやかさで
  catch: 日時・贈り物の 習慣・冗談の 意図
  short: 結婚式の 招待と 乾杯が わかる
  en: "I can follow friends and the couple talking about a wedding invitation, giving speeches and making toasts, in a lively reception hall, and catch the date, the gift custom, and what a joke really means."
status: voiced
letter:
  en: "You caught it all! The RSVP date, the dress code, and every joke in Marshal's toast, even over the band. Next wedding, you're my plus-one, okay? Honestly, I couldn't be happier with how well you listened. Now raise your glass, and save me a dance!"
  ja: "ぜんぶ ききとれたね！ へんじの しめきりも、ドレスコードも、バンドが うるさい なかで マーシャルの スピーチの じょうだんも。つぎの けっこんしきは、わたしの つれとして きてね。ほんとうに、あなたの ききとりには これいじょう ないほど うれしいわ。さあ グラスを あげて、わたしと いっきょく おどってね！"
ph:
  - { id: ph-rsvp, en: "RSVP by…", ja: "〜までに 出欠の 返事を", match: "\\bRSVP", register: friend, scene: "a wedding invitation", trap: "RSVP＝出欠の 返事。by の 後が 期限" }
  - { id: ph-plus-one, en: "a plus-one", ja: "同伴者（一人）", match: "\\bplus[- ]one\\b", register: friend, scene: "who you can bring", trap: "plus-one＝連れて いける 一人。「もう1つ」 ではない" }
