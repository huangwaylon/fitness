  - { id: ph-couldnt-be-happier, en: "I couldn't be happier for you", ja: "最高に うれしい", match: "\\bcouldn't be happier\\b", register: friend, scene: "congratulating the couple", trap: "couldn't でも 否定 ではない。最高に うれしい" }
  - { id: ph-raise-glasses, en: "raise your glasses", ja: "グラスを お持ちください（乾杯）", match: "\\braise (your|our|a) glass(es)?\\b", register: friend, scene: "a toast", trap: "乾杯の 合図。続けて To〜! と 言う" }
