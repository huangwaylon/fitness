# The ITS booker's Worker (its/README.md): one Worker and a SQLite-backed Durable Object on the Workers Free plan, beside
# the island's relay and the gym bot on the same account. Deploy: `npm run deploy`. Secrets (never in this public repo):
# `npx wrangler secret put` KEY_A, KEY_B (the relay's), ITS_RUNNER_TOKEN, GH_DISPATCH_TOKEN (開始's and the watchdog's
# dispatch; optional), ITS_HEALTH_TOKEN and VAPID_PRIVATE (README "Push": `npm run vapid:keys`).
name = "its-bot"
# The relay's account, pinned as it is there (relay/wrangler.toml).
account_id = "984dde81c150a207305c312cde950046"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[vars]
# 'on': runners may run. 'off': the stop switch, every runner told to stop and no dispatch (settings stay editable;
# README "Operations").
MODE = "on"
# The app's page origin (relay/wrangler.toml's): exact origins, comma-separated; localhost is always allowed.
ALLOWED_ORIGINS = "https://island-fund.pages.dev"
# Web Push's VAPID public key (README "Push"; base64url, 65 bytes; the app subscribes with the same one): the pair from
# `npm run vapid:keys`, its private part the secret VAPID_PRIVATE. Not a key: push is off (subscribe answers 503).
VAPID_PUBLIC = "BF4wAVL_Tio7Tnlvwk5Vh9DOpXQdOJ_bdlo8EqcNUkLZXjUuTHtzX3ekqG2VrmXyoZX5GqNXEd2BA-6tOnD00g4"

# The watchdog (its/README.md "Watchdog"): restarts a missing runner and pushes once per incident. A cron, not the
# object's alarm (the push outbox's): it needs nothing to arm it. The Free plan allows 5 cron triggers account-wide:
# the relay's 2 and the gym bot's 1, so this makes 4.
[triggers]
crons = ["*/5 * * * *"]

# The record: settings, bookings, the runner's last report, the lease, the events.
[[durable_objects.bindings]]
name = "BOT"
class_name = "ItsBot"

# The Free plan has only SQLite-backed Durable Objects: new_sqlite_classes, never new_classes.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ItsBot"]

# Workers Logs: the console lines, 3 days. No invocation logs (each request's IP and headers).
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = false
