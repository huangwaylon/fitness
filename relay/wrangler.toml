# The live relay (docs/backend.md#live-relay): one Worker + SQLite-backed Durable Objects (the island room, the record) on the
# Workers Free plan. Deploy: `npm run deploy` (production) or `npm run deploy:test` (the smoke-test copy, its own
# secrets and room). Secrets: `npx wrangler secret put KEY_A` / `KEY_B` / `KEY_C` (add `--env test` for the
# test copy).
name = "island-fund-relay"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[vars]
# the app's page origin (src/auth.ts): Cloudflare Pages (GitHub Pages' was dropped 2026-11-05); exact origins,
# comma-separated
ALLOWED_ORIGINS = "https://island-fund.pages.dev"
# The real weather's point (relay/src/weather.ts, docs/backend.md "The real weather"): central Tokyo, by the 東京 AMeDAS
# station, rounded to ~1 km. Open-Meteo sees only this (and a Cloudflare IP).
WX_LAT = "35.69"
WX_LON = "139.75"

# Every 15 minutes: the real weather when it's due (at :15 and :45).
[triggers]
crons = ["*/15 * * * *"]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "IslandRoom"

# The record (docs/backend.md#the-record): metrics, events and the ingest audit.
[[durable_objects.bindings]]
name = "STORE"
class_name = "IslandStore"

# The log (docs/ops/observability.md): the phones' and the relay's events, 30 days.
[[durable_objects.bindings]]
name = "LOG"
class_name = "IslandLog"

# The Free plan has only SQLite-backed Durable Objects: new_sqlite_classes, never new_classes.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["IslandRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["IslandStore"]

# A forest mini-game's room, deployed 2026-11-04 and removed the same day (the feature was dropped): migrations only
# append, so it stays recorded here and v4 deletes the class.
[[migrations]]
tag = "v3"
new_sqlite_classes = ["ExpeditionRoom"]

[[migrations]]
tag = "v4"
deleted_classes = ["ExpeditionRoom"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["IslandLog"]

# Workers Logs (docs/ops/observability.md): the relay's console lines only (each a class or a count, never a body),
# 3 days. No invocation logs: they hold each request's IP, headers and place.
[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = false

[env.test]
name = "island-fund-relay-test"

# the test copy runs no cron (a hello fetches the weather when it's due)
[env.test.triggers]
crons = []

[env.test.vars]
ALLOWED_ORIGINS = "https://island-fund.pages.dev"
WX_LAT = "35.69"
WX_LON = "139.75"

[[env.test.durable_objects.bindings]]
name = "ROOM"
class_name = "IslandRoom"

[[env.test.durable_objects.bindings]]
name = "STORE"
class_name = "IslandStore"

[[env.test.durable_objects.bindings]]
name = "LOG"
class_name = "IslandLog"

[[env.test.migrations]]
tag = "v1"
new_sqlite_classes = ["IslandRoom"]

[[env.test.migrations]]
tag = "v2"
new_sqlite_classes = ["IslandStore"]

[[env.test.migrations]]
tag = "v3"
new_sqlite_classes = ["ExpeditionRoom"]

[[env.test.migrations]]
tag = "v4"
deleted_classes = ["ExpeditionRoom"]

[[env.test.migrations]]
tag = "v5"
new_sqlite_classes = ["IslandLog"]
