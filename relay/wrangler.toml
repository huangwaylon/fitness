# The live relay (docs/backend.md#live-relay): one Worker + SQLite-backed Durable Objects (the island room, the record) on the
# Workers Free plan. Deploy: `npm run deploy` (production) or `npm run deploy:test` (the smoke-test copy, its own
# secrets and room). Secrets: `npx wrangler secret put KEY_A` / `KEY_B` / `KEY_C` (add `--env test` for the
# test copy).
name = "island-fund-relay"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[vars]
# the app's page origin (src/auth.ts): Cloudflare Pages (GitHub Pages' was dropped 2026-11-05); exact origins,
# comma-separated
ALLOWED_ORIGINS = "https://island-fund.pages.dev"
# The real weather's point (relay/src/weather.ts, docs/backend.md "The real weather"): central Tokyo, by the 東京 AMeDAS
# station, rounded to ~1 km. Open-Meteo sees only this (and a Cloudflare IP).
WX_LAT = "35.69"
WX_LON = "139.75"
# `/stt` (src/sttRoute.ts, docs/kikimimi-mic.md §3.5): "1" turns it off (503); a role's calls a UTC day (then 429)
STT_OFF = "0"
STT_DAY_MAX = "300"
# The record's daily backup (src/archive.ts, docs/ops/runbook.md#6-backups): the private archive repo, its release, and
# the age recipient (the public key: the secret one never leaves the Mac). The token is a secret: `npx wrangler secret
# put ARCHIVE_TOKEN` (a fine-grained token, that repo only, Contents read/write); unset, no backup ("no_token").
ARCHIVE_REPO = "huangwaylon/fitness-archive"
ARCHIVE_RELEASE = "dumps"
ARCHIVE_RECIPIENT = "age18lxeem3mkp978qr7pm7r5sdd6qktv5z6rt2qfmjm8p7weufcypcqxsj6vu"

# Workers AI for `/stt` (whisper-large-v3-turbo): the audio for the request only, nothing kept. No secret.
[ai]
binding = "AI"

# At :15 and :45: the real weather when it's due (2026-11-10: every 15 minutes woke the room 96 times a day, half of
# them with nothing due). 19:15 UTC (04:15 Tokyo) is the compaction's tick, gated off (COMPACT_CRON). 18:00 UTC (03:00
# Tokyo): the record's backup (src/archive.ts ARCHIVE_CRON), nothing else.
[triggers]
crons = ["15,45 * * * *", "0 18 * * *"]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "IslandRoom"

# The record (docs/backend.md#the-record): metrics, events and the ingest audit.
[[durable_objects.bindings]]
name = "STORE"
class_name = "IslandStore"

# The log (docs/ops/observability.md): the phones' and the relay's events, 30 days.
[[durable_objects.bindings]]
name = "LOG"
class_name = "IslandLog"

# The Free plan has only SQLite-backed Durable Objects: new_sqlite_classes, never new_classes.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["IslandRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["IslandStore"]

# A forest mini-game's room, deployed 2026-11-04 and removed the same day (the feature was dropped): migrations only
# append, so it stays recorded here and v4 deletes the class.
[[migrations]]
tag = "v3"
new_sqlite_classes = ["ExpeditionRoom"]

[[migrations]]
tag = "v4"
deleted_classes = ["ExpeditionRoom"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["IslandLog"]

# Workers Logs (docs/ops/observability.md): the relay's console lines only (each a class or a count, never a body),
# 3 days. No invocation logs: they hold each request's IP, headers and place.
[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = false

[env.test]
name = "island-fund-relay-test"

# the test copy runs no cron (a hello fetches the weather when it's due)
[env.test.triggers]
crons = []

[env.test.vars]
ALLOWED_ORIGINS = "https://island-fund.pages.dev"
WX_LAT = "35.69"
WX_LON = "139.75"
STT_OFF = "0"
STT_DAY_MAX = "300"
# its backup only by hand (`record.ts backup --test`), into its own release
ARCHIVE_REPO = "huangwaylon/fitness-archive"
ARCHIVE_RELEASE = "dumps-test"
ARCHIVE_RECIPIENT = "age18lxeem3mkp978qr7pm7r5sdd6qktv5z6rt2qfmjm8p7weufcypcqxsj6vu"

[env.test.ai]
binding = "AI"

[[env.test.durable_objects.bindings]]
name = "ROOM"
class_name = "IslandRoom"

[[env.test.durable_objects.bindings]]
name = "STORE"
class_name = "IslandStore"

[[env.test.durable_objects.bindings]]
name = "LOG"
class_name = "IslandLog"

[[env.test.migrations]]
tag = "v1"
new_sqlite_classes = ["IslandRoom"]

[[env.test.migrations]]
tag = "v2"
new_sqlite_classes = ["IslandStore"]

[[env.test.migrations]]
tag = "v3"
new_sqlite_classes = ["ExpeditionRoom"]

[[env.test.migrations]]
tag = "v4"
deleted_classes = ["ExpeditionRoom"]

[[env.test.migrations]]
tag = "v5"
new_sqlite_classes = ["IslandLog"]
