# The live relay (docs/backend.md#live-relay): one Worker + SQLite-backed Durable Objects (the island room, the record) on the
# Workers Free plan. Deploy: `npm run deploy` (production) or `npm run deploy:test` (the smoke-test copy, its own
# secrets and room). Secrets: `npx wrangler secret put KEY_A` / `KEY_B` / `KEY_C` (add `--env test` for the
# test copy).
name = "island-fund-relay"
# The island's account, pinned: this machine also holds the amimono account's login (another repo), so a
# wrong credential fails here instead of deploying elsewhere. Covers [env.test] too.
account_id = "984dde81c150a207305c312cde950046"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[vars]
# the app's page origin (src/auth.ts): Cloudflare Pages (GitHub Pages' was dropped 2026-11-05); exact origins,
# comma-separated
ALLOWED_ORIGINS = "https://island-fund.pages.dev"
# The real weather's point (relay/src/weather.ts, docs/backend.md "The real weather"): central Tokyo, by the 東京 AMeDAS
# station, rounded to ~1 km. Open-Meteo sees only this (and a Cloudflare IP).
WX_LAT = "35.69"
WX_LON = "139.75"
# `/stt` (src/sttRoute.ts, docs/speech-test.md): "1" turns it off (503); a role's calls a UTC day (then 429)
STT_OFF = "0"
STT_DAY_MAX = "100"
# `/grade` (src/gradeRoute.ts, docs/sugoroku.md#speaking): "1" turns it off (503); a role's calls a UTC day (then 429)
GRADE_OFF = "0"
GRADE_DAY_MAX = "250"
# The record's daily backup (src/archive.ts, docs/ops/runbook.md#6-backups): the private archive repo, its release, and
# the age recipient (the public key: the secret one never leaves the Mac). The token: the GitHub App's (secrets
# GH_APP_ID, GH_APP_INSTALLATION_ID, GH_APP_KEY_RELAY); unset, no backup ("no_token").
ARCHIVE_REPO = "huangwaylon/fitness-archive"
ARCHIVE_RELEASE = "dumps"
ARCHIVE_RECIPIENT = "age18lxeem3mkp978qr7pm7r5sdd6qktv5z6rt2qfmjm8p7weufcypcqxsj6vu"
# やること's reminders (src/pusher.ts, docs/todo.md "Reminders"): Web Push's VAPID public key, its-bot's same pair (one
# subscription per phone serves both: its/README.md "Keys"); its private scalar the secret VAPID_PRIVATE (`npx wrangler
# secret put VAPID_PRIVATE`, its-bot's value). Either missing: push is off (subscribe 503, no reminder sent).
VAPID_PUBLIC = "BF4wAVL_Tio7Tnlvwk5Vh9DOpXQdOJ_bdlo8EqcNUkLZXjUuTHtzX3ekqG2VrmXyoZX5GqNXEd2BA-6tOnD00g4"
# 行きたい場所 (src/places.ts, docs/backend.md "Saved places"): the shared Google Maps list's id (not a secret: its link is
# the share link). Read by places-pull.yml (scripts/record.ts places-pull), not the relay: Google /sorry-blocks Cloudflare.
PLACES_LIST = "a3yCJpEiSAOfjK8l36rPGA"

# The bots' state in the same backup (src/archive.ts runBots, docs/decisions.md): service bindings, so the relay reads
# its-bot's /its/status (with KEY_A) and gym-bot's /gym/state (with the secret GYM_TOKEN, gym-bot's value) without a
# public request. The test copy has none (its bots' part says `none`).
[[services]]
binding = "ITS_BOT"
service = "its-bot"

[[services]]
binding = "GYM_BOT"
service = "gym-bot"

# Workers AI for `/stt` (whisper-large-v3-turbo), `/grade` (gemma-4-26b) and 行きたい場所's categories (the same model: a
# place's name and area): the audio, sentence or names for the call only, nothing kept. No secret.
[ai]
binding = "AI"

# At :15 and :45 (src/index.ts scheduled): the real weather when it's due, the wet days, the places' categories, the
# record's alarm check and, from 04:15 Tokyo, the nightly jobs not done today. 18:00 UTC (03:00 Tokyo): the record's
# backup (src/archive.ts ARCHIVE_CRON) and the nightly jobs (the prunes wait for that night's backup).
[triggers]
crons = ["15,45 * * * *", "0 18 * * *"]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "IslandRoom"

# The record (docs/backend.md#the-record): metrics, events and the ingest audit.
[[durable_objects.bindings]]
name = "STORE"
class_name = "IslandStore"

# The log (docs/ops/observability.md): the phones' and the relay's events, 30 days.
[[durable_objects.bindings]]
name = "LOG"
class_name = "IslandLog"

# The Free plan has only SQLite-backed Durable Objects: new_sqlite_classes, never new_classes.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["IslandRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["IslandStore"]

# A forest mini-game's room, deployed 2026-11-04 and removed the same day (the feature was dropped): migrations only
# append, so it stays recorded here and v4 deletes the class.
[[migrations]]
tag = "v3"
new_sqlite_classes = ["ExpeditionRoom"]

[[migrations]]
tag = "v4"
deleted_classes = ["ExpeditionRoom"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["IslandLog"]

# Workers Logs (docs/ops/observability.md): the relay's console lines only (each a class or a count, never a body),
# 3 days. No invocation logs: they hold each request's IP, headers and place.
[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = false

[env.test]
name = "island-fund-relay-test"

# the test copy runs no cron (a hello fetches the weather when it's due)
[env.test.triggers]
crons = []

[env.test.vars]
ALLOWED_ORIGINS = "https://island-fund.pages.dev"
WX_LAT = "35.69"
WX_LON = "139.75"
STT_OFF = "0"
STT_DAY_MAX = "100"
GRADE_OFF = "0"
GRADE_DAY_MAX = "250"
# its backup only by hand (`record.ts backup --test`), into its own release: "0", its alarm never runs one
ARCHIVE_AUTO = "0"
ARCHIVE_REPO = "huangwaylon/fitness-archive"
ARCHIVE_RELEASE = "dumps-test"
ARCHIVE_RECIPIENT = "age18lxeem3mkp978qr7pm7r5sdd6qktv5z6rt2qfmjm8p7weufcypcqxsj6vu"
VAPID_PUBLIC = "BF4wAVL_Tio7Tnlvwk5Vh9DOpXQdOJ_bdlo8EqcNUkLZXjUuTHtzX3ekqG2VrmXyoZX5GqNXEd2BA-6tOnD00g4"
PLACES_LIST = "a3yCJpEiSAOfjK8l36rPGA"

[env.test.ai]
binding = "AI"

[[env.test.durable_objects.bindings]]
name = "ROOM"
class_name = "IslandRoom"

[[env.test.durable_objects.bindings]]
name = "STORE"
class_name = "IslandStore"

[[env.test.durable_objects.bindings]]
name = "LOG"
class_name = "IslandLog"

[[env.test.migrations]]
tag = "v1"
new_sqlite_classes = ["IslandRoom"]

[[env.test.migrations]]
tag = "v2"
new_sqlite_classes = ["IslandStore"]

[[env.test.migrations]]
tag = "v3"
new_sqlite_classes = ["ExpeditionRoom"]

[[env.test.migrations]]
tag = "v4"
deleted_classes = ["ExpeditionRoom"]

[[env.test.migrations]]
tag = "v5"
new_sqlite_classes = ["IslandLog"]
