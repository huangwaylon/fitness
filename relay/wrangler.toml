# The live relay (docs/backend.md#live-relay): one Worker + one SQLite-backed Durable Object (the island room) on the
# Workers Free plan. Deploy: `npm run deploy` (production) or `npm run deploy:test` (the smoke-test copy, its own
# secrets and room). Secrets: `npx wrangler secret put KEY_A` / `KEY_B` and `VAPID_PRIVATE` (add `--env test` for the
# test copy; VAPID: docs/ops/runbook.md §12).
name = "island-fund-relay"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[vars]
ALLOWED_ORIGINS = "https://huangwaylon.github.io"
# Web Push (docs/backend.md#notifications): the VAPID public key (the app's PUSH_PUBLIC_KEY, lib/sync/push.ts, must
# match; its private half is the secret VAPID_PRIVATE) and the subject the push services may contact.
VAPID_PUBLIC = "BCfU7NJ22GxdALlsB_vyhPE3hi5LGgLHl2OKcwdOAkEEoLoIJmcaoG0wmFbO5WX9nriyL0PXACdU5S7pCdn6qTE"
VAPID_SUBJECT = "https://huangwaylon.github.io/fitness/"
# The record's one-way export to the sheet (docs/backend.md#the-record "Export"): the Apps Script web app's /exec URL.
EXPORT_URL = "https://script.google.com/macros/s/AKfycbwAMHDa69-GmAEmhrO7WXiRhkQoJLzCImiBkwV7itHbSATMC_wtHFEgy4Tn5eXzKjGU/exec"

# Every 15 minutes the export when the record changed; 18:00 UTC (03:00 Tokyo) whatever changed.
[triggers]
crons = ["*/15 * * * *", "0 18 * * *"]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "IslandRoom"

# The record (docs/backend.md#the-record): metrics, events and the ingest audit.
[[durable_objects.bindings]]
name = "STORE"
class_name = "IslandStore"

# The Free plan has only SQLite-backed Durable Objects: new_sqlite_classes, never new_classes.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["IslandRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["IslandStore"]

[observability]
enabled = true
head_sampling_rate = 0.1

[env.test]
name = "island-fund-relay-test"

# the test copy exports nowhere (no EXPORT_URL) and runs no cron
[env.test.triggers]
crons = []

[env.test.vars]
EXPORT_URL = ""
ALLOWED_ORIGINS = "https://huangwaylon.github.io"
VAPID_PUBLIC = "BCfU7NJ22GxdALlsB_vyhPE3hi5LGgLHl2OKcwdOAkEEoLoIJmcaoG0wmFbO5WX9nriyL0PXACdU5S7pCdn6qTE"
VAPID_SUBJECT = "https://huangwaylon.github.io/fitness/"

[[env.test.durable_objects.bindings]]
name = "ROOM"
class_name = "IslandRoom"

[[env.test.durable_objects.bindings]]
name = "STORE"
class_name = "IslandStore"

[[env.test.migrations]]
tag = "v1"
new_sqlite_classes = ["IslandRoom"]

[[env.test.migrations]]
tag = "v2"
new_sqlite_classes = ["IslandStore"]
