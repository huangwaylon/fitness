# The live relay (docs/ops/runbook.md §8): `test` type-checks, runs knip (unused files and exports) and the unit tests of
# relay/ and the shared protocol; then, on main, `deploy` puts it live: the test copy, its smoke test, production.
# Deploy UI's relay guard (app/scripts/relay-first.ts) waits for it. Run it by hand (Run workflow) to redeploy.
name: Relay checks

on:
  push:
    branches: [main]
    paths: ['relay/**', 'app/src/lib/contract/**', 'app/src/lib/random.ts', 'app/src/lib/types.ts', 'app/src/lib/its/contract.ts', 'its/worker/src/**', 'its/worker/test/pushKit.ts', '.github/workflows/relay.yml']
  pull_request:
    paths: ['relay/**', 'app/src/lib/contract/**', 'app/src/lib/random.ts', 'app/src/lib/types.ts', 'app/src/lib/its/contract.ts', 'its/worker/src/**', 'its/worker/test/pushKit.ts', '.github/workflows/relay.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # (its tests import app/src/lib, and its-bot's Web Push code for やること's reminders: the rest of the repo,
          # app/static's 521 MB above all, never needed)
          sparse-checkout: |
            relay
            app/src
            its/worker/src
            its/worker/test
            .github/workflows
            app/scripts
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run knip
      - run: npm test

  # The relay live once its checks pass (runbook §8 steps 2–3): skipped when the live relay already has the last commit
  # of what it bundles (relay-first.ts RELAY_PATHS: a test- or script-only change, or a re-run behind a newer deploy);
  # Run workflow deploys anyway (main's tip only). One at a time: a newer push's run waits, replacing an older pending one.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: relay-deploy
      cancel-in-progress: false
    environment:
      name: relay
      url: https://island-fund-relay.island-fund-relay.workers.dev/health
    defaults:
      run:
        working-directory: relay
    # (the secrets only in the steps that use them)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # (the history without its blobs: the last relay commit, and deploy.sh's origin/main check)
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            relay
            app/src
            app/scripts
            its/worker/src
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - id: need
        env:
          GH_TOKEN: ${{ github.token }}
          RELAY_HEALTH: https://island-fund-relay.island-fund-relay.workers.dev/health
          RELAY_FIRST_ONCE: '1'
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::no CLOUDFLARE_API_TOKEN secret: the relay not deployed (docs/ops/runbook.md §8)"
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # (a token without Workers access, Pages' alone: Cloudflare answers 401/403; skipped with a warning, not red)
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services/island-fund-relay" || true)
          if [ "$code" = 401 ] || [ "$code" = 403 ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN has no Workers access ($code): the relay not deployed; add Account → Workers Scripts → Edit to the token (docs/ops/runbook.md §8)"
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$MANUAL" = true ]; then
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo "::warning::$GITHUB_SHA is no longer main's tip: not deployed (run the workflow again)"
              echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # (exit 0: the live relay has it; else, or the check failing, deploy: a redeploy is harmless)
          if node ../app/scripts/relay-first.ts; then echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.need.outputs.go == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      # The smoke test's keys: the test copy's, never production's (repo secret RELAY_TEST_SMOKE_KEYS: relay/.smoke-keys'
      # lines); without it the smoke test is skipped with a warning.
      - id: keys
        if: steps.need.outputs.go == 'true'
        env:
          SMOKE_KEYS: ${{ secrets.RELAY_TEST_SMOKE_KEYS }}
        run: |
          if [ -z "$SMOKE_KEYS" ]; then
            echo "::warning::no RELAY_TEST_SMOKE_KEYS secret: the test copy's smoke test skipped (docs/ops/runbook.md §8)"
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            (umask 077; printf '%s\n' "$SMOKE_KEYS" > .smoke-keys)
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.need.outputs.go == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:test
      - if: steps.keys.outputs.have == 'true'
        run: npm run smoke
      - if: steps.need.outputs.go == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          rm -f .smoke-keys
          npm run deploy
      # /health names this commit (deploy.sh's stamp) within 2 min
      - if: steps.need.outputs.go == 'true'
        run: |
          want=$(git rev-parse --short HEAD)
          for _ in $(seq 24); do
            got=$(curl -sS --max-time 10 https://island-fund-relay.island-fund-relay.workers.dev/health | node -p "JSON.parse(require('fs').readFileSync(0)).sha" 2>/dev/null || true)
            [ "$got" = "$want" ] && { echo "the live relay is $want"; exit 0; }
            sleep 5
          done
          echo "::error title=Relay not live::/health answers '$got', not $want"; exit 1
