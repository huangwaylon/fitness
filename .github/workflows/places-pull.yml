# 保存した場所's list, read only here (docs/ops/runbook.md#saved-places): Google /sorry-blocks Cloudflare and Overpass
# refuses it, so this fetches the list on a GitHub runner and hands it to the relay (relay/scripts/record.ts places-pull
# → the admin op places_ingest: read, checked, diffed, categorised), then looks the places due up in OpenStreetMap
# (places-osm → places_due, places_osm). its-bot dispatches it at :23/:53 (its/worker/src/dispatch.ts); the schedule
# is the backstop, and a pull within 10 min (the whole: 20 h) skips itself. The log shows counts and HTTP codes only: the repo is public (never a place, a note, a key).
# One secret, RELAY_PLACES_KEY (the relay's PLACES_KEY): it signs the places ops only (relay/src/sign.ts PLACES_OPS),
# never a member key's admin (a dump, a restore).
name: Places pull

on:
  schedule:
    # the backstop (GitHub drops most scheduled runs; its-bot dispatches it at the same minutes)
    - cron: '23,53 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Pull even when a run pulled the list lately'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: places-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            relay
            app/src/lib
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Google's and Overpass's answer to this runner (codes only)
        run: |
          node --input-type=module -e "
            import { getList, PLACES_POLL } from './src/places.ts';
            import { readFileSync } from 'node:fs';
            const list = /^PLACES_LIST = \"([^\"]+)\"/m.exec(readFileSync('wrangler.toml', 'utf8'))[1];
            const g = await getList((u, i) => fetch(u, i), list, PLACES_POLL);
            await g.body?.cancel();
            console.log('google', 'why' in g ? g.why : g.status, /\/sorry/.test(g.loc ?? '') ? '(/sorry)' : '');"
          echo "overpass $(curl -s -o /dev/null -w '%{http_code}' --max-time 60 -A 'island-fund-relay/1.0 (a private two-person app; github.com/huangwaylon)' --data-urlencode 'data=[out:json][timeout:5];node(1);out ids;' https://overpass-api.de/api/interpreter)"
      - name: The list (the newest 50, then the whole once a day)
        env:
          PLACES_KEY: ${{ secrets.RELAY_PLACES_KEY }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          if [ -z "$PLACES_KEY" ]; then echo "::warning::no RELAY_PLACES_KEY secret: nothing pulled"; exit 0; fi
          # (a refusal is a warning, not a red run every half hour: the relay's cron.places log raises a stale list)
          node scripts/record.ts places-pull --recent $FORCE || echo "::warning::the newest 50 not pulled"
          node scripts/record.ts places-pull || echo "::warning::the whole list not pulled"
      - name: OpenStreetMap's hours (50 places due at most a run)
        env:
          PLACES_KEY: ${{ secrets.RELAY_PLACES_KEY }}
        run: |
          if [ -z "$PLACES_KEY" ]; then exit 0; fi
          node scripts/record.ts places-osm 50 || echo "::warning::OpenStreetMap's batch failed"
