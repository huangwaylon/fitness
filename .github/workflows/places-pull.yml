# 保存した場所's list, read only here (docs/ops/runbook.md#saved-places): Google /sorry-blocks Cloudflare and Overpass
# refuses it, so this fetches the list on a GitHub runner and hands it to the relay (relay/scripts/record.ts places-pull
# → the admin op places_ingest: read, checked, diffed, categorised), then looks the places due up in OpenStreetMap
# (places-osm → places_due, places_osm). its-bot dispatches it at :15/:45 (its/worker/src/dispatch.ts); the schedule
# is the backstop, and a pull within 10 min (the whole: 20 h) skips itself. The log shows counts and HTTP codes only: the repo is public (never a place, a note, a key).
# One secret, RELAY_PLACES_KEY (the relay's PLACES_KEY): it signs the places ops only (relay/src/sign.ts PLACES_OPS),
# never a member key's admin (a dump, a restore).
name: Places pull

on:
  schedule:
    # the backstop (GitHub drops most scheduled runs; its-bot dispatches it at the same minutes)
    - cron: '23,53 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Pull even when a run pulled the list lately'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: places-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    # (a run takes ~5 min: this is only the backstop)
    timeout-minutes: 20
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            relay
            app/src/lib
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci --ignore-scripts
      - name: The list (one Google request: the whole once in 20 h, else the newest 50)
        env:
          PLACES_KEY: ${{ secrets.RELAY_PLACES_KEY }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          if [ -z "$PLACES_KEY" ]; then echo "::warning::no RELAY_PLACES_KEY secret: nothing pulled"; exit 0; fi
          # (a refusal is a warning, not a red run every half hour: health.yml alerts on a list 3 h unpulled)
          node scripts/record.ts places-pull $FORCE || echo "::warning::the list not pulled"
      - name: OpenStreetMap's hours (30 places due, 4 minutes at most a run)
        env:
          PLACES_KEY: ${{ secrets.RELAY_PLACES_KEY }}
        run: |
          if [ -z "$PLACES_KEY" ]; then exit 0; fi
          node scripts/record.ts places-osm 30 || echo "::warning::OpenStreetMap's batch failed"
