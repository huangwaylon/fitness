# Builds the UI as a static site and deploys it to Cloudflare Pages: https://island-fund.pages.dev/ (its own origin; GitHub
# Pages, https://huangwaylon.github.io/fitness/, until 2026-11-05).
# The backend is the relay (relay/: the record at /api, the room at /room); its URLs are in the app (lib/sync/live.ts).
# The layout (docs/ops/testing.md, docs/ops/test-strategy.md): the gate, lean (the user, 2026-11-08: two people use the
# app, fix-forward is cheap): `build` (the `site` artifact: what is deployed, its budgets), `checks` and `select` →
# `e2e-gate` (the core e2e and what the push changed or reaches) all at once, then `deploy` once all are green.
# After it, never holding it back: the full logic tier and the drawn smoke (e2e-logic-full.yml); nightly, everything
# drawn (e2e-full.yml).
name: Deploy UI

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/pages.yml']
  # Pull requests (Dependabot's included) get the same checks, without the deploy.
  pull_request:
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch:

# Least privilege: the build job (which runs dependency code: vite plugins, svelte-check, Playwright) can only read;
# only the deploy job can publish.
permissions:
  contents: read

# The newest green deploys: one run at a time on a branch, never cancelled (`cancel-in-progress: false`); a newer push
# waits, and one still waiting is replaced by the newest. So in a burst of pushes the running one finishes and deploys,
# then the newest runs. (Each job had its own group before, cancelling the older run's: in a burst nothing finished,
# and with the groups never cancelling, each waiting run lost a few shards to the next push and none deployed.)
# `deploy`'s own group is never cancelled halfway either. The full logic tier is its own workflow after this one
# (e2e-logic-full.yml): this run's result is the gate's alone.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The deployable build, once (about 30 s).
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      # what is deployed, and what the full tier tests (already-compressed webp/glb/m4a: stored, not zipped again)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: app/build-pages
          include-hidden-files: true
          compression-level: 0
          retention-days: 1

  # Red main never deploys: the type-check (`check` runs svelte-kit sync first), knip and the unit tests (golden
  # fixtures included), beside the build.
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run knip
      - run: npx vitest run
      # the e2e quarantine in the summary; red when a quarantined test has no owner (docs/ops/testing.md "Tags")
      - run: node scripts/e2e-quarantine.ts >> "$GITHUB_STEP_SUMMARY"

  # What the gate's e2e runs, chosen once for all 4 shards (each choosing its own, an API call failing in one gave it
  # another selection and plan: tests in no shard, the gate green): the selection (scripts/e2e-impact.ts: the gate set,
  # the changed specs, the reached ones), the auto-quarantine (scripts/e2e-flakes.ts) and the shards' plan
  # (scripts/e2e-shards.ts), as the `gate-plan` artifact. Without app/static/: the plan lists the tests, never serves.
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # (the flaky ledger's artifacts, and the deployments: the commit live on the site)
    permissions:
      contents: read
      actions: read
      deployments: read
    defaults:
      run:
        working-directory: app
    env:
      E2E_RENDER: none
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # (the base to diff against, and where a force-pushed one meets HEAD: the history, without its blobs)
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !/app/static/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/e2e-impact.ts ${BASE:+--base "$BASE"} --out sel >> "$GITHUB_STEP_SUMMARY"
          node scripts/e2e-flakes.ts --out sel/quarantine.txt >> "$GITHUB_STEP_SUMMARY"
      # (playwright's --list loads the specs: the deps, not the build)
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # (the selected files unquoted: the list splits into them; chromium* takes in chromium-x3 and chromium-mic-x3)
      - run: |
          E2E_X3="$(tr '\n' ' ' < sel/x3.txt)"
          export E2E_X3
          # shellcheck disable=SC2046
          node scripts/e2e-shards.ts plan 4 shards e2e/timings.json -- --project='chromium*' --grep-invert "@render|@quarantine" --test-list-invert sel/quarantine.txt $(cat sel/specs.txt sel/x3.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-plan
          path: |
            app/sel
            app/shards
          if-no-files-found: error
          retention-days: 1

  # The gate's e2e (docs/ops/testing.md "The gate"): `select`'s plan in logic mode (E2E_RENDER=none: nothing drawn),
  # @render and @quarantine left out; the changed specs 3× and never retried, any other test retried once (failing
  # again: red; passing: flaky, in the summary and the ledger, flaky-<shard>). Each shard builds the commit itself.
  # Not `needs: select`: a shard waits for its artifact after its own build, so select (~16 s) isn't on the way to the
  # deploy (needing it cost ~35 s: the job, then a runner for each shard).
  e2e-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # (select's artifact, looked for in this run)
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: app
    env:
      E2E_RENDER: none
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-headless-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      - run: npm run build
      # select's plan, once it's uploaded (red if select failed, or none in 3 min)
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          for _ in $(seq 60); do
            [ "$(gh api "$api/artifacts?name=gate-plan" --jq .total_count 2>/dev/null)" = 1 ] && exit 0
            state=$(gh api "$api/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" --jq '.jobs[] | select(.name == "select") | .conclusion' 2>/dev/null || true)
            case "$state" in failure|cancelled|skipped) echo "::error::the select job: $state, no plan"; exit 1 ;; esac
            sleep 3
          done
          echo "::error::no gate-plan from the select job in 3 min"; exit 1
      # (sel/: specs.txt, x3.txt (the changed specs: E2E_X3), quarantine.txt; shards/: the plan)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gate-plan
          path: app
      - run: echo "E2E_X3=$(tr '\n' ' ' < sel/x3.txt)" >> "$GITHUB_ENV"
      - id: e2e
        # (the plan leaves them out, but a whole spec file in a shard list (e2e-shards.ts: serial or ›-titled) brings its
        # quarantined tests back in: 32266e9a ran kikimimi-path:113; so filter here too)
        run: |
          if ! grep -q . shards/${{ matrix.shard }}.txt; then echo "nothing in this shard"; exit 0; fi
          npx playwright test --project='chromium*' --test-list shards/${{ matrix.shard }}.txt --test-list-invert sel/quarantine.txt --grep-invert "@render|@quarantine" --max-failures=10
        env:
          E2E_FLAKY_FILE: flaky.json
      - if: failure() && steps.e2e.outcome == 'failure'
        run: node scripts/e2e-report.ts playwright-results.json "Failed in the gate, shard ${{ matrix.shard }}" >> "$GITHUB_STEP_SUMMARY"
      # the flaky ledger's entry (a run with a flaky test writes one)
      - if: always() && steps.e2e.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaky-${{ matrix.shard }}
          path: app/flaky.json
          if-no-files-found: ignore
          retention-days: 3

  # Once the gate is green, the build to Cloudflare Pages (https://island-fund.pages.dev, project island-fund: direct
  # upload, no Git integration, so this workflow stays the gate). Secrets CLOUDFLARE_API_TOKEN (Pages: Edit, this
  # account only) and CLOUDFLARE_ACCOUNT_ID (docs/ops/runbook.md §1); without them the job says so and deploys nothing.
  # With the site: ききみみ's recogniser under stt/ (docs/kikimimi-mic.md §3.6, the stopgap till R2): whisper tiny.en and
  # the ONNX runtime, ~67 MiB in parts ≤ 20 MiB, never in git nor in the `site` artifact, from an Actions cache keyed on
  # their pins (app/src/lib/mic/models.ts), which scripts/stt-models.ts fills on a miss (Hugging Face at the pinned
  # revision, npm; every file's sha256 checked; an older entry restored first, so only what changed is fetched). Pages
  # uploads a file once (by its hash): an unchanged model costs a deploy a cache restore (~2 s). And app/functions/
  # (functions/stt/[[path]].ts: R2 under /stt/ once the bucket is bound; till then it passes to the static files).
  deploy:
    needs: [build, checks, select, e2e-gate]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-deploy
      cancel-in-progress: false
    environment:
      name: cloudflare-pages
      url: https://island-fund.pages.dev/
    # (the secrets only in the steps that use them: stt-models.ts fetches from Hugging Face and npm)
    steps:
      - id: ready
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::no CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secret: Cloudflare Pages not deployed (docs/ops/runbook.md §1)"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      # (before the artifact: a checkout cleans its folder)
      - if: steps.ready.outputs.go == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            app/functions
            app/scripts/stt-models.ts
            app/src/lib/mic/models.ts
          sparse-checkout-cone-mode: false
      - if: steps.ready.outputs.go == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - if: steps.ready.outputs.go == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - if: steps.ready.outputs.go == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: stt
          key: stt-${{ hashFiles('app/src/lib/mic/models.ts', 'app/scripts/stt-models.ts') }}
          restore-keys: stt-
      - if: steps.ready.outputs.go == 'true'
        run: |
          node app/scripts/stt-models.ts --out ../stt
          cp -R stt site/stt
      - if: steps.ready.outputs.go == 'true'
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.0 pages deploy ../site --project-name island-fund --branch main --commit-hash "$GITHUB_SHA" --commit-message "${GITHUB_SHA::12}"
      # the site answers this commit's build (the version SvelteKit polls), with its headers
      - if: steps.ready.outputs.go == 'true'
        run: |
          want=$(node -p "require('./site/_app/version.json').version")
          for _ in 1 2 3 4 5 6; do
            got=$(curl -sS --max-time 20 "https://island-fund.pages.dev/_app/version.json?t=$(date +%s)" | node -p "JSON.parse(require('fs').readFileSync(0)).version" 2>/dev/null || true)
            [ "$got" = "$want" ] && break
            sleep 10
          done
          [ "$got" = "$want" ] || { echo "::error::island-fund.pages.dev answers build '$got', not '$want'"; exit 1; }
          curl -sSI --max-time 20 https://island-fund.pages.dev/ | grep -i '^content-security-policy:.*frame-ancestors' > /dev/null || { echo "::error::no CSP header on island-fund.pages.dev"; exit 1; }
          stt=$(node -p "require('./stt/manifest.json').id")
          curl -sS --max-time 20 "https://island-fund.pages.dev/stt/manifest.json?t=$(date +%s)" | grep -qF "$stt" || { echo "::error::island-fund.pages.dev/stt/ doesn't serve $stt"; exit 1; }
          echo "island-fund.pages.dev serves $want with its headers, and stt/ $stt"
