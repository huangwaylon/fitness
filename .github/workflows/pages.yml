# Builds the UI as a static site and deploys it to GitHub Pages: https://huangwaylon.github.io/fitness/
# The backend is the Apps Script web app (ADR 0015); its /exec URL comes from the repo variable GAS_URL.
name: Deploy UI to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/pages.yml']
  # Pull requests (Dependabot's included) get the same check + vitest + build, without the deploy.
  pull_request:
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts
      # Red main never deploys: type-check (`check` runs svelte-kit sync first) and the unit tests (golden fixtures included) gate the build.
      - run: npm run check
      - run: npx vitest run
      - run: npm run build
        env:
          VITE_GAS_URL: ${{ vars.GAS_URL }}
          BASE_PATH: /${{ github.event.repository.name }}
      # The demo smoke test (tap, undo, harvest, きろく edit) against the build just made, before it deploys.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/build-pages

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
