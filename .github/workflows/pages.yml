# Builds the app as a static site and deploys it to Cloudflare Pages (https://island-fund.pages.dev/). The jobs, the
# gate and the tiers that run after a deploy: docs/ops/testing.md "CI". The backend is the relay (relay/).
name: Deploy UI

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/pages.yml']
  # Pull requests (Dependabot's included) get the same checks, without the deploy.
  pull_request:
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch:

# Least privilege: the jobs that run dependency code (vite plugins, svelte-check, Playwright) can only read; only the
# deploy job can publish.
permissions:
  contents: read

# Pushes' runs overlap, never cancelled; a pull request's go one at a time on its branch.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-{0}', github.ref) || format('pages-run-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # The gate's plan first, once for all 4 shards (each choosing its own could disagree), then the checks. With
  # app/static/: Kit types asset() by its files.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # (the flaky ledger's artifacts, and the deployments: the commit live on the site)
    permissions:
      contents: read
      actions: read
      deployments: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # (the base to diff against, and where a force-pushed one meets HEAD: the history, without its old blobs)
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          E2E_RENDER: none
        run: |
          node scripts/e2e-impact.ts ${BASE:+--base "$BASE"} --out sel >> "$GITHUB_STEP_SUMMARY"
          node scripts/e2e-flakes.ts --out sel/quarantine.txt >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # (the selected files unquoted: the list splits into them; chromium* takes in chromium-x3 and chromium-mic-x3)
      - env:
          E2E_RENDER: none
        run: |
          E2E_X3="$(tr '\n' ' ' < sel/x3.txt)"
          export E2E_X3
          # shellcheck disable=SC2046
          node scripts/e2e-shards.ts plan 4 shards e2e/timings.json -- --project='chromium*' --grep-invert "@render|@quarantine" --test-list-invert sel/quarantine.txt $(cat sel/specs.txt sel/x3.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-plan
          path: |
            app/sel
            app/shards
          if-no-files-found: error
          retention-days: 1
      - run: npm run check
      - run: npm run knip
      # the e2e quarantine in the summary; red when a quarantined test has no owner (docs/ops/testing.md "Tags")
      - run: node scripts/e2e-quarantine.ts >> "$GITHUB_STEP_SUMMARY"
      # the docs' links, anchors and paths, and the code's citations of them (docs/ops/testing.md "Before you push")
      - run: node scripts/docs-check.ts

  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx vitest run

  # The gate's e2e (docs/ops/testing.md "The gate"). Not `needs: checks`: each shard builds, then waits for the plan.
  e2e-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # (the gate-plan artifact, looked for in this run)
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # (each shard is named in the deploy's GATE: a shard added here, red deploys till it is there too)
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: app
    env:
      E2E_RENDER: none
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-headless-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      - run: npm run build
      # shard 1's build is the deployable one, `site` (the build reads only GITHUB_SHA; E2E_RENDER is the tests'): what
      # is deployed and what the full tier tests (already-compressed webp/glb/m4a: stored, not zipped again)
      - if: matrix.shard == 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: app/build-pages
          include-hidden-files: true
          compression-level: 0
          retention-days: 1
      # the plan, once `checks` uploaded it (red if `checks` failed before it, or none in 6 min). Polled every 15 s, the
      # jobs only when the plan isn't there: the workflow token's API quota is per repo and hourly, and a 3 s poll of
      # both from 4 shards (~160 calls a minute a run) used it up on a busy day (2026-11-11), every gate then red here.
      # An API error is printed, not swallowed.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          for _ in $(seq 24); do
            if n=$(gh api "$api/artifacts?name=gate-plan" --jq .total_count 2>/tmp/gh.err); then
              [ "$n" = 1 ] && exit 0
              state=$(gh api "$api/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" --jq '.jobs[] | select(.name == "checks") | .conclusion' 2>>/tmp/gh.err || true)
              case "$state" in failure|cancelled|skipped) echo "::error::the checks job: $state, no plan"; exit 1 ;; esac
            else
              echo "::warning::gh api: $(head -c 300 /tmp/gh.err)"
            fi
            sleep 15
          done
          echo "::error::no gate-plan from the checks job in 6 min"; exit 1
      # (sel/: specs.txt, x3.txt (the changed specs: E2E_X3), quarantine.txt; shards/: the plan)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gate-plan
          path: app
      - run: echo "E2E_X3=$(tr '\n' ' ' < sel/x3.txt)" >> "$GITHUB_ENV"
      - id: e2e
        # (the plan leaves them out, but a whole spec file in a shard list (serial or ›-titled) brings its quarantined
        # tests back in: so filter here too)
        run: |
          if ! grep -q . shards/${{ matrix.shard }}.txt; then echo "nothing in this shard"; exit 0; fi
          npx playwright test --project='chromium*' --test-list shards/${{ matrix.shard }}.txt --test-list-invert sel/quarantine.txt --grep-invert "@render|@quarantine" --max-failures=10
        env:
          E2E_FLAKY_FILE: flaky.json
      - if: failure() && steps.e2e.outcome == 'failure'
        run: node scripts/e2e-report.ts playwright-results.json "Failed in the gate, shard ${{ matrix.shard }}" >> "$GITHUB_STEP_SUMMARY"
      # the flaky ledger's entry (a run with a flaky test writes one)
      - if: always() && steps.e2e.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaky-${{ matrix.shard }}
          path: app/flaky.json
          if-no-files-found: ignore
          retention-days: 3

  # Once the gate is green, `site` to Cloudflare Pages (secrets: docs/ops/runbook.md §1); no `needs`: it gets ready
  # meanwhile, then waits on GATE. With ききみみ's recogniser under stt/ (docs/kikimimi-mic.md "Hosting and the service
  # worker").
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # (the gate's jobs, looked at in this run)
    permissions:
      contents: read
      actions: read
    concurrency:
      group: cloudflare-deploy
      cancel-in-progress: false
    environment:
      name: cloudflare-pages
      url: https://island-fund.pages.dev/
    # (the secrets only in the steps that use them: stt-models.ts fetches from Hugging Face and npm)
    steps:
      - id: ready
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::no CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secret: Cloudflare Pages not deployed (docs/ops/runbook.md §1)"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      # (a checkout cleans its folder: before the artifact)
      - if: steps.ready.outputs.go == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            app/scripts/stt-models.ts
            app/src/lib/mic/models.ts
            app/scripts/deploy-gate.ts
            app/scripts/deploy-order.ts
          sparse-checkout-cone-mode: false
      - if: steps.ready.outputs.go == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - if: steps.ready.outputs.go == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: stt
          key: stt-${{ hashFiles('app/src/lib/mic/models.ts', 'app/scripts/stt-models.ts') }}
          restore-keys: stt-
      # (wrangler installed now, outside app/: no lockfile of its own to keep, nothing of the app's)
      - if: steps.ready.outputs.go == 'true'
        run: |
          node app/scripts/stt-models.ts --out ../stt
          npm install --prefix "$RUNNER_TEMP/wrangler" --no-audit --no-fund --no-save wrangler@4.156.0
      # `site`, once e2e-gate (1) uploaded it (red if that shard failed before it, or none in 5 min)
      - if: steps.ready.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # (every 10 s, the jobs only when the site isn't there: the token's hourly quota, as the gate-plan's wait)
          for _ in $(seq 30); do
            if n=$(gh api "$api/artifacts?name=site" --jq .total_count 2>/tmp/gh.err); then
              [ "$n" = 1 ] && exit 0
              state=$(gh api "$api/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" --jq '.jobs[] | select(.name == "e2e-gate (1)") | .conclusion' 2>>/tmp/gh.err || true)
              case "$state" in failure|cancelled|skipped) echo "::error::e2e-gate (1): $state, no site"; exit 1 ;; esac
            else
              echo "::warning::gh api: $(head -c 300 /tmp/gh.err)"
            fi
            sleep 10
          done
          echo "::error::no site from e2e-gate (1) in 5 min"; exit 1
      - if: steps.ready.outputs.go == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - if: steps.ready.outputs.go == 'true'
        run: cp -R stt site/stt
      # The gate, failing closed (scripts/deploy-gate.ts), 20 min at most. GATE is the one list of the gate's jobs.
      - if: steps.ready.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GATE: checks,unit,e2e-gate (1),e2e-gate (2),e2e-gate (3),e2e-gate (4)
        run: |
          api="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100"
          errors=0
          for _ in $(seq 120); do
            if gh api "$api" > "$RUNNER_TEMP/jobs.json" 2>/tmp/gh.err; then
              errors=0
              verdict=$(node app/scripts/deploy-gate.ts "$RUNNER_TEMP/jobs.json") || verdict="red: the check itself failed"
              case "$verdict" in
                green) echo "the gate is green: $GATE"; exit 0 ;;
                red*) echo "::error::the gate isn't green, nothing deployed (${verdict#red: })"; exit 1 ;;
              esac
            else
              errors=$((errors + 1))
              echo "::warning::gh api: $(head -c 300 /tmp/gh.err)"
              [ "$errors" -ge 5 ] && { echo "::error::the jobs API failed 5 times running: nothing deployed"; exit 1; }
            fi
            sleep 10
          done
          echo "::error::the gate not done in 20 min (${verdict:-no answer}): nothing deployed"; exit 1
      # The order guard (scripts/deploy-order.ts): never older code over newer.
      - id: order
        if: steps.ready.outputs.go == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          PAGES_PROJECT: island-fund
        run: node app/scripts/deploy-order.ts
      - if: steps.order.outputs.deploy == 'true'
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # (once more on a failure: Pages' "Failed to publish your Function: Unknown internal error" is theirs, and a
        # second upload sends only what the first didn't)
        run: |
          set -o pipefail
          deploy() { "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" pages deploy ../site --project-name island-fund --branch main --commit-hash "$GITHUB_SHA" --commit-message "${GITHUB_SHA::12}" | tee "$RUNNER_TEMP/deploy.log"; }
          deploy || { echo "::warning::wrangler failed, once more in 15 s"; sleep 15; deploy; }
      # the site answers this build, with its headers, within 6 min; else this deployment's own URL serving it is
      # Cloudflare's alias lag, a warning (docs/ops/runbook.md §1)
      - if: steps.order.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          want=$(node -p "require('./site/_app/version.json').version")
          ver() { curl -sS --max-time 20 "$1/_app/version.json?t=$(date +%s%N)" | node -p "JSON.parse(require('fs').readFileSync(0)).version" 2>/dev/null || true; }
          for _ in $(seq 180); do
            got=$(ver https://island-fund.pages.dev)
            [ "$got" = "$want" ] && break
            sleep 2
          done
          if [ "$got" != "$want" ]; then
            own=$(grep -o 'https://[a-z0-9]*\.island-fund\.pages\.dev' "$RUNNER_TEMP/deploy.log" | tail -1)
            mine=$([ -n "$own" ] && ver "$own")
            "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" pages deployment list --project-name island-fund --environment production 2>&1 | head -12 || true
            if [ -z "$mine" ] || [ "$mine" != "$want" ]; then
              echo "::error title=Deploy not served::island-fund.pages.dev answers '$got' and this deployment ($own) '$mine', not '$want'"
              exit 1
            fi
            echo "::warning title=Pages alias lag::$own serves $want, but island-fund.pages.dev still answers '$got' after 6 min: Cloudflare's alias, not the code (it catches up by itself); the checks on $own"
            site=$own
          else
            site=https://island-fund.pages.dev
          fi
          curl -sSI --max-time 20 "$site/" | grep -i '^content-security-policy:.*frame-ancestors' > /dev/null || { echo "::error::no CSP header on $site"; exit 1; }
          stt=$(node -p "require('./stt/manifest.json').id")
          curl -sS --max-time 20 "$site/stt/manifest.json?t=$(date +%s)" | grep -qF "$stt" || { echo "::error::$site/stt/ doesn't serve $stt"; exit 1; }
          echo "$site serves $want with its headers, and stt/ $stt"
