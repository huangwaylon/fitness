# Builds the UI as a static site and deploys it to GitHub Pages: https://huangwaylon.github.io/fitness/
# The backend is the relay (relay/: the record at /api, the room at /room); its URLs are in the app (lib/sync/live.ts).
# The layout (docs/ops/testing.md): `build` once (its build-pages/ is both the Pages artifact and what every e2e shard
# tests), `checks` beside it, the e2e shards on the build, then `deploy` once all of them are green.
name: Deploy UI to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/pages.yml']
  # Pull requests (Dependabot's included) get the same checks, without the deploy.
  pull_request:
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch:
  # nightly: the 3D island's suite (e2e-3d), until it's green and gates the cutover
  schedule:
    - cron: '17 18 * * *'

# Least privilege: the build job (which runs dependency code: vite plugins, svelte-check, Playwright) can only read;
# only the deploy job can publish.
permissions:
  contents: read

# No run-wide concurrency: a burst of pushes cancels the older runs' checks (each job's own group, below: a newer push's
# job cancels the older one's), so the latest deploys without queuing them all; `deploy` has its own group that is never
# cancelled halfway (a newer deploy waits for it; one still waiting is replaced by the newer).

jobs:
  # The deployable build, once (about 30 s).
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      # what the e2e shards test (already-compressed webp/glb/m4a: stored, not zipped again)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: app/build-pages
          include-hidden-files: true
          compression-level: 0
          retention-days: 1
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: app/build-pages
      # the logic tier's shards, balanced by each test's time on main so far (scripts/e2e-shards.ts; with no times yet,
      # by count): Playwright test lists, one a shard, for every shard to run the same plan
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/e2e-timings.json
          key: e2e-timings-${{ github.run_id }}
          restore-keys: e2e-timings-
      - run: node scripts/e2e-shards.ts plan 8 shards e2e-timings.json -- --project=chromium --grep-invert "@render|@quarantine"
        env:
          E2E_RENDER: none
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shards
          path: app/shards
          retention-days: 1

  # Red main never deploys: the type-check (`check` runs svelte-kit sync first), knip and the unit tests (golden
  # fixtures included), beside the build.
  checks:
    runs-on: ubuntu-latest
    concurrency:
      group: pages-checks-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run knip
      - run: npx vitest run

  # The Playwright tests against the build job's build-pages/, split by test over the runners (fullyParallel). No silent
  # retries: a test that fails is run once more in its own step; passing then, it is named in the job summary and
  # annotated on its spec as flaky (the deploy goes on), failing again (or more than a few failed: something is broken,
  # not flaky) the job is red. docs/ops/testing.md.
  # Chromium gates the deploy until WebKit (e2e-flake-hunt.yml, on macOS: nightly and on demand) is green across the board.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages-e2e-${{ matrix.shard }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        working-directory: app
    env:
      BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-headless-shell
      # (the runner image has Chrome, so Chromium's system libraries: no apt step)
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: app/build-pages
      - id: e2e
        continue-on-error: true
        run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/8
      - name: A failed test, once more (flaky or broken?)
        if: steps.e2e.outcome == 'failure'
        run: |
          node scripts/e2e-report.ts playwright-results.json "Failed in chromium shard ${{ matrix.shard }}" >> "$GITHUB_STEP_SUMMARY"
          cp playwright-results.json first-run.json 2>/dev/null || true
          n=$(node -p "try { require('./test-results/.last-run.json').failedTests.length } catch { 0 }")
          if [ "$n" -eq 0 ] || [ "$n" -gt 5 ]; then
            echo "::error::$n tests failed: broken, not flaky (no rerun)"; exit 1
          fi
          npx playwright test --project=chromium --last-failed
          echo "::warning::$n flaky e2e test(s) in chromium shard ${{ matrix.shard }}: failed, then passed; see the summary (docs/ops/testing.md)"
          ANNOTATE=1 node scripts/e2e-report.ts first-run.json "Flaky e2e (chromium)"
          node scripts/e2e-report.ts first-run.json "Flaky e2e (failed, then passed on a rerun): fix the cause, docs/ops/testing.md" >> "$GITHUB_STEP_SUMMARY"

  # The logic tier (docs/ops/test-strategy.md): every test but the drawn ones (@render) and the quarantined
  # (@quarantine), with the 3D engines drawing nothing (E2E_RENDER=none, src/lib/ui-state/testMode.ts: the gameplay, cameras and
  # tap areas all run, CI's software GL costs nothing), in shards balanced by time (the build's plan). A failed test is
  # run once more, as the e2e job does.
  e2e-logic:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    concurrency:
      group: pages-e2e-logic-${{ matrix.shard }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        working-directory: app
    env:
      BASE_PATH: /${{ github.event.repository.name }}
      E2E_RENDER: none
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-headless-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: app/build-pages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shards
          path: app/shards
      - id: e2e
        continue-on-error: true
        run: npx playwright test --project=chromium --test-list shards/${{ matrix.shard }}.txt
      # (each test's time, for the next run's plan: the first run's report)
      - if: always() && steps.e2e.outcome != 'skipped'
        run: cp playwright-results.json timings-${{ matrix.shard }}.json 2>/dev/null || true
      - if: always() && steps.e2e.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timings-${{ matrix.shard }}
          path: app/timings-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 1
      - name: A failed test, once more (flaky or broken?)
        if: steps.e2e.outcome == 'failure'
        run: |
          node scripts/e2e-report.ts playwright-results.json "Failed in the logic tier, shard ${{ matrix.shard }}" >> "$GITHUB_STEP_SUMMARY"
          cp playwright-results.json first-run.json 2>/dev/null || true
          n=$(node -p "try { require('./test-results/.last-run.json').failedTests.length } catch { 0 }")
          if [ "$n" -eq 0 ] || [ "$n" -gt 5 ]; then
            echo "::error::$n tests failed: broken, not flaky (no rerun)"; exit 1
          fi
          npx playwright test --project=chromium --last-failed
          echo "::warning::$n flaky e2e test(s) in logic shard ${{ matrix.shard }}: failed, then passed; quarantine it (docs/ops/testing.md)"
          ANNOTATE=1 node scripts/e2e-report.ts first-run.json "Flaky e2e (logic tier)"
          node scripts/e2e-report.ts first-run.json "Flaky e2e (failed, then passed on a rerun): quarantine it and fix the cause, docs/ops/testing.md" >> "$GITHUB_STEP_SUMMARY"

  # The drawn smoke (docs/ops/test-strategy.md): the tests that need the pixels (@render) and a few whole 3D flows
  # (@smoke) with real (software) GL, on one runner.
  e2e-render:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    concurrency:
      group: pages-e2e-render-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: app
    env:
      BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-headless-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: app/build-pages
      - id: e2e
        run: npx playwright test --project=chromium --grep "@render|@smoke" --grep-invert "@quarantine"
      - if: failure() && steps.e2e.outcome == 'failure'
        run: node scripts/e2e-report.ts playwright-results.json "Failed in the drawn smoke (e2e-render)" >> "$GITHUB_STEP_SUMMARY"

  # The logic tier's test times, kept for the next run's shards (a cache entry a run; the newest is restored).
  timings:
    needs: e2e-logic
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: app/scripts
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/e2e-timings.json
          key: e2e-timings-${{ github.run_id }}
          restore-keys: e2e-timings-
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: timings-*
          path: reports
          merge-multiple: true
      - run: node app/scripts/e2e-shards.ts timings app/e2e-timings.json reports/*.json
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/e2e-timings.json
          key: e2e-timings-${{ github.run_id }}

  # The same suite on the 3D island (E2E_ISLAND=3d: せってい's switch in each test's localStorage), ahead of the cutover
  # that makes it the default (docs/world3d-gaps.md). Not gating yet: it never holds the deploy back (not in deploy's
  # needs, continue-on-error), and its failures are in its job summary; it gates once it's green. Only nightly and on
  # demand (`gh workflow run pages.yml`) until then: its 8 runners red on every push bought nothing.
  e2e-3d:
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    concurrency:
      group: pages-e2e-3d-${{ matrix.shard }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        working-directory: app
    env:
      BASE_PATH: /${{ github.event.repository.name }}
      E2E_ISLAND: 3d
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-headless-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: app/build-pages
      - id: e2e
        run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/8
      - name: The failures, in the job summary
        if: failure() && steps.e2e.outcome == 'failure'
        run: node scripts/e2e-report.ts playwright-results.json "Failed on the 3D island (E2E_ISLAND=3d), shard ${{ matrix.shard }}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [build, checks, e2e]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # never cancelled halfway: a newer push's deploy waits for this one
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
