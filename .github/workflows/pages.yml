# Builds the UI as a static site and deploys it to GitHub Pages: https://huangwaylon.github.io/fitness/
# The backend is the Apps Script web app; its /exec URL comes from the repo variable GAS_URL.
# The layout (docs/ops/testing.md): `build` once (its build-pages/ is both the Pages artifact and what every e2e shard
# tests), `checks` beside it, the e2e shards on the build, then `deploy` once all of them are green.
name: Deploy UI to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/pages.yml']
  # Pull requests (Dependabot's included) get the same checks, without the deploy.
  pull_request:
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch:

# Least privilege: the build job (which runs dependency code: vite plugins, svelte-check, Playwright) can only read;
# only the deploy job can publish.
permissions:
  contents: read

# No run-wide concurrency: a burst of pushes cancels the older runs' checks (each job's own group, below: a newer push's
# job cancels the older one's), so the latest deploys without queuing them all; `deploy` has its own group that is never
# cancelled halfway (a newer deploy waits for it; one still waiting is replaced by the newer).

jobs:
  # The deployable build, once (about 30 s).
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
        env:
          VITE_GAS_URL: ${{ vars.GAS_URL }}
          BASE_PATH: /${{ github.event.repository.name }}
      # what the e2e shards test (already-compressed webp/glb/m4a: stored, not zipped again)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: app/build-pages
          include-hidden-files: true
          compression-level: 0
          retention-days: 1
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: app/build-pages

  # Red main never deploys: the type-check (`check` runs svelte-kit sync first), knip and the unit tests (golden
  # fixtures included), beside the build.
  checks:
    runs-on: ubuntu-latest
    concurrency:
      group: pages-checks-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run knip
      - run: npx vitest run

  # The Playwright tests against the build job's build-pages/, split over four runners.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages-e2e-${{ matrix.shard }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: app/build-pages
      - run: npx playwright test --shard=${{ matrix.shard }}/4
        env:
          BASE_PATH: /${{ github.event.repository.name }}

  deploy:
    needs: [build, checks, e2e]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # never cancelled halfway: a newer push's deploy waits for this one
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
