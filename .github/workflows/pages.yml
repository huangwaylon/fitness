# Builds the UI as a static site and deploys it to GitHub Pages: https://huangwaylon.github.io/fitness/
# The backend is the Apps Script web app (ADR 0015); its /exec URL comes from the repo variable GAS_URL.
name: Deploy UI to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/pages.yml']
  # Pull requests (Dependabot's included) get the same check + vitest + build, without the deploy.
  pull_request:
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch:

# Least privilege: the build job (which runs dependency code: vite plugins, svelte-check, Playwright) can only read;
# only the deploy job can publish.
permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # never cancel a deploy halfway

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts
      # Red main never deploys: type-check (`check` runs svelte-kit sync first) and the unit tests (golden fixtures included) gate the build.
      - run: npm run check
      - run: npm run knip
      - run: npx vitest run
      - run: npm run build
        env:
          VITE_GAS_URL: ${{ vars.GAS_URL }}
          BASE_PATH: /${{ github.event.repository.name }}
      # The demo smoke test (tap, undo, harvest, きろく edit) against the build just made, before it deploys.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: app/build-pages

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
