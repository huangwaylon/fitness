# Builds the UI as a static site and deploys it to Cloudflare Pages: https://island-fund.pages.dev/ (its own origin; GitHub
# Pages, https://huangwaylon.github.io/fitness/, until 2026-11-05).
# The backend is the relay (relay/: the record at /api, the room at /room); its URLs are in the app (lib/sync/live.ts).
# The layout (docs/ops/testing.md): the gate, lean (the user, 2026-11-08: two people use the
# app, fix-forward is cheap): `build` (the `site` artifact: what is deployed, its budgets), `checks` (with the gate's
# plan), `unit` → `e2e-gate` (the core e2e and what the push changed or reaches) all at once, and `deploy` getting
# ready beside them, deploying once all are green. After it, never holding it back: the full logic tier and the drawn smoke
# (e2e-logic-full.yml); nightly, everything drawn (e2e-full.yml).
name: Deploy UI

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/pages.yml']
  # Pull requests (Dependabot's included) get the same checks, without the deploy.
  pull_request:
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch:

# Least privilege: the build job (which runs dependency code: vite plugins, svelte-check, Playwright) can only read;
# only the deploy job can publish.
permissions:
  contents: read

# Pushes to main run at once, never cancelled: a push's gate no longer waits for the run before it (24–143 s in a burst,
# 2026-11-08). Only `deploy` is one at a time (its own group, `cloudflare-deploy`: a newer one waiting replaces an older
# one waiting), and its order guard (scripts/deploy-order.ts) never puts older code over newer. (Cancelling older runs
# was tried: in a burst nothing finished.) A pull request's runs: one at a time on its branch, as before. The full
# logic tier is its own workflow after this one (e2e-logic-full.yml): this run's result is the gate's alone.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-{0}', github.ref) || format('pages-run-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # The deployable build, once (about 30 s).
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      # what is deployed, and what the full tier tests (already-compressed webp/glb/m4a: stored, not zipped again)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: app/build-pages
          include-hidden-files: true
          compression-level: 0
          retention-days: 1

  # Red main never deploys: first the gate's plan, then the type-check (`check` runs svelte-kit sync first), knip, the
  # quarantine's owners and the docs' pointers. The plan: what the gate's e2e runs, chosen once for all 4 shards (each
  # choosing its own, an API call failing in one gave it another selection: tests in no shard, the gate green): the
  # selection (scripts/e2e-impact.ts: the gate set, the changed specs, the reached ones), the auto-quarantine
  # (scripts/e2e-flakes.ts) and the shards' plan (scripts/e2e-shards.ts), uploaded as `gate-plan` ~20 s in, while the
  # shards still build (they wait for the artifact, not the job). (Its own `select` job until 2026-11-09: a billed
  # minute a push for ~16 s of work.) The unit tests (golden fixtures included) in `unit`, beside it. Both with
  # app/static/: Kit types asset() by its files, the tests read it.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # (the flaky ledger's artifacts, and the deployments: the commit live on the site)
    permissions:
      contents: read
      actions: read
      deployments: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # (the base to diff against, and where a force-pushed one meets HEAD: the history, without its old blobs)
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          E2E_RENDER: none
        run: |
          node scripts/e2e-impact.ts ${BASE:+--base "$BASE"} --out sel >> "$GITHUB_STEP_SUMMARY"
          node scripts/e2e-flakes.ts --out sel/quarantine.txt >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # (the selected files unquoted: the list splits into them; chromium* takes in chromium-x3 and chromium-mic-x3)
      - env:
          E2E_RENDER: none
        run: |
          E2E_X3="$(tr '\n' ' ' < sel/x3.txt)"
          export E2E_X3
          # shellcheck disable=SC2046
          node scripts/e2e-shards.ts plan 4 shards e2e/timings.json -- --project='chromium*' --grep-invert "@render|@quarantine" --test-list-invert sel/quarantine.txt $(cat sel/specs.txt sel/x3.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-plan
          path: |
            app/sel
            app/shards
          if-no-files-found: error
          retention-days: 1
      - run: npm run check
      - run: npm run knip
      # the e2e quarantine in the summary; red when a quarantined test has no owner (docs/ops/testing.md "Tags")
      - run: node scripts/e2e-quarantine.ts >> "$GITHUB_STEP_SUMMARY"
      # the docs' links, anchors and paths, and the code's citations of them (docs/ops/testing.md "Before you push")
      - run: node scripts/docs-check.ts

  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx vitest run

  # The gate's e2e (docs/ops/testing.md "The gate"): the `gate-plan` (from `checks`) in logic mode (E2E_RENDER=none:
  # nothing drawn), @render and @quarantine left out; the changed specs 3× and never retried, any other test retried
  # once (failing again: red; passing: flaky, in the summary and the ledger, flaky-<shard>). Each shard builds the
  # commit itself.
  # Not `needs: checks`: a shard waits for the plan's artifact after its own build, so the rest of `checks` isn't on
  # the way to the deploy (needing the plan's job cost ~35 s: the job, then a runner for each shard).
  e2e-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # (the gate-plan artifact, looked for in this run)
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # (each shard is named in the deploy's GATE: a shard added here, red deploys till it is there too)
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: app
    env:
      E2E_RENDER: none
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-headless-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      - run: npm run build
      # the plan, once `checks` uploaded it (red if `checks` failed before it, or none in 3 min)
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          for _ in $(seq 60); do
            [ "$(gh api "$api/artifacts?name=gate-plan" --jq .total_count 2>/dev/null)" = 1 ] && exit 0
            state=$(gh api "$api/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" --jq '.jobs[] | select(.name == "checks") | .conclusion' 2>/dev/null || true)
            case "$state" in failure|cancelled|skipped) echo "::error::the checks job: $state, no plan"; exit 1 ;; esac
            sleep 3
          done
          echo "::error::no gate-plan from the checks job in 3 min"; exit 1
      # (sel/: specs.txt, x3.txt (the changed specs: E2E_X3), quarantine.txt; shards/: the plan)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gate-plan
          path: app
      - run: echo "E2E_X3=$(tr '\n' ' ' < sel/x3.txt)" >> "$GITHUB_ENV"
      - id: e2e
        # (the plan leaves them out, but a whole spec file in a shard list (e2e-shards.ts: serial or ›-titled) brings its
        # quarantined tests back in: 32266e9a ran kikimimi-path:113; so filter here too)
        run: |
          if ! grep -q . shards/${{ matrix.shard }}.txt; then echo "nothing in this shard"; exit 0; fi
          npx playwright test --project='chromium*' --test-list shards/${{ matrix.shard }}.txt --test-list-invert sel/quarantine.txt --grep-invert "@render|@quarantine" --max-failures=10
        env:
          E2E_FLAKY_FILE: flaky.json
      - if: failure() && steps.e2e.outcome == 'failure'
        run: node scripts/e2e-report.ts playwright-results.json "Failed in the gate, shard ${{ matrix.shard }}" >> "$GITHUB_STEP_SUMMARY"
      # the flaky ledger's entry (a run with a flaky test writes one)
      - if: always() && steps.e2e.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaky-${{ matrix.shard }}
          path: app/flaky.json
          if-no-files-found: ignore
          retention-days: 3

  # Once the gate is green, the build to Cloudflare Pages (https://island-fund.pages.dev, project island-fund: direct
  # upload, no Git integration, so this workflow stays the gate). Secrets CLOUDFLARE_API_TOKEN (Pages: Edit, this
  # account only) and CLOUDFLARE_ACCOUNT_ID (docs/ops/runbook.md §1); without them the job says so and deploys nothing.
  # It starts once `build` is done and gets everything ready while the gate runs (the 537 MB `site`, ~7–25 s; the
  # models; wrangler, ~7 s by npx), then waits for the gate (its GATE list, below), else red and nothing deployed.
  # (`needs` on the gate put all that after it: ~30 s of every push→live.) Its group holds while it waits, so a newer
  # run's deploy waits for it (or, still waiting, replaces an older one waiting): the deploys go in push order, and the
  # order guard, just before wrangler, skips one (green, a notice) whose commit is live already or older than the live.
  # With the site: ききみみ's recogniser under stt/ (docs/kikimimi-mic.md "Hosting and the service worker", the stopgap till R2): whisper tiny.en and
  # the ONNX runtime, ~67 MiB in parts ≤ 20 MiB, never in git nor in the `site` artifact, from an Actions cache keyed on
  # their pins (app/src/lib/mic/models.ts), which scripts/stt-models.ts fills on a miss (Hugging Face at the pinned
  # revision, npm; every file's sha256 checked; an older entry restored first, so only what changed is fetched). Pages
  # uploads a file once (by its hash): an unchanged model costs a deploy a cache restore (~2 s). And app/functions/
  # (functions/stt/[[path]].ts: R2 under /stt/ once the bucket is bound; till then it passes to the static files).
  deploy:
    needs: [build]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # (the gate's jobs, looked at in this run)
    permissions:
      contents: read
      actions: read
    concurrency:
      group: cloudflare-deploy
      cancel-in-progress: false
    environment:
      name: cloudflare-pages
      url: https://island-fund.pages.dev/
    # (the secrets only in the steps that use them: stt-models.ts fetches from Hugging Face and npm)
    steps:
      - id: ready
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::no CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secret: Cloudflare Pages not deployed (docs/ops/runbook.md §1)"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      # (before the artifact: a checkout cleans its folder)
      - if: steps.ready.outputs.go == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            app/functions
            app/scripts/stt-models.ts
            app/src/lib/mic/models.ts
            app/scripts/deploy-gate.ts
            app/scripts/deploy-order.ts
          sparse-checkout-cone-mode: false
      - if: steps.ready.outputs.go == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - if: steps.ready.outputs.go == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - if: steps.ready.outputs.go == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: stt
          key: stt-${{ hashFiles('app/src/lib/mic/models.ts', 'app/scripts/stt-models.ts') }}
          restore-keys: stt-
      # (wrangler installed now, outside app/: no lockfile of its own to keep, nothing of the app's)
      - if: steps.ready.outputs.go == 'true'
        run: |
          node app/scripts/stt-models.ts --out ../stt
          cp -R stt site/stt
          npm install --prefix "$RUNNER_TEMP/wrangler" --no-audit --no-fund --no-save wrangler@4.156.0
      # The gate, failing closed: each job in GATE exactly once in this run attempt (a re-run's carried-over jobs with
      # them), each `completed` and `success`. Any other conclusion (failure, cancelled, skipped, neutral, timed out),
      # a job twice, or a job of this workflow not in GATE (a new job or shard, GATE not updated) is red. Missing or
      # running: it waits, 20 min at most. The API failing 5 times running: red. GATE is the one list of the gate's
      # jobs (the e2e-gate matrix points here).
      - if: steps.ready.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GATE: build,checks,unit,e2e-gate (1),e2e-gate (2),e2e-gate (3),e2e-gate (4)
        run: |
          api="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100"
          errors=0
          for _ in $(seq 400); do
            if gh api "$api" > "$RUNNER_TEMP/jobs.json"; then
              errors=0
              verdict=$(node app/scripts/deploy-gate.ts "$RUNNER_TEMP/jobs.json") || verdict="red: the check itself failed"
              case "$verdict" in
                green) echo "the gate is green: $GATE"; exit 0 ;;
                red*) echo "::error::the gate isn't green, nothing deployed (${verdict#red: })"; exit 1 ;;
              esac
            else
              errors=$((errors + 1))
              [ "$errors" -ge 5 ] && { echo "::error::the jobs API failed 5 times running: nothing deployed"; exit 1; }
            fi
            sleep 3
          done
          echo "::error::the gate not done in 20 min (${verdict:-no answer}): nothing deployed"; exit 1
      # The order guard: what is live against this commit (Cloudflare's live deployment, GitHub's compare), deploy=true
      # only if this one is newer (or, on a dispatch, the same); not sure or an API down: red.
      - id: order
        if: steps.ready.outputs.go == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          PAGES_PROJECT: island-fund
        run: node app/scripts/deploy-order.ts
      - if: steps.order.outputs.deploy == 'true'
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" pages deploy ../site --project-name island-fund --branch main --commit-hash "$GITHUB_SHA" --commit-message "${GITHUB_SHA::12}"
      # the site answers this commit's build (the version SvelteKit polls), with its headers (looked at every 2 s, a minute)
      - if: steps.order.outputs.deploy == 'true'
        run: |
          want=$(node -p "require('./site/_app/version.json').version")
          for _ in $(seq 30); do
            got=$(curl -sS --max-time 20 "https://island-fund.pages.dev/_app/version.json?t=$(date +%s%N)" | node -p "JSON.parse(require('fs').readFileSync(0)).version" 2>/dev/null || true)
            [ "$got" = "$want" ] && break
            sleep 2
          done
          [ "$got" = "$want" ] || { echo "::error::island-fund.pages.dev answers build '$got', not '$want'"; exit 1; }
          curl -sSI --max-time 20 https://island-fund.pages.dev/ | grep -i '^content-security-policy:.*frame-ancestors' > /dev/null || { echo "::error::no CSP header on island-fund.pages.dev"; exit 1; }
          stt=$(node -p "require('./stt/manifest.json').id")
          curl -sS --max-time 20 "https://island-fund.pages.dev/stt/manifest.json?t=$(date +%s)" | grep -qF "$stt" || { echo "::error::island-fund.pages.dev/stt/ doesn't serve $stt"; exit 1; }
          echo "island-fund.pages.dev serves $want with its headers, and stt/ $stt"
