# Builds the UI as a static site and deploys it to GitHub Pages: https://huangwaylon.github.io/fitness/
# The API stays on the home Mac behind Tailscale Funnel; its URL comes from the repo variable API_BASE.
name: Deploy UI to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      # --ignore-scripts: the static UI never loads better-sqlite3, so skip its native build on the runner.
      - run: npm ci --ignore-scripts
      - run: npx svelte-kit sync
      - run: npm run build:pages
        env:
          VITE_API_BASE: ${{ vars.API_BASE }}
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
