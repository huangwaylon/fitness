# Kalori's watch (docs/food-data.md "Kalori": the watch; docs/ops/runbook.md "Refresh Kalori"), every 6 hours: a
# refresh that never came, and the backstop of kalori-scrape.yml's deploy-check. Each writes status.json on the
# `kalori-status` branch (the alert is its `alert`: a dot on the bots tab's メニュー, no issue, no mail), through
# .github/scripts/kalori-status.sh and food-data/scripts/kalori_status.py, as kalori-scrape.yml does.
# - backstop: a merge's deploy still pending 160 min after status.json's write (the deploy-check job lost): the same
#   look and outcome (.github/scripts/kalori-deploy.sh backstop: ok, a re-run, reverted, deploy_failed). (No
#   workflow_run: a run the workflow token dispatched fires none.)
# - late: the newest completed scheduled kalori-scrape run over 8 days old (late), or a run not done after 2 days or a
#   `running` status 8 h old with no run (stuck).
# A job that fails writes its own alert.
name: Kalori watch

on:
  schedule:
    # (an odd minute: GitHub drops scheduled runs under load)
    - cron: '29 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# (no concurrency group: it keeps one pending run and would drop a pass; two writes of status.json at once are
# kalori-status.sh's lease, the later one redone on the newer status)

env:
  GH_REPO: ${{ github.repository }}

jobs:
  backstop:
    if: github.repository == 'huangwaylon/fitness'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # the revert, the kalori-status branch
      actions: write    # the re-run, the dispatch
    steps:
      # (all history, no blobs until read: the revert reads the three files' blobs alone)
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            food-data/scripts
            app/static/food
            .github/scripts
      - name: A deploy still pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          .github/scripts/kalori-deploy.sh backstop
      - name: status.json, on a failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          .github/scripts/kalori-status.sh alert --reasons deploy_failed --alert-text "the watch's deploy backstop failed: its log" \
            --run-url "$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"

  late:
    if: github.repository == 'huangwaylon/fitness'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # the kalori-status branch
      actions: read     # kalori-scrape's runs
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            food-data/scripts
            .github/scripts
      - name: A refresh late or stuck
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f='databaseId,event,status,conclusion,createdAt,url'
          { gh run list -w kalori-scrape.yml -L 40 --json "$f"; gh run list -w kalori-scrape.yml -e schedule -s completed -L 3 --json "$f"; } \
            | jq -s 'add' > "$RUNNER_TEMP/runs.json"
          .github/scripts/kalori-status.sh get > "$RUNNER_TEMP/status.json"
          python3 -I food-data/scripts/kalori_status.py watch --runs "$RUNNER_TEMP/runs.json" --prev "$RUNNER_TEMP/status.json" > "$RUNNER_TEMP/watch.json"
          cat "$RUNNER_TEMP/watch.json"
          reasons=$(jq -r '.reasons | join(",")' "$RUNNER_TEMP/watch.json")
          [ -n "$reasons" ] || { echo "on time"; exit 0; }
          echo "::warning::$(jq -r .text "$RUNNER_TEMP/watch.json")"
          gh auth setup-git
          .github/scripts/kalori-status.sh alert --reasons "$reasons" --alert-text "$(jq -r .text "$RUNNER_TEMP/watch.json")" \
            --run-url "$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
      - name: status.json, on a failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          .github/scripts/kalori-status.sh alert --reasons stuck --alert-text "the watch's 6-hourly check failed: its log" \
            --run-url "$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
