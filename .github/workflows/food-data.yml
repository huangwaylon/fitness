# The food-data pipeline's unit tests (docs/food-data.md): stdlib only, no network, no raw inputs, so the runner's
# python3 does. Rebuilding the data stays manual (the raw downloads are never in the repo).
name: Food data checks

on:
  push:
    branches: [main]
    paths: ['food-data/**', '.github/workflows/food-data.yml']
  pull_request:
    paths: ['food-data/**', '.github/workflows/food-data.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # (only its own folder: not the app's 521 MB of static files)
          sparse-checkout: food-data
      - run: python3 --version
      - run: python3 -I -m unittest discover -s food-data/scripts/tests
