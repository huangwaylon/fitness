# Backend monitor (docs/ops/runbook.md §5): a keyless {"action":"health"} POST to the Apps Script /exec URL
# (repo variable GAS_URL). It fails, so GitHub e-mails the owner, unless the reply is JSON with ok:true and a `build`
# equal to the committed Code.js's (line 3, `// build: <12 hex>`). HTML = the authorization lapsed (google-setup.md
# §9); another build = Code.js changed but was not redeployed (google-setup.md §11).
name: Backend health

on:
  schedule:
    - cron: '17 */6 * * *' # every 6 h (06:17, 12:17, 18:17, 00:17 JST)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    if: vars.GAS_URL != ''
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: app/apps-script/Code.js
          sparse-checkout-cone-mode: false
      - name: POST health to /exec
        env:
          GAS_URL: ${{ vars.GAS_URL }}
        run: |
          body=$(curl -sSL --max-time 60 -H 'Content-Type: text/plain' --data '{"action":"health"}' "$GAS_URL")
          echo "$body" | head -c 300; echo
          echo "$body" | jq -e '.ok == true' > /dev/null || { echo "::error::/exec did not answer JSON ok (authorization lapsed? google-setup.md §9)"; exit 1; }
          live=$(echo "$body" | jq -r '.build // ""')
          repo=$(sed -n 's#^// build: ##p' app/apps-script/Code.js)
          if [ "$live" != "$repo" ]; then
            echo "::error::/exec runs build '$live' but main's apps-script/Code.js is '$repo': redeploy (google-setup.md §11)"
            exit 1
          fi
          echo "healthy, build $live"
