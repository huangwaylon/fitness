# Backend monitor (docs/ops/runbook.md §2): the relay's /health, the record's /api (a keyless {"action":"health"}) and
# the site (a build, its CSP, the relay's CORS for its origin), the heartbeats (dispatch_stopped, relay_cron_stale)
# and the log's alert (docs/ops/observability.md "The alert"): any of them opens the `alert` issue (counts only: the
# repo is public; .github/scripts/ops-issue.sh), a change comments on it, a green run closes it; down or a heartbeat
# also ends the run red. The `gym` job: gym-bot's (`gym-alert`).
name: Backend health

on:
  schedule:
    # the backstop: GitHub drops most scheduled runs, so its-bot's cron dispatches this at :15 and :45
    # (its/worker/src/dispatch.ts); each run's 8 s are free (a public repo)
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      simulate:
        description: 'A test of the alert path: the relay taken as down (relay_down), its issue opened'
        type: choice
        options: [none, relay_down]
        default: none

permissions:
  contents: read
  issues: write
  actions: read   # this workflow's newest dispatched run (dispatch_stopped)

# (its-bot's dispatch, the schedule and a hand's at once: one at a time, so never two issues)
concurrency:
  group: health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      # The up checks may fail (continue-on-error): the alert step below always runs and opens the `alert` issue,
      # because a run its-bot dispatches mails no one (its actor is the App), and the job ends red after it.
      - name: The relay's health and the record's
        id: relay
        continue-on-error: true
        env:
          SIMULATE: ${{ inputs.simulate }}
        run: |
          [ "$SIMULATE" != relay_down ] || { echo "::error::simulated: the relay taken as down (a test of the alert)"; exit 1; }
          relay=https://island-fund-relay.island-fund-relay.workers.dev
          body=$(curl -sS --max-time 30 "$relay/health")
          echo "$body" > "$RUNNER_TEMP/health.json"
          echo "$body" | head -c 300; echo
          echo "$body" | jq -e '.ok == true' > /dev/null || { echo "::error::the relay's /health did not answer ok (docs/ops/runbook.md §8)"; exit 1; }
          # the real weather (docs/backend.md "The real weather"): a warning only, the phones fall back on their own
          echo "$body" | jq -e '(.wx.age // 9999) <= 180' > /dev/null || echo "::warning::the real weather is over 3 hours old or missing (docs/ops/runbook.md §2): $(echo "$body" | jq -c '.wx')"
          body=$(curl -sS --max-time 30 -H 'Content-Type: text/plain' --data '{"action":"health"}' "$relay/api")
          echo "$body" | head -c 300; echo
          echo "$body" | jq -e '.ok == true' > /dev/null || { echo "::error::the record's /api did not answer ok (docs/ops/runbook.md §9)"; exit 1; }
          echo "healthy, record build $(echo "$body" | jq -r '.build')"
      - name: The app's site (Cloudflare Pages), its headers, and the relay admitting its origin
        id: site
        continue-on-error: true
        run: |
          site=https://island-fund.pages.dev
          v=$(curl -sS --max-time 30 "$site/_app/version.json?t=$(date +%s)" | jq -r '.version // empty')
          [ -n "$v" ] || { echo "::error::$site/_app/version.json did not answer (docs/ops/runbook.md §1)"; exit 1; }
          curl -sSI --max-time 30 "$site/" | grep -qi '^content-security-policy:.*frame-ancestors' || { echo "::error::$site has no CSP header (docs/ops/runbook.md §1)"; exit 1; }
          cors=$(curl -sS --max-time 30 -o /dev/null -D - -H "Origin: $site" -H 'Content-Type: text/plain' --data '{"action":"health"}' https://island-fund-relay.island-fund-relay.workers.dev/api | grep -i '^access-control-allow-origin:' | tr -d '\r' | awk '{print $2}')
          [ "$cors" = "$site" ] || { echo "::error::the relay's /api doesn't allow $site (ALLOWED_ORIGINS, docs/backend.md)"; exit 1; }
          echo "site $v, with its CSP; the relay allows its origin"

      # The heartbeats (in the alert below, and red): GitHub fires ~10-25 % of a schedule's ticks, so this workflow's
      # newest run its-bot dispatched (its App's actor: a hand's dispatch never counts) over 2 h old is its-bot's cron or
      # token dead (read from a scheduled run too: the backstop); /health's cronAt (ms: the relay's :15/:45 cron, its
      # weather and wet days) over 2 h old is that cron dead.
      - name: its-bot's dispatches and the relay's cron
        id: beat
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date +%s); why=
          at=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/health.yml/runs?event=workflow_dispatch&per_page=30" \
            --jq '[.workflow_runs[] | select(.triggering_actor.login == "island-fund-bot[bot]")][0].created_at // 0 | if . == 0 then 0 else fromdateiso8601 end' 2>/dev/null) || at=
          if [ -z "$at" ]; then d='?'; echo "::warning::this workflow's dispatched runs could not be read"
          else
            # (0: none of the newest 30 dispatched runs is its-bot's)
            d=$(( (now - at) / 60 ))
            [ "$d" -le 120 ] || why="dispatch_stopped: its-bot last dispatched $d min ago (its cron or its GitHub App token, runbook §2)"
          fi
          # (absent until the relay reports it: a notice, never red)
          c=$(jq -r '(.cronAt // .wx.cronAt) | if type == "number" then (if . > 1e11 then . / 1000 else . end | floor) else empty end' "$RUNNER_TEMP/health.json" 2>/dev/null) || c=
          if [ -n "$c" ]; then
            m=$(( (now - c) / 60 ))
            [ "$m" -le 120 ] || why="${why:+$why; }relay_cron_stale: the relay's cron last ran $m min ago (runbook §2)"
          else m='?'; echo "::notice::the relay's /health has no cronAt yet"; fi
          echo "dispatched $d min ago; the relay's cron $m min ago"
          { echo "why=$why"; echo "counts=dispatched $d min ago; relay cron $m min ago"; } >> "$GITHUB_OUTPUT"

      - name: The log's alert
        if: always()
        env:
          RELAY_UP: ${{ steps.relay.outcome }}
          SITE_UP: ${{ steps.site.outcome }}
          HEALTH_TOKEN: ${{ secrets.HEALTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BEAT: ${{ steps.beat.outputs.why }}
          BEAT_COUNTS: ${{ steps.beat.outputs.counts }}
        run: |
          why=; counts=; down=
          [ "$RELAY_UP" = success ] || down="relay_down: the relay's /health or the record's /api did not answer ok (runbook §8/§9)"
          [ "$SITE_UP" = success ] || down="${down:+$down; }site_down: the site, its CSP or the relay's CORS for it failed (runbook §1)"
          if [ -z "$HEALTH_TOKEN" ]; then echo "::warning::no HEALTH_TOKEN secret: the log's alert is off (docs/ops/observability.md)"
          else
          s=$(curl -sS --max-time 30 -H "Authorization: Bearer $HEALTH_TOKEN" https://island-fund-relay.island-fund-relay.workers.dev/health/log)
          if ! echo "$s" | jq -e '.ok == true' > /dev/null; then
            echo "::error::/health/log did not answer: $(echo "$s" | head -c 200)"; down="${down:+$down; }log_down: /health/log did not answer"
          else
          # (the public run log gets the checked fields only, the counts line below; never the whole /health/log)
          # the thresholds (the last 6 hours): errors (not while leaving), the record's `unavailable`, a cap reached,
          # the day's events past half the cap, the day's rows written past half the Free plan's 100k (read: 5M; the
          # field absent on an older relay: not), the prune dead (an event older than 32 days), no good record backup in
          # 30 h (backupH: -1 none in the log; none run yet: not), a nightly job, the saved places' pull
          why=$(echo "$s" | jq -r '[
            (if .e6h > 20 then "\(.e6h) errors in 6 h" else empty end),
            (if .unavailable6h > 5 then "the record answered unavailable \(.unavailable6h) times in 6 h" else empty end),
            (if (.capped | length) > 0 then "a day cap reached: \(.capped | join(", "))" else empty end),
            (if .budgetPct > 50 then "\(.budgetPct) % of the day'"'"'s log cap used" else empty end),
            (if (.rowsPct // 0) > 50 then "\(.rowsPct) % of the Free plan'"'"'s rows written a day (UTC) used" else empty end),
            (if (.rowsReadPct // 0) > 50 then "\(.rowsReadPct) % of the Free plan'"'"'s rows read a day (UTC) used" else empty end),
            (if .oldestDays > 32 then "the oldest event is \(.oldestDays) days old (the prune)" else empty end),
            (if (.backupH // 0) > 30 or ((.backupH // 0) < 0 and (.backupSt // "none") != "none") then "no record backup in 30 h (last: \(.backupSt))" else empty end),
            (if (.nightlyH // 0) > 30 or (.nightlyH // 0) < 0 then "a nightly job not done in 30 h (nightlyH \(.nightlyH); /health/log .nightly; runbook §6)" else empty end),
            (if (.placesH // 0) >= 3 or (.placesH // 0) < 0 then "the saved places not pulled in 3 h (places-pull.yml: its-bot'"'"'s dispatch; runbook §9)" else empty end)
          ] | join("; ")')
          [ "$(echo "$s" | jq '.phones24h')" = 0 ] && echo "::warning::no phone events in 24 h: the phones' log may be broken, or nobody opened the app"
          counts=$(echo "$s" | jq -r '"errors 1 h \(.e1h), 6 h \(.e6h); warnings 6 h \(.w6h); unavailable 6 h \(.unavailable6h); phones 24 h \(.phones24h); today \(.today) (\(.budgetPct) %); rows written \(.rowsPct // 0) %, read \(.rowsReadPct // "?") %; oldest \(.oldestDays) d; backup \(.backupH // "?") h ago (\(.backupSt // "?")); nightly \(.nightlyH // "?") h; places pulled \(.placesH // "?") h ago; "')
          echo "$counts"
          fi
          fi
          why="$BEAT${BEAT:+${why:+; }}$why"
          why="$down${down:+${why:+; }}$why"
          counts="$counts$BEAT_COUNTS"
          WHY=$why COUNTS=$counts LOOK="docs/ops/observability.md \"Investigating\" (\`cd relay && npm run logs -- report --since 6h\`)" \
            .github/scripts/ops-issue.sh alert relay
          [ -z "$down$BEAT" ] || { echo "::error::$down${down:+${BEAT:+; }}$BEAT"; exit 1; }

  # gym-bot's alert (gym/README.md): its public /status (codes and numbers only, held so here) → one issue labelled
  # `gym-alert` when the verdict is broken or failing (the site failing past the bot's warning), or the checks stalled
  # (the newest, idle ones too, over 3 × the interval old while running; not while the site fails: its backoff stretches
  # them), commented on a change of reasons, closed when well. Never red: the issue is the alert.
  gym:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: gym-bot's checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          code=$(curl -sS --max-time 20 --retry 2 --retry-all-errors --retry-delay 10 -o g.json -w '%{http_code}' \
            https://gym-bot.island-fund-relay.workers.dev/status) || code=000
          c='if type == "string" and test("^[a-z_]{1,40}$") then . else "?" end'
          n='if type == "number" then floor else null end'
          s=$(jq -c "{verdict: (.verdict | $c), reasons: [(.reasons // [])[] | $c], mode: (.mode | $c), paused: (.paused == true),
                      every: (.intervalMin | $n), now: (.now | $n), last: ([.lastCheck, (.checks // [])[].t] | map(numbers) | max | $n)}" g.json 2>/dev/null) || s=
          rm -f g.json
          case "$code" in [0-9][0-9][0-9]) ;; *) code=000 ;; esac
          if [ "$code" != 200 ] || [ -z "$s" ]; then
            why=status_unreachable
            counts="/status answered $code"
          else
            echo "$s"
            why=$(echo "$s" | jq -r '[
              (if .verdict == "broken" or .verdict == "failing" then "verdict_\(.verdict)" else empty end),
              (if .mode == "bot" and (.paused | not) and (.reasons | index("site_failing") | not) and .every != null and .now != null and (.now - (.last // 0)) > 3 * .every * 60000 then "checks_stale" else empty end)
            ] | join(" ")')
            counts=$(echo "$s" | jq -r '"verdict \(.verdict); reasons \(.reasons | join(" ")); last check \(if .last and .now then "\((.now - .last) / 60000 | floor) min ago" else "none" end); every \(.every // "?") min; \(if .paused then "paused" else "running" end)"')
          fi
          echo "${why:-healthy}: $counts"
          WHY=$why COUNTS=$counts LOOK="gym/README.md (the app's ボット → ジム, \`cd gym && npx wrangler tail\`)" .github/scripts/ops-issue.sh gym-alert gym
