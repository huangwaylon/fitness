# Backend monitor (docs/ops/runbook.md §2): the relay's /health, the record's /api (a keyless {"action":"health"}) and
# the site (a build, its CSP, the relay's CORS for its origin); red, so GitHub e-mails the owner, unless all answer ok.
# Then the log's alert (docs/ops/observability.md "The alert"): counts over the thresholds open one issue labelled
# `alert` (counts only: the repo is public), a change comments on it, a green run closes it.
name: Backend health

on:
  schedule:
    - cron: '17 */6 * * *' # every 6 h (09:17, 15:17, 21:17, 03:17 JST)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: The relay's health and the record's
        run: |
          relay=https://island-fund-relay.island-fund-relay.workers.dev
          body=$(curl -sS --max-time 30 "$relay/health")
          echo "$body" | head -c 300; echo
          echo "$body" | jq -e '.ok == true' > /dev/null || { echo "::error::the relay's /health did not answer ok (docs/ops/runbook.md §8)"; exit 1; }
          # the real weather (docs/backend.md "The real weather"): a warning only, the phones fall back on their own
          echo "$body" | jq -e '(.wx.age // 9999) <= 180' > /dev/null || echo "::warning::the real weather is over 3 hours old or missing (docs/ops/runbook.md §2): $(echo "$body" | jq -c '.wx')"
          body=$(curl -sS --max-time 30 -H 'Content-Type: text/plain' --data '{"action":"health"}' "$relay/api")
          echo "$body" | head -c 300; echo
          echo "$body" | jq -e '.ok == true' > /dev/null || { echo "::error::the record's /api did not answer ok (docs/ops/runbook.md §9)"; exit 1; }
          echo "healthy, record build $(echo "$body" | jq -r '.build')"
      - name: The app's site (Cloudflare Pages), its headers, and the relay admitting its origin
        run: |
          site=https://island-fund.pages.dev
          v=$(curl -sS --max-time 30 "$site/_app/version.json?t=$(date +%s)" | jq -r '.version // empty')
          [ -n "$v" ] || { echo "::error::$site/_app/version.json did not answer (docs/ops/runbook.md §1)"; exit 1; }
          curl -sSI --max-time 30 "$site/" | grep -qi '^content-security-policy:.*frame-ancestors' || { echo "::error::$site has no CSP header (docs/ops/runbook.md §1)"; exit 1; }
          cors=$(curl -sS --max-time 30 -o /dev/null -D - -H "Origin: $site" -H 'Content-Type: text/plain' --data '{"action":"health"}' https://island-fund-relay.island-fund-relay.workers.dev/api | grep -i '^access-control-allow-origin:' | tr -d '\r' | awk '{print $2}')
          [ "$cors" = "$site" ] || { echo "::error::the relay's /api doesn't allow $site (ALLOWED_ORIGINS, docs/backend.md)"; exit 1; }
          echo "site $v, with its CSP; the relay allows its origin"

      - name: The log's alert
        env:
          HEALTH_TOKEN: ${{ secrets.HEALTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "$HEALTH_TOKEN" ]; then echo "::warning::no HEALTH_TOKEN secret: the log's alert is off (docs/ops/observability.md)"; exit 0; fi
          s=$(curl -sS --max-time 30 -H "Authorization: Bearer $HEALTH_TOKEN" https://island-fund-relay.island-fund-relay.workers.dev/health/log)
          echo "$s" | jq -e '.ok == true' > /dev/null || { echo "::error::/health/log did not answer: $(echo "$s" | head -c 200)"; exit 1; }
          echo "$s" | jq -c .
          # the thresholds (the last 6 hours): errors (not while leaving), the record's `unavailable`, a cap reached,
          # the day's events past half the cap, the day's rows written past half the Free plan's 100k, the prune dead (an
          # event older than 32 days), no good record backup in 48 h (backupH: -1 none in the log; none run yet: not)
          why=$(echo "$s" | jq -r '[
            (if .e6h > 20 then "\(.e6h) errors in 6 h" else empty end),
            (if .unavailable6h > 5 then "the record answered unavailable \(.unavailable6h) times in 6 h" else empty end),
            (if (.capped | length) > 0 then "a day cap reached: \(.capped | join(", "))" else empty end),
            (if .budgetPct > 50 then "\(.budgetPct) % of the day'"'"'s log cap used" else empty end),
            (if (.rowsPct // 0) > 50 then "\(.rowsPct) % of the Free plan'"'"'s rows written a day (UTC) used" else empty end),
            (if .oldestDays > 32 then "the oldest event is \(.oldestDays) days old (the prune)" else empty end),
            (if (.backupH // 0) > 48 or ((.backupH // 0) < 0 and (.backupSt // "none") != "none") then "no record backup in 48 h (last: \(.backupSt))" else empty end)
          ] | join("; ")')
          [ "$(echo "$s" | jq '.phones24h')" = 0 ] && echo "::warning::no phone events in 24 h: the phones' log may be broken, or nobody opened the app"
          open=$(gh issue list --label alert --state open --json number --jq '.[0].number // empty')
          counts=$(echo "$s" | jq -r '"errors 1 h \(.e1h), 6 h \(.e6h); warnings 6 h \(.w6h); unavailable 6 h \(.unavailable6h); phones 24 h \(.phones24h); today \(.today) (\(.budgetPct) %); rows written \(.rowsPct // 0) %; oldest \(.oldestDays) d; backup \(.backupH // "?") h ago (\(.backupSt // "?"))"')
          body="$why

          $counts

          Investigate: docs/ops/observability.md \"Investigating\" (\`cd relay && npm run logs -- report --since 6h\`). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$why" ]; then
            echo "::warning::$why"
            gh label create alert --color B60205 --description "the relay's log alert (health.yml)" 2>/dev/null || true
            if [ -z "$open" ]; then gh issue create --label alert --title "Relay alert: $why" --body "$body"
            else
              last=$(gh issue view "$open" --json comments,body --jq '(.comments | last | .body) // .body' | head -1)
              [ "$last" = "$why" ] || gh issue comment "$open" --body "$body"
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Back under the thresholds: $counts"
          fi
