# The ITS booker's runner (its/runner/README.md): headed Chrome under xvfb solves Turnstile, curl scans every interval,
# holds and outcomes go to the its-bot Worker's record (remote.DEFAULT_URL). The repo variable ITS_RUNNER_ENABLED = 1
# turns it on; unset it to stop every job before it starts. Every run checks out main, so what lands there runs at the
# next run. Never two runners: this workflow's concurrency group, and the Worker's lease. Secrets live only in the `its`
# environment (deployments from main only). The Actions log is public: the runner prints only logs.public lines; its
# private log is age-encrypted to ITS_LOG_RECIPIENT and uploaded as the only artifact (14 days).
#
# Timings (test_remote's workflow test parses this file): no new hold ITS_RUN_MIN after the job started, then main.py's
# drain (≤ 15 min) and run_end, inside the Run step's timeout, inside the job's. A run lasts ~5.5 h; as it ends it
# dispatches its successor (the handoff job), unless another run of this workflow is already unfinished. GitHub drops most scheduled ticks, so the schedule is a backstop, and so
# is the its-bot Worker's watchdog (its/README.md "Watchdog"): it dispatches when no runner reports. The schedule ticks
# every 30 min, so most ticks find a run in progress: the gate job ends those at once (no pending run for the next tick
# to cancel), except the tick in the last 30 min of a run, which queues the next run to start the moment this one ends.
# A dispatch (開始's, the handoff's, the watchdog's) always queues: one pending run at most, never two running.
name: ITS runner

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  ITS_RUN_MIN: 320          # minutes from the job's start to the last new hold
  ITS_SKIP_YOUNGER_MIN: 290 # a scheduled tick skips while another run started less than this ago (ITS_RUN_MIN − 30)
  ITS_HANDOFF_AFTER_MIN: 60 # a run that ends younger hands off nothing: no dispatch loop (the watchdog backs off)

jobs:
  # No concurrency here: it answers at once while a run holds the group.
  gate:
    if: >-
      github.repository == 'huangwaylon/fitness' && github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' && vars.ITS_RUNNER_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      - name: Skip a scheduled tick while a young run is in progress
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then echo "go=1" >> "$GITHUB_OUTPUT"; echo "gate: $GITHUB_EVENT_NAME, go"; exit 0; fi
          # Another run of this workflow, not finished, started (or queued) under ITS_SKIP_YOUNGER_MIN ago. Any failure
          # to ask: go (the concurrency group still queues it).
          young=$(gh run list -R "$GITHUB_REPOSITORY" -w its-runner.yml -L 20 --json databaseId,status,startedAt,createdAt \
            --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and .status != \"completed\")
                   | select(((.startedAt // .createdAt) | sub(\"\\\\.[0-9]+Z$\"; \"Z\") | fromdateiso8601) > (now - $ITS_SKIP_YOUNGER_MIN * 60))]
                   | length" 2>/dev/null) || young=
          case "$young" in
            ''|*[!0-9]*) echo "go=1" >> "$GITHUB_OUTPUT"; echo "gate: could not list the runs, go" ;;
            0) echo "go=1" >> "$GITHUB_OUTPUT"; echo "gate: no young run, go" ;;
            *) echo "go=0" >> "$GITHUB_OUTPUT"; echo "gate: $young young run(s) in progress, skip" ;;
          esac

  run:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: its-runner
      cancel-in-progress: false
    environment: its
    outputs:
      handoff: ${{ steps.next.outputs.run }}
    env:
      # The site's dates are Tokyo's (book_hotels reads them in Asia/Tokyo anyway; this makes the log's times agree).
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: its/runner

      # Before anything is installed: a stopped bot (paused, MODE off, no dates) ends the job here in seconds. Another
      # run's lease doesn't (it may be a run that is ending: main.py's claim waits for it). Reads the config only, with
      # the image's python3 (remote.py is stdlib); prints codes, never the settings (remote.preflight_main).
      - name: Preflight
        id: pre
        working-directory: its/runner
        env:
          ITS_RUNNER_TOKEN: ${{ secrets.ITS_RUNNER_TOKEN }}
        run: |
          echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "ITS_STATE_DIR=$RUNNER_TEMP/its-state" >> "$GITHUB_ENV"   # config.STATE_DIR: outside the checkout
          python3 remote.py preflight

      # No pip cache, no actions/cache at all: nothing of a run (s=, cookies, the Chrome profile) outlives it.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.pre.outputs.run == '1'
        with:
          python-version: '3.12'

      - name: Install pydoll (hashed) and the fonts, age
        if: steps.pre.outputs.run == '1'
        run: |
          python -m pip install --quiet --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r its/runner/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk age
          google-chrome --version
          command -v xvfb-run

      # The secrets are this step's env only. --deadline: no new hold ITS_RUN_MIN after the job started; main.py drains
      # for up to 15 more (DRAIN_SEC), sends run_end and exits 0 inside this step's timeout. restart.py restarts a crash
      # (≤ 5, backed off, the same deadline and run id, while the preflight says run), never past the deadline.
      - name: Run
        if: steps.pre.outputs.run == '1'
        timeout-minutes: 345
        working-directory: its/runner
        env:
          START: ${{ steps.pre.outputs.start }}
          ITS_RUNNER_TOKEN: ${{ secrets.ITS_RUNNER_TOKEN }}
          ITS_IMAP_USER: ${{ secrets.ITS_IMAP_USER }}
          ITS_IMAP_APP_PASSWORD: ${{ secrets.ITS_IMAP_APP_PASSWORD }}
          ITS_EMAIL: ${{ secrets.ITS_EMAIL }}
          ITS_KIGOU: ${{ secrets.ITS_KIGOU }}
          ITS_BANGOU: ${{ secrets.ITS_BANGOU }}
          ITS_KANA_SEI: ${{ secrets.ITS_KANA_SEI }}
          ITS_KANA_MEI: ${{ secrets.ITS_KANA_MEI }}
          ITS_KANA_NAME: ${{ secrets.ITS_KANA_NAME }}
          ITS_NAME_SEI: ${{ secrets.ITS_NAME_SEI }}
          ITS_NAME_MEI: ${{ secrets.ITS_NAME_MEI }}
          ITS_BIRTH: ${{ secrets.ITS_BIRTH }}
          ITS_SEX: ${{ secrets.ITS_SEX }}
          ITS_ZOKUGARA: ${{ secrets.ITS_ZOKUGARA }}
          ITS_TEL: ${{ secrets.ITS_TEL }}
          ITS_OFFICE_NAME: ${{ secrets.ITS_OFFICE_NAME }}
          ITS_ZIP: ${{ secrets.ITS_ZIP }}
          ITS_STATE: ${{ secrets.ITS_STATE }}
          ITS_ADDR: ${{ secrets.ITS_ADDR }}
        run: |
          deadline=$((START + ITS_RUN_MIN * 60))
          exec python restart.py "$deadline" xvfb-run -a --server-args='-screen 0 1280x1600x24' python main.py --remote --deadline "$deadline"

      # Whether the handoff job dispatches a successor: a run that lasted ITS_HANDOFF_AFTER_MIN, while the bot should
      # run (the preflight again: paused, MODE off, no dates or no answer write run=0). Not after a cancel: someone
      # stopped it (or the watchdog, which dispatches itself). A run that died sooner is left to the watchdog.
      - name: Hand off?
        id: next
        if: ${{ !cancelled() && steps.pre.outputs.run == '1' }}
        working-directory: its/runner
        env:
          START: ${{ steps.pre.outputs.start }}
          ITS_RUNNER_TOKEN: ${{ secrets.ITS_RUNNER_TOKEN }}
        run: |
          age=$(( ($(date +%s) - START) / 60 ))
          if [ "$age" -lt "$ITS_HANDOFF_AFTER_MIN" ]; then echo "handoff: none, the run lasted $age min"; exit 0; fi
          python3 remote.py preflight || true

      # Encryption failure (or no recipient) uploads nothing: the plaintext never leaves the runner.
      - name: Encrypt the private log
        if: always() && steps.pre.outputs.run == '1'
        env:
          RECIPIENT: ${{ vars.ITS_LOG_RECIPIENT }}
        run: |
          out="$RUNNER_TEMP/its-private.tar.gz.age"
          rm -f "$out"
          if [ -z "$RECIPIENT" ] || [ ! -d "$ITS_STATE_DIR" ]; then
            echo "::warning::no private log uploaded (no ITS_LOG_RECIPIENT or no state dir)"; exit 0
          fi
          # tar's warnings name files, and file names carry dates and hotels: silenced (this log is public).
          if tar --warning=none -C "$ITS_STATE_DIR" -czf - . 2>/dev/null | age -r "$RECIPIENT" -o "$out"; then
            echo "encrypted: $(stat -c %s "$out") bytes"
          else
            rm -f "$out"; echo "::warning::encryption failed: nothing uploaded"
          fi
          rm -rf "$ITS_STATE_DIR"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.pre.outputs.run == '1'
        with:
          name: its-private-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/its-private.tar.gz.age
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  # The successor, dispatched as this run ends: its run job waits in the concurrency group until this one's has ended
  # (never two runners), then starts. GITHUB_TOKEN's workflow_dispatch does start a run; the write permission on
  # Actions is this job's alone, never beside the run job's secrets.
  handoff:
    needs: run
    if: ${{ !cancelled() && needs.run.outputs.handoff == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      # Not when another run of this workflow is unfinished (a tick's, the watchdog's, 開始's: it is the successor, or
      # its gate is deciding); asked per status, never a page of finished runs. Any failure to ask: dispatch (the
      # group still queues it).
      - name: Dispatch the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for s in queued pending waiting requested in_progress; do
            other=$(gh run list -R "$GITHUB_REPOSITORY" -w its-runner.yml -s "$s" -L 5 --json databaseId \
              --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)] | length" 2>/dev/null) || other=
            case "$other" in ''|*[!0-9]*|0) ;; *) echo "handoff: a run is $s already, none dispatched"; exit 0 ;; esac
          done
          gh workflow run its-runner.yml -R "$GITHUB_REPOSITORY" --ref main
          echo "handoff: dispatched"
