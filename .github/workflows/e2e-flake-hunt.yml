# The flake hunt (docs/ops/testing.md "CI"): the logic tier in WebKit, each test several times, retries off; logic
# mode, as the gate (the VM's software GL isn't the phones' Metal). 2 workers: a 3-core VM. Nightly: its-bot dispatches
# it at 19:30 UTC (04:30 Tokyo, after the relay's 03:00 batch and places-details' 03:30; its/worker/src/dispatch.ts),
# the schedule the backstop, skipping itself after a dispatched run in 20 h; and on demand. It gates nothing: red when
# any test failed even once, its summary lists them worst first.
name: e2e flake hunt

on:
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch:
    inputs:
      repeat:
        description: Runs of each test
        default: '3'
        required: true

permissions:
  contents: read

# (a late schedule waits for the dispatched run, then skips itself)
concurrency:
  group: e2e-flake-hunt
  cancel-in-progress: false

jobs:
  # The schedule's run only: none dispatched (its-bot's or by hand, not cancelled) in the last 20 h, else go=false.
  due:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      go: ${{ steps.due.outputs.go }}
    steps:
      - id: due
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go=true
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            n=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/e2e-flake-hunt.yml/runs" -f event=workflow_dispatch -f per_page=5 \
              -f created=">$(date -u -d '20 hours ago' +%FT%TZ)" --jq '[.workflow_runs[] | select(.conclusion != "cancelled")] | length') || n=0
            [ "$n" = 0 ] || go=false
          fi
          echo "dispatched runs in 20 h: ${n:-0}; go=$go"
          echo "go=$go" >> "$GITHUB_OUTPUT"

  build:
    needs: due
    if: needs.due.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      # the site, and the client manifest boot.spec finds the 3D island's chunk by (its name is a hash)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: |
            app/build-pages
            app/.svelte-kit/output/client/.vite/manifest.json
          include-hidden-files: true
          compression-level: 0
          retention-days: 1

  # (on macOS: Safari's own WebKit; Linux's draws the island at about a frame a second)
  hunt:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    defaults:
      run:
        working-directory: app
    env:
      E2E_RENDER: none
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}-webkit
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install webkit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: app
      # (a test 60 s: the VM runs a test 2-3× its Linux time, and it hunts flakes, not speed)
      - id: e2e
        continue-on-error: true
        run: npx playwright test --project=webkit --repeat-each=${{ inputs.repeat || '3' }} --retries=0 --workers=2 --timeout=60000 --grep-invert "@render|@quarantine" --shard=${{ matrix.shard }}/5
      - name: Report
        if: always()
        run: |
          node scripts/e2e-report.ts playwright-results.json "Flaky in shard ${{ matrix.shard }} (×${{ inputs.repeat || '3' }})" >> "$GITHUB_STEP_SUMMARY"
          ANNOTATE=1 node scripts/e2e-report.ts playwright-results.json "Flaky e2e"
          # (red for any failure but WebKit itself crashing under Playwright, "Cannot find parent object browser@…":
          # the environment, named in the summary; scripts/e2e-report.ts VERDICT)
          [ "${{ steps.e2e.outcome }}" = success ] || VERDICT=1 node scripts/e2e-report.ts playwright-results.json verdict > /dev/null
