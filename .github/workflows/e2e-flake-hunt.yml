# The flake hunt (docs/ops/testing.md "CI"): the logic tier in WebKit, each test several times, retries off; logic
# mode, as the gate (the VM's software GL isn't the phones' Metal). 2 workers: a 3-core VM. Nightly: its-bot dispatches
# it at 19:30 UTC (04:30 Tokyo, after the relay's 03:00 batch and places-details' 03:30; its/worker/src/dispatch.ts),
# the schedule the backstop, skipping itself after a dispatched run in 20 h; and on demand. It gates nothing and stays
# green: any test failing even once (or the hunt itself broken) opens or comments on the one `flake` issue with the
# shards' summaries, worst first (.github/scripts/ops-issue.sh), a clean night closes it.
name: e2e flake hunt

on:
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch:
    inputs:
      repeat:
        description: Runs of each test
        default: '3'
        required: true

permissions:
  contents: read

# (a late schedule waits for the dispatched run, then skips itself)
concurrency:
  group: e2e-flake-hunt
  cancel-in-progress: false

jobs:
  # The schedule's run only: none dispatched (its-bot's or by hand, not cancelled) in the last 20 h, else go=false.
  due:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      go: ${{ steps.due.outputs.go }}
    steps:
      - id: due
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go=true
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            n=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/e2e-flake-hunt.yml/runs" -f event=workflow_dispatch -f per_page=5 \
              -f created=">$(date -u -d '20 hours ago' +%FT%TZ)" --jq '[.workflow_runs[] | select(.conclusion != "cancelled")] | length') || n=0
            [ "$n" = 0 ] || go=false
          fi
          echo "dispatched runs in 20 h: ${n:-0}; go=$go"
          echo "go=$go" >> "$GITHUB_OUTPUT"

  build:
    needs: due
    if: needs.due.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      # the site, and the client manifest boot.spec finds the 3D island's chunk by (its name is a hash)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: |
            app/build-pages
            app/.svelte-kit/output/client/.vite/manifest.json
          include-hidden-files: true
          compression-level: 0
          retention-days: 1

  # (on macOS: Safari's own WebKit; Linux's draws the island at about a frame a second)
  hunt:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    defaults:
      run:
        working-directory: app
    env:
      E2E_RENDER: none
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}-webkit
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install webkit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: app
      # (a test 60 s: the VM runs a test 2-3× its Linux time, and it hunts flakes, not speed)
      - id: e2e
        continue-on-error: true
        run: npx playwright test --project=webkit --repeat-each=${{ inputs.repeat || '3' }} --retries=0 --workers=2 --timeout=60000 --grep-invert "@render|@quarantine" --shard=${{ matrix.shard }}/5
      - name: Report
        if: always()
        env:
          E2E: ${{ steps.e2e.outcome }}
        run: |
          mkdir -p flake
          node scripts/e2e-report.ts playwright-results.json "Flaky in shard ${{ matrix.shard }} (×${{ inputs.repeat || '3' }})" > flake/summary.md
          cat flake/summary.md >> "$GITHUB_STEP_SUMMARY"
          ANNOTATE=1 node scripts/e2e-report.ts playwright-results.json "Flaky e2e"
          # (red for any failure but WebKit itself crashing under Playwright, "Cannot find parent object browser@…":
          # the environment, named in the summary; scripts/e2e-report.ts VERDICT); the `file` job reads it
          v=ok
          [ "$E2E" = success ] || VERDICT=1 node scripts/e2e-report.ts playwright-results.json verdict > /dev/null || v=red
          echo "$v" > flake/verdict
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-${{ matrix.shard }}
          path: app/flake
          retention-days: 3

  # The night's verdict → the `flake` issue: a shard red (a test failed that wasn't the browser crashing), a shard with
  # no verdict or the build broken (hunt_broken); all clean closes it.
  file:
    needs: [due, hunt]
    if: always() && needs.due.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: flake-*
          path: flake
      - name: The flake issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HUNT: ${{ needs.hunt.result }}
        run: |
          red=0 none=0
          for i in 1 2 3 4 5; do
            v=$(cat "flake/flake-$i/verdict" 2>/dev/null) || v=
            case "$v" in ok) ;; red) red=$((red + 1)) ;; *) none=$((none + 1)) ;; esac
          done
          # the failed tests' places (never the browser's own crash), each once, worst first as each shard lists them
          where=$(cat flake/flake-*/summary.md 2>/dev/null | grep -E '^- .e2e/' | grep -v 'the browser crashed' | sed -E 's/^- .(e2e\/[^ ]+). .*/\1/' | awk '!s[$0]++') || where=
          n=$(printf '%s' "$where" | grep -c . || true)
          why=
          [ "$red" = 0 ] || why="$n tests failed in the hunt: $(echo "$where" | head -5 | paste -sd ' ' -)$([ "$n" -le 5 ] || echo " (+$((n - 5)) more)")"
          [ "$none" = 0 ] || why="${why:+$why; }hunt_broken: $none of 5 shards gave no verdict (the hunt: $HUNT)"
          counts=$(cat flake/flake-*/summary.md 2>/dev/null | head -c 60000) || counts=
          WHY=$why COUNTS="${counts:-no summaries}" LOOK="docs/ops/testing.md \"CI\" (\`npm run e2e:flakes\`; quarantine: \`npm run e2e:quarantine\`)" \
            .github/scripts/ops-issue.sh flake "flake hunt"
