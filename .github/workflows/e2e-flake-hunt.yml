# The flake hunt (docs/ops/testing.md): the whole e2e suite in WebKit, every test run several times over, retries off.
# Nightly (03:30 Tokyo) and on demand (Actions → e2e flake hunt → Run workflow, with how many runs each). It gates no
# deploy: it goes red when any test failed even once, and its summary lists them, worst first, to fix at the cause.
name: e2e flake hunt

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      repeat:
        description: Runs of each test
        default: '3'
        required: true

permissions:
  contents: read

concurrency:
  group: e2e-flake-hunt
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: app/build-pages
          include-hidden-files: true
          compression-level: 0
          retention-days: 1

  # (on macOS: Safari's own WebKit; Linux's draws the island at about a frame a second)
  hunt:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}-webkit
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install webkit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: app/build-pages
      - id: e2e
        continue-on-error: true
        run: npx playwright test --project=webkit --repeat-each=${{ inputs.repeat || '3' }} --shard=${{ matrix.shard }}/5
      - name: Report
        if: always()
        run: |
          node scripts/e2e-report.ts playwright-results.json "Flaky in shard ${{ matrix.shard }} (×${{ inputs.repeat || '3' }})" >> "$GITHUB_STEP_SUMMARY"
          ANNOTATE=1 node scripts/e2e-report.ts playwright-results.json "Flaky e2e"
          test "${{ steps.e2e.outcome }}" = success
