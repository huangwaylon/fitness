# Weekly dependency PRs: the toolchain is bleeding-edge (Kit 3, Vite 8, TS 6, Vitest 5). Each PR runs its checks
# (pages.yml's check, knip, vitest, build and e2e; relay/gym/its tests; no deploy); automerge.yml merges it once all are
# green, no person. A bump that breaks something: fix it, or close the PR and add an `ignore` here.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      toolchain:
        patterns: ['@sveltejs/*', 'svelte', 'svelte-check', 'vite', 'vitest', 'typescript', '@types/node', '@playwright/test', 'knip']
      fonts:
        patterns: ['@fontsource/*']
    # (TypeScript's majors by hand: svelte-check peers on a range that lags them, so a group with one can't npm ci)
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 5
  # the relay Worker: one grouped PR
  - package-ecosystem: npm
    directory: /relay
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ['*']
    open-pull-requests-limit: 2
  # its-bot: one grouped PR
  - package-ecosystem: npm
    directory: /its/worker
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ['*']
    open-pull-requests-limit: 2
  # gym-bot: one grouped PR
  - package-ecosystem: npm
    directory: /gym
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ['*']
    open-pull-requests-limit: 2
  # pages.yml's wrangler: one grouped PR
  - package-ecosystem: npm
    directory: /.github/deploy
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ['*']
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
