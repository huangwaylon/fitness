# The gym bot (README.md): one Worker and a SQLite-backed Durable Object on the Workers Free plan, beside the island's
# relay on the same account. Deploy: `npm run deploy`. Secrets (never in this public repo): `npx wrangler secret put`
# LINE_CHANNEL_TOKEN, LINE_CHANNEL_SECRET, LINE_GROUP_ID, GYM_TOKEN, KEY_A, KEY_B (the relay's, for /gym/config and
# /gym/act), and optionally NAME_A, NAME_B (the members' names in the app's changes).
name = "gym-bot"
# The relay's account, pinned as it is there (relay/wrangler.toml).
account_id = "984dde81c150a207305c312cde950046"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[vars]
# 'bot': this Worker checks the gym and answers the taps. 'off': the stop switch, LINE's events ignored and nothing
# checked (README "Operations").
MODE = "bot"
# The Worker's address: /status says whether LINE's webhook points at $URL/line/webhook.
URL = "https://gym-bot.island-fund-relay.workers.dev"
# The app's page origin (relay/wrangler.toml's), for /gym/config: exact origins, comma-separated; localhost always.
ALLOWED_ORIGINS = "https://island-fund.pages.dev"

# Hourly: sets the checks' alarm again if none is set (src/index.ts `scheduled`). The Free plan allows 5 cron triggers
# an account; the relay uses 2.
[triggers]
crons = ["7 * * * *"]

# The bot: the state, the checks (on its alarm) and the taps' answers.
[[durable_objects.bindings]]
name = "BOT"
class_name = "GymBot"

# The Free plan has only SQLite-backed Durable Objects: new_sqlite_classes, never new_classes.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GymBot"]

# Workers Logs: the bot's console lines, 3 days. No invocation logs (each request's IP and headers).
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = false
