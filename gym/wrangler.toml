# The gym bot (README.md): one Worker and a SQLite-backed Durable Object on the Workers Free plan, beside the island's
# relay on the same account. Deploy: `npm run deploy`. Secrets (never in this public repo): `npx wrangler secret put`
# LINE_CHANNEL_TOKEN, LINE_CHANNEL_SECRET, LINE_GROUP_ID and GYM_TOKEN.
name = "gym-bot"
# Umeway1122@gmail.com's account, pinned as the relay's is (relay/wrangler.toml).
account_id = "984dde81c150a207305c312cde950046"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[vars]
# 'off': LINE's events are ignored and nothing is checked, while the Mac runs the bot. 'bot': this Worker checks the gym
# and answers the taps. README "Cutting over".
MODE = "off"

# The bot: the state, the checks (on its alarm) and the taps' answers.
[[durable_objects.bindings]]
name = "BOT"
class_name = "GymBot"

# The Free plan has only SQLite-backed Durable Objects: new_sqlite_classes, never new_classes.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GymBot"]

# Workers Logs: the bot's console lines, 3 days. No invocation logs (each request's IP and headers).
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = false
